<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#f3eee5">
  <meta
    name="description"
    content="知微老师高等数学对话演示，支持求导、积分和极限计算。"
  >
  <title>知微老师 · 高数对话演示</title>
  <link rel="icon" href="data:,">
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='katex/katex.min.css') }}"
  >
  <style>
    :root {
      --ink: #1c2531;
      --muted: #655f56;
      --line: #e3dbcf;
      --line-strong: #cec4b6;
      --canvas: #f3eee5;
      --surface: #fffcf7;
      --paper: #f8f3ea;
      --paper-rule: rgba(92, 78, 58, 0.022);
      --soft-blue: #eef4ff;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-ink: #1e40af;
      --amber: #b45309;
      --amber-soft: #fff7e8;
      --red: #b42318;
      --green: #18794e;
      --sidebar-bg: #f4efe6;
      --sidebar-hover: #ece5da;
      --sidebar-active: #e4dbce;
      --disabled-bg: #d8d1c6;
      --disabled-ink: #6c665d;
      --media-placeholder: #ebe4d9;
      --sidebar-width: 272px;
      --sidebar-rail-width: 68px;
      --sidebar-current-width: var(--sidebar-width);
      --scrim: rgba(15, 28, 48, 0.34);
      --selection-bg: #dbe8ff;
      --selection-ink: #1e40af;
      --focus-ring: #2563eb;
      --radius-control: 6px;
      --font-xs: 0.75rem;
      --font-sm: 0.8125rem;
      --font-md: 0.875rem;
      --shadow-card: none;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e8e6e1;
      --muted: #a8a49d;
      --line: #34312d;
      --line-strong: #4b4741;
      --canvas: #111315;
      --surface: #1a1c1f;
      --paper: #16181a;
      --paper-rule: rgba(120, 162, 255, 0.052);
      --soft-blue: #17243a;
      --blue: #78a2ff;
      --blue-dark: #a8c1ff;
      --blue-ink: #c9d8ff;
      --amber: #f0ad4e;
      --amber-soft: #2b2418;
      --red: #f07a70;
      --green: #58c08d;
      --sidebar-bg: #17191c;
      --sidebar-hover: #22252a;
      --sidebar-active: #2b2e33;
      --disabled-bg: #30343a;
      --disabled-ink: #8f949d;
      --media-placeholder: #24272b;
      --scrim: rgba(3, 8, 16, 0.62);
      --selection-bg: #2f5eb8;
      --selection-ink: #ffffff;
      --focus-ring: #8fb1ff;
      --shadow-card: none;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      font-family: system-ui, "Segoe UI", "Microsoft YaHei", "PingFang SC",
        sans-serif;
      line-height: 1.55;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 3px;
    }

    ::selection {
      color: var(--selection-ink);
      background: var(--selection-bg);
    }

    * {
      scrollbar-color: var(--line-strong) transparent;
      scrollbar-width: thin;
    }

    *::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    *::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 999px;
      background: var(--line-strong);
      background-clip: padding-box;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      display: flex;
      width: 100%;
      max-width: 1440px;
      height: 100vh;
      height: 100dvh;
      min-height: 540px;
      margin: 0 auto;
      overflow: hidden;
      border: 0;
      background: var(--surface);
      box-shadow: none;
    }

    .app-shell[data-sidebar-collapsed="true"] {
      --sidebar-current-width: var(--sidebar-rail-width);
    }

    .sidebar {
      position: relative;
      flex: 0 0 var(--sidebar-current-width);
      width: var(--sidebar-current-width);
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: var(--sidebar-bg);
      transition: width 0.2s ease, flex-basis 0.2s ease;
    }

    .app-shell.is-resizing .sidebar {
      transition: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-inner {
      width: var(--sidebar-current-width);
      padding: 12px 10px;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-top {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-brand,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-section,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-footer,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-resizer {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .toolbox-scroll {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-rail {
      display: grid;
    }

    .sidebar-inner {
      display: flex;
      width: var(--sidebar-width);
      height: 100%;
      min-height: 0;
      flex-direction: column;
      padding: 14px 12px 12px;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 40px;
    }

    .sidebar-rail {
      display: none;
      gap: 8px;
      margin-top: 2px;
    }

    .sidebar-rail-button {
      display: grid;
      width: 44px;
      height: 44px;
      margin: 0 auto;
      padding: 0;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
    }

    .sidebar-rail-button:hover,
    .sidebar-rail-button:focus-visible {
      border-color: var(--line-strong);
      color: var(--ink);
      background: var(--sidebar-hover);
    }

    .sidebar-rail-button[aria-current="true"] {
      border-color: var(--line-strong);
      color: var(--blue-dark);
      background: var(--sidebar-active);
    }

    .sidebar-rail-button svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
      color: var(--ink);
      font-size: 0.88rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .sidebar-logo {
      display: grid;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 6px;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 1rem;
      font-weight: 800;
    }

    .icon-button {
      display: grid;
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      color: var(--muted);
      background: var(--surface);
      font-size: 1rem;
      font-weight: 800;
      line-height: 1;
    }

    .icon-button:hover {
      border-color: var(--line-strong);
      color: var(--ink);
      background: var(--sidebar-hover);
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    #conversationPanelToggle svg {
      transition: transform 0.15s ease;
    }

    .conversation-panel[data-collapsed="true"] #conversationPanelToggle svg {
      transform: rotate(180deg);
    }

    .conversation-panel-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
    }

    .conversation-panel-head .new-chat-icon {
      flex-basis: 30px;
      width: 30px;
      height: 30px;
      border-color: transparent;
      color: var(--blue-dark);
      background: transparent;
      font-size: 1.05rem;
    }

    .conversation-panel-head .new-chat-icon:hover,
    .conversation-panel-head .new-chat-icon:focus-visible {
      border-color: var(--line-strong);
      color: var(--ink);
      background: var(--sidebar-hover);
    }

    .sidebar-section {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      margin-top: 20px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 6px 8px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0;
    }

    .history-list {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: thin;
    }

    .history-item {
      position: relative;
      display: flex;
      align-items: stretch;
      width: 100%;
      margin-bottom: 4px;
      overflow: visible;
      border: 1px solid transparent;
      border-radius: var(--radius-control);
      color: var(--ink);
      background: transparent;
    }

    .history-item::before {
      content: none;
    }

    .history-select {
      min-width: 0;
      flex: 1;
      padding: 9px 10px;
      overflow: hidden;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
    }

    .history-actions {
      position: absolute;
      top: 50%;
      right: 6px;
      display: flex;
      gap: 3px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 0.15s ease;
    }

    .history-item:hover .history-actions,
    .history-item:focus-within .history-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .history-action {
      min-height: 24px;
      padding: 2px 5px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      color: var(--muted);
      background: var(--surface);
      font-size: 0.64rem;
      font-weight: 750;
    }

    .history-action:hover {
      border-color: var(--line-strong);
      color: var(--ink);
      background: var(--sidebar-hover);
    }

    .history-item:hover {
      border-color: var(--line);
      background: var(--sidebar-hover);
    }

    .history-item[data-active="true"] {
      border-color: var(--line-strong);
      background: var(--sidebar-active);
    }

    .history-item[data-active="true"]::before {
      background: transparent;
    }

    .history-title,
    .history-time {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-title {
      font-size: 0.79rem;
      font-weight: 750;
      transition: padding-right 0.15s ease;
    }

    .history-item:hover .history-title,
    .history-item:focus-within .history-title {
      padding-right: 82px;
    }

    .history-time {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .history-empty {
      padding: 10px;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.6;
    }

    .solver-dialog {
      width: min(720px, calc(100vw - 28px));
      max-width: none;
      max-height: min(780px, calc(100dvh - 28px));
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: none;
    }

    .solver-dialog::backdrop {
      background: var(--scrim);
    }

    .solver-shell {
      display: flex;
      max-height: min(780px, calc(100dvh - 28px));
      flex-direction: column;
    }

    .solver-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
    }

    .solver-header h2 {
      margin: 0;
      color: var(--ink);
      font-size: 1.02rem;
      line-height: 1.35;
    }

    .solver-header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .solver-body {
      min-height: 0;
      padding: 16px 20px;
      overflow-y: auto;
    }

    .solver-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .solver-field {
      display: grid;
      min-width: 0;
      gap: 5px;
    }

    .solver-field.is-wide {
      grid-column: 1 / -1;
    }

    .solver-field label {
      color: var(--muted);
      font-size: 0.73rem;
      font-weight: 800;
    }

    .solver-field input,
    .solver-field select,
    .solver-field textarea {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-control);
      color: var(--ink);
      background: var(--surface);
      font-size: 0.82rem;
      outline: none;
    }

    .solver-field textarea {
      min-height: 70px;
      resize: vertical;
      line-height: 1.5;
    }

    .solver-field input:focus,
    .solver-field select:focus,
    .solver-field textarea:focus {
      border-color: var(--focus-ring);
      box-shadow: none;
    }

    .solver-hint {
      margin: 14px 0 0;
      padding: 9px 11px;
      border-radius: 6px;
      color: var(--muted);
      background: var(--sidebar-bg);
      font-size: 0.74rem;
      line-height: 1.55;
    }

    .solver-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 20px 17px;
      border-top: 1px solid var(--line);
      background: var(--sidebar-bg);
    }

    .solver-status {
      min-width: 0;
      color: var(--red);
      font-size: 0.75rem;
    }

    .solver-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
    }

    .solver-button {
      min-height: 38px;
      padding: 7px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      color: var(--ink);
      background: var(--surface);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .solver-button:hover {
      border-color: var(--line-strong);
      background: var(--sidebar-hover);
    }

    .solver-button.primary {
      border-color: var(--blue);
      color: #ffffff;
      background: var(--blue);
    }

    .solver-button.primary:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .solver-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    html[data-theme="dark"] .solver-field input,
    html[data-theme="dark"] .solver-field select,
    html[data-theme="dark"] .solver-field textarea,
    html[data-theme="dark"] .solver-footer {
      border-color: var(--line);
      background: var(--surface);
    }

    html[data-theme="dark"] .solver-field label,
    html[data-theme="dark"] .solver-hint {
      color: var(--muted);
    }

    .sidebar-footer {
      flex: 0 0 auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .theme-button {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 38px;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 0.77rem;
      font-weight: 750;
      text-align: left;
    }

    .theme-button:hover {
      border-color: var(--line);
      color: var(--ink);
      background: var(--sidebar-hover);
    }

    .theme-icon {
      display: grid;
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      place-items: center;
      border-radius: 0;
      background: transparent;
    }

    .theme-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .sidebar-resizer {
      position: absolute;
      z-index: 5;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      cursor: col-resize;
    }

    .sidebar-resizer:hover,
    .sidebar-resizer:focus-visible {
      background: var(--line-strong);
      outline: none;
    }

    .sidebar-scrim {
      display: none;
    }

    .conversation-panel {
      display: flex;
      flex: 0 0 238px;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: var(--sidebar-bg);
    }

    .conversation-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 58px;
      padding: 12px 12px 8px;
    }

    .conversation-panel-title {
      color: var(--ink);
      font-size: 0.83rem;
      font-weight: 850;
    }

    .conversation-panel .sidebar-section {
      margin-top: 0;
      padding: 0 8px 10px;
    }

    .conversation-panel .section-heading {
      padding-right: 5px;
      padding-left: 5px;
    }

    .conversation-panel .sidebar-section {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .conversation-panel[data-collapsed="true"] {
      flex-basis: 50px;
    }

    .conversation-panel[data-collapsed="true"] .conversation-panel-title,
    .conversation-panel[data-collapsed="true"] .new-chat-icon,
    .conversation-panel[data-collapsed="true"] .sidebar-section {
      display: none;
    }

    .conversation-panel[data-collapsed="true"] .conversation-panel-head {
      justify-content: center;
      padding: 12px 4px;
    }

    .toolbox-scroll {
      min-height: 0;
      flex: 1 1 auto;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 2px 4px 12px;
      scrollbar-width: thin;
    }

    .toolbox-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      padding: 2px 2px 8px;
      border-bottom: 1px solid var(--line);
    }

    .toolbox-tab {
      min-height: 34px;
      padding: 5px 6px;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--muted);
      background: transparent;
      font-size: 0.67rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .toolbox-tab:hover {
      color: var(--ink);
      background: var(--sidebar-hover);
    }

    .toolbox-tab[aria-selected="true"] {
      border-color: var(--line-strong);
      color: var(--ink);
      background: var(--sidebar-active);
      box-shadow: inset 0 -2px 0 var(--blue);
    }

    .toolbox-tab:focus-visible {
      border-color: var(--focus-ring);
      outline: 0;
      box-shadow: none;
    }

    .toolbox-tab-count {
      display: inline-grid;
      min-width: 20px;
      height: 20px;
      margin-left: 3px;
      padding: 0 5px;
      place-items: center;
      border-radius: 4px;
      color: var(--muted);
      background: var(--sidebar-hover);
      font-size: 0.7rem;
      font-variant-numeric: tabular-nums;
    }

    .toolbox-panel[data-active="false"] {
      display: none;
    }

    .wrongbook-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin: 0 2px 8px;
      color: var(--muted);
      font-size: 0.66rem;
    }

    .wrongbook-toolbar > span {
      flex: 1 1 100%;
      min-width: 0;
    }

    .wrongbook-clear {
      flex: 0 0 auto;
      white-space: nowrap;
      min-height: 26px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--muted);
      background: var(--surface);
      font-size: 0.64rem;
    }

    .wrongbook-clear:hover {
      border-color: color-mix(in srgb, var(--red) 34%, var(--line));
      color: var(--red);
      background: color-mix(in srgb, var(--red) 7%, transparent);
    }

    .wrongbook-list {
      display: grid;
      gap: 7px;
    }

    .wrongbook-item {
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }

    .wrongbook-item-title {
      display: -webkit-box;
      overflow: hidden;
      color: var(--ink);
      font-size: 0.72rem;
      font-weight: 750;
      line-height: 1.45;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .wrongbook-item-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.61rem;
    }

    .wrongbook-answer {
      margin-top: 7px;
      padding-top: 6px;
      border-top: 1px solid var(--line);
    }

    .wrongbook-answer summary {
      cursor: pointer;
      color: var(--blue-dark);
      font-size: 0.65rem;
      font-weight: 800;
    }

    .wrongbook-answer-text {
      max-height: 180px;
      margin-top: 6px;
      overflow: auto;
      color: var(--muted);
      font-size: 0.66rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .wrongbook-item-actions {
      display: flex;
      gap: 5px;
      margin-top: 7px;
    }

    .wrongbook-item-actions button {
      flex: 1 1 0;
      min-height: 28px;
      padding: 3px 5px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      background: var(--sidebar-bg);
      font-size: 0.65rem;
      font-weight: 800;
    }

    .wrongbook-item-actions button[data-wrongbook-action="delete"] {
      color: var(--muted);
      background: transparent;
    }

    .wrongbook-item-actions button:hover {
      border-color: var(--line-strong);
    }

    .wrongbook-empty {
      padding: 14px 8px;
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1.6;
      text-align: center;
    }

    .learning-progress-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin: 0 2px 9px;
    }

    .progress-metric {
      min-height: 66px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }

    .progress-metric strong {
      display: block;
      color: var(--ink);
      font-size: 1.25rem;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .progress-metric span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.61rem;
      font-weight: 700;
    }

    .progress-streak {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 0 2px 10px;
      padding: 9px 10px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.64rem;
    }

    .progress-streak strong {
      color: var(--ink);
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
    }

    .progress-days {
      display: grid;
      gap: 6px;
      margin: 0 2px;
    }

    .progress-day {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 26px;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 0.61rem;
    }

    .progress-day-count {
      color: var(--ink);
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .progress-day-track {
      height: 6px;
      overflow: hidden;
      border-radius: 2px;
      background: var(--sidebar-hover);
    }

    .progress-day-fill {
      width: var(--progress-width, 0%);
      height: 100%;
      border-radius: inherit;
      background: var(--blue);
      transition: width 0.25s ease;
    }

    .progress-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      margin: 12px 2px 0;
    }

    .progress-action {
      min-height: 32px;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      background: var(--surface);
      font-size: 0.62rem;
      font-weight: 800;
    }

    .progress-action:hover,
    .progress-action:focus-visible {
      border-color: var(--line-strong);
      background: var(--sidebar-hover);
    }

    .progress-action.primary {
      border-color: var(--line-strong);
      background: var(--sidebar-active);
    }

    .progress-status {
      min-height: 1.6em;
      margin: 7px 3px 0;
      color: var(--muted);
      font-size: 0.61rem;
      line-height: 1.5;
    }

    .progress-status[data-state="error"] {
      color: var(--red);
    }

    .progress-status[data-state="success"] {
      color: var(--blue-dark);
    }

    .toolbox-section {
      padding: 12px 2px;
      border-top: 1px solid var(--line);
    }

    .toolbox-section:first-child {
      border-top: 0;
    }

    .toolbox-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 4px 9px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 850;
      letter-spacing: 0;
    }

    .toolbox-heading span:last-child {
      color: var(--muted);
      font-size: 0.63rem;
      letter-spacing: 0;
    }

    .quick-stack {
      display: grid;
      gap: 7px;
    }

    .quick-tool {
      padding: 8px 9px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }

    .quick-tool-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .quick-tool-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      font-size: 0.74rem;
      font-weight: 850;
    }

    .quick-tool-mark {
      display: inline-grid;
      min-width: 20px;
      height: 20px;
      place-items: center;
      color: var(--blue-dark);
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 0.78rem;
    }

    .quick-tool-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
    }

    .quick-tool-row.is-limit {
      grid-template-columns: minmax(0, 1fr) 18px 58px;
    }

    .quick-tool-row.is-integral {
      grid-template-columns: minmax(0, 1fr) 54px 54px;
    }

    .quick-input,
    .quick-select {
      width: 100%;
      min-width: 0;
      height: 34px;
      padding: 6px 8px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      color: var(--ink);
      background: var(--surface);
      font-size: 0.75rem;
      outline: none;
    }

    .quick-input:focus,
    .quick-select:focus {
      border-color: var(--focus-ring);
      box-shadow: none;
    }

    .quick-calculate {
      min-width: 54px;
      height: 34px;
      padding: 5px 9px;
      border: 1px solid var(--blue);
      border-radius: 4px;
      color: #fff;
      background: var(--blue);
      font-size: 0.72rem;
      font-weight: 850;
    }

    .quick-calculate:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .quick-calculate:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .quick-caption {
      margin: 6px 1px 0;
      color: var(--muted);
      font-size: 0.64rem;
      line-height: 1.4;
    }

    .toolbox-more-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 34px;
      padding: 6px 9px;
      border: 1px dashed var(--line-strong);
      border-radius: 4px;
      color: var(--ink);
      background: transparent;
      font-size: 0.7rem;
      font-weight: 850;
    }

    .toolbox-more-toggle:hover,
    .toolbox-more-toggle:focus-visible {
      border-color: var(--line-strong);
      background: var(--sidebar-hover);
    }

    .toolbox-more-toggle::after {
      content: "+";
      font-size: 0.9rem;
      line-height: 1;
    }

    .toolbox-more-toggle[aria-expanded="true"]::after {
      content: "−";
    }

    .related-knowledge {
      display: grid;
      max-height: min(32vh, 280px);
      min-height: 0;
      gap: 7px;
      margin: 0 0 8px;
      padding: 2px 2px 12px;
      overflow-x: hidden;
      overflow-y: auto;
      border-bottom: 1px solid var(--line);
      scrollbar-width: thin;
    }

    .related-knowledge-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 0 4px;
      color: var(--muted);
      font-size: 0.67rem;
      font-weight: 850;
    }

    .related-knowledge-head span:last-child {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 750;
    }

    .related-knowledge-list {
      display: grid;
      gap: 6px;
    }

    .related-knowledge-empty {
      margin: 0 4px;
      padding: 8px 9px;
      border: 1px dashed var(--line-strong);
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.66rem;
      line-height: 1.5;
    }

    .knowledge-item {
      display: grid;
      gap: 4px;
      width: 100%;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: var(--sidebar-bg);
      font-size: 0.7rem;
      line-height: 1.4;
    }

    .knowledge-item strong {
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 0.68rem;
      font-weight: 850;
    }

    .knowledge-item p {
      margin: 0;
      color: var(--muted);
      font-size: 0.64rem;
      line-height: 1.55;
    }

    .knowledge-source {
      display: block;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .solver-entry {
      display: flex;
      width: 100%;
      min-height: 38px;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: var(--surface);
      font-size: 0.72rem;
      font-weight: 800;
      text-align: left;
    }

    .solver-entry::after {
      color: var(--muted);
      content: "";
      width: 5px;
      height: 5px;
      border-top: 1.5px solid currentColor;
      border-right: 1.5px solid currentColor;
      transform: rotate(45deg);
    }

    .solver-entry:hover,
    .solver-entry:focus-visible {
      border-color: var(--line-strong);
      background: var(--sidebar-hover);
    }

    .topic-presets {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .topic-preset,
    .symbol-button {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      background: var(--surface);
      font-size: 0.7rem;
      font-weight: 800;
    }

    .topic-preset:hover,
    .symbol-button:hover {
      border-color: var(--line-strong);
      background: var(--sidebar-hover);
    }

    .symbol-board {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 5px;
      margin-top: 9px;
    }

    .symbol-button {
      min-height: 29px;
      padding: 3px 0;
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 0.86rem;
    }

    .topic-library {
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .topic-library > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 5px;
      color: var(--muted);
      font-size: 0.69rem;
      font-weight: 850;
      cursor: pointer;
      list-style: none;
    }

    .topic-library > summary::-webkit-details-marker {
      display: none;
    }

    .conversation-panel,
    .sidebar,
    .chat-layout {
      min-height: 0;
    }

    .workspace-body {
      display: flex;
      width: 100%;
      min-height: 0;
      min-width: 0;
      flex: 1 1 auto;
      flex-direction: column;
      overflow: hidden;
      background: var(--paper);
    }

    .inline-solver {
      display: grid;
      gap: 11px;
    }

    .inline-solver[hidden] {
      display: none;
    }

    .inline-solver-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .inline-solver-head h3 {
      margin: 0;
      color: var(--ink);
      font-size: 0.86rem;
    }

    .inline-solver-head p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .inline-solver .solver-grid {
      grid-template-columns: 1fr;
    }

    .inline-solver .solver-field input,
    .inline-solver .solver-field select,
    .inline-solver .solver-field textarea {
      min-height: 34px;
      padding: 6px 8px;
      font-size: 0.76rem;
    }

    .inline-solver .solver-field textarea {
      min-height: 62px;
    }

    .inline-solver .solver-hint {
      margin: 0;
      padding: 8px;
      font-size: 0.68rem;
    }

    .inline-solver-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .quick-favorites {
      display: grid;
      gap: 5px;
      margin-top: 8px;
    }

    .favorite-item {
      display: block;
      width: 100%;
      padding: 6px 7px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--muted);
      background: var(--surface);
      font-size: 0.67rem;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .quick-plot-form {
      display: grid;
      gap: 6px;
    }

    .quick-plot-input {
      min-height: 62px;
      resize: vertical;
    }

    .quick-plot-range {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .inline-solver[hidden] {
      display: none;
    }

    .composer-image-preview {
      display: grid;
      min-width: 0;
      gap: 8px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--sidebar-bg);
    }

    .composer-image-preview[hidden] {
      display: none;
    }

    .composer-image-list {
      display: flex;
      min-width: 0;
      max-height: 292px;
      flex-wrap: wrap;
      gap: 8px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .composer-image-item {
      display: grid;
      min-width: 0;
      flex: 1 1 238px;
      grid-template-columns: 44px minmax(0, 1fr) 30px;
      align-items: start;
      gap: 9px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }

    .composer-image-item[data-state="success"] {
      border-color: color-mix(in srgb, var(--blue) 38%, var(--line));
      background: color-mix(in srgb, var(--blue) 5%, var(--surface));
    }

    .composer-image-item[data-state="error"] {
      border-color: color-mix(in srgb, var(--red) 48%, var(--line));
      background: color-mix(in srgb, var(--red) 7%, var(--surface));
    }

    .composer-image-thumb {
      display: block;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 4px;
      object-fit: cover;
      background: var(--surface);
    }

    .composer-image-copy {
      min-width: 0;
    }

    .composer-image-copy strong,
    .composer-image-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .composer-image-copy strong {
      color: var(--ink);
      font-size: 0.74rem;
      line-height: 1.4;
    }

    .composer-image-copy span {
      margin-top: 1px;
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1.4;
    }

    .composer-image-question-picker {
      display: grid;
      min-width: 0;
      margin-top: 6px;
      padding: 0;
      border: 0;
      gap: 5px;
    }

    .composer-image-question-toolbar {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 5px;
    }

    .composer-image-question-count {
      min-width: 0;
      margin-right: auto;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.67rem;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .composer-image-question-command {
      min-height: 26px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      background: var(--sidebar-bg);
      font: inherit;
      font-size: 0.67rem;
      font-weight: 750;
    }

    .composer-image-question-command:hover:not(:disabled) {
      border-color: var(--line-strong);
      background: var(--sidebar-hover);
    }

    .composer-image-question-command:disabled {
      color: var(--muted);
      background: var(--surface);
      cursor: default;
      opacity: 0.58;
    }

    .composer-image-question-options {
      display: grid;
      min-width: 0;
      max-height: 108px;
      grid-template-columns: repeat(auto-fit, minmax(86px, 1fr));
      gap: 4px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .composer-image-question-option {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 5px;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      background: var(--surface);
      font-size: 0.68rem;
      line-height: 1.35;
      cursor: pointer;
    }

    .composer-image-question-option:hover {
      border-color: var(--line-strong);
    }

    .composer-image-question-option:has(input:checked) {
      border-color: color-mix(in srgb, var(--blue) 50%, var(--line));
      background: color-mix(in srgb, var(--soft-blue) 76%, var(--surface));
    }

    .composer-image-question-option input {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--blue);
    }

    .composer-image-question-option span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .composer-image-review {
      min-height: 28px;
      margin-top: 6px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
      font-size: 0.68rem;
      font-weight: 750;
    }

    .composer-image-item[data-state="success"] .composer-image-copy span {
      color: var(--blue-dark);
    }

    .composer-image-item[data-state="error"] .composer-image-copy span {
      color: var(--red);
    }

    .composer-image-remove {
      display: grid;
      width: 30px;
      height: 30px;
      padding: 0;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--muted);
      background: transparent;
      font-size: 1rem;
      line-height: 1;
    }

    .composer-image-remove:hover {
      border-color: var(--line);
      color: var(--ink);
      background: var(--surface);
    }

    .composer-image-remove svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .composer-image-footer {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 2px;
    }

    .composer-image-status {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .composer-image-clear {
      flex: 0 0 auto;
      min-height: 26px;
      padding: 2px 8px;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--muted);
      background: transparent;
      font-size: 0.68rem;
      font-weight: 750;
    }

    .composer-image-clear:hover {
      border-color: var(--line);
      color: var(--ink);
      background: var(--surface);
    }

    .chat-layout {
      display: flex;
      width: 100%;
      min-width: 0;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex: 0 0 auto;
      min-height: 68px;
      padding: 11px 20px;
      border-bottom: 0;
      background: var(--paper);

    .brand {
