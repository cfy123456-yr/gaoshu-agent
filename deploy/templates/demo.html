<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8ff">
  <meta
    name="description"
    content="知微老师高等数学对话演示，支持求导、积分和极限计算。"
  >
  <title>知微老师 · 高数对话演示</title>
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='katex/katex.min.css') }}"
  >
  <style>
    :root {
      --ink: #172033;
      --muted: #6d7a91;
      --line: #e4ecf7;
      --line-strong: #cbdaf0;
      --canvas: #f4f8ff;
      --surface: #ffffff;
      --soft-blue: #eaf2ff;
      --blue: #2868d8;
      --blue-dark: #174da3;
      --blue-ink: #123f87;
      --amber: #b77916;
      --red: #c2413b;
      --shadow: 0 12px 34px rgba(37, 99, 201, 0.09);
      --sidebar-bg: #f7faff;
      --sidebar-hover: #edf4ff;
      --sidebar-active: #e4eeff;
      --sidebar-width: 272px;
      --sidebar-rail-width: 68px;
      --sidebar-current-width: var(--sidebar-width);
      --scrim: rgba(15, 28, 48, 0.34);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e8f0ff;
      --muted: #9aabc5;
      --line: #293c5a;
      --line-strong: #3e587c;
      --canvas: #0d1626;
      --surface: #142033;
      --soft-blue: #1b3150;
      --blue: #5d91ef;
      --blue-dark: #a8c7ff;
      --blue-ink: #c9dcff;
      --amber: #d9a54d;
      --red: #ef8178;
      --shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
      --sidebar-bg: #101b2c;
      --sidebar-hover: #192941;
      --sidebar-active: #203655;
      --scrim: rgba(3, 8, 16, 0.62);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      line-height: 1.55;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(40, 104, 216, 0.18);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      display: flex;
      width: 100%;
      max-width: 1440px;
      height: 100vh;
      height: 100dvh;
      min-height: 540px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 0 0 1px rgba(203, 218, 240, 0.72);
    }

    .app-shell[data-sidebar-collapsed="true"] {
      --sidebar-current-width: var(--sidebar-rail-width);
    }

    .sidebar {
      position: relative;
      flex: 0 0 var(--sidebar-current-width);
      width: var(--sidebar-current-width);
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: var(--sidebar-bg);
      transition: width 0.2s ease, flex-basis 0.2s ease;
    }

    .app-shell.is-resizing .sidebar {
      transition: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-inner {
      width: var(--sidebar-current-width);
      padding: 12px 10px;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-top {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-brand,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-section,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-footer,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-resizer,
    .app-shell[data-sidebar-collapsed="true"] .tools-menu summary {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .new-chat-button {
      width: 44px;
      min-height: 44px;
      margin: 14px auto 0;
      padding: 0;
      border-radius: 12px;
    }

    .app-shell[data-sidebar-collapsed="true"] .new-chat-label {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .tools-menu {
      margin-top: 14px;
      padding-top: 14px;
    }

    .app-shell[data-sidebar-collapsed="true"] .tool-list {
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 0;
    }

    .app-shell[data-sidebar-collapsed="true"] .tool-button {
      display: grid;
      width: 44px;
      min-height: 44px;
      height: 44px;
      margin: 0 auto;
      padding: 0;
      place-items: center;
      border-radius: 12px;
    }

    .app-shell[data-sidebar-collapsed="true"] .tool-label {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .tool-icon {
      display: block;
      font-size: 0.7rem;
      letter-spacing: -0.02em;
    }

    .sidebar-inner {
      display: flex;
      width: var(--sidebar-width);
      height: 100%;
      min-height: 0;
      flex-direction: column;
      padding: 14px 12px 12px;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 40px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
      color: var(--ink);
      font-size: 0.88rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .sidebar-logo {
      display: grid;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-size: 0.82rem;
    }

    .icon-button {
      display: grid;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--surface);
      font-size: 1rem;
      font-weight: 800;
      line-height: 1;
    }

    .icon-button:hover {
      border-color: var(--line-strong);
      color: var(--blue-dark);
      background: var(--sidebar-hover);
    }

    .new-chat-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 42px;
      margin-top: 16px;
      padding: 8px 12px;
      border: 1px solid var(--blue);
      border-radius: 10px;
      color: #ffffff;
      background: var(--blue);
      font-size: 0.84rem;
      font-weight: 800;
    }

    .new-chat-button:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .sidebar-section {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      margin-top: 20px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 6px 8px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .history-list {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: thin;
    }

    .history-item {
      position: relative;
      display: flex;
      align-items: stretch;
      width: 100%;
      margin-bottom: 4px;
      overflow: visible;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--ink);
      background: transparent;
    }

    .history-item::before {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 0;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: transparent;
      content: "";
    }

    .history-select {
      min-width: 0;
      flex: 1;
      padding: 9px 10px;
      overflow: hidden;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
    }

    .history-actions {
      position: absolute;
      top: 50%;
      right: 6px;
      display: flex;
      gap: 3px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 0.15s ease;
    }

    .history-item:hover .history-actions,
    .history-item:focus-within .history-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .history-action {
      min-height: 24px;
      padding: 2px 5px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      color: var(--muted);
      background: var(--surface);
      font-size: 0.64rem;
      font-weight: 750;
    }

    .history-action:hover {
      border-color: #a9c5ec;
      color: var(--blue-dark);
      background: var(--soft-blue);
    }

    .history-item:hover {
      border-color: var(--line);
      background: var(--sidebar-hover);
    }

    .history-item[data-active="true"] {
      border-color: #c8dbf7;
      background: var(--sidebar-active);
    }

    .history-item[data-active="true"]::before {
      background: var(--blue);
    }

    .history-title,
    .history-time {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-title {
      font-size: 0.79rem;
      font-weight: 750;
      transition: padding-right 0.15s ease;
    }

    .history-item:hover .history-title,
    .history-item:focus-within .history-title {
      padding-right: 82px;
    }

    .history-time {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .history-empty {
      padding: 10px;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.6;
    }

    .tools-menu {
      flex: 0 0 auto;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .tools-menu summary {
      padding: 5px 6px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      list-style: none;
    }

    .tools-menu summary::-webkit-details-marker {
      display: none;
    }

    .tools-menu summary::after {
      float: right;
      content: "+";
      font-size: 0.9rem;
    }

    .tools-menu[open] summary::after {
      content: "−";
    }

    .tool-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding: 7px 4px 1px;
    }

    .tool-button {
      display: grid;
      place-items: center;
      min-height: 34px;
      padding: 5px 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--blue-dark);
      background: var(--surface);
      font-size: 0.73rem;
      font-weight: 800;
    }

    .tool-icon {
      display: none;
    }

    .tool-button:hover {
      border-color: #a9c5ec;
      background: var(--sidebar-hover);
    }

    .tool-button.is-wide {
      grid-column: 1 / -1;
    }

    .solver-dialog {
      width: min(720px, calc(100vw - 28px));
      max-width: none;
      max-height: min(780px, calc(100dvh - 28px));
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(20, 55, 110, 0.24);
    }

    .solver-dialog::backdrop {
      background: rgba(11, 27, 52, 0.38);
      backdrop-filter: blur(3px);
    }

    .solver-shell {
      display: flex;
      max-height: min(780px, calc(100dvh - 28px));
      flex-direction: column;
    }

    .solver-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
    }

    .solver-header h2 {
      margin: 0;
      color: var(--ink);
      font-size: 1.02rem;
      line-height: 1.35;
    }

    .solver-header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .solver-body {
      min-height: 0;
      padding: 16px 20px;
      overflow-y: auto;
    }

    .solver-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .solver-field {
      display: grid;
      min-width: 0;
      gap: 5px;
    }

    .solver-field.is-wide {
      grid-column: 1 / -1;
    }

    .solver-field label {
      color: #60708b;
      font-size: 0.73rem;
      font-weight: 800;
    }

    .solver-field input,
    .solver-field select,
    .solver-field textarea {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #d5e2f3;
      border-radius: 9px;
      color: var(--ink);
      background: #fbfdff;
      font-size: 0.82rem;
      outline: none;
    }

    .solver-field textarea {
      min-height: 70px;
      resize: vertical;
      line-height: 1.5;
    }

    .solver-field input:focus,
    .solver-field select:focus,
    .solver-field textarea:focus {
      border-color: #87afea;
      box-shadow: 0 0 0 3px rgba(40, 104, 216, 0.08);
    }

    .solver-hint {
      margin: 14px 0 0;
      padding: 9px 11px;
      border-radius: 9px;
      color: #53647f;
      background: var(--soft-blue);
      font-size: 0.74rem;
      line-height: 1.55;
    }

    .solver-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 20px 17px;
      border-top: 1px solid var(--line);
      background: #fbfdff;
    }

    .solver-status {
      min-width: 0;
      color: var(--red);
      font-size: 0.75rem;
    }

    .solver-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
    }

    .solver-button {
      min-height: 38px;
      padding: 7px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      color: var(--blue-dark);
      background: var(--surface);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .solver-button:hover {
      border-color: #9ebce8;
      background: var(--sidebar-hover);
    }

    .solver-button.primary {
      border-color: var(--blue);
      color: #ffffff;
      background: var(--blue);
    }

    .solver-button.primary:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .solver-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .formula-body {
      display: grid;
      gap: 16px;
    }

    .formula-group {
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fbfdff;
    }

    .formula-group h3 {
      margin: 0 0 10px;
      color: var(--blue-dark);
      font-size: 0.86rem;
    }

    .formula-list {
      display: grid;
      gap: 9px;
      margin: 0;
    }

    .formula-item {
      display: grid;
      gap: 4px;
    }

    .formula-item code {
      color: var(--ink);
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 1rem;
      line-height: 1.5;
      white-space: normal;
    }

    .formula-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.5;
    }

    html[data-theme="dark"] .solver-field input,
    html[data-theme="dark"] .solver-field select,
    html[data-theme="dark"] .solver-field textarea,
    html[data-theme="dark"] .solver-footer,
    html[data-theme="dark"] .formula-group {
      border-color: var(--line);
      background: #101b2c;
    }

    html[data-theme="dark"] .solver-field label,
    html[data-theme="dark"] .solver-hint {
      color: var(--muted);
    }

    .sidebar-footer {
      flex: 0 0 auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .theme-button {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 38px;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      font-size: 0.77rem;
      font-weight: 750;
      text-align: left;
    }

    .theme-button:hover {
      border-color: var(--line);
      color: var(--blue-dark);
      background: var(--sidebar-hover);
    }

    .theme-icon {
      display: grid;
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      place-items: center;
      border-radius: 7px;
      background: var(--soft-blue);
    }

    .sidebar-resizer {
      position: absolute;
      z-index: 5;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      cursor: col-resize;
    }

    .sidebar-resizer:hover,
    .sidebar-resizer:focus-visible {
      background: rgba(40, 104, 216, 0.18);
      outline: none;
    }

    .sidebar-scrim {
      display: none;
    }

    .chat-layout {
      display: flex;
      min-width: 0;
      flex: 1;
      flex-direction: column;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex: 0 0 auto;
      min-height: 80px;
      padding: 15px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.97);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-size: 1.05rem;
      font-weight: 850;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy h1 {
      margin: 0;
      color: var(--ink);
      font-size: 1.1rem;
      line-height: 1.25;
    }

    .brand-copy p {
      margin: 2px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.77rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 9px;
    }

    .status-chip,
    .clear-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border-radius: 999px;
      font-size: 0.79rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .status-chip {
      gap: 7px;
      min-width: 92px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #f7faff;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
    }

    .status-chip[data-state="online"] {
      border-color: #c9dbf8;
      color: var(--blue-dark);
      background: #edf4ff;
    }

    .status-chip[data-state="online"] .status-dot {
      background: var(--blue);
    }

    .status-chip[data-state="offline"] {
      border-color: #efc5c1;
      color: #84261f;
      background: #fff4f2;
    }

    .status-chip[data-state="offline"] .status-dot {
      background: var(--red);
    }

    .clear-button {
      min-height: 34px;
      padding: 5px 12px;
      border: 1px solid transparent;
      color: var(--muted);
      background: transparent;
    }

    .clear-button:hover {
      border-color: var(--line);
      color: var(--blue-dark);
      background: #f4f8ff;
    }

    .messages {
      flex: 1 1 auto;
      min-height: 0;
      padding: 30px 30px 22px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      background: #f8fbff;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 24px;
    }

    .message[data-role="user"] {
      flex-direction: row-reverse;
    }

    .avatar {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      margin-top: 20px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-size: 0.8rem;
      font-weight: 850;
    }

    .message[data-role="user"] .avatar {
      border: 1px solid #d8e5f8;
      color: var(--blue-dark);
      background: #ffffff;
    }

    .message-content {
      width: fit-content;
      max-width: min(76%, 680px);
      min-width: 0;
    }

    .message[data-role="user"] .message-content {
      display: flex;
      align-items: flex-end;
      flex-direction: column;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 18px;
      margin: 0 6px 5px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .message-meta time {
      color: #93a0b4;
      font-size: 0.64rem;
      font-weight: 500;
      opacity: 0.8;
    }

    .message[data-role="user"] .message-meta {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 100%;
      min-width: 74px;
      margin: 0 2px;
      padding: 14px 17px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px 18px 18px 18px;
      background: var(--surface);
      box-shadow: 0 4px 14px rgba(37, 99, 201, 0.045);
    }

    .message[data-role="user"] .bubble {
      border-color: var(--blue);
      border-radius: 18px 6px 18px 18px;
      color: #ffffff;
      background: var(--blue);
      box-shadow: none;
    }

    .message-text {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .formula {
      max-width: 100%;
      margin: 14px -17px 12px;
      padding: 15px 12px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      border: 0;
      border-radius: 12px;
      color: var(--blue-ink);
      background: #f2f7ff;
      text-align: center;
      -webkit-overflow-scrolling: touch;
    }

    .formula .katex {
      font-size: 1.18em;
      white-space: nowrap;
    }

    .formula .katex-display {
      min-width: max-content;
    }

    .function-plot {
      width: 100%;
      max-width: 100%;
      margin: 13px 0 4px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
    }

    .function-plot img {
      display: block;
      width: 100%;
      height: auto;
    }

    .verdict {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      margin-top: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .verdict[data-state="correct"] {
      color: var(--blue-dark);
      background: #eaf2ff;
    }

    .verdict[data-state="incorrect"] {
      color: #84261f;
      background: #fff0ee;
    }

    .calculation-details {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .calculation-details summary {
      width: fit-content;
      cursor: pointer;
      font-weight: 750;
    }

    .calculation-grid {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 5px 12px;
      margin: 8px 0 1px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .calculation-grid dt {
      color: #71809a;
      font-size: 0.73rem;
      font-weight: 700;
    }

    .calculation-grid dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 0.76rem;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7fa4dc;
      animation: pulse 1.15s ease-in-out infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes pulse {
      0%,
      70%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      35% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .messages {
        scroll-behavior: auto;
      }

      .typing span {
        animation-duration: 2s;
      }
    }

    .composer-area {
      flex: 0 0 auto;
      padding: 0 28px 18px;
      border-top: 1px solid var(--line);
      background: #ffffff;
    }

    .suggestions-toolbar {
      display: flex;
      justify-content: flex-end;
      padding: 8px 2px 0;
    }

    .suggestions-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      padding: 3px 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 0.7rem;
      font-weight: 750;
    }

    .suggestions-toggle:hover {
      border-color: var(--line);
      color: var(--blue-dark);
      background: #f7faff;
    }

    .suggestions-toggle-icon {
      display: inline-block;
      font-size: 0.9rem;
      line-height: 1;
      transform: rotate(180deg);
      transition: transform 0.15s ease;
    }

    .composer-area[data-suggestions-collapsed="true"] .suggestions-toggle-icon {
      transform: rotate(0deg);
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 2px 10px;
      overflow: visible;
    }

    .composer-area[data-suggestions-collapsed="true"] .suggestions {
      display: none;
    }

    .suggestions:empty {
      display: none;
    }

    .suggestion {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 5px 11px;
      border: 1px solid #d4e2f5;
      border-radius: 999px;
      color: var(--blue-dark);
      background: #f7faff;
      font-size: 0.77rem;
      font-weight: 750;
      transition: transform 0.15s ease, border-color 0.15s ease,
        background-color 0.15s ease;
    }

    .suggestion:hover {
      border-color: #a9c5ec;
      background: #edf4ff;
      transform: translateY(-1px);
    }

    .suggestion:active {
      transform: translateY(0) scale(0.98);
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 9px;
      padding: 8px;
      border: 1px solid #d7e3f3;
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(37, 99, 201, 0.07);
    }

    .composer:focus-within {
      border-color: #8fb3e8;
      box-shadow: 0 0 0 3px rgba(40, 104, 216, 0.09);
    }

    .chat-input {
      width: 100%;
      min-height: 42px;
      max-height: 132px;
      padding: 9px 8px 8px;
      overflow-y: auto;
      resize: none;
      border: 0;
      color: var(--ink);
      background: transparent;
      outline: none;
      line-height: 1.5;
    }

    .chat-input::placeholder {
      color: #91a0b7;
    }

    .send-button {
      min-width: 72px;
      min-height: 42px;
      padding: 8px 17px;
      border: 1px solid var(--blue);
      border-radius: 10px;
      color: #ffffff;
      background: var(--blue);
      font-weight: 800;
    }

    .send-button:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .send-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    html[data-theme="dark"] .chat-header,
    html[data-theme="dark"] .composer-area {
      background: rgba(20, 32, 51, 0.97);
    }

    html[data-theme="dark"] .messages {
      background: #101b2c;
    }

    html[data-theme="dark"] .status-chip,
    html[data-theme="dark"] .suggestion {
      background: #182840;
    }

    html[data-theme="dark"] .bubble {
      background: #182840;
    }

    html[data-theme="dark"] .message[data-role="user"] .bubble {
      background: var(--blue);
    }

    html[data-theme="dark"] .formula {
      background: #1a2e4d;
    }

    html[data-theme="dark"] .message[data-role="user"] .avatar {
      background: #182840;
    }

    @media (hover: none) {
      .history-actions {
        position: static;
        align-items: center;
        padding-right: 6px;
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }

      .history-item .history-title {
        padding-right: 0;
      }
    }

    @media (max-width: 820px) {
      .app-shell {
        min-height: 0;
      }

      .sidebar {
        position: fixed;
        z-index: 30;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(86vw, 340px);
        flex-basis: auto;
        border-right: 1px solid var(--line);
        box-shadow: 14px 0 34px rgba(24, 48, 84, 0.14);
        transform: translateX(0);
        transition: transform 0.2s ease;
      }

      .app-shell[data-sidebar-collapsed="true"] .sidebar {
        width: min(86vw, 340px);
        border-right: 1px solid var(--line);
        transform: translateX(-104%);
      }

      .sidebar-inner {
        width: 100%;
      }

      .sidebar-resizer {
        display: none;
      }

      .sidebar-scrim {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: block;
        border: 0;
        background: var(--scrim);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .app-shell[data-sidebar-collapsed="false"] .sidebar-scrim {
        opacity: 1;
        pointer-events: auto;
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        width: 100%;
        border: 0;
      }

      .chat-header {
        min-height: 70px;
        padding: 11px 14px;
      }

      .brand-mark {
        flex-basis: 38px;
        width: 38px;
        height: 38px;
      }

      .brand-copy h1 {
        font-size: 0.98rem;
      }

      .brand-copy p,
      .clear-button {
        display: none;
      }

      .brand {
        gap: 8px;
      }

      .status-chip {
        min-width: auto;
        padding: 6px 9px;
      }

      .messages {
        padding: 22px 12px 16px;
      }

      .message {
        gap: 7px;
        margin-bottom: 20px;
      }

      .avatar {
        flex-basis: 30px;
        width: 30px;
        height: 30px;
        font-size: 0.73rem;
      }

      .message-content {
        max-width: 87%;
      }

      .bubble {
        padding: 10px 12px;
      }

      .formula {
        margin-right: -12px;
        margin-left: -12px;
      }

      .composer-area {
        padding: 0 10px 12px;
      }

      .solver-dialog {
        width: calc(100vw - 16px);
        max-height: calc(100dvh - 16px);
        border-radius: 13px;
      }

      .solver-shell {
        max-height: calc(100dvh - 16px);
      }

      .solver-header,
      .solver-body,
      .solver-footer {
        padding-right: 14px;
        padding-left: 14px;
      }

      .solver-grid {
        grid-template-columns: 1fr;
      }

      .solver-field.is-wide {
        grid-column: auto;
      }

      .solver-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .solver-actions {
        justify-content: flex-end;
      }

      .send-button {
        min-width: 62px;
        padding-right: 13px;
        padding-left: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell" data-sidebar-collapsed="false">
    <aside class="sidebar" id="sidebar" aria-label="会话与工具">
      <div class="sidebar-inner">
        <div class="sidebar-top">
          <div class="sidebar-brand">
            <span class="sidebar-logo" aria-hidden="true">知</span>
            <span>知微高数</span>
          </div>
          <button
            class="icon-button"
            type="button"
            data-sidebar-toggle
            aria-label="折叠侧边栏"
            title="折叠侧边栏"
          >‹</button>
        </div>

        <button class="new-chat-button" id="newChatButton" type="button">
          <span aria-hidden="true">+</span>
          <span class="new-chat-label">新建会话</span>
        </button>

        <section class="sidebar-section" aria-labelledby="historyHeading">
          <div class="section-heading" id="historyHeading">
            <span>历史对话</span>
            <span id="historyCount">0</span>
          </div>
          <div class="history-list" id="historyList"></div>
        </section>

        <details class="tools-menu">
          <summary>高数工具</summary>
          <div class="tool-list">
            <button
              class="tool-button"
              type="button"
              data-formula-type="derivative"
            >
              <span class="tool-icon" aria-hidden="true">d/dx</span>
              <span class="tool-label">求导</span>
            </button>
            <button
              class="tool-button"
              type="button"
              data-formula-type="integral"
            >
              <span class="tool-icon" aria-hidden="true">∫</span>
              <span class="tool-label">积分</span>
            </button>
            <button
              class="tool-button"
              type="button"
              data-formula-type="limit"
            >
              <span class="tool-icon" aria-hidden="true">lim</span>
              <span class="tool-label">极限</span>
            </button>
            <button
              class="tool-button is-wide"
              id="openSolverButton"
              type="button"
            >
              <span class="tool-icon" aria-hidden="true">∑</span>
              <span class="tool-label">全章节解题</span>
            </button>
          </div>
        </details>

        <div class="sidebar-footer">
          <button class="theme-button" id="themeToggle" type="button">
            <span class="theme-icon" aria-hidden="true">◐</span>
            <span id="themeLabel">切换深色主题</span>
          </button>
        </div>
      </div>
      <div
        class="sidebar-resizer"
        id="sidebarResizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整侧边栏宽度"
        tabindex="0"
      ></div>
    </aside>
    <button
      class="sidebar-scrim"
      id="sidebarScrim"
      type="button"
      aria-label="关闭侧边栏"
      tabindex="-1"
    ></button>

    <div class="chat-layout">
      <header class="chat-header">
        <div class="brand">
          <button
            class="icon-button"
            id="sidebarToggle"
            type="button"
            data-sidebar-toggle
            aria-label="展开或折叠侧边栏"
            title="展开或折叠侧边栏"
          >☰</button>
          <div class="brand-mark" aria-hidden="true">知</div>
          <div class="brand-copy">
            <h1>知微老师</h1>
            <p>高等数学学习伙伴</p>
          </div>
        </div>
        <div class="header-actions">
          <div
            class="status-chip"
            id="serviceStatus"
            data-state="checking"
            role="status"
          >
            <span class="status-dot" aria-hidden="true"></span>
            <span id="serviceStatusText">连接中</span>
          </div>
          <button class="clear-button" id="clearButton" type="button">清空对话</button>
        </div>
      </header>

      <main
        class="messages"
        id="messageList"
        aria-label="知微老师对话记录"
        aria-live="polite"
      ></main>

      <footer class="composer-area" data-suggestions-collapsed="false">
        <div class="suggestions-toolbar">
          <button
            class="suggestions-toggle"
            id="suggestionsToggle"
            type="button"
            aria-controls="suggestions"
            aria-expanded="true"
            title="折叠示例快捷指令"
          >
            <span class="suggestions-toggle-icon" aria-hidden="true">⌃</span>
            <span id="suggestionsToggleLabel">收起示例</span>
          </button>
        </div>
        <div class="suggestions" id="suggestions" aria-label="示例题目"></div>
        <form class="composer" id="chatForm">
          <label class="sr-only" for="chatInput">输入高等数学题目</label>
          <textarea
            class="chat-input"
            id="chatInput"
            name="message"
            rows="1"
            maxlength="600"
            autocomplete="off"
            spellcheck="false"
            placeholder="输入题目，例如：求导 x^2"
            required
          ></textarea>
          <button class="send-button" id="sendButton" type="submit">发送</button>
        </form>
      </footer>
    </div>
  </div>

  <dialog class="solver-dialog" id="solverDialog" aria-labelledby="solverTitle">
    <form class="solver-shell" id="solverForm">
      <header class="solver-header">
        <div>
          <h2 id="solverTitle">全章节解题</h2>
          <p>选择题型和参数，结果由确定性数学工具计算。</p>
        </div>
        <button
          class="icon-button"
          id="closeSolverButton"
          type="button"
          aria-label="关闭全章节解题"
          title="关闭"
        >×</button>
      </header>
      <div class="solver-body">
        <div class="solver-grid">
          <div class="solver-field">
            <label for="solverChapter">章节</label>
            <select id="solverChapter"></select>
          </div>
          <div class="solver-field">
            <label for="solverTopic">题型</label>
            <select id="solverTopic"></select>
          </div>
        </div>
        <div class="solver-grid" id="solverFields"></div>
        <p class="solver-hint" id="solverHint"></p>
      </div>
      <footer class="solver-footer">
        <div class="solver-status" id="solverStatus" role="status"></div>
        <div class="solver-actions">
          <button class="solver-button" id="cancelSolverButton" type="button">
            取消
          </button>
          <button class="solver-button primary" id="submitSolverButton" type="submit">
            开始计算
          </button>
        </div>
      </footer>
    </form>
  </dialog>

  <dialog
    class="solver-dialog formula-dialog"
    id="formulaDialog"
    aria-labelledby="formulaTitle"
  >
    <div class="solver-shell">
      <header class="solver-header">
        <div>
          <h2 id="formulaTitle">公式速查</h2>
          <p id="formulaSubtitle">常用公式和简短知识点。</p>
        </div>
        <button
          class="icon-button"
          id="closeFormulaButton"
          type="button"
          aria-label="关闭公式速查"
          title="关闭"
        >×</button>
      </header>
      <div class="solver-body formula-body" id="formulaContent"></div>
      <footer class="solver-footer">
        <div class="solver-status"></div>
        <div class="solver-actions">
          <button class="solver-button primary" id="closeFormulaAction" type="button">
            知道了
          </button>
        </div>
      </footer>
    </div>
  </dialog>

  <script
    defer
    src="{{ url_for('static', filename='katex/katex.min.js') }}"
  ></script>
  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "zhiwei-demo-chat-v1";
      const SESSION_KEY = "zhiwei-demo-session-v1";
      const CONVERSATIONS_KEY = "zhiwei-demo-conversations-v1";

      const MAX_STORED_MESSAGES = 40;

      const DEFAULT_SIDEBAR_WIDTH = 272;
      const DEFAULT_SUGGESTIONS = [
        "求导 x^2",

        "积分 x^2",
        "积分 0 到 1 x^2",
        "lim x→0 sin(x)/x",
        "我以前做过哪些题",
      ];
      const FORMULA_GUIDES = {
        derivative: {
          title: "求导常用公式",
          subtitle: "先看基本公式，再注意复合函数和商的求导。",
          groups: [
            {
              heading: "基本公式",
              items: [
                ["(x^n)' = n x^(n-1)", "幂函数求导。"],
                ["(sin x)' = cos x", "正弦函数求导。"],
                ["(cos x)' = -sin x", "余弦函数求导注意负号。"],
                ["(e^x)' = e^x", "指数函数保持不变。"],
                ["(ln x)' = 1/x", "定义域 x > 0。"],
              ],
            },
            {
              heading: "运算规则",
              items: [

                ["(u/v)' = (u'v - uv')/v^2", "商求导，分母不能为 0。"],
                ["[f(g(x))]' = f'(g(x))g'(x)", "复合函数链式法则。"],

            },
          ],
        },
        integral: {

          groups: [
            {
              heading: "基本公式",
              items: [
                ["∫ x^n dx = x^(n+1)/(n+1) + C", "当 n ≠ -1。"],
                ["∫ 1/x dx = ln|x| + C", "x 不能为 0。"],
                ["∫ e^x dx = e^x + C", "指数函数积分。"],
                ["∫ sin x dx = -cos x + C", "正弦函数积分注意负号。"],
                ["∫ cos x dx = sin x + C", "余弦函数积分。"],
              ],
            },
            {
              heading: "常用方法",
              items: [
                ["∫ u dv = uv - ∫ v du", "分部积分法。"],
                ["换元后要同步换 dx 和积分上下限", "定积分换元时尤其重要。"],
              ],
            },
          ],
        },
        limit: {
          title: "极限常用公式",
          subtitle: "先判断类型，再选择等价无穷小或洛必达法则。",
          groups: [
            {
              heading: "常用极限",

                ["lim(x→∞) (1 + 1/x)^x = e", "重要极限。"],

            {

              items: [

              ],
            },
          ],
        },
      };
      const solverText = (
        key,
        label,
        placeholder,
        defaultValue = "",
        options = {},
      ) => ({
        key,
        label,
        placeholder,
        defaultValue,
        type: "text",
        ...options,

      function normalizeMessages(value) {
        if (!Array.isArray(value)) {
          return [];
        }
        return value
          .filter((item) => item && (item.role === "user" || item.role === "assistant"))
          .slice(-MAX_STORED_MESSAGES)
          .map((item) => ({
            id: String(item.id || makeId()),
            role: item.role,
            text: String(item.text || ""),
            formulaLatex: String(item.formulaLatex || ""),
            formulaText: String(item.formulaText || ""),
            resultLabel: String(item.resultLabel || ""),
            resultValue: String(item.resultValue || ""),
            verdict: typeof item.verdict === "boolean" ? item.verdict : null,
            plotUrl: String(item.plotUrl || ""),
            createdAt: String(item.createdAt || currentTime()),
          }));
      }

      function loadConversations() {
        try {
          const parsed = JSON.parse(
            window.localStorage.getItem(CONVERSATIONS_KEY) || "[]",
          );
          if (!Array.isArray(parsed)) {
            return [];
          }
          return parsed
            .filter((item) => item && item.id)
            .slice(0, MAX_CONVERSATIONS)
            .map((item) => ({
              id: String(item.id),
              title: String(item.title || "历史对话"),
              renamed: Boolean(item.renamed),
              updatedAt: Number(item.updatedAt) || Date.now(),
              messages: normalizeMessages(item.messages),
            }));
        } catch (error) {
          return [];
        }
      }

      function persistConversations() {
        try {
          window.localStorage.setItem(
            CONVERSATIONS_KEY,
            JSON.stringify(conversations.slice(0, MAX_CONVERSATIONS)),
          );
        } catch (error) {
          // Conversation history remains optional when browser storage is unavailable.
        }
      }

        try {

          if (!value) {
            value =

                : `session-${makeId()}`;
            window.localStorage.setItem(SESSION_KEY, value);
          }
          return value;
        } catch (error) {
          return "session-fallback";
