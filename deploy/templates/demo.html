      async function submitSolverRequest(event) {
        event.preventDefault();
        if (requestInFlight) {
          return;
        }

        let payload;
        let selected;
        try {
          selected = selectedSolverTopic();
          payload = buildSolverPayload();
        } catch (error) {
          solverStatus.textContent = error.message || "请检查输入参数";
          return;
        }

        solverStatus.textContent = "";
        submitSolverButton.disabled = true;
        submitSolverButton.textContent = "计算中";
        setRequestState(true);

        const controller = new AbortController();
        const timeoutId = window.setTimeout(
          () => controller.abort(),
          REQUEST_TIMEOUT_MS,
        );
        try {
          const response = await fetch("/demo/api/solve", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
            signal: controller.signal,
          }).finally(() => window.clearTimeout(timeoutId));

          let data;
          try {
            data = await response.json();
          } catch (error) {
            throw new Error("计算服务返回了无法识别的内容");
          }
          if (!response.ok) {
            throw new Error(
              data.detail
              || `计算服务返回错误（${response.status}）`,
            );
          }

          const notes = Array.isArray(data.notes) && data.notes.length
            ? `\n\n提示：${data.notes.join("；")}`
            : "";
          messages.push(
            {
              id: makeId(),
              role: "user",
              text: `【全章节解题】${solverSummary(selected, payload.inputs)}`,
              formulaLatex: "",
              formulaText: "",
              resultLabel: "",
              resultValue: "",
              verdict: null,
              createdAt: currentTime(),
            },
            {
              id: makeId(),
              role: "assistant",
              text: `已用“${data.method}”完成计算。${notes}`,
              formulaLatex: String(data.latex || ""),
              formulaText: String(data.result || ""),
              resultLabel: String(data.method || ""),
              resultValue: String(data.result || ""),
              verdict:
                typeof data.is_correct === "boolean"
                  ? data.is_correct
                  : null,
              createdAt: currentTime(),
            },
          );
          renderMessages();
          saveMessages();
          closeSolverDialog();
        } catch (error) {
          solverStatus.textContent =
            error.name === "AbortError"
              ? "等待时间过长，请稍后重试。"
              : error.message || "计算服务暂时不可用";
        } finally {
          submitSolverButton.disabled = false;
          submitSolverButton.textContent = "开始计算";
          setRequestState(false);
        }
      }

      async function sendMessage(rawMessage) {
        const text = String(rawMessage || "").trim();
        if (!text || requestInFlight) {
          return;
        }
        const history = requestHistory();

        const userMessageId = makeId();
        messages.push({
          id: userMessageId,
          role: "user",
          text,
          formulaLatex: "",
          formulaText: "",
          resultLabel: "",
          resultValue: "",
          verdict: null,
          createdAt: currentTime(),
        });

        const loadingId = makeId();
        messages.push({
          id: loadingId,
          role: "assistant",
          text: "",
          formulaLatex: "",
          formulaText: "",
          resultLabel: "",
          resultValue: "",
          verdict: null,
          createdAt: currentTime(),
          loading: true,
        });

        chatInput.value = "";
        resizeInput();
        setRequestState(true);
        renderMessages();
        saveMessages();

        const controller = new AbortController();
        const timeoutId = window.setTimeout(
          () => controller.abort(),
          REQUEST_TIMEOUT_MS,
        );

        try {
          const cachedResponse = responseCache.get(text);
          if (cachedResponse) {
            window.clearTimeout(timeoutId);
            await new Promise((resolve) => window.setTimeout(resolve, 120));
            const cachedIndex = messages.findIndex(
              (message) => message.id === loadingId,
            );
            if (cachedIndex !== -1) {
              messages[cachedIndex] = responseToMessage(cachedResponse);
            }
            syncWrongBookAnswer(userMessageId, text);
            renderSuggestions(cachedResponse.suggestions);
            return;
          }

          const response = await fetch("/demo/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Demo-Session": demoSessionId,
            },
            body: JSON.stringify({ message: text, history }),
            signal: controller.signal,
          }).finally(() => window.clearTimeout(timeoutId));

          let data;
          try {
            data = await response.json();
          } catch (error) {
            throw new Error("计算服务返回了无法识别的内容。");
          }

          if (!response.ok) {
            throw new Error(data.detail || `计算服务返回错误（${response.status}）。`);
          }

          const index = messages.findIndex((message) => message.id === loadingId);
          if (index !== -1) {
            messages[index] = responseToMessage(data);
          }
          syncWrongBookAnswer(userMessageId, text);
          cacheResponse(text, data);
          renderSuggestions(data.suggestions);
        } catch (error) {
          const index = messages.findIndex((message) => message.id === loadingId);
          if (index !== -1) {
            messages[index] = {
              id: loadingId,
              role: "assistant",
              text:
                error.name === "AbortError"
                  ? "这次等待时间有点长，已停止等待。可以再发一次同一题，系统会复用已有结果。"
                  : error.message || "计算服务暂时不可用，请稍后重试。",
              formulaLatex: "",
              formulaText: "",
              resultLabel: "",
              resultValue: "",
              verdict: null,
              createdAt: currentTime(),
            };
          }
          renderSuggestions(DEFAULT_SUGGESTIONS);
        } finally {
          setRequestState(false);
          renderMessages();
          saveMessages();
          chatInput.focus();
        }
      }

      function renderPreviewResult(data, options = {}) {
        const label = options.label || data.method || "计算结果";
        const latex = String(options.latex ?? data.latex ?? "");
        const text = String(options.text ?? data.result ?? "");
        const notes = options.notes ?? data.notes;
        const question = options.question || "";

        previewContent.replaceChildren();
        const wrap = element("div", "preview-result");
        wrap.append(element("div", "preview-result-title", label));

        if (latex || text) {
          const formula = element("div", "preview-formula");
          let rendered = false;
          if (latex && window.katex) {
            try {
              window.katex.render(latex, formula, {
                displayMode: true,
                throwOnError: true,
                strict: false,
                trust: false,
              });
              rendered = true;
            } catch (error) {
              rendered = false;
            }
          }
          if (!rendered) {
            formula.textContent = text || latex;
          }
          wrap.append(formula);
        }

        if (latex && text) {
          wrap.append(element("p", "preview-result-text", text));
        }

        if (Array.isArray(notes) && notes.length) {
          wrap.append(
            element("p", "preview-notes", `提示：${notes.join("；")}`),

          meta.append(askButton);

        wrap.append(meta);

        previewContent.append(wrap);
        previewBadge.textContent = options.badge || "已完成";
        setPreviewCollapsed(false);

      async function runInlineSolve({ chapter, topic, inputs, label, question }) {
        if (requestInFlight) {
          setPreviewError("正在处理上一题，请稍候再试。");
          return;
        }

        setPreviewLoading(label);
        setRequestState(true);
        const controller = new AbortController();
        const timeoutId = window.setTimeout(
          () => controller.abort(),
          REQUEST_TIMEOUT_MS,
        );
        try {
          const response = await fetch("/demo/api/solve", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ chapter, topic, inputs }),
            signal: controller.signal,
          }).finally(() => window.clearTimeout(timeoutId));

          let data;
          try {
            data = await response.json();
          } catch (error) {
            throw new Error("计算服务返回了无法识别的内容");
          }
          if (!response.ok) {
            throw new Error(
              data.detail || `计算服务返回错误（${response.status}）`,
            );
          }

          renderPreviewResult(data, { label, question });
        } catch (error) {
          setPreviewError(
            error.name === "AbortError"
              ? "等待时间过长，请稍后重试。"
              : error.message || "计算服务暂时不可用",
          );
        } finally {
          setRequestState(false);
        }
      }

      function runInlinePlot(expressions, xMin, xMax) {
        const curves = expressions
          .map((value) => String(value).trim())
          .filter(Boolean);
        if (!curves.length) {
          return;
        }

        previewContent.replaceChildren();
        const grid = element("div", "preview-plot-grid");
        curves.forEach((expression) => {
          const figure = document.createElement("figure");
          const image = document.createElement("img");
          const params = new URLSearchParams({
            expression,
            variable: "x",
            x_min: String(xMin),
            x_max: String(xMax),
            samples: "600",
            width: "720",
            height: "420",
          });
          image.src = `/demo/api/plot.svg?${params.toString()}`;
          image.alt = `y = ${expression}`;
          image.loading = "lazy";
          figure.append(image);
          grid.append(figure);
        });
        previewContent.append(grid);
        previewBadge.textContent = "函数图像";
        setPreviewCollapsed(false);
      }

      function renameConversation(conversationId) {
        const conversation = conversations.find(
          (item) => item.id === conversationId,
        );
        if (!conversation) {
          return;
        }
        const nextTitle = window.prompt("重命名会话", conversation.title);
        if (nextTitle === null) {
          return;
        }
        const title = nextTitle.replace(/\s+/g, " ").trim();
        if (!title) {
          return;
        }
        conversation.title = title.slice(0, 60);
        conversation.renamed = true;
        conversation.updatedAt = Date.now();
        persistConversations();
        renderHistory();
      }

      function deleteConversation(conversationId) {
        const conversation = conversations.find(
          (item) => item.id === conversationId,
        );
        if (!conversation) {
          return;
        }
        if (!window.confirm(`确定删除“${conversationPreview(conversation)}”吗？`)) {
          return;
        }

        const wasActive = conversationId === activeConversationId;
        conversations = conversations.filter(
          (item) => item.id !== conversationId,
        );
        persistConversations();

        if (!wasActive) {
          renderHistory();
          return;
        }
        if (conversations.length) {
          selectConversation(conversations[0].id);
        } else {
          startNewConversation();
        }

            inputs: { expression, variable: "x", lower, upper },
            label: "定积分",
            question: `求定积分 ${lower} 到 ${upper} ${expression}`,
          });
        });
      }

      if (quickDifferentialForm) {
        quickDifferentialForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const equation = readQuickInput("quickDifferentialExpression");
          if (!equation) {
            setPreviewError("请先填写微分方程。");
            return;
          }
          runInlineSolve({
            chapter: "differential_equations",
            topic: "dsolve",
            inputs: { equation, variable: "x", function: "y" },
            label: "微分方程",
            question: `解微分方程 ${equation}`,
          });
        });
      }

      if (quickPlotForm) {
        quickPlotForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const expressions = readQuickInput("quickPlotExpression").split("\n");
          const xMin = readQuickInput("quickPlotXMin") || "-6";
          const xMax = readQuickInput("quickPlotXMax") || "6";
          if (!expressions.some((value) => value.trim())) {
            setPreviewError("请至少填写一条函数表达式，每行一条。");
            return;
          }
          runInlinePlot(expressions, xMin, xMax);
        });
      }

      if (conversationPanelToggle) {
        conversationPanelToggle.addEventListener("click", () => {
          setConversationPanelCollapsed(
            conversationPanel.dataset.collapsed !== "true",
          );
        });
      }

      if (previewToggle) {
        previewToggle.addEventListener("click", () => {
          setPreviewCollapsed(previewPanel.dataset.collapsed !== "true");
        });
      }

      if (previewClear) {
        previewClear.addEventListener("click", () => {
          setPreviewEmpty();
        });
      }

      if (toolbox) {
        toolbox.addEventListener("click", (event) => {
          const tabButton = event.target.closest("[data-toolbox-tab]");
          if (tabButton) {
            setToolboxTab(tabButton.dataset.toolboxTab);
            return;
          }

          const collapsedQuickTool = event.target.closest(
            ".quick-tool[data-focus-target]",
          );
          if (
            collapsedQuickTool &&
            appShell.dataset.sidebarCollapsed === "true"
          ) {
            setSidebarCollapsed(false);
            const focusTarget = document.getElementById(
              collapsedQuickTool.dataset.focusTarget,
            );
            if (focusTarget) {
              window.requestAnimationFrame(() => focusTarget.focus());
            }
            return;
          }

          const formulaCard = event.target.closest("[data-formula-card]");
          if (formulaCard) {
            insertIntoChatInput(formulaCard.dataset.formula || "");
            return;
          }

          const wrongBookAction = event.target.closest(
            "[data-wrongbook-action]",
          );
          if (wrongBookAction) {
            const itemId = wrongBookAction.dataset.wrongBookId;
            if (wrongBookAction.dataset.wrongbookAction === "practice") {
              practiceWrongBookItem(itemId);
            } else if (
              wrongBookAction.dataset.wrongbookAction === "delete"
            ) {
              deleteWrongBookItem(itemId);
            }
            return;
          }

          const symbolButton = event.target.closest("[data-symbol]");
          if (symbolButton) {
            insertIntoChatInput(symbolButton.dataset.symbol || "");
            return;
          }
          const promptButton = event.target.closest("[data-toolbox-prompt]");
          if (promptButton) {
            if (sidebarMedia.matches) {
              setSidebarCollapsed(true);
            }
            sendMessage(promptButton.dataset.toolboxPrompt);
          }
        });
      }

      if (formulaImageButton && formulaImageInput) {
        formulaImageButton.addEventListener("click", () =>
          formulaImageInput.click(),
        );
        formulaImageInput.addEventListener("change", () => {
          if (formulaImageInput.files && formulaImageInput.files.length) {
            const message =
              "图片识别暂未接入视觉接口，请先输入题目文字。";
            if (formulaImageStatus) {
              formulaImageStatus.textContent = message;
            }
            setPreviewEmpty(message);
            previewBadge.textContent = "提示";
            setPreviewCollapsed(false);
          }
          formulaImageInput.value = "";
        });
      }

      if (formulaSearchInput) {
        formulaSearchInput.addEventListener("input", renderFormulaCards);
      }

      if (wrongBookClear) {
        wrongBookClear.addEventListener("click", clearWrongBook);
      }

      if (wrongBookExport) {
        wrongBookExport.addEventListener("click", exportWrongBook);
      }

      document.querySelector(".tools-menu").addEventListener("click", (event) => {
        const formulaButton = event.target.closest("[data-formula-type]");
        if (formulaButton) {
          if (sidebarMedia.matches) {
            setSidebarCollapsed(true);
          }
          openFormulaDialog(formulaButton.dataset.formulaType);
          return;
        }
        const solverTopicButton = event.target.closest("[data-solver-topic]");
        if (solverTopicButton) {
          if (sidebarMedia.matches) {
            setSidebarCollapsed(true);
          }
          openSolverTopic(
            solverTopicButton.dataset.solverChapter,
            solverTopicButton.dataset.solverTopic,
          );
          return;
        }
        const button = event.target.closest("[data-prompt]");
        if (!button) {
          return;
        }
        if (sidebarMedia.matches) {
          setSidebarCollapsed(true);
        }
        sendMessage(button.dataset.prompt);
      });

      openSolverButton.addEventListener("click", openSolverDialog);
      closeSolverButton.addEventListener("click", closeSolverDialog);
      cancelSolverButton.addEventListener("click", closeSolverDialog);
      closeFormulaButton.addEventListener("click", closeFormulaDialog);
      closeFormulaAction.addEventListener("click", closeFormulaDialog);
      formulaDialog.addEventListener("click", (event) => {
        if (event.target === formulaDialog) {
          closeFormulaDialog();
        }
      });
      solverChapter.addEventListener("change", populateSolverTopics);
      solverTopic.addEventListener("change", renderSolverFields);
      solverForm.addEventListener("submit", submitSolverRequest);
      solverDialog.addEventListener("click", (event) => {
        if (event.target === solverDialog) {
          closeSolverDialog();
        }
      });

      themeToggle.addEventListener("click", () => {
        setTheme(
          document.documentElement.dataset.theme === "dark" ? "light" : "dark",
        );
      });

      let resizePointerId = null;
      let resizeStartX = 0;
      let resizeStartWidth = DEFAULT_SIDEBAR_WIDTH;

      sidebarResizer.addEventListener("pointerdown", (event) => {
        if (sidebarMedia.matches || event.button !== 0) {
          return;
        }
        event.preventDefault();
        resizePointerId = event.pointerId;
        resizeStartX = event.clientX;
        resizeStartWidth =
          parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--sidebar-width",
            ),
          ) || DEFAULT_SIDEBAR_WIDTH;
        appShell.classList.add("is-resizing");
        sidebarResizer.setPointerCapture(event.pointerId);
      });

      sidebarResizer.addEventListener("pointermove", (event) => {
        if (event.pointerId !== resizePointerId) {
          return;
        }
        setSidebarWidth(
          resizeStartWidth + event.clientX - resizeStartX,
          false,
        );
      });

      function finishSidebarResize(event) {
        if (event.pointerId !== resizePointerId) {
          return;
        }
        resizePointerId = null;
        appShell.classList.remove("is-resizing");
        const width =
          parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--sidebar-width",
            ),
          ) || DEFAULT_SIDEBAR_WIDTH;
        setSidebarWidth(width);
      }

      sidebarResizer.addEventListener("pointerup", finishSidebarResize);
      sidebarResizer.addEventListener("pointercancel", finishSidebarResize);

      sidebarResizer.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") {
          return;
        }
        event.preventDefault();
        const direction = event.key === "ArrowRight" ? 1 : -1;
        const currentWidth =
          parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--sidebar-width",
            ),
          ) || DEFAULT_SIDEBAR_WIDTH;
        setSidebarWidth(currentWidth + direction * 16);
      });

      const handleSidebarMediaChange = (event) => {
        if (event.matches) {
          setSidebarCollapsed(true, false);
          return;
        }
        let savedState = false;
        try {
          savedState =
            window.localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === "true";
        } catch (error) {
          savedState = false;
        }
        setSidebarCollapsed(savedState, false);
      };

      if (sidebarMedia.addEventListener) {
        sidebarMedia.addEventListener("change", handleSidebarMediaChange);
      } else {
        sidebarMedia.addListener(handleSidebarMediaChange);
      }

      chatForm.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage(chatInput.value);
      });

      chatInput.addEventListener("input", resizeInput);
      chatInput.addEventListener("keydown", (event) => {
        if (
          event.key === "Enter"
          && !event.shiftKey
          && !event.isComposing
          && event.keyCode !== 229
        ) {
          event.preventDefault();
          chatForm.requestSubmit();
        }
      });

      suggestions.addEventListener("click", (event) => {
        const button = event.target.closest(".suggestion");
        if (button) {
          sendMessage(button.dataset.message);
        }
      });

      suggestionsToggle.addEventListener("click", () => {
        setSuggestionsCollapsed(
          composerArea.dataset.suggestionsCollapsed !== "true",
        );
      });

      clearButton.addEventListener("click", clearCurrentConversation);

      wrongBook = loadWrongBook();
      conversations = loadConversations();
      try {
        activeConversationId =
          window.localStorage.getItem(ACTIVE_CONVERSATION_KEY) || "";
      } catch (error) {
        activeConversationId = "";
      }

      let activeConversation = conversations.find(
        (conversation) => conversation.id === activeConversationId,
      );
      if (activeConversation) {
        messages = normalizeMessages(activeConversation.messages);
      } else {
        messages = loadMessages();
        if (!messages.length && conversations.length) {
          activeConversation = conversations[0];
          activeConversationId = activeConversation.id;
          messages = normalizeMessages(activeConversation.messages);
        }
      }

      if (!activeConversationId) {
        activeConversationId = makeId();
      }
      try {
        window.localStorage.setItem(
          ACTIVE_CONVERSATION_KEY,
          activeConversationId,
        );
      } catch (error) {
        // The current conversation remains active in memory.
      }

      if (!messages.length) {
        messages = [welcomeMessage()];
      }

      let savedTheme = "light";
      let savedSidebarWidth = DEFAULT_SIDEBAR_WIDTH;
      let savedSidebarCollapsed = false;
      try {
        savedTheme =
          window.localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light";
        savedSidebarWidth =
          Number(window.localStorage.getItem(SIDEBAR_WIDTH_KEY)) ||
          DEFAULT_SIDEBAR_WIDTH;
        savedSidebarCollapsed =
          window.localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === "true";
      } catch (error) {
        // Defaults apply when browser storage is unavailable.
      }
      setTheme(savedTheme);
      setSidebarWidth(savedSidebarWidth, false);
      setSuggestionsCollapsed(false);
      setSidebarCollapsed(
        sidebarMedia.matches ? true : savedSidebarCollapsed,
        false,
      );

      populateSolverChapters();
      renderToolsNavigation();
      renderFormulaCards();
      renderWrongBook();
      saveMessages();
      renderSuggestions(DEFAULT_SUGGESTIONS);
      renderMessages();
      resizeInput();
      checkService();
    })();
  </script>
</body>
</html>
