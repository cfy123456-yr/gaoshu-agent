<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#eef1f5">
  <meta
    name="description"
    content="知微老师高等数学对话演示，支持求导、积分和极限计算。"
  >
  <title>知微老师 · 高数对话演示</title>
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='katex/katex.min.css') }}"
  >
  <style>
    :root {
      --ink: #18202f;
      --muted: #5f6b7f;
      --line: #e2e6ed;
      --line-strong: #cbd2dd;
      --canvas: #eef1f5;
      --surface: #ffffff;
      --soft-blue: #e8f0fd;
      --blue: #2563d9;
      --blue-dark: #164daa;
      --blue-ink: #123c7d;
      --amber: #b77916;
      --red: #c2413b;
      --shadow: 0 12px 30px rgba(30, 41, 59, 0.08);
      --sidebar-bg: #f3f5f8;
      --sidebar-hover: #e9edf3;
      --sidebar-active: #e3eaf5;
      --sidebar-width: 272px;
      --sidebar-rail-width: 68px;
      --sidebar-current-width: var(--sidebar-width);
      --scrim: rgba(15, 28, 48, 0.34);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e6ebf4;
      --muted: #9aa6b7;
      --line: #293342;
      --line-strong: #3c485b;
      --canvas: #0d121b;
      --surface: #151b25;
      --soft-blue: #1c2c46;
      --blue: #6699f0;
      --blue-dark: #b5ceff;
      --blue-ink: #d3e1ff;
      --amber: #d9a54d;
      --red: #ef8178;
      --shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
      --sidebar-bg: #111722;
      --sidebar-hover: #1b2431;
      --sidebar-active: #223454;
      --scrim: rgba(3, 8, 16, 0.62);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      line-height: 1.55;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(40, 104, 216, 0.18);
      outline-offset: 2px;
    }

    ::selection {
      color: var(--blue-ink);
      background: #d7e7ff;
    }

    * {
      scrollbar-color: var(--line-strong) transparent;
      scrollbar-width: thin;
    }

    *::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    *::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 999px;
      background: var(--line-strong);
      background-clip: padding-box;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      display: flex;
      width: 100%;
      max-width: 1440px;
      height: 100vh;
      height: 100dvh;
      min-height: 540px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 0 0 1px rgba(203, 210, 221, 0.78);
    }

    .app-shell[data-sidebar-collapsed="true"] {
      --sidebar-current-width: var(--sidebar-rail-width);
    }

    .sidebar {
      position: relative;
      flex: 0 0 var(--sidebar-current-width);
      width: var(--sidebar-current-width);
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: var(--sidebar-bg);
      transition: width 0.2s ease, flex-basis 0.2s ease;
    }

    .app-shell.is-resizing .sidebar {
      transition: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-inner {
      width: var(--sidebar-current-width);
      padding: 12px 10px;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-top {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-brand,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-section,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-footer,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-resizer {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .toolbox-scroll {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-rail {
      display: grid;
    }

    .sidebar-inner {
      display: flex;
      width: var(--sidebar-width);
      height: 100%;
      min-height: 0;
      flex-direction: column;
      padding: 14px 12px 12px;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 40px;
    }

    .sidebar-rail {
      display: none;
      gap: 8px;
      margin-top: 2px;
    }

    .sidebar-rail-button {
      display: grid;
      width: 44px;
      height: 44px;
      margin: 0 auto;
      padding: 0;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 11px;
      color: var(--muted);
      background: transparent;
    }

    .sidebar-rail-button:hover,
    .sidebar-rail-button:focus-visible {
      border-color: #a9c5ec;
      color: var(--blue-dark);
      background: var(--sidebar-hover);
    }

    .sidebar-rail-button[aria-current="true"] {
      border-color: var(--line-strong);
      color: var(--blue-dark);
      background: var(--sidebar-active);
    }

    .sidebar-rail-button svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
      color: var(--ink);
      font-size: 0.88rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .sidebar-logo {
      display: grid;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-size: 0.82rem;
    }

    .icon-button {
      display: grid;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--surface);
      font-size: 1rem;
      font-weight: 800;
      line-height: 1;
    }

    .icon-button:hover {
      border-color: var(--line-strong);
      color: var(--blue-dark);
      background: var(--sidebar-hover);
    }

    .conversation-panel-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 4px;
    }

    .conversation-panel-head .new-chat-icon {
      flex-basis: 30px;
      width: 30px;
      height: 30px;
      border-color: transparent;
      color: var(--blue-dark);
      background: transparent;
      font-size: 1.05rem;
    }

    .conversation-panel-head .new-chat-icon:hover,
    .conversation-panel-head .new-chat-icon:focus-visible {
      border-color: #a9c5ec;
      color: var(--blue-dark);
      background: var(--soft-blue);
    }

    .sidebar-section {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      margin-top: 20px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 6px 8px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .history-list {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: thin;
    }

    .history-item {
      position: relative;
      display: flex;
      align-items: stretch;
      width: 100%;
      margin-bottom: 4px;
      overflow: visible;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--ink);
      background: transparent;
    }

    .history-item::before {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 0;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: transparent;
      content: "";
    }

    .history-select {
      min-width: 0;
      flex: 1;
      padding: 9px 10px;
      overflow: hidden;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
    }

    .history-actions {
      position: absolute;
      top: 50%;
      right: 6px;
      display: flex;
      gap: 3px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 0.15s ease;
    }

    .history-item:hover .history-actions,
    .history-item:focus-within .history-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .history-action {
      min-height: 24px;
      padding: 2px 5px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      color: var(--muted);
      background: var(--surface);
      font-size: 0.64rem;
      font-weight: 750;
    }

    .history-action:hover {
      border-color: #a9c5ec;
      color: var(--blue-dark);
      background: var(--soft-blue);
    }

    .history-item:hover {
      border-color: var(--line);
      background: var(--sidebar-hover);
    }

    .history-item[data-active="true"] {
      border-color: #c8dbf7;
      background: var(--sidebar-active);
    }

    .history-item[data-active="true"]::before {
      background: var(--blue);
    }

    .history-title,
    .history-time {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-title {
      font-size: 0.79rem;
      font-weight: 750;
      transition: padding-right 0.15s ease;
    }

    .history-item:hover .history-title,
    .history-item:focus-within .history-title {
      padding-right: 82px;
    }

    .history-time {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .history-empty {
      padding: 10px;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.6;
    }

    .solver-dialog {
      width: min(720px, calc(100vw - 28px));
      max-width: none;
      max-height: min(780px, calc(100dvh - 28px));
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(20, 55, 110, 0.24);
    }

    .solver-dialog::backdrop {
      background: rgba(11, 27, 52, 0.38);
      backdrop-filter: blur(3px);
    }

    .solver-shell {
      display: flex;
      max-height: min(780px, calc(100dvh - 28px));
      flex-direction: column;
    }

    .solver-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
    }

    .solver-header h2 {
      margin: 0;
      color: var(--ink);
      font-size: 1.02rem;
      line-height: 1.35;
    }

    .solver-header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .solver-body {
      min-height: 0;
      padding: 16px 20px;
      overflow-y: auto;
    }

    .solver-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .solver-field {
      display: grid;
      min-width: 0;
      gap: 5px;
    }

    .solver-field.is-wide {
      grid-column: 1 / -1;
    }

    .solver-field label {
      color: #60708b;
      font-size: 0.73rem;
      font-weight: 800;
    }

    .solver-field input,
    .solver-field select,
    .solver-field textarea {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #d5e2f3;
      border-radius: 9px;
      color: var(--ink);
      background: #fbfdff;
      font-size: 0.82rem;
      outline: none;
    }

    .solver-field textarea {
      min-height: 70px;
      resize: vertical;
      line-height: 1.5;
    }

    .solver-field input:focus,
    .solver-field select:focus,
    .solver-field textarea:focus {
      border-color: #87afea;
      box-shadow: 0 0 0 3px rgba(40, 104, 216, 0.08);
    }

    .solver-hint {
      margin: 14px 0 0;
      padding: 9px 11px;
      border-radius: 9px;
      color: #53647f;
      background: var(--soft-blue);
      font-size: 0.74rem;
      line-height: 1.55;
    }

    .solver-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 20px 17px;
      border-top: 1px solid var(--line);
      background: #fbfdff;
    }

    .solver-status {
      min-width: 0;
      color: var(--red);
      font-size: 0.75rem;
    }

    .solver-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
    }

    .solver-button {
      min-height: 38px;
      padding: 7px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      color: var(--blue-dark);
      background: var(--surface);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .solver-button:hover {
      border-color: #9ebce8;
      background: var(--sidebar-hover);
    }

    .solver-button.primary {
      border-color: var(--blue);
      color: #ffffff;
      background: var(--blue);
    }

    .solver-button.primary:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .solver-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    html[data-theme="dark"] .solver-field input,
    html[data-theme="dark"] .solver-field select,
    html[data-theme="dark"] .solver-field textarea,
    html[data-theme="dark"] .solver-footer {
      border-color: var(--line);
      background: #101b2c;
    }

    html[data-theme="dark"] .solver-field label,
    html[data-theme="dark"] .solver-hint {
      color: var(--muted);
    }

    .sidebar-footer {
      flex: 0 0 auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .theme-button {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 38px;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      font-size: 0.77rem;
      font-weight: 750;
      text-align: left;
    }

    .theme-button:hover {
      border-color: var(--line);
      color: var(--blue-dark);
      background: var(--sidebar-hover);
    }

    .theme-icon {
      display: grid;
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      place-items: center;
      border-radius: 7px;
      background: var(--soft-blue);
    }

    .sidebar-resizer {
      position: absolute;
      z-index: 5;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      cursor: col-resize;
    }

    .sidebar-resizer:hover,
    .sidebar-resizer:focus-visible {
      background: rgba(40, 104, 216, 0.18);
      outline: none;
    }

    .sidebar-scrim {
      display: none;
    }

    .conversation-panel {
      display: flex;
      flex: 0 0 238px;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: color-mix(in srgb, var(--sidebar-bg) 86%, var(--surface));
    }

    .conversation-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 58px;
      padding: 12px 12px 8px;
    }

    .conversation-panel-title {
      color: var(--ink);
      font-size: 0.83rem;
      font-weight: 850;
    }

    .conversation-panel .sidebar-section {
      margin-top: 0;
      padding: 0 8px 10px;
    }

    .conversation-panel .section-heading {
      padding-right: 5px;
      padding-left: 5px;
    }

    .conversation-panel .sidebar-section {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .conversation-panel[data-collapsed="true"] {
      flex-basis: 50px;
    }

    .conversation-panel[data-collapsed="true"] .conversation-panel-title,
    .conversation-panel[data-collapsed="true"] .new-chat-icon,
    .conversation-panel[data-collapsed="true"] .sidebar-section {
      display: none;
    }

    .conversation-panel[data-collapsed="true"] .conversation-panel-head {
      justify-content: center;
      padding: 12px 4px;
    }

    .toolbox-scroll {
      min-height: 0;
      flex: 1 1 auto;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 2px 4px 12px;
      scrollbar-width: thin;
    }

    .toolbox-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      padding: 2px 2px 8px;
      border-bottom: 1px solid var(--line);
    }

    .toolbox-tab {
      min-height: 34px;
      padding: 5px 6px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 0.67rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .toolbox-tab:hover {
      color: var(--blue-dark);
      background: var(--sidebar-hover);
    }

    .toolbox-tab[aria-selected="true"] {
      border-color: var(--line-strong);
      color: var(--blue-dark);
      background: var(--sidebar-active);
    }

    .toolbox-tab:focus-visible {
      border-color: #87afea;
      outline: 0;
      box-shadow: 0 0 0 3px rgba(40, 104, 216, 0.1);
    }

    .toolbox-tab-count {
      display: inline-grid;
      min-width: 18px;
      height: 18px;
      margin-left: 3px;
      padding: 0 5px;
      place-items: center;
      border-radius: 999px;
      color: var(--blue-dark);
      background: color-mix(in srgb, var(--blue) 11%, transparent);
      font-size: 0.58rem;
      font-variant-numeric: tabular-nums;
    }

    .toolbox-panel[data-active="false"] {
      display: none;
    }

    .wrongbook-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin: 0 2px 8px;
      color: var(--muted);
      font-size: 0.66rem;
    }

    .wrongbook-toolbar > span {
      flex: 1 1 100%;
      min-width: 0;
    }

    .wrongbook-clear {
      flex: 0 0 auto;
      white-space: nowrap;
      min-height: 26px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: var(--surface);
      font-size: 0.64rem;
    }

    .wrongbook-clear:hover {
      border-color: #e2b7b2;
      color: var(--red);
      background: color-mix(in srgb, var(--red) 7%, transparent);
    }

    .wrongbook-list {
      display: grid;
      gap: 7px;
    }

    .wrongbook-item {
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .wrongbook-item-title {
      display: -webkit-box;
      overflow: hidden;
      color: var(--ink);
      font-size: 0.72rem;
      font-weight: 750;
      line-height: 1.45;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .wrongbook-item-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.61rem;
    }

    .wrongbook-answer {
      margin-top: 7px;
      padding-top: 6px;
      border-top: 1px solid var(--line);
    }

    .wrongbook-answer summary {
      cursor: pointer;
      color: var(--blue-dark);
      font-size: 0.65rem;
      font-weight: 800;
    }

    .wrongbook-answer-text {
      max-height: 180px;
      margin-top: 6px;
      overflow: auto;
      color: var(--muted);
      font-size: 0.66rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .wrongbook-item-actions {
      display: flex;
      gap: 5px;
      margin-top: 7px;
    }

    .wrongbook-item-actions button {
      flex: 1 1 0;
      min-height: 28px;
      padding: 3px 5px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-size: 0.65rem;
      font-weight: 800;
    }

    .wrongbook-item-actions button[data-wrongbook-action="delete"] {
      color: var(--muted);
      background: transparent;
    }

    .wrongbook-item-actions button:hover {
      border-color: #a9c5ec;
    }

    .wrongbook-empty {
      padding: 14px 8px;
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1.6;
      text-align: center;
    }

    .learning-progress-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin: 0 2px 9px;
    }

    .progress-metric {
      min-height: 66px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .progress-metric strong {
      display: block;
      color: var(--blue-ink);
      font-size: 1.25rem;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .progress-metric span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.61rem;
      font-weight: 700;
    }

    .progress-streak {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 0 2px 10px;
      padding: 9px 10px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.64rem;
    }

    .progress-streak strong {
      color: var(--blue-dark);
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
    }

    .progress-days {
      display: grid;
      gap: 6px;
      margin: 0 2px;
    }

    .progress-day {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 26px;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 0.61rem;
    }

    .progress-day-count {
      color: var(--blue-dark);
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .progress-day-track {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--sidebar-hover);
    }

    .progress-day-fill {
      width: var(--progress-width, 0%);
      height: 100%;
      border-radius: inherit;
      background: var(--blue);
      transition: width 0.25s ease;
    }

    .progress-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      margin: 12px 2px 0;
    }

    .progress-action {
      min-height: 32px;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--blue-dark);
      background: var(--surface);
      font-size: 0.62rem;
      font-weight: 800;
    }

    .progress-action:hover,
    .progress-action:focus-visible {
      border-color: #a9c5ec;
      background: var(--sidebar-hover);
    }

    .progress-action.primary {
      border-color: #b9d0ef;
      background: var(--soft-blue);
    }

    .progress-status {
      min-height: 1.6em;
      margin: 7px 3px 0;
      color: var(--muted);
      font-size: 0.61rem;
      line-height: 1.5;
    }

    .progress-status[data-state="error"] {
      color: var(--red);
    }

    .progress-status[data-state="success"] {
      color: var(--blue-dark);
    }

    .toolbox-section {
      padding: 12px 2px;
      border-top: 1px solid var(--line);
    }

    .toolbox-section:first-child {
      border-top: 0;
    }

    .toolbox-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 4px 9px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 850;
      letter-spacing: 0.04em;
    }

    .toolbox-heading span:last-child {
      color: var(--blue-dark);
      font-size: 0.63rem;
      letter-spacing: 0;
    }

    .quick-stack {
      display: grid;
      gap: 7px;
    }

    .quick-tool {
      padding: 8px 9px 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: color-mix(in srgb, var(--surface) 72%, transparent);
    }

    .quick-tool-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .quick-tool-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      font-size: 0.74rem;
      font-weight: 850;
    }

    .quick-tool-mark {
      display: inline-grid;
      min-width: 20px;
      height: 20px;
      place-items: center;
      color: var(--blue-dark);
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 0.78rem;
    }

    .quick-tool-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
    }

    .quick-tool-row.is-limit {
      grid-template-columns: minmax(0, 1fr) 18px 58px;
    }

    .quick-tool-row.is-integral {
      grid-template-columns: minmax(0, 1fr) 54px 54px;
    }

    .quick-input,
    .quick-select {
      width: 100%;
      min-width: 0;
      height: 34px;
      padding: 6px 8px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: var(--ink);
      background: var(--surface);
      font-size: 0.75rem;
      outline: none;
    }

    .quick-input:focus,
    .quick-select:focus {
      border-color: #87afea;
      box-shadow: 0 0 0 3px rgba(40, 104, 216, 0.08);
    }

    .quick-calculate {
      min-width: 54px;
      height: 34px;
      padding: 5px 9px;
      border: 1px solid var(--blue);
      border-radius: 7px;
      color: #fff;
      background: var(--blue);
      font-size: 0.72rem;
      font-weight: 850;
    }

    .quick-calculate:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .quick-calculate:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .quick-caption {
      margin: 6px 1px 0;
      color: var(--muted);
      font-size: 0.64rem;
      line-height: 1.4;
    }

    .toolbox-more-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 34px;
      padding: 6px 9px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      color: var(--blue-dark);
      background: transparent;
      font-size: 0.7rem;
      font-weight: 850;
    }

    .toolbox-more-toggle:hover,
    .toolbox-more-toggle:focus-visible {
      border-color: #a9c5ec;
      background: var(--sidebar-hover);
    }

    .toolbox-more-toggle::after {
      content: "+";
      font-size: 0.9rem;
      line-height: 1;
    }

    .toolbox-more-toggle[aria-expanded="true"]::after {
      content: "−";
    }

    .related-knowledge {
      display: grid;
      max-height: min(32vh, 280px);
      min-height: 0;
      gap: 7px;
      margin: 0 0 8px;
      padding: 2px 2px 12px;
      overflow-x: hidden;
      overflow-y: auto;
      border-bottom: 1px solid var(--line);
      scrollbar-width: thin;
    }

    .related-knowledge-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 0 4px;
      color: var(--muted);
      font-size: 0.67rem;
      font-weight: 850;
    }

    .related-knowledge-head span:last-child {
      color: var(--blue-dark);
      font-size: 0.6rem;
      font-weight: 750;
    }

    .related-knowledge-list {
      display: grid;
      gap: 6px;
    }

    .related-knowledge-empty {
      margin: 0 4px;
      padding: 8px 9px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.66rem;
      line-height: 1.5;
    }

    .knowledge-item {
      display: grid;
      gap: 4px;
      width: 100%;
      padding: 8px 9px;
      border-left: 3px solid color-mix(in srgb, var(--blue) 72%, var(--line));
      border-radius: 0 7px 7px 0;
      color: var(--ink);
      background: color-mix(in srgb, var(--soft-blue) 58%, var(--surface));
      font-size: 0.7rem;
      line-height: 1.4;
    }

    .knowledge-item strong {
      overflow-wrap: anywhere;
      color: var(--blue-dark);
      font-size: 0.68rem;
      font-weight: 850;
    }

    .knowledge-item p {
      margin: 0;
      color: var(--muted);
      font-size: 0.64rem;
      line-height: 1.55;
    }

    .knowledge-source {
      display: block;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 0.58rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .solver-entry {
      display: flex;
      width: 100%;
      min-height: 38px;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--blue-dark);
      background: var(--surface);
      font-size: 0.72rem;
      font-weight: 800;
      text-align: left;
    }

    .solver-entry::after {
      color: var(--muted);
      content: "›";
      font-size: 0.9rem;
    }

    .solver-entry:hover,
    .solver-entry:focus-visible {
      border-color: #a9c5ec;
      background: var(--sidebar-hover);
    }

    .topic-presets {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .topic-preset,
    .symbol-button,
    .workspace-tab,
    .preview-action {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--blue-dark);
      background: var(--surface);
      font-size: 0.7rem;
      font-weight: 800;
    }

    .topic-preset:hover,
    .symbol-button:hover,
    .workspace-tab:hover,
    .preview-action:hover {
      border-color: #a9c5ec;
      background: var(--sidebar-hover);
    }

    .symbol-board {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 5px;
      margin-top: 9px;
    }

    .symbol-button {
      min-height: 29px;
      padding: 3px 0;
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 0.86rem;
    }

    .topic-library {
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .topic-library > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 5px;
      color: var(--muted);
      font-size: 0.69rem;
      font-weight: 850;
      cursor: pointer;
      list-style: none;
    }

    .topic-library > summary::-webkit-details-marker {
      display: none;
    }

    .conversation-panel,
    .sidebar,
    .chat-layout {
      min-height: 0;
    }

    .workspace-body {
      display: flex;
      width: 100%;
      min-height: 0;
      min-width: 0;
      flex: 1 1 auto;
      flex-direction: column;
      overflow: hidden;
      background: #f6f8fa;
    }

    .preview-panel {
      display: flex;
      width: 100%;
      min-width: 0;
      flex: 0 0 230px;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .preview-panel[data-collapsed="true"] {
      flex-basis: 48px;
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 46px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--line);
    }

    .preview-title-wrap {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
    }

    .preview-title {
      margin: 0;
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 850;
    }

    .preview-badge {
      padding: 1px 7px;
      border-radius: 999px;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-size: 0.62rem;
      font-weight: 850;
    }

    .preview-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .workspace-tab,
    .preview-action {
      min-height: 28px;
      padding: 3px 8px;
      border-color: transparent;
      background: transparent;
      font-size: 0.68rem;
    }

    .workspace-tab[data-active="true"] {
      border-color: var(--line-strong);
      background: var(--soft-blue);
    }

    .preview-content {
      min-height: 0;
      flex: 1 1 auto;
      overflow: auto;
      padding: 12px 14px 15px;
    }

    .preview-empty {
      display: grid;
      height: 100%;
      min-height: 150px;
      place-items: center;
      color: var(--muted);
      font-size: 0.76rem;
      text-align: center;
    }

    .preview-result {
      display: grid;
      gap: 10px;
    }

    .preview-result-title {
      color: var(--muted);
      font-size: 0.69rem;
      font-weight: 800;
    }

    .preview-formula {
      padding: 13px 12px;
      overflow-x: auto;
      border: 1px solid color-mix(in srgb, var(--blue) 28%, var(--line));
      border-radius: 10px;
      color: var(--blue-ink);
      background: color-mix(in srgb, var(--soft-blue) 58%, transparent);
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 1.05rem;
      text-align: center;
    }

    .preview-result-text {
      margin: 0;
      color: var(--ink);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 0.79rem;
    }

    .preview-plot-grid {
      display: grid;
      gap: 10px;
    }

    .preview-plot-grid figure {
      margin: 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
    }

    .preview-plot-grid img {
      display: block;
      width: 100%;
      height: auto;
    }

    .inline-solver {
      display: grid;
      gap: 11px;
    }

    .inline-solver[hidden] {
      display: none;
    }

    .inline-solver-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .inline-solver-head h3 {
      margin: 0;
      color: var(--ink);
      font-size: 0.86rem;
    }

    .inline-solver-head p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .inline-solver .solver-grid {
      grid-template-columns: 1fr;
    }

    .inline-solver .solver-field input,
    .inline-solver .solver-field select,
    .inline-solver .solver-field textarea {
      min-height: 34px;
      padding: 6px 8px;
      font-size: 0.76rem;
    }

    .inline-solver .solver-field textarea {
      min-height: 62px;
    }

    .inline-solver .solver-hint {
      margin: 0;
      padding: 8px;
      font-size: 0.68rem;
    }

    .inline-solver-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .quick-favorites {
      display: grid;
      gap: 5px;
      margin-top: 8px;
    }

    .favorite-item {
      display: block;
      width: 100%;
      padding: 6px 7px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: var(--surface);
      font-size: 0.67rem;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .quick-plot-form {
      display: grid;
      gap: 6px;
    }

    .quick-plot-input {
      min-height: 62px;
      resize: vertical;
    }

    .quick-plot-range {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .preview-result-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .preview-notes {
      margin: 0;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      color: var(--muted);
      background: color-mix(in srgb, var(--soft-blue) 34%, transparent);
      font-size: 0.72rem;
    }

    .preview-error {
      padding: 10px;
      border: 1px solid color-mix(in srgb, var(--red) 46%, var(--line));
      border-radius: 8px;
      color: var(--ink);
      background: color-mix(in srgb, var(--red) 9%, transparent);
      font-size: 0.76rem;
    }

    .preview-action[hidden],
    .preview-output[hidden],
    .inline-solver[hidden] {
      display: none;
    }

    .composer-image-preview {
      display: grid;
      min-width: 0;
      gap: 8px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #f7faff;
    }

    .composer-image-preview[hidden] {
      display: none;
    }

    .composer-image-list {
      display: flex;
      min-width: 0;
      max-height: 196px;
      flex-wrap: wrap;
      gap: 8px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .composer-image-item {
      display: grid;
      min-width: 0;
      flex: 1 1 238px;
      grid-template-columns: 44px minmax(0, 1fr) 30px;
      align-items: center;
      gap: 9px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }

    .composer-image-item[data-state="success"] {
      border-color: #b8d7c1;
      background: #f5fbf6;
    }

    .composer-image-item[data-state="error"] {
      border-color: color-mix(in srgb, var(--red) 48%, var(--line));
      background: color-mix(in srgb, var(--red) 7%, var(--surface));
    }

    .composer-image-thumb {
      display: block;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      object-fit: cover;
      background: var(--surface);
    }

    .composer-image-copy {
      min-width: 0;
    }

    .composer-image-copy strong,
    .composer-image-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .composer-image-copy strong {
      color: var(--ink);
      font-size: 0.74rem;
      line-height: 1.4;
    }

    .composer-image-copy span {
      margin-top: 1px;
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1.4;
    }

    .composer-image-question-select {
      width: 100%;
      min-height: 30px;
      margin-top: 6px;
      padding: 3px 6px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
      font-size: 0.7rem;
    }

    .composer-image-review {
      min-height: 28px;
      margin-top: 6px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
      font-size: 0.68rem;
      font-weight: 750;
    }

    .composer-image-item[data-state="success"] .composer-image-copy span {
      color: #2f6b41;
    }

    .composer-image-item[data-state="error"] .composer-image-copy span {
      color: var(--red);
    }

    .composer-image-remove {
      display: grid;
      width: 30px;
      height: 30px;
      padding: 0;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 1rem;
      line-height: 1;
    }

    .composer-image-remove:hover {
      border-color: var(--line);
      color: var(--ink);
      background: var(--surface);
    }

    .composer-image-footer {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 2px;
    }

    .composer-image-status {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .composer-image-clear {
      flex: 0 0 auto;
      min-height: 26px;
      padding: 2px 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 0.68rem;
      font-weight: 750;
    }

    .composer-image-clear:hover {
      border-color: var(--line);
      color: var(--ink);
      background: var(--surface);
    }

    .chat-layout {
      display: flex;
      width: 100%;
      min-width: 0;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex: 0 0 auto;
      min-height: 80px;
      padding: 15px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.97);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-size: 1.05rem;
      font-weight: 850;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy h1 {
      margin: 0;
      color: var(--ink);
      font-size: 1.1rem;
      line-height: 1.25;
    }

    .brand-copy p {
      margin: 2px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.77rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 9px;
    }

    .status-chip,
    .clear-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border-radius: 999px;
      font-size: 0.79rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .status-chip {
      gap: 7px;
      min-width: 92px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #f7faff;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
    }

    .status-chip[data-state="online"] {
      border-color: #c9dbf8;
      color: var(--blue-dark);
      background: #edf4ff;
    }

    .status-chip[data-state="online"] .status-dot {
      background: var(--blue);
    }

    .status-chip[data-state="offline"] {
      border-color: #efc5c1;
      color: #84261f;
      background: #fff4f2;
    }

    .status-chip[data-state="offline"] .status-dot {
      background: var(--red);
    }

    .clear-button {
      min-height: 34px;
      padding: 5px 12px;
      border: 1px solid transparent;
      color: var(--muted);
      background: transparent;
    }

    .clear-button:hover {
      border-color: var(--line);
      color: var(--blue-dark);
      background: #f4f8ff;
    }

    .messages {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      padding: 30px 30px 22px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      background: #f8f9fb;
    }

    .message {
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 24px;
    }

    .message[data-role="user"] {
      flex-direction: row-reverse;
    }

    .avatar {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      margin-top: 20px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-size: 0.8rem;
      font-weight: 850;
    }

    .message[data-role="user"] .avatar {
      border: 1px solid #d8e5f8;
      color: var(--blue-dark);
      background: #ffffff;
    }

    .message-content {
      width: fit-content;
      max-width: min(76%, 680px);
      min-width: 0;
      flex: 0 1 auto;
    }

    .message-text .math-inline {
      white-space: nowrap;
    }

    .message-text .math-display {
      display: block;
      max-width: 100%;
      margin: 12px 0;
      overflow-x: auto;
      overscroll-behavior-x: contain;
    }

    .message-text .math-display .katex-display {
      margin: 0;
    }

    .message[data-role="user"] .message-content {
      display: flex;
      align-items: flex-end;
      flex-direction: column;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 18px;
      margin: 0 6px 5px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .message-meta time {
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 500;
    }

    .message[data-role="user"] .message-meta {
      justify-content: flex-end;
    }

    .message-actions {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      margin: 5px 6px 0;
    }

    .message[data-role="assistant"] .message-actions {
      justify-content: flex-start;
    }

    .message-action {
      min-height: 24px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      font-size: 0.62rem;
      font-weight: 800;
    }

    .message-action:hover {
      border-color: #a9c5ec;
      color: var(--blue-dark);
      background: var(--sidebar-hover);
    }

    .message-action[data-bookmarked="true"] {
      border-color: #b9d0ef;
      color: var(--blue-dark);
      background: var(--soft-blue);
    }

    .bubble {
      max-width: 100%;
      min-width: 74px;
      margin: 0 2px;
      padding: 14px 17px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px 18px 18px 18px;
      background: var(--surface);
      box-shadow: 0 4px 14px rgba(37, 99, 201, 0.045);
    }

    .message[data-role="user"] .bubble {
      border-color: var(--blue);
      border-radius: 18px 6px 18px 18px;
      color: #ffffff;
      background: var(--blue);
      box-shadow: none;
    }

    .message-text {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-attachments {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(108px, 1fr));
      gap: 7px;
      margin-bottom: 10px;
    }

    .message-attachments:last-child {
      margin-bottom: 0;
    }

    .message-attachment {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }

    .message[data-role="user"] .message-attachment {
      border-color: rgba(255, 255, 255, 0.36);
      background: rgba(255, 255, 255, 0.12);
    }

    .message-attachment img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #eef3f9;
    }

    .message-attachment-file {
      display: flex;
      min-height: 48px;
      align-items: center;
      gap: 7px;
      padding: 8px;
      font-size: 0.68rem;
      line-height: 1.35;
    }

    .message-attachment-file svg {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .message-attachment-file span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .formula {
      max-width: 100%;
      margin: 14px -17px 12px;
      padding: 15px 12px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      border: 0;
      border-radius: 12px;
      color: var(--blue-ink);
      background: #f2f7ff;
      text-align: center;
      -webkit-overflow-scrolling: touch;
    }

    .formula .katex {
      font-size: 1.18em;
      white-space: nowrap;
    }

    .formula .katex-display {
      min-width: max-content;
    }

    .function-plot {
      width: 100%;
      max-width: 100%;
      margin: 13px 0 4px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
    }

    .function-plot img {
      display: block;
      width: 100%;
      height: auto;
    }

    .verdict {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      margin-top: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .verdict[data-state="correct"] {
      color: var(--blue-dark);
      background: #eaf2ff;
    }

    .verdict[data-state="incorrect"] {
      color: #84261f;
      background: #fff0ee;
    }

    .calculation-details {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .calculation-details summary {
      width: fit-content;
      cursor: pointer;
      font-weight: 750;
    }

    .calculation-grid {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 5px 12px;
      margin: 8px 0 1px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .calculation-grid dt {
      color: #667085;
      font-size: 0.73rem;
      font-weight: 700;
    }

    .calculation-grid dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 0.76rem;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7fa4dc;
      animation: pulse 1.15s ease-in-out infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes pulse {
      0%,
      70%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      35% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .messages {
        scroll-behavior: auto;
      }

      .typing span {
        animation-duration: 2s;
      }
    }

    .composer-area {
      width: 100%;
      flex: 0 0 auto;
      min-width: 0;
      padding: 0 28px max(18px, env(safe-area-inset-bottom));
      overflow: hidden;
      border-top: 1px solid var(--line);
      background: #ffffff;
    }

    .suggestions-toolbar {
      display: flex;
      justify-content: flex-end;
      padding: 8px 2px 0;
    }

    .suggestions-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      padding: 3px 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 0.7rem;
      font-weight: 750;
    }

    .suggestions-toggle:hover {
      border-color: var(--line);
      color: var(--blue-dark);
      background: #f7faff;
    }

    .suggestions-toggle-icon {
      display: inline-block;
      font-size: 0.9rem;
      line-height: 1;
      transform: rotate(180deg);
      transition: transform 0.15s ease;
    }

    .composer-area[data-suggestions-collapsed="true"] .suggestions-toggle-icon {
      transform: rotate(0deg);
    }

    .suggestions {
      display: flex;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 2px 10px;
      overflow: visible;
    }

    .composer-area[data-suggestions-collapsed="true"] .suggestions {
      display: none;
    }

    .suggestions:empty {
      display: none;
    }

    .suggestion {
      flex: 0 0 auto;
      max-width: 100%;
      min-height: 32px;
      padding: 5px 11px;
      overflow: hidden;
      border: 1px solid #d4e2f5;
      border-radius: 999px;
      color: var(--blue-dark);
      background: #f7faff;
      font-size: 0.77rem;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: transform 0.15s ease, border-color 0.15s ease,
        background-color 0.15s ease;
    }

    .suggestion:hover {
      border-color: #a9c5ec;
      background: #edf4ff;
      transform: translateY(-1px);
    }

    .suggestion:active {
      transform: translateY(0) scale(0.98);
    }

    .composer {
      display: flex;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      border: 1px solid #d7e3f3;
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(37, 99, 201, 0.07);
    }

    .composer-row {
      display: grid;
      min-width: 0;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: end;
      gap: 8px;
    }

    .image-file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .composer:focus-within {
      border-color: #8fb3e8;
      box-shadow: 0 0 0 3px rgba(40, 104, 216, 0.09);
    }

    .chat-input {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      max-height: 132px;
      padding: 9px 8px 8px;
      overflow-y: auto;
      resize: none;
      border: 0;
      color: var(--ink);
      background: transparent;
      outline: none;
      line-height: 1.5;
    }

    .chat-input::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    .image-upload-button {
      display: grid;
      flex: 0 0 auto;
      width: 42px;
      min-height: 42px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--blue-dark);
      background: var(--sidebar-bg);
    }

    .image-upload-button:hover {
      border-color: #a9c5ec;
      background: var(--soft-blue);
    }

    .image-upload-button:active {
      transform: translateY(1px);
    }

    .image-upload-button:disabled {
      cursor: wait;
      opacity: 0.66;
    }

    .image-upload-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .image-upload-button[data-loading="true"] svg {
      animation: image-spin 0.9s linear infinite;
    }

    @keyframes image-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .send-button {
      flex: 0 0 auto;
      min-width: 72px;
      min-height: 42px;
      padding: 8px 17px;
      border: 1px solid var(--blue);
      border-radius: 10px;
      color: #ffffff;
      background: var(--blue);
      font-weight: 800;
    }

    .send-button:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .send-button:active {
      transform: translateY(1px);
    }

    .send-button:disabled {
      cursor: not-allowed;
      border-color: #b8c2d0;
      color: #f7f8fa;
      background: #9aa6b7;
      opacity: 0.62;
    }

    html[data-theme="dark"] .chat-header,
    html[data-theme="dark"] .composer-area {
      background: rgba(20, 32, 51, 0.97);
    }

    html[data-theme="dark"] .image-upload-button,
    html[data-theme="dark"] .composer-image-preview {
      border-color: var(--line);
      background: #182334;
    }

    html[data-theme="dark"] .image-upload-button:hover {
      background: var(--soft-blue);
    }

    html[data-theme="dark"] .composer-image-preview[data-state="success"] {
      border-color: #355e42;
      background: #14261a;
    }

    html[data-theme="dark"]
      .composer-image-preview[data-state="success"]
      .composer-image-copy
      span {
      color: #95d3a6;
    }

    html[data-theme="dark"] .messages {
      background: #10151e;
    }

      html[data-theme="dark"] .status-chip,
      html[data-theme="dark"] .suggestion {
        background: #1a2433;
      }

      html[data-theme="dark"] .bubble {
        background: #1a2433;
      }

    html[data-theme="dark"] .message[data-role="user"] .bubble {
      background: var(--blue);
    }

      html[data-theme="dark"] .formula {
        background: #1a2b45;
      }

      html[data-theme="dark"] .message[data-role="user"] .avatar {
        background: #1a2433;
      }

    @media (hover: none) {
      .history-actions {
        position: static;
        align-items: center;
        padding-right: 6px;
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }

      .history-item .history-title {
        padding-right: 0;
      }

      .toolbox-tab,
      .progress-action {
        min-height: 44px;
      }
    }

    @media (max-width: 820px) {
      .app-shell {
        min-height: 0;
      }

      .sidebar {
        position: fixed;
        z-index: 30;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(86vw, 340px);
        flex-basis: auto;
        border-right: 1px solid var(--line);
        box-shadow: 14px 0 34px rgba(24, 48, 84, 0.14);
        transform: translateX(0);
        transition: transform 0.2s ease;
      }

      .app-shell[data-sidebar-collapsed="true"] .sidebar {
        width: min(86vw, 340px);
        border-right: 1px solid var(--line);
        transform: translateX(-104%);
      }

      .sidebar-inner {
        width: 100%;
      }

      .sidebar-resizer {
        display: none;
      }

      .sidebar-scrim {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: block;
        border: 0;
        background: var(--scrim);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .app-shell[data-sidebar-collapsed="false"] .sidebar-scrim {
        opacity: 1;
        pointer-events: auto;
      }

      .conversation-panel {
        display: none;
      }

      .preview-panel {
        flex-basis: 210px;
      }

      .toolbox-tab,
      .progress-action {
        min-height: 44px;
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        width: 100%;
        border: 0;
      }

      .chat-header {
        width: 100%;
        min-width: 0;
        min-height: 70px;
        padding: 11px 14px;
      }

      .brand-mark {
        flex-basis: 38px;
        width: 38px;
        height: 38px;
      }

      .brand-copy h1 {
        font-size: 0.98rem;
      }

      .brand-copy p,
      .clear-button {
        display: none;
      }

      .brand {
        flex: 1 1 auto;
        min-width: 0;
        gap: 8px;
      }

      .brand-copy {
        overflow: hidden;
      }

      .brand-copy h1 {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .header-actions {
        flex: 0 0 auto;
        gap: 6px;
      }

      .status-chip {
        min-width: auto;
        padding: 6px 9px;
      }

      .messages {
        max-width: 100%;
        padding: 22px 12px 16px;
      }

      .message {
        gap: 7px;
        margin-bottom: 20px;
      }

      .avatar {
        flex-basis: 30px;
        width: 30px;
        height: 30px;
        font-size: 0.73rem;
      }

      .message-content {
        width: auto;
        max-width: calc(100% - 37px);
      }

      .bubble {
        padding: 10px 12px;
      }

      .formula {
        margin-right: -12px;
        margin-left: -12px;
      }

      .composer-area {
        max-width: 100%;
        padding: 0 10px max(12px, env(safe-area-inset-bottom));
      }

      .suggestions {
        padding-top: 10px;
        padding-bottom: 8px;
      }

      .composer-row {
        grid-template-columns: minmax(0, 1fr) 42px 54px;
        gap: 6px;
      }

      .send-button {
        min-width: 54px;
        padding-right: 8px;
        padding-left: 8px;
      }

      .solver-dialog {
        width: calc(100vw - 16px);
        max-height: calc(100dvh - 16px);
        border-radius: 13px;
      }

      .solver-shell {
        max-height: calc(100dvh - 16px);
      }

      .solver-header,
      .solver-body,
      .solver-footer {
        padding-right: 14px;
        padding-left: 14px;
      }

      .solver-grid {
        grid-template-columns: 1fr;
      }

      .solver-field.is-wide {
        grid-column: auto;
      }

      .solver-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .solver-actions {
        justify-content: flex-end;
      }

      .preview-panel {
        flex-basis: 184px;
      }

      .preview-head {
        padding-right: 9px;
        padding-left: 9px;
      }

      .preview-content {
        padding: 9px 10px 12px;
      }

      .workspace-tab {
        display: none;
      }

      .send-button {
        min-width: 62px;
        padding-right: 13px;
        padding-left: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell" data-sidebar-collapsed="false">
    <aside class="sidebar" id="sidebar" aria-label="会话与工具">
      <div class="sidebar-inner">
        <nav class="sidebar-rail" aria-label="侧边栏快捷入口">
          <button
            class="sidebar-rail-button"
            type="button"
            data-sidebar-toggle
            aria-label="展开侧边栏"
            title="展开侧边栏"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
          <button
            class="sidebar-rail-button"
            type="button"
            data-rail-tab="wrongbook"
            aria-current="true"
            aria-label="错题集"
            title="错题集"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3h12v18H6z"></path>
              <path d="M9 8h6"></path>
              <path d="M9 12h6"></path>
              <path d="m9 16 1.5 1.5L14 14"></path>
            </svg>
          </button>
          <button
            class="sidebar-rail-button"
            type="button"
            data-rail-tab="progress"
            aria-current="false"
            aria-label="学习进度"
            title="学习进度"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 19V5"></path>
              <path d="M4 19h16"></path>
              <path d="m7 15 3-3 3 2 5-6"></path>
            </svg>
          </button>
        </nav>

        <div class="sidebar-top">
          <div class="sidebar-brand">
            <span class="sidebar-logo" aria-hidden="true">知</span>
            <span>知微高数</span>
          </div>
          <button
            class="icon-button"
            type="button"
            data-sidebar-toggle
            aria-label="折叠侧边栏"
            title="折叠侧边栏"
          >‹</button>
        </div>

        <div class="toolbox-scroll">
          <section
            class="related-knowledge"
            id="questionKnowledge"
            aria-label="本题知识点"
          >
            <div class="related-knowledge-head">
              <span>本题知识点</span>
              <span id="questionKnowledgeStatus">等待题目</span>
            </div>
            <div
              class="related-knowledge-list"
              id="questionKnowledgeList"
              aria-live="polite"

      function welcomeMessage() {
        let previousIndex = lastWelcomeIndex;
        if (previousIndex < 0) {
          try {
            const storedIndex = Number(
              window.sessionStorage.getItem(WELCOME_INDEX_KEY),
            );
            if (
              Number.isInteger(storedIndex)
              && storedIndex >= 0
              && storedIndex < WELCOME_TEXTS.length
            ) {
              previousIndex = storedIndex;
            }
          } catch (error) {
            previousIndex = -1;
          }
        }

        const availableIndexes = WELCOME_TEXTS
          .map((_, index) => index)
          .filter((index) => index !== previousIndex);
        const pool = availableIndexes.length
          ? availableIndexes
          : WELCOME_TEXTS.map((_, index) => index);
        const welcomeIndex = pool[Math.floor(Math.random() * pool.length)];
        lastWelcomeIndex = welcomeIndex;
        try {
          window.sessionStorage.setItem(
            WELCOME_INDEX_KEY,
            String(welcomeIndex),
          );
        } catch (error) {
          // The welcome message still varies in memory when storage is unavailable.

        return {
          id: makeId(),
          role: "assistant",
          text: WELCOME_TEXTS[welcomeIndex],

        );

      function updateCurrentConversation() {
        const hasUserMessage = messages.some(
          (message) => message.role === "user" && message.text.trim(),

        const existingConversation = conversations.find(
          (conversation) => conversation.id === activeConversationId,
        );
        conversations = conversations.filter(
          (conversation) => conversation.id !== activeConversationId,
        );
        if (hasUserMessage) {
          conversations.unshift({
            id: activeConversationId,
            title:
              existingConversation && existingConversation.renamed
                ? existingConversation.title
                : currentConversationTitle(),
            renamed: Boolean(existingConversation?.renamed),
            updatedAt: Date.now(),
            messages: messagesForStorage(messages).slice(-MAX_STORED_MESSAGES),
          });
          conversations = conversations.slice(0, MAX_CONVERSATIONS);
        }
        persistConversations();
        renderHistory();

      function cacheResponse(question, data) {
        if (
          !data
          || data.history_used
          || [
            "general",
            "help",
            "history",
            "unknown",
            "needs_input",
            "ocr_error",
          ].includes(data.intent)

        }
        const key = question.trim();
        if (!key) {
          return;
        }
        responseCache.delete(key);
        responseCache.set(key, data);
        while (responseCache.size > RESPONSE_CACHE_LIMIT) {
          responseCache.delete(responseCache.keys().next().value);
        }
      }

      function resolvedAnswerForUserMessage(messageId) {
        const index = messages.findIndex((message) => message.id === messageId);
        if (index === -1) {
          return null;
        }
        for (let cursor = index + 1; cursor < messages.length; cursor += 1) {
          const candidate = messages[cursor];
          if (candidate.role === "user") {
            return null;
          }
          if (candidate.role !== "assistant" || candidate.loading) {
            continue;
          }
          return candidate;
        }
        return null;
      }

      function sourceUserMessageForAnswer(message) {
        if (!message || message.role !== "assistant" || message.loading) {
          return null;
        }
        if (message.sourceUserMessageId) {
          const linkedMessage = messages.find(
            (item) =>
              item.id === message.sourceUserMessageId
              && item.role === "user",
          );
          if (linkedMessage) {
            return linkedMessage;
          }
        }
        const index = messages.findIndex((item) => item.id === message.id);
        for (let cursor = index - 1; cursor >= 0; cursor -= 1) {
          const candidate = messages[cursor];
          if (candidate.role === "user" && !candidate.loading) {
            return candidate;
          }
        }
        return null;
      }

      function messageCanJoinWrongBook(message) {
        if (!message || message.loading) {
          return false;
        }
        const userMessage = message.role === "assistant"
          ? sourceUserMessageForAnswer(message)
          : message;
        if (
          !userMessage
          || userMessage.role !== "user"
          || userMessage.loading
        ) {
          return false;
        }
        const answer = message.role === "assistant"
          ? message
          : resolvedAnswerForUserMessage(userMessage.id);
        if (
          !answer
          || !WRONG_BOOK_ELIGIBLE_INTENTS.has(String(answer.intent || ""))
        ) {
          return false;
        }
        return Boolean(
          String(answer.resultValue || "").trim()
          || String(answer.formulaLatex || "").trim()
          || String(answer.formulaText || "").trim()
          || String(answer.plotUrl || "").trim()
        );
      }
