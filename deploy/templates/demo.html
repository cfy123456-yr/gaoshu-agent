<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f5">
  <meta
    name="description"
    content="知微老师高等数学对话演示，支持求导、积分和极限计算。"
  >
  <title>知微老师 · 高数对话演示</title>
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='katex/katex.min.css') }}"
  >
  <style>
    :root {
      --ink: #17231f;
      --muted: #61706a;
      --line: #d7e0db;
      --line-strong: #b8c8c0;
      --canvas: #f4f7f5;
      --surface: #ffffff;
      --soft-green: #e7f1ec;
      --green: #1d6b56;
      --green-dark: #14503f;
      --blue: #245f8c;
      --blue-dark: #18486d;
      --amber: #a25b16;
      --red: #ad2d24;
      --shadow: 0 16px 45px rgba(23, 35, 31, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.62), transparent 220px),
        var(--canvas);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      line-height: 1.55;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(29, 107, 86, 0.2);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      display: flex;
      width: min(980px, 100%);
      height: 100dvh;
      min-height: 540px;
      margin: 0 auto;
      overflow: hidden;
      border-right: 1px solid var(--line);
      border-left: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow);
    }

    .chat-layout {
      display: flex;
      min-width: 0;
      flex: 1;
      flex-direction: column;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex: 0 0 auto;
      min-height: 76px;
      padding: 13px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid #a9c9bb;
      border-radius: 50%;
      color: var(--green-dark);
      background: var(--soft-green);
      font-size: 1.05rem;
      font-weight: 850;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy h1 {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.25;
    }

    .brand-copy p {
      margin: 2px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.77rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 9px;
    }

    .status-chip,
    .clear-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border-radius: 999px;
      font-size: 0.79rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .status-chip {
      gap: 7px;
      min-width: 92px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #f7f9f8;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
    }

    .status-chip[data-state="online"] {
      border-color: #b8d7c8;
      color: var(--green-dark);
      background: #ecf7f1;
    }

    .status-chip[data-state="online"] .status-dot {
      background: #258463;
    }

    .status-chip[data-state="offline"] {
      border-color: #efc5c1;
      color: #84261f;
      background: #fff4f2;
    }

    .status-chip[data-state="offline"] .status-dot {
      background: var(--red);
    }

    .clear-button {
      min-height: 34px;
      padding: 5px 12px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: transparent;
    }

    .clear-button:hover {
      border-color: var(--line-strong);
      color: var(--ink);
      background: #f5f7f6;
    }

    .messages {
      flex: 1 1 auto;
      min-height: 0;
      padding: 24px 22px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }

    .message[data-role="user"] {
      flex-direction: row-reverse;
    }

    .avatar {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      margin-top: 20px;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--green-dark);
      background: var(--soft-green);
      font-size: 0.8rem;
      font-weight: 850;
    }

    .message[data-role="user"] .avatar {
      border-color: #a9c5dc;
      color: var(--blue-dark);
      background: #eaf3fa;
    }

    .message-content {
      width: fit-content;
      max-width: min(76%, 680px);
    }

    .message[data-role="user"] .message-content {
      display: flex;
      align-items: flex-end;
      flex-direction: column;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 18px;
      margin: 0 5px 3px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .message[data-role="user"] .message-meta {
      justify-content: flex-end;
    }

    .bubble {
      min-width: 74px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 6px 16px 16px 16px;
      background: var(--surface);
      box-shadow: 0 5px 18px rgba(23, 35, 31, 0.045);
    }

    .message[data-role="user"] .bubble {
      border-color: var(--blue);
      border-radius: 16px 6px 16px 16px;
      color: #ffffff;
      background: var(--blue);
      box-shadow: none;
    }

    .message-text {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .formula {
      max-width: 100%;
      margin: 12px -15px 11px;
      padding: 12px 10px;
      overflow-x: auto;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: #12372c;
      background: #f7fbf9;
      text-align: center;
    }

    .formula .katex {
      font-size: 1.18em;
    }

    .verdict {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      margin-top: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .verdict[data-state="correct"] {
      color: var(--green-dark);
      background: #e8f6ef;
    }

    .verdict[data-state="incorrect"] {
      color: #84261f;
      background: #fff0ee;
    }

    .calculation-details {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .calculation-details summary {
      width: fit-content;
      cursor: pointer;
      font-weight: 750;
    }

    .calculation-grid {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 5px 12px;
      margin: 8px 0 1px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .calculation-grid dt {
      color: #7b8983;
      font-size: 0.73rem;
      font-weight: 700;
    }

    .calculation-grid dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 0.76rem;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7e9b8f;
      animation: pulse 1.15s ease-in-out infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes pulse {
      0%,
      70%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      35% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .messages {
        scroll-behavior: auto;
      }

      .typing span {
        animation-duration: 2s;
      }
    }

    .composer-area {
      flex: 0 0 auto;
      padding: 0 18px 15px;
      background: rgba(255, 255, 255, 0.96);
    }

    .suggestions {
      display: flex;
      gap: 8px;
      padding: 10px 2px 9px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .suggestions:empty {
      display: none;
    }

    .suggestion {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 5px 11px;
      border: 1px solid #b8cbdc;
      border-radius: 999px;
      color: var(--blue-dark);
      background: #f7fbfe;
      font-size: 0.77rem;
      font-weight: 750;
    }

    .suggestion:hover {
      border-color: #89acc8;
      background: #eef6fb;
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 9px;
      padding: 9px;
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 8px 25px rgba(23, 35, 31, 0.07);
    }

    .composer:focus-within {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(29, 107, 86, 0.1);
    }

    .chat-input {
      width: 100%;
      min-height: 42px;
      max-height: 132px;
      padding: 9px 8px 8px;
      overflow-y: auto;
      resize: none;
      border: 0;
      color: var(--ink);
      background: transparent;
      outline: none;
      line-height: 1.5;
    }

    .chat-input::placeholder {
      color: #85928c;
    }

    .send-button {
      min-width: 72px;
      min-height: 42px;
      padding: 8px 17px;
      border: 1px solid var(--green-dark);
      border-radius: 10px;
      color: #ffffff;
      background: var(--green);
      font-weight: 800;
    }

    .send-button:hover {
      background: var(--green-dark);
    }

    .send-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .composer-note {
      margin: 7px 3px 0;
      color: #86928d;
      font-size: 0.69rem;
    }

    @media (max-width: 640px) {
      .app-shell {
        width: 100%;
        border: 0;
      }

      .chat-header {
        min-height: 66px;
        padding: 10px 13px;
      }

      .brand-mark {
        flex-basis: 38px;
        width: 38px;
        height: 38px;
      }

      .brand-copy h1 {
        font-size: 0.98rem;
      }

      .brand-copy p,
      .clear-button {
        display: none;
      }

      .status-chip {
        min-width: auto;
        padding: 6px 9px;
      }

      .messages {
        padding: 18px 12px;
      }

      .message {
        gap: 7px;
        margin-bottom: 17px;
      }

      .avatar {
        flex-basis: 30px;
        width: 30px;
        height: 30px;
        font-size: 0.73rem;
      }

      .message-content {
        max-width: 87%;
      }

      .bubble {
        padding: 10px 12px;
      }

      .formula {
        margin-right: -12px;
        margin-left: -12px;
      }

      .composer-area {
        padding: 0 10px 10px;
      }

      .send-button {
        min-width: 62px;
        padding-right: 13px;
        padding-left: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="chat-layout">
      <header class="chat-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">知</div>
          <div class="brand-copy">
            <h1>知微老师</h1>
            <p>高等数学学习伙伴</p>
          </div>
        </div>
        <div class="header-actions">
          <div
            class="status-chip"
            id="serviceStatus"
            data-state="checking"
            role="status"
          >
            <span class="status-dot" aria-hidden="true"></span>
            <span id="serviceStatusText">连接中</span>
          </div>
          <button class="clear-button" id="clearButton" type="button">清空对话</button>
        </div>
      </header>

      <main
        class="messages"
        id="messageList"
        aria-label="知微老师对话记录"
        aria-live="polite"
      ></main>

      <footer class="composer-area">
        <div class="suggestions" id="suggestions" aria-label="示例题目"></div>
        <form class="composer" id="chatForm">
          <label class="sr-only" for="chatInput">输入高等数学题目</label>
          <textarea
            class="chat-input"
            id="chatInput"
            name="message"
            rows="1"
            maxlength="600"
            autocomplete="off"
            spellcheck="false"
            placeholder="输入题目，例如：求导 x^2"
            required
          ></textarea>
          <button class="send-button" id="sendButton" type="submit">发送</button>
        </form>
        <p class="composer-note">SymPy 确定性计算</p>
      </footer>
    </div>
  </div>

  <script
    defer
    src="{{ url_for('static', filename='katex/katex.min.js') }}"
  ></script>
  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "zhiwei-demo-chat-v1";
      const MAX_STORED_MESSAGES = 40;
      const DEFAULT_SUGGESTIONS = [
        "求导 x^2",
        "判断 2x 是不是 x^2 的导数",
        "积分 x^2",
        "积分 0 到 1 x^2",
        "lim x→0 sin(x)/x",
      ];
      const WELCOME_TEXT =
        "你好，我是知微老师。把题目发给我，我会用数学工具计算，再和你一起检查思路。";

      const messageList = document.getElementById("messageList");
      const suggestions = document.getElementById("suggestions");
      const chatForm = document.getElementById("chatForm");
      const chatInput = document.getElementById("chatInput");
      const sendButton = document.getElementById("sendButton");
      const clearButton = document.getElementById("clearButton");
      const serviceStatus = document.getElementById("serviceStatus");
      const serviceStatusText = document.getElementById("serviceStatusText");

      let messages = [];
      let currentSuggestions = [...DEFAULT_SUGGESTIONS];
      let requestInFlight = false;

      function makeId() {
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function currentTime() {
        return new Date().toLocaleTimeString("zh-CN", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      }

      function welcomeMessage() {
        return {
          id: makeId(),
          role: "assistant",
          text: WELCOME_TEXT,
          formulaLatex: "",
          formulaText: "",
          resultLabel: "",
          resultValue: "",
          verdict: null,
          createdAt: currentTime(),
        };
      }

      function loadMessages() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            return [];
          }
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) {
            return [];
          }
          return parsed
            .filter((item) => item && (item.role === "user" || item.role === "assistant"))
            .slice(-MAX_STORED_MESSAGES)
            .map((item) => ({
              id: String(item.id || makeId()),
              role: item.role,
              text: String(item.text || ""),
              formulaLatex: String(item.formulaLatex || ""),
              formulaText: String(item.formulaText || ""),
              resultLabel: String(item.resultLabel || ""),
              resultValue: String(item.resultValue || ""),
              verdict: typeof item.verdict === "boolean" ? item.verdict : null,
              createdAt: String(item.createdAt || currentTime()),
            }));
        } catch (error) {
          return [];
        }
      }

      function saveMessages() {
        try {
          window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(messages.slice(-MAX_STORED_MESSAGES)),
          );
        } catch (error) {
          // The conversation still works when browser storage is unavailable.
        }
      }

      function element(tagName, className, text) {
        const node = document.createElement(tagName);
        if (className) {
          node.className = className;
        }
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      }

      function renderFormula(container, message) {
        container.textContent = "";
        if (!message.formulaLatex) {
          return;
        }

        if (window.katex) {
          try {
            window.katex.render(message.formulaLatex, container, {
              displayMode: true,
              throwOnError: true,
              strict: false,
              trust: false,
            });
            return;
          } catch (error) {
            // Fall back to the plain text returned by the calculation service.
          }
        }
        container.textContent = message.formulaText || message.formulaLatex;
      }

      function createMessageNode(message) {
        const article = element("article", "message");
        article.dataset.role = message.role;
        article.dataset.messageId = message.id;

        const avatar = element(
          "div",
          "avatar",
          message.role === "user" ? "我" : "知",
        );
        avatar.setAttribute("aria-hidden", "true");

        const content = element("div", "message-content");
        const meta = element("div", "message-meta");
        meta.append(
          element("span", "", message.role === "user" ? "你" : "知微老师"),
          element("time", "", message.createdAt),
        );

        const bubble = element("div", "bubble");
        if (message.loading) {
          const typing = element("div", "typing");
          typing.setAttribute("aria-label", "知微老师正在计算");
          typing.append(element("span"), element("span"), element("span"));
          bubble.append(typing);
        } else {
          bubble.append(element("p", "message-text", message.text));

          if (message.formulaLatex) {
            const formula = element("div", "formula");
            renderFormula(formula, message);
            bubble.append(formula);
          }

          if (typeof message.verdict === "boolean") {
            const verdict = element(
              "div",
              "verdict",
              message.verdict ? "答案正确" : "答案不正确",
            );
            verdict.dataset.state = message.verdict ? "correct" : "incorrect";
            bubble.append(verdict);
          }

          if (message.resultLabel && message.resultValue) {
            const details = element("details", "calculation-details");
            details.append(element("summary", "", "计算明细"));
            const grid = element("dl", "calculation-grid");
            grid.append(
              element("dt", "", "结果"),
              element("dd", "", message.resultValue),
              element("dt", "", "类型"),
              element("dd", "", message.resultLabel),
            );
            details.append(grid);
            bubble.append(details);
          }
        }

        content.append(meta, bubble);
        article.append(avatar, content);
        return article;
      }

      function scrollToLatest() {
        window.requestAnimationFrame(() => {
          messageList.scrollTop = messageList.scrollHeight;
        });
      }

      function renderMessages() {
        const fragment = document.createDocumentFragment();
        messages.forEach((message) => fragment.append(createMessageNode(message)));
        messageList.replaceChildren(fragment);
        scrollToLatest();
      }

      function renderSuggestions(items) {
        currentSuggestions = Array.isArray(items) && items.length
          ? items.slice(0, 5)
          : DEFAULT_SUGGESTIONS;
        const fragment = document.createDocumentFragment();
        currentSuggestions.forEach((text) => {
          const button = element("button", "suggestion", String(text));
          button.type = "button";
          button.dataset.message = String(text);
          fragment.append(button);
        });
        suggestions.replaceChildren(fragment);
      }

      function resizeInput() {
        chatInput.style.height = "auto";
        chatInput.style.height = `${Math.min(chatInput.scrollHeight, 132)}px`;
      }

      function setRequestState(active) {
        requestInFlight = active;
        sendButton.disabled = active;
        sendButton.textContent = active ? "计算中" : "发送";
      }

      function responseToMessage(data) {
        const calculation = data.calculation || {};
        let resultLabel = "";
        let resultValue = "";

        if (data.intent === "verify") {
          resultLabel = "导数";
          resultValue = calculation.derivative || "";
        } else if (data.intent === "integrate") {
          resultLabel = "积分";
          resultValue = calculation.integral || "";
        } else if (data.intent === "limit") {
          resultLabel = "极限";
          resultValue = calculation.limit || "";
        }

        return {
          id: makeId(),
          role: "assistant",
          text: String(data.reply || "这次没有得到可用的计算结果。"),
          formulaLatex: String(data.formula_latex || ""),
          formulaText: String(data.formula_text || ""),
          resultLabel,
          resultValue: String(resultValue),
          verdict:
            typeof calculation.is_correct === "boolean"
              ? calculation.is_correct
              : null,
          createdAt: currentTime(),
        };
      }

      async function sendMessage(rawMessage) {
        const text = String(rawMessage || "").trim();
        if (!text || requestInFlight) {
          return;
        }

        messages.push({
          id: makeId(),
          role: "user",
          text,
          formulaLatex: "",
          formulaText: "",
          resultLabel: "",
          resultValue: "",
          verdict: null,
          createdAt: currentTime(),
        });

        const loadingId = makeId();
        messages.push({
          id: loadingId,
          role: "assistant",
          text: "",
          formulaLatex: "",
          formulaText: "",
          resultLabel: "",
          resultValue: "",
          verdict: null,
          createdAt: currentTime(),
          loading: true,
        });

        chatInput.value = "";
        resizeInput();
        setRequestState(true);
        renderMessages();
        saveMessages();

        const controller = new AbortController();
        const timeoutId = window.setTimeout(() => controller.abort(), 30000);

        try {
          const response = await fetch("/demo/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text }),
            signal: controller.signal,
          }).finally(() => window.clearTimeout(timeoutId));

          let data;
          try {
            data = await response.json();
          } catch (error) {
            throw new Error("计算服务返回了无法识别的内容。");
          }

          if (!response.ok) {
            throw new Error(data.detail || `计算服务返回错误（${response.status}）。`);
          }

          const index = messages.findIndex((message) => message.id === loadingId);
          if (index !== -1) {
            messages[index] = responseToMessage(data);
          }
          renderSuggestions(data.suggestions);
        } catch (error) {
          const index = messages.findIndex((message) => message.id === loadingId);
          if (index !== -1) {
            messages[index] = {
              id: loadingId,
              role: "assistant",
              text:
                error.name === "AbortError"
                  ? "这次计算超时了，请把题目简化后重试。"
                  : error.message || "计算服务暂时不可用，请稍后重试。",
              formulaLatex: "",
              formulaText: "",
              resultLabel: "",
              resultValue: "",
              verdict: null,
              createdAt: currentTime(),
            };
          }
          renderSuggestions(DEFAULT_SUGGESTIONS);
        } finally {
          setRequestState(false);
          renderMessages();
          saveMessages();
          chatInput.focus();
        }
      }

      async function checkService() {
        try {
          const response = await fetch("/demo/api/health", { cache: "no-store" });
          if (!response.ok) {
            throw new Error("offline");
          }
          serviceStatus.dataset.state = "online";
          serviceStatusText.textContent = "服务在线";
        } catch (error) {
          serviceStatus.dataset.state = "offline";
          serviceStatusText.textContent = "服务离线";
        }
      }

      chatForm.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage(chatInput.value);
      });

      chatInput.addEventListener("input", resizeInput);
      chatInput.addEventListener("keydown", (event) => {
        if (
          event.key === "Enter"
          && !event.shiftKey
          && !event.isComposing
          && event.keyCode !== 229
        ) {
          event.preventDefault();
          chatForm.requestSubmit();
        }
      });

      suggestions.addEventListener("click", (event) => {
        const button = event.target.closest(".suggestion");
        if (button) {
          sendMessage(button.dataset.message);
        }
      });

      clearButton.addEventListener("click", () => {
        if (requestInFlight) {
          return;
        }
        messages = [welcomeMessage()];
        renderSuggestions(DEFAULT_SUGGESTIONS);
        renderMessages();
        saveMessages();
        chatInput.focus();
      });

      messages = loadMessages();
      if (!messages.length) {
        messages = [welcomeMessage()];
      }
      renderSuggestions(DEFAULT_SUGGESTIONS);
      renderMessages();
      resizeInput();
      checkService();
    })();
  </script>
</body>
</html>
