          let interimChunk = "";
          for (
            let index = event.resultIndex;
            index < event.results.length;
            index += 1
          ) {
            const result = event.results[index];
            const transcript = String(result[0]?.transcript || "");
            if (result.isFinal) {
              finalChunk += transcript;
            } else {
              interimChunk += transcript;
            }
          }
          if (finalChunk) {
            voiceFinalText = `${voiceFinalText}${finalChunk}`;
          }
          const transcript = `${voiceFinalText}${interimChunk}`;
          if (transcript) {
            applyVoiceDraft(transcript);
            setVoiceStatus(
              "正在聆听并实时转写，请核对输入框中的公式。",
              "listening",
            );
          }
        };

        recognition.onerror = (event) => {
          const error = String(event.error || "");
          if (error === "aborted" && voiceStopRequested) {
            return;
          }
          const errorMessages = {
            "not-allowed":
              "麦克风权限被拒绝，请在浏览器地址栏允许麦克风后重试。",
            "service-not-allowed":
              "浏览器禁止了语音识别服务，请检查网站权限后重试。",
            "audio-capture":
              "没有找到可用的麦克风，请检查设备和系统权限后重试。",
            "no-speech": "没有听清内容，请靠近麦克风后重试。",
            network: "语音识别服务暂时不可用，请检查网络后重试。",
            "language-not-supported":
              "当前浏览器不支持中文语音识别，请改用文字输入。",
            aborted: "语音输入已中止，请重试。",
          };
          voiceDiscardResult = true;
          setVoiceStatus(
            errorMessages[error] || "语音输入失败，请改用文字输入。",
            "error",
          );
        };

        recognition.onend = () => {
          const discardResult = voiceDiscardResult;
          const transcript = voiceFinalText.trim();
          setVoiceListeningState(false);
          voiceStopRequested = false;
          voiceDiscardResult = false;
          if (discardResult) {
            syncComposerState();
            return;
          }
          if (transcript) {
            applyVoiceDraft(transcript);
            setVoiceStatus(
              "已转写到输入框，请核对公式后发送。",
              "success",
            );
          }
          syncComposerState();
        };

        speechRecognition = recognition;
        return speechRecognition;
      }

      function startVoiceInput() {
        if (!BrowserSpeechRecognition) {
          setVoiceStatus(
            "当前浏览器不支持中文语音识别，请改用文字输入。",
            "error",
          );
          return;
        }
        if (requestInFlight) {
          setVoiceStatus("上一题还在计算，完成后可以继续语音输入。", "error");
          return;
        }
        if (voiceInputListening) {
          return;
        }

        const recognition = ensureSpeechRecognition();
        if (!recognition) {
          return;
        }
        stopAnswerSpeech();
        voiceBaseText = chatInput.value.trimEnd();
        voiceFinalText = "";
        voiceStopRequested = false;
        voiceDiscardResult = false;
        setVoiceListeningState(true);
        setVoiceStatus("正在启动麦克风，请稍候…", "listening");
        try {
          recognition.start();
        } catch (error) {
          setVoiceListeningState(false);
          setVoiceStatus(
            error && error.name === "InvalidStateError"
              ? "语音识别已经在运行，请稍候。"
              : "无法启动语音输入，请检查麦克风权限后重试。",
            "error",
          );
        }
      }

      function stopVoiceInput({discard = false, status = ""} = {}) {
        voiceStopRequested = true;
        voiceDiscardResult = Boolean(discard);
        if (!speechRecognition || !voiceInputListening) {
          setVoiceListeningState(false);
          if (status) {
            setVoiceStatus(status, discard ? "error" : "success");
          }
          return;
        }
        try {
          if (discard && typeof speechRecognition.abort === "function") {
            speechRecognition.abort();
          } else {
            speechRecognition.stop();
          }
        } catch (error) {
          setVoiceListeningState(false);
          if (status) {
            setVoiceStatus(status, "error");
          }
        }
      }

      function speechFriendlyMathText(value) {
        const exponentWords = (exponent) => {
          const normalized = String(exponent || "").trim();
          if (normalized === "2") {
            return " 的平方";
          }
          if (normalized === "3") {
            return " 的立方";
          }
          return ` 的 ${normalized} 次方`;
        };

        return String(value || "")
          .replace(/\$\$?/g, "")
          .replace(/\\\[|\\\]|\\\(|\\\)/g, "")
          .replace(
            /\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g,
            (_, numerator, denominator) =>
              `${numerator} 除以 ${denominator}`,
          )
          .replace(
            /\\sqrt\s*\{([^{}]+)\}/g,
            (_, expression) => `根号 ${expression}`,
          )
          .replace(/d\s*\/\s*d([A-Za-z])/g, "对 $1 求导")
          .replace(/\\int/g, "积分")
          .replace(/\\lim/g, "极限")
          .replace(/\\(?:sin|cos|tan|ln|log|exp)/g, (match) =>
            match.slice(1),
          )
          .replace(/\\[A-Za-z]+/g, "")
          .replace(/[{}]/g, "")
          .replace(/\*\*/g, "^")
          .replace(/\^\s*\{?([^{}\s]+)\}?/g, (_, exponent) =>
            exponentWords(exponent),
          )
          .replace(/乘以|×|·|\*/g, "乘以")
          .replace(/÷|\//g, "除以")
          .replace(/->|→|\\to/g, "趋近于")
          .replace(/\bpi\b/gi, "圆周率")
          .replace(/\boo\b/gi, "无穷大")
          .replace(/\bsqrt\b/gi, "根号")
          .replace(/>=/g, "大于等于")
          .replace(/<=/g, "小于等于")
          .replace(/!=/g, "不等于")
          .replace(/=/g, "等于")
          .replace(/_/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function speechTextForMessage(message) {
        if (!message || message.role !== "assistant" || message.loading) {
          return "";
        }
        const parts = [];
        if (message.text) {
          parts.push(String(message.text));
        }
        const formulaText = String(message.formulaText || "").trim();
        if (formulaText && !String(message.text || "").includes(formulaText)) {
          parts.push(formulaText);
        }
        const resultValue = String(message.resultValue || "").trim();
        if (resultValue && !String(message.text || "").includes(resultValue)) {
          parts.push(`计算结果为 ${resultValue}`);
        }
        return speechFriendlyMathText(parts.join("。")).slice(0, 1800);
      }

      function syncSpeechButtons() {
        const supported = Boolean(
          speechSynthesisApi && SpeechSynthesisUtteranceApi,
        );
        document
          .querySelectorAll('[data-message-action="speak-answer"]')
          .forEach((button) => {
            button.hidden = !supported;
            const speaking =
              supported
              && button.dataset.messageId === activeSpeechMessageId;
            button.dataset.speaking = String(speaking);
            const label = button.querySelector(".speech-button-label");
            if (label) {
              label.textContent = speaking ? "停止朗读" : "朗读答案";
            } else {
              button.textContent = speaking ? "停止" : "朗读";
            }
            button.setAttribute("aria-pressed", String(speaking));
            button.setAttribute(
              "aria-label",
              speaking ? "停止朗读这条回答" : "朗读这条回答",
            );
            button.title = speaking ? "停止朗读" : "朗读这条回答";
          });
      }

      function stopAnswerSpeech({status = ""} = {}) {
        const utterance = activeSpeechUtterance;
        activeSpeechUtterance = null;
        activeSpeechMessageId = "";
        if (speechSynthesisApi) {
          speechSynthesisApi.cancel();
        }
        if (utterance) {
          utterance.onend = null;
          utterance.onerror = null;
        }
        syncSpeechButtons();
        if (status) {
          setVoiceStatus(status, "success");
        }
      }

      function toggleAnswerSpeech(messageId) {
        if (!speechSynthesisApi || !SpeechSynthesisUtteranceApi) {
          setVoiceStatus(
            "当前浏览器不支持回答朗读，请使用较新的 Chrome、Edge 或 Safari。",
            "error",
          );
          return;
        }
        if (activeSpeechMessageId === messageId) {
          stopAnswerSpeech({status: "已停止朗读。"});
          return;
        }
        const message = messages.find((item) => item.id === messageId);
        const speechText = speechTextForMessage(message);
        if (!speechText) {
          setVoiceStatus("这条回答没有可朗读的文字内容。", "error");
          return;
        }

        if (voiceInputListening) {
          stopVoiceInput({discard: true});
        }
        stopAnswerSpeech();

        const utterance = new SpeechSynthesisUtteranceApi(speechText);
        utterance.lang = "zh-CN";
        utterance.rate = 0.94;
        utterance.pitch = 1;
        utterance.volume = 1;
        utterance.onend = () => {
          if (activeSpeechUtterance !== utterance) {
            return;
          }
          activeSpeechUtterance = null;
          activeSpeechMessageId = "";
          syncSpeechButtons();
          setVoiceStatus("回答朗读结束。", "success");
        };
        utterance.onerror = (event) => {
          if (activeSpeechUtterance !== utterance) {
            return;
          }
          activeSpeechUtterance = null;
          activeSpeechMessageId = "";
          syncSpeechButtons();
          if (event.error !== "canceled" && event.error !== "interrupted") {
            setVoiceStatus("回答朗读失败，请稍后重试。", "error");
          }
        };
        activeSpeechMessageId = messageId;
        activeSpeechUtterance = utterance;
        syncSpeechButtons();
        setVoiceStatus("正在朗读回答…", "listening");
        try {
          speechSynthesisApi.speak(utterance);
        } catch (error) {
          stopAnswerSpeech({
            status: "回答朗读失败，请稍后重试。",
          });
        }
      }

      function stopVoiceInteraction() {
        if (speechRecognition && voiceInputListening) {
          voiceDiscardResult = true;
          voiceStopRequested = true;
          try {
            if (typeof speechRecognition.abort === "function") {
              speechRecognition.abort();
            } else {
              speechRecognition.stop();
            }
          } catch (error) {
            // The page is closing or the recognition session already ended.
          }
        }
        setVoiceListeningState(false);
        stopAnswerSpeech();
      }

      function appendRecognizedText(text) {
        const existing = chatInput.value.trimEnd();
        const separator = existing ? "\n\n" : "";
        const maximum = Number(chatInput.maxLength) || 600;
        const remaining = Math.max(
          0,
          maximum - existing.length - separator.length,
        );
        const accepted = text.slice(0, remaining).trim();
        if (!accepted) {
          return "";
        }
        chatInput.value = `${existing}${separator}${accepted}`;
        resizeInput();
        queueQuestionKnowledgeUpdate(chatInput.value);
        return accepted;
      }

      function removeInsertedText(item) {
        if (!item.insertedText) {
          return;
        }
        const index = chatInput.value.indexOf(item.insertedText);
        if (index === -1) {
          return;
        }
        const before = chatInput.value
          .slice(0, index)
          .replace(/\s+$/, "");
        const after = chatInput.value
          .slice(index + item.insertedText.length)
          .replace(/^\s+/, "");
        chatInput.value = [before, after].filter(Boolean).join("\n\n");
        resizeInput();
        queueQuestionKnowledgeUpdate(chatInput.value);
      }

      function decodeQuestionImage(file) {
        if (typeof createImageBitmap === "function") {
          return createImageBitmap(file, {imageOrientation: "from-image"})
            .then((bitmap) => ({
              source: bitmap,
              width: bitmap.width,
              height: bitmap.height,
              close: () => bitmap.close(),
            }))
            .catch(() => decodeQuestionImageElement(file));
        }
        return decodeQuestionImageElement(file);
      }

      function decodeQuestionImageElement(file) {
        return new Promise((resolve, reject) => {
          const source = new Image();
          const objectUrl = URL.createObjectURL(file);
          source.onload = () => {
            URL.revokeObjectURL(objectUrl);
            resolve({
              source,
              width: source.naturalWidth || source.width,
              height: source.naturalHeight || source.height,
              close: () => {},
            });
          };
          source.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error("图片无法读取，请重新选择。"));
          };
          source.src = objectUrl;
        });
      }

      function canvasToBlob(canvas, type, quality) {
        return new Promise((resolve, reject) => {
          canvas.toBlob(
            (blob) => {
              if (blob) {
                resolve(blob);
              } else {
                reject(new Error("图片压缩失败，请重新选择。"));
              }
            },
            type,
            quality,
          );
        });
      }

      function preparedImageName(name, type) {
        const baseName = String(name || "question").replace(/\.[^.]+$/, "");
        return `${baseName}${type === "image/jpeg" ? ".jpg" : ".png"}`;
      }

      async function prepareQuestionImage(file) {
        const decoded = await decodeQuestionImage(file);
        try {
          const longestEdge = Math.max(decoded.width, decoded.height);
          const scale = Math.min(
            1,
            MAX_QUESTION_IMAGE_EDGE / Math.max(1, longestEdge),
          );
          const shouldReencode =
            scale < 1
            || file.size > QUESTION_IMAGE_RECOMPRESS_BYTES;
          if (!shouldReencode) {
            return {
              file,
              size: file.size,
              compressed: false,
            };
          }

          const width = Math.max(1, Math.round(decoded.width * scale));
          const height = Math.max(1, Math.round(decoded.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext("2d", {alpha: false});
          if (!context) {
            throw new Error("当前浏览器无法压缩图片，请重新选择。");
          }
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, width, height);
          context.imageSmoothingEnabled = true;
          context.imageSmoothingQuality = "high";
          context.drawImage(decoded.source, 0, 0, width, height);

          let blob = await canvasToBlob(
            canvas,
            "image/jpeg",
            QUESTION_IMAGE_JPEG_QUALITY,
          );
          if (blob.size > MAX_QUESTION_IMAGE_BYTES) {
            blob = await canvasToBlob(canvas, "image/jpeg", 0.8);
          }
          if (blob.size > MAX_QUESTION_IMAGE_BYTES) {
            throw new Error("图片压缩后仍超过 6 MB，请重新拍摄。");
          }
          if (blob.size >= file.size && scale === 1) {
            return {
              file,
              size: file.size,
              compressed: false,
            };
          }
          return {
            file: new File(
              [blob],
              preparedImageName(file.name, blob.type),
              {
                type: blob.type,
                lastModified: Date.now(),
              },
            ),
            size: blob.size,
            compressed: true,
          };
        } finally {
          decoded.close();
        }
      }

      function enqueueQuestionImageRecognition(item) {
        questionImageRecognitionQueue = questionImageRecognitionQueue
          .catch(() => {})
          .then(() => recognizeQuestionImage(item));
      }

      async function recognizeQuestionImage(item) {
        if (
          !item.file
          || item.state === "error"
          || !pendingQuestionImages.includes(item)
        ) {
          return;
        }
        item.controller = new AbortController();
        const controller = item.controller;
        item.state = "loading";
        item.statusText = `正在优化图片（${imageSizeLabel(item.size)}）...`;
        renderComposerImages();

        try {
          const prepared = await prepareQuestionImage(item.file);
          if (controller.signal.aborted) {
            return;
          }
          item.uploadFile = prepared.file;
          item.uploadSize = prepared.size;
          item.compressed = prepared.compressed;
          item.statusText = prepared.compressed
            ? `正在识别（${imageSizeLabel(item.size)} → ${imageSizeLabel(prepared.size)}）...`
            : `正在识别（${imageSizeLabel(prepared.size)}）...`;
          renderComposerImages();

          const formData = new FormData();
          formData.append(
            "image",
            prepared.file,
            prepared.file.name || "question.jpg",
          );
          const response = await fetch("/demo/api/ocr", {
            method: "POST",
            headers: {"X-Demo-Session": demoSessionId},
            body: formData,
            signal: controller.signal,
          });

          let data = {};
          try {
            data = await response.json();
          } catch (error) {
            if (!response.ok) {
              throw new Error(`图片识别服务返回错误（${response.status}）。`);
            }
            throw new Error("图片识别服务返回了无法识别的内容。");
          }
          if (!response.ok) {
            throw new Error(
              data.detail || `图片识别服务返回错误（${response.status}）。`,
            );
          }

          const text = String(data.text || "").trim();
          if (!text) {
            throw new Error("图片中没有识别到可用题目，请重新拍摄。");
          }

          const recognitionSource = String(data.provider || "").trim();
          const recognitionWarning = String(data.warning || "").trim();
          const questionBlocks = Array.isArray(data.question_blocks)
            ? data.question_blocks
              .map((block, blockIndex) => ({
                index: Number(block?.index) || blockIndex + 1,
                label: String(block?.label || "").trim(),
                text: String(block?.text || "").trim(),
              }))
              .filter((block) => block.text)
            : [];
          item.text = text;
          item.state = "success";
          item.questionBlocks = questionBlocks;
          item.selectedBlockIndexes = [];
          item.selectedBlockText = "";
          item.reviewRequired = Boolean(data.review_required);
          item.reviewConfirmed = false;
          if (questionBlocks.length > 1) {
            item.insertedText = "";
            item.statusText =
              `识别到 ${questionBlocks.length} 道独立题，请选择需要计算的题目`;
            composerImageNotice =
              recognitionWarning
              || "可多选或全选，发送后会按题逐次计算。";
          } else if (item.reviewRequired) {
            item.insertedText = "";
            item.statusText = "整图可能含多题，请确认当前识别题";
            composerImageNotice =
              recognitionWarning || "请确认当前识别题，或裁剪小题后重新识别。";
          } else {
            lastRecognizedQuestion = text;
            item.insertedText = appendRecognizedText(text);
            item.statusText = recognitionSource === "windows"
              ? "已离线识别，请核对公式后发送"
              : item.insertedText
                ? item.compressed
                  ? "已识别（上传前已压缩），可直接发送"
                  : "已识别，可直接发送"
                : "已识别，但输入内容已达上限";
            if (!item.insertedText) {
              composerImageNotice = "输入内容已达 600 字，发送时将使用图片识别内容。";
            } else if (item.insertedText.length < text.length) {
              composerImageNotice = "部分识别内容超出 600 字，发送时将自动截取。";
            }
            if (recognitionWarning) {
              composerImageNotice = recognitionWarning;
            }
          }
        } catch (error) {
          if (error.name === "AbortError") {
            return;
          }
          item.state = "error";
          item.statusText =
            error.message || "图片识别失败，请稍后重试。";
        } finally {
          if (item.controller === controller) {
            item.controller = null;
          }
          renderComposerImages();
          flushPendingComposerSubmission();
        }
      }

      function addQuestionImages(fileList) {
        const files = Array.from(fileList || []);
        if (!files.length) {
          return;
        }
        composerImageNotice = "";
        const available = Math.max(
          0,
          MAX_QUESTION_IMAGE_COUNT - pendingQuestionImages.length,
        );
        if (!available) {
          composerImageNotice = `最多同时发送 ${MAX_QUESTION_IMAGE_COUNT} 张图片。`;
          renderComposerImages();
          return;
        }
        if (files.length > available) {
          composerImageNotice = `最多同时发送 ${MAX_QUESTION_IMAGE_COUNT} 张图片，已保留前 ${available} 张。`;
        }

        files.slice(0, available).forEach((file) => {
          const mimeType = String(file.type || "").toLowerCase();
          const item = {
            id: makeId(),
            file,
            name: file.name || "题目图片",
            size: file.size,
            previewUrl: "",
            state: "loading",
            statusText: `等待识别（${imageSizeLabel(file.size)}）...`,
            text: "",
            insertedText: "",
            questionBlocks: [],
            selectedBlockIndexes: [],
            selectedBlockText: "",
            reviewRequired: false,
            reviewConfirmed: false,
            uploadFile: null,
            uploadSize: file.size,
            compressed: false,
            controller: null,
          };
          if (!QUESTION_IMAGE_TYPES.has(mimeType)) {
            item.state = "error";
            item.statusText = "仅支持 JPG、PNG、WebP 或 GIF 图片。";
          } else if (file.size > MAX_QUESTION_IMAGE_INPUT_BYTES) {
            item.state = "error";
            item.statusText = "原始图片不能超过 20 MB，请压缩后重试。";
          } else {
            item.previewUrl = URL.createObjectURL(file);
          }
          pendingQuestionImages.push(item);
        });

        renderComposerImages();
        pendingQuestionImages
          .filter((item) => item.state === "loading" && item.file)
          .forEach((item) => {
            enqueueQuestionImageRecognition(item);
          });
      }

      function removeQuestionImage(imageId, { focus = false } = {}) {
        const index = pendingQuestionImages.findIndex(
          (item) => item.id === imageId,
        );
        if (index === -1) {
          return;
        }
        const item = pendingQuestionImages[index];
        if (item.controller) {
          item.controller.abort();
        }
        if (item.previewUrl) {
          URL.revokeObjectURL(item.previewUrl);
        }
        removeInsertedText(item);
        pendingQuestionImages.splice(index, 1);
        if (!pendingQuestionImages.length) {
          pendingComposerSubmission = false;
        }
        composerImageNotice = "";
        renderComposerImages();
        if (focus) {
          imageUploadButton.focus();
        }
      }

      function clearQuestionImages({
        focus = false,
        revokeUrls = true,
      } = {}) {
        pendingQuestionImages.forEach((item) => {
          if (item.controller) {
            item.controller.abort();
          }
          if (revokeUrls && item.previewUrl) {
            URL.revokeObjectURL(item.previewUrl);
          }
        });
        pendingQuestionImages = [];
        composerImageNotice = "";
        pendingComposerSubmission = false;
        imageFileInput.value = "";
        composerImageList.replaceChildren();
        composerImagePreview.hidden = true;
        composerImageStatus.textContent = "";
        syncComposerState();
        if (focus) {
          imageUploadButton.focus();
        }
      }

      function hasImageRecognitionInFlight() {
        return pendingQuestionImages.some(
          (item) => item.state === "loading",
        );
      }

      function composeQuestionRequests() {
        const requests = [];
        const addRequest = (text, source, confirmed, origin) => {
          const normalized = String(text || "").trim();
          if (!normalized) {
            return;
          }
          const duplicate = requests.some(
            (request) =>
              request.text === normalized && request.origin === origin,
          );
          if (!duplicate) {
            requests.push({
              text: normalized,
              source,
              confirmed: Boolean(confirmed),
              origin,
            });
          }
        };

        let manualText = chatInput.value.trim();
        pendingQuestionImages.forEach((item) => {
          const insertedText = String(item.insertedText || "").trim();
          if (insertedText) {
            manualText = manualText.replace(insertedText, "");
          }
        });
        manualText = manualText.replace(/\n{3,}/g, "\n\n").trim();
        if (manualText) {
          addRequest(manualText, "text", false, "manual");
        }
        pendingQuestionImages.forEach((item) => {
          recognizedQuestionTexts(item).forEach((text) => {
            addRequest(text, "ocr", true, `image:${item.id}`);
          });
        });
        return requests;
      }

      function pendingImageAttachments() {
        return pendingQuestionImages
          .filter((item) => item.previewUrl)
          .map((item) => ({
            name: item.name,
            previewUrl: item.previewUrl,
          }));
      }

      function syncComposerState() {
        const hasText = Boolean(chatInput.value.trim());
        const hasRecognizedImage = pendingQuestionImages.some(
          (item) => Boolean(usableRecognizedText(item)),
        );
        const recognizing = hasImageRecognitionInFlight();
        const hasPendingImage = pendingQuestionImages.some(
          (item) => item.previewUrl,
        );
        sendButton.disabled =
          requestInFlight
          || (!hasText && !hasRecognizedImage && !hasPendingImage);
        sendButton.textContent = requestInFlight
          ? "计算中"
          : "发送";
        sendButton.setAttribute("aria-busy", String(requestInFlight));
        imageUploadButton.disabled =
          requestInFlight
          || pendingQuestionImages.length >= MAX_QUESTION_IMAGE_COUNT;
        if (recognizing) {
          imageUploadButton.dataset.loading = "true";
        } else {
          imageUploadButton.removeAttribute("data-loading");
        }
      }

      function flushPendingComposerSubmission() {
        if (
          !pendingComposerSubmission
          || requestInFlight
          || hasImageRecognitionInFlight()
        ) {
          return;
        }
        pendingComposerSubmission = false;
        window.setTimeout(() => {
          if (!requestInFlight) {
            submitComposer();
          }
        }, 0);
      }

      async function submitComposer() {
        if (requestInFlight) {
          return;
        }
        if (hasImageRecognitionInFlight()) {
          pendingComposerSubmission = true;
          composerImageNotice = "正在识别图片，完成后会自动发送。";
          renderComposerImages();
          return;
        }
        pendingComposerSubmission = false;
        const unresolvedImage = pendingQuestionImages.find(
          (item) => item.state === "success" && !usableRecognizedText(item),
        );
        if (unresolvedImage) {
          composerImageNotice =
            "整图可能包含多道题，请先选择题号，或确认当前识别题后发送。";
          renderComposerImages();
          return;
        }
        const requests = composeQuestionRequests();
        if (!requests.length) {
          composerImageNotice =
            "请选择至少一道需要计算的题目后发送。";
          renderComposerImages();
          return;
        }
        const attachments = pendingImageAttachments();
        clearQuestionImages({ revokeUrls: false });
        for (let index = 0; index < requests.length; index += 1) {
          const request = requests[index];
          await sendMessage(
            request.text,
            {
              attachments: index === 0 ? attachments : [],
              source: request.source,
              confirmedOcr: request.confirmed,
              pendingQuestion: request.text,
            },
          );
        }
      }

      function setRequestState(active) {
        requestInFlight = active;
        syncComposerState();
      }

      function responseToMessage(data, sourceUserMessageId = "") {
        const calculation = data.calculation || {};
        let resultLabel = "";
        let resultValue = "";

        if (data.intent === "verify") {
          resultLabel = "导数";
          resultValue = calculation.derivative || "";
        } else if (data.intent === "integrate") {
          resultLabel = "积分";
          resultValue = calculation.integral || "";
        } else if (data.intent === "limit") {
          resultLabel = "极限";
          resultValue = calculation.limit || "";
        } else if (data.intent === "solve") {
          resultLabel = calculation.method || "章节求解";
          resultValue = calculation.result || "";
        } else if (data.intent === "arithmetic") {
          resultLabel = "计算结果";
          resultValue = calculation.result || "";
        } else if (data.intent === "plot") {
          resultLabel = "函数表达式";
          resultValue = calculation.expression || "";
        }

        return {
          id: makeId(),
          role: "assistant",
          text: String(data.reply || "这次没有得到可用的计算结果。"),
          intent: String(data.intent || ""),
          formulaLatex: String(data.formula_latex || ""),
          formulaText: String(data.formula_text || ""),
          resultLabel,
          resultValue: String(resultValue),
          verdict:
            typeof calculation.is_correct === "boolean"
              ? calculation.is_correct
              : null,
          plotUrl: String(calculation.plot_url || ""),
          sourceUserMessageId: String(sourceUserMessageId || ""),
          createdAt: currentTime(),
        };
      }

      function selectedSolverTopic() {
        const chapterKey = solverChapter.value || Object.keys(SOLVER_CHAPTERS)[0];
        const chapter = SOLVER_CHAPTERS[chapterKey];
        if (!chapter) {
          return null;
        }
        const topicKey =
          solverTopic.value || Object.keys(chapter.topics)[0];
        const topic = chapter.topics[topicKey];
        if (!topic) {
          return null;
        }
        return { chapterKey, chapter, topicKey, topic };
      }

      function renderSolverFields() {
        const selected = selectedSolverTopic();
        if (!selected) {
          solverFields.replaceChildren();
          solverHint.textContent = "";
          return;
        }

        const fragment = document.createDocumentFragment();
        selected.topic.fields.forEach((field) => {
          const wrapper = element(
            "div",
            `solver-field${field.wide ? " is-wide" : ""}`,
          );
          const label = element("label", "", field.label);
          label.htmlFor = `solver-${field.key}`;
          const control = document.createElement(
            field.type === "json" ? "textarea" : "input",
          );
          control.id = `solver-${field.key}`;
          control.name = field.key;
          control.placeholder = field.placeholder;
          control.value = field.defaultValue;
          if (field.type === "number") {
            control.type = "number";
          } else if (field.type !== "json") {
            control.type = "text";
          }
          if (field.required !== false) {
            control.required = true;
          }
          wrapper.append(label, control);
          fragment.append(wrapper);
        });

        solverFields.replaceChildren(fragment);
        solverHint.textContent = selected.topic.hint;
        solverStatus.textContent = "";
      }

      function populateSolverTopics() {
        const chapter = SOLVER_CHAPTERS[solverChapter.value];
        if (!chapter) {
          solverTopic.replaceChildren();
          renderSolverFields();
          return;
        }

        const fragment = document.createDocumentFragment();
        Object.entries(chapter.topics).forEach(([topicKey, topic]) => {
          const option = document.createElement("option");
          option.value = topicKey;
          option.textContent = topic.label;
          fragment.append(option);
        });
        solverTopic.replaceChildren(fragment);
        renderSolverFields();
      }

      function populateSolverChapters() {
        if (solverChapter.options.length) {
          return;
        }
        const fragment = document.createDocumentFragment();
        Object.entries(SOLVER_CHAPTERS).forEach(([chapterKey, chapter]) => {
          const option = document.createElement("option");
          option.value = chapterKey;
          option.textContent = chapter.label;
          fragment.append(option);
        });
        solverChapter.replaceChildren(fragment);
        populateSolverTopics();
      }

      function readSolverField(field) {
        const control = document.getElementById(`solver-${field.key}`);
        const raw = control ? control.value.trim() : "";
        if (!raw) {
          if (field.required !== false) {
            throw new Error(`请填写${field.label}`);
          }
          return undefined;
        }
        if (field.type === "list") {
          const values = raw
            .split(",")
            .map((value) => value.trim())
            .filter(Boolean);
          if (!values.length) {
            throw new Error(`${field.label}不能为空`);
          }
          return values;
        }
        if (field.type === "json") {
          try {
            const parsed = JSON.parse(raw);
            if (
              !parsed
              || Array.isArray(parsed)
              || typeof parsed !== "object"
            ) {
              throw new Error("not-object");
            }
            return parsed;
          } catch (error) {
            throw new Error(`${field.label}必须是 JSON 对象`);
          }
        }
        return raw;
      }

      function buildSolverPayload() {
        const selected = selectedSolverTopic();
        if (!selected) {
          throw new Error("请选择章节和题型");
        }
        const inputs = {};
        selected.topic.fields.forEach((field) => {
          const value = readSolverField(field);
          if (value !== undefined) {
            inputs[field.key] = value;
          }
        });
        return {
          chapter: selected.chapterKey,
          topic: selected.topicKey,
          inputs,
        };
      }

      function solverSummary(selected, inputs) {
        const details = selected.topic.fields
          .filter((field) => inputs[field.key] !== undefined)
          .map((field) => {
            const value = inputs[field.key];
            const text = Array.isArray(value)
              ? value.join(", ")
              : typeof value === "object"
                ? JSON.stringify(value)
                : value;
            return `${field.label}：${text}`;
          });
        return `${selected.chapter.label} / ${selected.topic.label}${
          details.length ? `；${details.join("；")}` : ""
        }`;
      }

      function openSolverDialog(chapterKey, topicKey) {
        if (requestInFlight) {
          return;
        }
        populateSolverChapters();
        const nextChapter =
          chapterKey && SOLVER_CHAPTERS[chapterKey]
            ? chapterKey
            : solverChapter.value;
        solverChapter.value = nextChapter;
        populateSolverTopics();
        if (topicKey && solverTopic.querySelector(`option[value="${topicKey}"]`)) {
          solverTopic.value = topicKey;
          renderSolverFields();
        }
        solverStatus.textContent = "";
        if (typeof solverDialog.showModal === "function") {
          solverDialog.showModal();
        } else {
          solverDialog.setAttribute("open", "");
        }
      }

      function closeSolverDialog() {
        if (
          solverDialog.open
          && typeof solverDialog.close === "function"
        ) {
          solverDialog.close();
        } else {
          solverDialog.removeAttribute("open");
        }
      }

      async function submitSolverRequest(event) {
        event.preventDefault();
        if (requestInFlight) {
          return;
        }

        let payload;
        let selected;
        try {
          selected = selectedSolverTopic();
          payload = buildSolverPayload();
        } catch (error) {
          solverStatus.textContent = error.message || "请检查输入参数";
          return;
        }

        solverStatus.textContent = "";
        submitSolverButton.disabled = true;
        submitSolverButton.textContent = "计算中";
        setRequestState(true);

        const controller = new AbortController();
        const timeoutId = window.setTimeout(
          () => controller.abort(),
          REQUEST_TIMEOUT_MS,
        );
        try {
          const response = await fetch("/demo/api/solve", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
            signal: controller.signal,
          }).finally(() => window.clearTimeout(timeoutId));

          let data;
          try {
            data = await response.json();
          } catch (error) {
            throw new Error("计算服务返回了无法识别的内容");
          }
          if (!response.ok) {
            throw new Error(
              data.detail
              || `计算服务返回错误（${response.status}）`,
            );
          }

          const notes = Array.isArray(data.notes) && data.notes.length
            ? `\n\n提示：${data.notes.join("；")}`
            : "";
          const solverUserMessageId = makeId();
          messages.push(
            {
              id: solverUserMessageId,
              role: "user",
              text: `【全章节解题】${solverSummary(selected, payload.inputs)}`,
              formulaLatex: "",
              formulaText: "",
              resultLabel: "",
              resultValue: "",
              verdict: null,
              createdAt: currentTime(),
            },
            {
              id: makeId(),
              role: "assistant",
              text: `已用“${data.method}”完成计算。${notes}`,
              intent: "solve",
              formulaLatex: String(data.latex || ""),
              formulaText: String(data.result || ""),
              resultLabel: String(data.method || ""),
              resultValue: String(data.result || ""),
              verdict:
                typeof data.is_correct === "boolean"
                  ? data.is_correct
                  : null,
              sourceUserMessageId: solverUserMessageId,
              createdAt: currentTime(),
            },
          );
          recordLearningActivity("calculation");
          renderMessages();
          saveMessages();
          closeSolverDialog();
        } catch (error) {
          solverStatus.textContent =
            error.name === "AbortError"
              ? "等待时间过长，请稍后重试。"
              : error.message || "计算服务暂时不可用";
        } finally {
          submitSolverButton.disabled = false;
          submitSolverButton.textContent = "开始计算";
          setRequestState(false);
        }
      }

      async function sendMessage(rawMessage, options = {}) {
        const text = String(rawMessage || "").trim();
        const source = options.source === "ocr" ? "ocr" : "text";
        const confirmedOcr = options.confirmedOcr === true;
        const confirmedOcrQuestion = confirmedOcr
          ? String(options.pendingQuestion || text).trim()
          : "";
        const requestText = confirmedOcr ? "\u786e\u8ba4" : text;
        const attachments = Array.isArray(options.attachments)
          ? options.attachments
            .slice(0, MAX_QUESTION_IMAGE_COUNT)
            .map((attachment) => ({
              name: String(
                (attachment && attachment.name) || "题目图片",
              ),
              previewUrl: String(
                (attachment && attachment.previewUrl) || "",
              ),
            }))
          : [];
        if ((!text && !attachments.length) || requestInFlight) {
          return;
        }
        stopVoiceInteraction();
        window.clearTimeout(knowledgeDebounceId);
        lastSubmittedKnowledgeText = text;
        renderQuestionKnowledge(text, { source: "submit" });
        const history = requestHistory();

        const userMessageId = makeId();
        messages.push({
          id: userMessageId,
          role: "user",
          text,
          formulaLatex: "",
          formulaText: "",
          resultLabel: "",
          resultValue: "",
          verdict: null,
          attachments,
          createdAt: currentTime(),
        });

        const loadingId = makeId();
        messages.push({
          id: loadingId,
          role: "assistant",
          text: "",
          formulaLatex: "",
          formulaText: "",
          resultLabel: "",
          resultValue: "",
          verdict: null,
          createdAt: currentTime(),
          loading: true,
        });

        chatInput.value = "";
        resizeInput();
        setRequestState(true);
        renderMessages();
        saveMessages();

        const controller = new AbortController();
        const timeoutId = window.setTimeout(
          () => controller.abort(),
          REQUEST_TIMEOUT_MS,
        );

        try {
          const compactRequestText = text.replace(
            /[\s,，。！!？?；;]/g,
            "",
          );
          const isConfirmationRequest = confirmedOcr || [
            "确认",
            "正确",
            "无误",
            "继续",
            "开始",
          ].some((marker) => compactRequestText.includes(marker));
          const messagePendingQuestion =
            [...messages]
              .reverse()
              .find(
                (message) =>
                  message.role === "assistant" &&
                  message.intent === "ocr_confirm" &&
                  message.formulaText,
              )?.formulaText || "";
          const pendingOcrQuestion = confirmedOcr
            ? confirmedOcrQuestion
            : (
              isConfirmationRequest
                ? (lastRecognizedQuestion || messagePendingQuestion)
                : messagePendingQuestion
            );
          const cachedResponse = responseCache.get(text);
          if (
            cachedResponse
            && cachedResponse.intent !== "ocr_confirm"
            && !pendingOcrQuestion
            && !isConfirmationRequest
          ) {
            window.clearTimeout(timeoutId);
            await new Promise((resolve) => window.setTimeout(resolve, 120));
            const cachedIndex = messages.findIndex(
              (message) => message.id === loadingId,
            );
            if (cachedIndex !== -1) {
              messages[cachedIndex] = responseToMessage(
                cachedResponse,
                userMessageId,
              );
            }
            syncWrongBookAnswer(userMessageId, text);
            recordLearningActivity("question");
            renderSuggestions(cachedResponse.suggestions);
            return;
          }

          const response = await fetch("/demo/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Demo-Session": demoSessionId,
            },
            body: JSON.stringify({
              message: requestText,
              history,
              source,
              pending_question: pendingOcrQuestion,
            }),
            signal: controller.signal,
          }).finally(() => window.clearTimeout(timeoutId));

          let data;
          try {
            data = await response.json();
          } catch (error) {
            throw new Error("计算服务返回了无法识别的内容。");
          }

          if (!response.ok) {
            throw new Error(data.detail || `计算服务返回错误（${response.status}）。`);
          }

          const index = messages.findIndex((message) => message.id === loadingId);
          if (index !== -1) {
            messages[index] = responseToMessage(data, userMessageId);
          }
          syncWrongBookAnswer(userMessageId, text);
          recordLearningActivity("question");
          if (data.intent !== "ocr_confirm") {
            cacheResponse(text, data);
          }
          if (
            data.intent !== "ocr_confirm"
            && data.intent !== "needs_input"
            && data.intent !== "unknown"
          ) {
            lastRecognizedQuestion = "";
          }
          renderSuggestions(data.suggestions);
        } catch (error) {
          const index = messages.findIndex((message) => message.id === loadingId);
          if (index !== -1) {
            messages[index] = {
              id: loadingId,
              role: "assistant",
              text:
                error.name === "AbortError"
                  ? "这次等待时间有点长，已停止等待。可以再发一次同一题，系统会复用已有结果。"
                  : error.message || "计算服务暂时不可用，请稍后重试。",
              intent: "error",
              formulaLatex: "",
              formulaText: "",
              resultLabel: "",
              resultValue: "",
              verdict: null,
              createdAt: currentTime(),
            };
          }
          renderSuggestions(DEFAULT_SUGGESTIONS);
        } finally {
          setRequestState(false);
          renderMessages();
          saveMessages();
          chatInput.focus();
        }
      }

      function setSidebarCollapsed(collapsed, persist = true) {
        const nextCollapsed = Boolean(collapsed);
        appShell.dataset.sidebarCollapsed = String(nextCollapsed);
        if (persist) {
          try {
            window.localStorage.setItem(
              SIDEBAR_COLLAPSED_KEY,
              String(nextCollapsed),
            );
          } catch (error) {
            // Layout state remains active for the current page.
          }
        }

        document.querySelectorAll("[data-sidebar-toggle]").forEach((button) => {
          button.setAttribute(
            "aria-label",
            nextCollapsed ? "展开侧边栏" : "折叠侧边栏",
          );
          button.setAttribute("aria-expanded", String(!nextCollapsed));
        });
      }

      function setSidebarWidth(width, persist = true) {
        const nextWidth = Math.min(
          MAX_SIDEBAR_WIDTH,
          Math.max(MIN_SIDEBAR_WIDTH, Number(width) || DEFAULT_SIDEBAR_WIDTH),
        );
        document.documentElement.style.setProperty(
          "--sidebar-width",
          `${nextWidth}px`,
        );
        if (persist) {
          try {
            window.localStorage.setItem(SIDEBAR_WIDTH_KEY, String(nextWidth));
          } catch (error) {
            // The current width still applies without storage.
          }
        }
      }

      function setTheme(theme) {
        const nextTheme = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = nextTheme;
        themeColorMeta?.setAttribute(
          "content",
          nextTheme === "dark" ? "#0f1115" : "#f3eee5",
        );
        themeLabel.textContent =
          nextTheme === "dark" ? "切换浅色主题" : "切换深色主题";
        try {
          window.localStorage.setItem(THEME_KEY, nextTheme);
        } catch (error) {
          // Theme remains active for the current page.
        }
      }

      function startNewConversation() {
        if (requestInFlight) {
          return;
        }
        stopVoiceInteraction();
        resetDemoSession();
        activeConversationId = makeId();
        try {
          window.localStorage.setItem(
            ACTIVE_CONVERSATION_KEY,
            activeConversationId,
          );
        } catch (error) {
          // The new conversation is still available in memory.
        }
        messages = [welcomeMessage()];
        pendingComposerSubmission = false;
        responseCache.clear();
        window.clearTimeout(knowledgeDebounceId);
        lastSubmittedKnowledgeText = "";
        renderQuestionKnowledge("");
        renderSuggestions(DEFAULT_SUGGESTIONS);
        renderMessages();
        saveMessages();
        if (sidebarMedia.matches) {
          setSidebarCollapsed(true);
        }
        chatInput.focus();
      }

      function clearCurrentConversation() {
        if (requestInFlight) {
          return;
        }
        stopVoiceInteraction();
        resetDemoSession();
        messages = [welcomeMessage()];
        pendingComposerSubmission = false;
        responseCache.clear();
        window.clearTimeout(knowledgeDebounceId);
        lastSubmittedKnowledgeText = "";
        renderQuestionKnowledge("");
        renderSuggestions(DEFAULT_SUGGESTIONS);
        renderMessages();
        saveMessages();
        chatInput.focus();
      }

      function resetDemoSession() {
        fetch("/demo/api/session/reset", {
          method: "POST",
          headers: {"X-Demo-Session": demoSessionId},
        }).catch(() => {
          // The next OCR request will also establish a fresh state.
        });
      }

      function setConversationPanelCollapsed(collapsed) {
        const nextCollapsed = Boolean(collapsed);
        conversationPanel.dataset.collapsed = String(nextCollapsed);
        conversationPanelToggle.setAttribute(
          "aria-label",
          nextCollapsed ? "展开会话列表" : "收起会话列表",
        );
        conversationPanelToggle.setAttribute(
          "title",
          nextCollapsed ? "展开会话列表" : "收起会话列表",
        );
      }

      function selectConversation(conversationId) {
        if (requestInFlight) {
          return;
        }
        stopVoiceInteraction();
        const conversation = conversations.find(
          (item) => item.id === conversationId,
        );
        if (!conversation) {
          return;
        }
        activeConversationId = conversation.id;
        messages = conversation.messages.length
          ? normalizeMessages(conversation.messages)
          : [welcomeMessage()];
        responseCache.clear();
        window.clearTimeout(knowledgeDebounceId);
        lastSubmittedKnowledgeText = latestUserQuestion();
        renderQuestionKnowledge(lastSubmittedKnowledgeText);
        try {
          window.localStorage.setItem(
            ACTIVE_CONVERSATION_KEY,
            activeConversationId,
          );
        } catch (error) {
          // The selected conversation is still active in memory.
        }
        renderSuggestions(DEFAULT_SUGGESTIONS);
        renderMessages();
        renderHistory();
        if (sidebarMedia.matches) {
          setSidebarCollapsed(true);
        }
        chatInput.focus();
      }

      function renameConversation(conversationId) {
        const conversation = conversations.find(
          (item) => item.id === conversationId,
        );
        if (!conversation) {
          return;
        }
        const nextTitle = window.prompt("重命名会话", conversation.title);
        if (nextTitle === null) {
          return;
        }
        const title = nextTitle.replace(/\s+/g, " ").trim();
        if (!title) {
          return;
        }
        conversation.title = title.slice(0, 60);
        conversation.renamed = true;
        conversation.updatedAt = Date.now();
        persistConversations();
        renderHistory();
      }

      function deleteConversation(conversationId) {
        const conversation = conversations.find(
          (item) => item.id === conversationId,
        );
        if (!conversation) {
          return;
        }
        if (!window.confirm(`确定删除“${conversationPreview(conversation)}”吗？`)) {
          return;
        }

        const wasActive = conversationId === activeConversationId;
        conversations = conversations.filter(
          (item) => item.id !== conversationId,
        );
        persistConversations();

        if (!wasActive) {
          renderHistory();
          return;
        }
        if (conversations.length) {
          selectConversation(conversations[0].id);
        } else {
          startNewConversation();
        }
      }

      document.querySelectorAll("[data-sidebar-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          setSidebarCollapsed(
            appShell.dataset.sidebarCollapsed !== "true",
          );
        });
      });

      sidebarScrim.addEventListener("click", () => {
        setSidebarCollapsed(true);
      });

      historyList.addEventListener("click", (event) => {
        const actionButton = event.target.closest("[data-history-action]");
        if (actionButton) {
          const item = actionButton.closest(".history-item");
          if (!item) {
            return;
          }
          if (actionButton.dataset.historyAction === "rename") {
            renameConversation(item.dataset.conversationId);
          } else if (actionButton.dataset.historyAction === "delete") {
            deleteConversation(item.dataset.conversationId);
          }
          return;
        }

        const selectButton = event.target.closest(".history-select");
        if (selectButton) {
          const item = selectButton.closest(".history-item");
          if (item) {
            selectConversation(item.dataset.conversationId);
          }
        }
      });

      messageList.addEventListener("click", (event) => {
        const explainButton = event.target.closest(
          '[data-message-action="explain-step"]',
        );
        if (explainButton) {
          const answerMessage = messages.find(
            (message) =>
              message.id === explainButton.dataset.messageId
              && message.role === "assistant",
          );
          const sourceUserMessage = sourceUserMessageForAnswer(answerMessage);
          const question = sourceUserMessage?.text
            ? `题目：${sourceUserMessage.text}\n`
            : "";
          sendMessage(
            `${question}请把上题再拆成更小步骤，重点解释我没看懂的那一步。`,
          );
          return;
        }
        const speakButton = event.target.closest(
          '[data-message-action="speak-answer"]',
        );
        if (speakButton) {
          toggleAnswerSpeech(speakButton.dataset.messageId);
          return;
        }
        const bookmarkButton = event.target.closest(
          '[data-message-action="toggle-wrongbook"]',
        );
        if (bookmarkButton) {
          toggleWrongBook(bookmarkButton.dataset.messageId);
        }
      });

      newChatButton.addEventListener("click", startNewConversation);

      function readQuickInput(id) {
        const input = document.getElementById(id);
        return input ? input.value.trim() : "";
      }

      if (conversationPanelToggle) {
        conversationPanelToggle.addEventListener("click", () => {
          setConversationPanelCollapsed(
            conversationPanel.dataset.collapsed !== "true",
          );
        });
      }

      document.querySelectorAll("[data-rail-tab]").forEach((button) => {
        button.addEventListener("click", () => {
          setToolboxTab(button.dataset.railTab);
          setSidebarCollapsed(false);
        });
      });

      if (toolbox) {
        toolbox.addEventListener("click", (event) => {
          const tabButton = event.target.closest("[data-toolbox-tab]");
          if (tabButton) {
            setToolboxTab(tabButton.dataset.toolboxTab);
            return;
          }

          const wrongBookAction = event.target.closest(
            "[data-wrongbook-action]",
          );
          if (wrongBookAction) {
            const itemId = wrongBookAction.dataset.wrongBookId;
            if (wrongBookAction.dataset.wrongbookAction === "practice") {
              practiceWrongBookItem(itemId);
            } else if (
              wrongBookAction.dataset.wrongbookAction === "delete"
            ) {
              deleteWrongBookItem(itemId);
            }
            return;
          }
        });
      }

      if (wrongBookClear) {
        wrongBookClear.addEventListener("click", clearWrongBook);
      }

      if (wrongBookExport) {
        wrongBookExport.addEventListener("click", exportWrongBook);
      }

      if (learningProgressExport) {
        learningProgressExport.addEventListener(
          "click",
          exportLearningProgress,
        );
      }

      if (learningProgressBackup) {
        learningProgressBackup.addEventListener(
          "click",
          exportLearningProgressBackup,
        );
      }

      if (learningProgressMerge) {
        learningProgressMerge.addEventListener("click", () => {
          learningProgressImportMode = "merge";
          learningProgressImportInput.value = "";
          learningProgressImportInput.click();
        });
      }

      if (learningProgressOverwrite) {
        learningProgressOverwrite.addEventListener("click", () => {
          learningProgressImportMode = "overwrite";
          learningProgressImportInput.value = "";
          learningProgressImportInput.click();
        });
      }

      if (learningProgressImportInput) {
        learningProgressImportInput.addEventListener("change", (event) => {
          const file = event.target.files && event.target.files[0];
          importLearningProgress(file, learningProgressImportMode);
        });
      }

      if (openSolverButton) {
        openSolverButton.addEventListener("click", openSolverDialog);
      }
      closeSolverButton.addEventListener("click", closeSolverDialog);
      cancelSolverButton.addEventListener("click", closeSolverDialog);
      solverChapter.addEventListener("change", populateSolverTopics);
      solverTopic.addEventListener("change", renderSolverFields);
      solverForm.addEventListener("submit", submitSolverRequest);
      solverDialog.addEventListener("click", (event) => {
        if (event.target === solverDialog) {
          closeSolverDialog();
        }
      });

      themeToggle.addEventListener("click", () => {
        setTheme(
          document.documentElement.dataset.theme === "dark" ? "light" : "dark",
        );
      });

      let resizePointerId = null;
      let resizeStartX = 0;
      let resizeStartWidth = DEFAULT_SIDEBAR_WIDTH;

      sidebarResizer.addEventListener("pointerdown", (event) => {
        if (sidebarMedia.matches || event.button !== 0) {
          return;
        }
        event.preventDefault();
        resizePointerId = event.pointerId;
        resizeStartX = event.clientX;
        resizeStartWidth =
          parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--sidebar-width",
            ),
          ) || DEFAULT_SIDEBAR_WIDTH;
        appShell.classList.add("is-resizing");
        sidebarResizer.setPointerCapture(event.pointerId);
      });

      sidebarResizer.addEventListener("pointermove", (event) => {
        if (event.pointerId !== resizePointerId) {
          return;
        }
        setSidebarWidth(
          resizeStartWidth + event.clientX - resizeStartX,
          false,
        );
      });

      function finishSidebarResize(event) {
        if (event.pointerId !== resizePointerId) {
          return;
        }
        resizePointerId = null;
        appShell.classList.remove("is-resizing");
        const width =
          parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--sidebar-width",
            ),
          ) || DEFAULT_SIDEBAR_WIDTH;
        setSidebarWidth(width);
      }

      sidebarResizer.addEventListener("pointerup", finishSidebarResize);
      sidebarResizer.addEventListener("pointercancel", finishSidebarResize);

      sidebarResizer.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") {
          return;
        }
        event.preventDefault();
        const direction = event.key === "ArrowRight" ? 1 : -1;
        const currentWidth =
          parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--sidebar-width",
            ),
          ) || DEFAULT_SIDEBAR_WIDTH;
        setSidebarWidth(currentWidth + direction * 16);
      });

      const handleSidebarMediaChange = (event) => {
        if (event.matches) {
          setSidebarCollapsed(true, false);
          return;
        }
        let savedState = false;
        try {
          savedState =
            window.localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === "true";
        } catch (error) {
          savedState = false;
        }
        setSidebarCollapsed(savedState, false);
      };

      if (sidebarMedia.addEventListener) {
        sidebarMedia.addEventListener("change", handleSidebarMediaChange);
      } else {
        sidebarMedia.addListener(handleSidebarMediaChange);
      }

      chatForm.addEventListener("submit", (event) => {
        event.preventDefault();
        stopVoiceInteraction();
        submitComposer();
      });

      voiceInputButton.addEventListener("click", () => {
        if (voiceInputListening) {
          stopVoiceInput({
            status: "已停止语音输入，转写内容已保留。",
          });
          return;
        }
        startVoiceInput();
      });

      chatInput.addEventListener("input", () => {
        resizeInput();
        queueQuestionKnowledgeUpdate(chatInput.value);
        syncComposerState();
      });
      chatInput.addEventListener("keydown", (event) => {
        if (
          event.key === "Enter"
          && !event.shiftKey
          && !event.isComposing
          && event.keyCode !== 229
        ) {
          event.preventDefault();
          chatForm.requestSubmit();
        }
      });

      imageUploadButton.addEventListener("click", () => {
        imageFileInput.click();
      });

      imageFileInput.addEventListener("change", () => {
        addQuestionImages(imageFileInput.files);
        imageFileInput.value = "";
      });

      composerImageList.addEventListener("click", (event) => {
        const removeButton = event.target.closest(".composer-image-remove");
        if (removeButton) {
          removeQuestionImage(removeButton.dataset.imageId, { focus: true });
        }
      });

      composerImageClear.addEventListener("click", () => {
        clearQuestionImages({ focus: true });
      });

      chatInput.addEventListener("paste", (event) => {
        const items = Array.from(
          (event.clipboardData && event.clipboardData.items) || [],
        );
        const imageFiles = items
          .filter((item) => String(item.type || "").startsWith("image/"))
          .map((item) => item.getAsFile())
          .filter(Boolean);
        if (!imageFiles.length) {
          return;
        }
        event.preventDefault();
        addQuestionImages(imageFiles);
      });

      suggestions.addEventListener("click", (event) => {
        const button = event.target.closest(".suggestion");
        if (button) {
          const action = button.dataset.suggestionAction || "ask";
          if (action === "upload") {
            imageFileInput.click();
            return;
          }
          if (action === "wrongbook") {
            setToolboxTab("wrongbook");
            if (sidebarMedia.matches) {
              setSidebarCollapsed(false);
            }
            window.requestAnimationFrame(() => {
              document
                .querySelector(".toolbox-tab[aria-selected='true']")
                ?.focus();
            });
            return;
          }
          if (action === "compose") {
            const prompt = button.dataset.prompt || "";
            if (prompt && !chatInput.value.trim()) {
              chatInput.value = prompt;
            }
            resizeInput();
            queueQuestionKnowledgeUpdate(chatInput.value);
            syncComposerState();
            chatInput.focus();
            chatInput.setSelectionRange(
              chatInput.value.length,
              chatInput.value.length,
            );
            return;
          }
          chatInput.value = button.dataset.message || "";
          resizeInput();
          queueQuestionKnowledgeUpdate(chatInput.value);
          syncComposerState();
          chatForm.requestSubmit();
        }
      });

      suggestionsToggle.addEventListener("click", () => {
        setSuggestionsCollapsed(
          composerArea.dataset.suggestionsCollapsed !== "true",
        );
      });

      clearButton.addEventListener("click", clearCurrentConversation);
      window.addEventListener("pagehide", stopVoiceInteraction);
      window.addEventListener("beforeunload", stopVoiceInteraction);

      wrongBook = loadWrongBook();
      learningProgress = loadLearningProgress();
      learningProgress.wrongBookSavedCount = wrongBook.length;
      conversations = loadConversations();
      try {
        activeConversationId =
          window.localStorage.getItem(ACTIVE_CONVERSATION_KEY) || "";
      } catch (error) {
        activeConversationId = "";
      }

      let activeConversation = conversations.find(
        (conversation) => conversation.id === activeConversationId,
      );
      if (activeConversation) {
        messages = normalizeMessages(activeConversation.messages);
      } else {
        messages = loadMessages();
        if (!messages.length && conversations.length) {
          activeConversation = conversations[0];
          activeConversationId = activeConversation.id;
          messages = normalizeMessages(activeConversation.messages);
        }
      }

      if (!activeConversationId) {
        activeConversationId = makeId();
      }
      try {
        window.localStorage.setItem(
          ACTIVE_CONVERSATION_KEY,
          activeConversationId,
        );
      } catch (error) {
        // The current conversation remains active in memory.
      }

      if (!messages.length) {
        messages = [welcomeMessage()];
      }

      let savedTheme = "light";
      let savedSidebarWidth = DEFAULT_SIDEBAR_WIDTH;
      let savedSidebarCollapsed = false;
      try {
        savedTheme =
          window.localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light";
        savedSidebarWidth =
          Number(window.localStorage.getItem(SIDEBAR_WIDTH_KEY)) ||
          DEFAULT_SIDEBAR_WIDTH;
        savedSidebarCollapsed =
          window.localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === "true";
      } catch (error) {
        // Defaults apply when browser storage is unavailable.
      }
      setTheme(savedTheme);
      setSidebarWidth(savedSidebarWidth, false);
      setSuggestionsCollapsed(compactComposerMedia.matches);
      setSidebarCollapsed(
        sidebarMedia.matches ? true : savedSidebarCollapsed,
        false,
      );
      populateSolverChapters();
      setToolboxTab("wrongbook");
      lastSubmittedKnowledgeText = latestUserQuestion();
      renderQuestionKnowledge(lastSubmittedKnowledgeText);
      renderWrongBook();
      renderLearningProgress();
      saveMessages();
      renderSuggestions(DEFAULT_SUGGESTIONS);
      renderMessages();
      resizeInput();
      syncComposerState();
      chatForm.dataset.voiceAvailable = String(Boolean(BrowserSpeechRecognition));
      voiceInputButton.hidden = !BrowserSpeechRecognition;
      syncSpeechButtons();
    })();
  </script>
</body>
</html>
