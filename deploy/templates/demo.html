      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 0;
      border-radius: 6px;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 1.3rem;
      font-weight: 800;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy h1 {
      margin: 0;
      color: var(--ink);
      font-size: 1.04rem;
      line-height: 1.25;
    }

    .brand-copy p {
      margin: 2px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.77rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 9px;
    }

    .clear-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      color: var(--muted);
      background: transparent;
      font-size: 0.79rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .clear-button:hover {
      border-color: var(--line);
      color: var(--ink);
      background: var(--sidebar-hover);
    }

    .messages {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      padding: 26px 24px 20px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      background-color: var(--paper);
      background-image: linear-gradient(
        to bottom,
        transparent 0,
        transparent 34px,
        var(--paper-rule) 34px,
        var(--paper-rule) 35px
      );
      background-position: 0 10px;
      background-size: 100% 35px;
    }

    .messages[data-welcome-only="true"] {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-right: clamp(24px, 8vw, 96px);
      padding-left: clamp(24px, 8vw, 96px);
    }

    .message {
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: flex-start;
      gap: 9px;
      margin-bottom: 20px;
    }

    .message[data-role="user"] {
      flex-direction: row-reverse;
    }

    .avatar {
      display: grid;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      margin-top: 20px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 0.75rem;
      font-weight: 850;
    }

    .message[data-role="user"] .avatar {
      border: 1px solid var(--line-strong);
      color: var(--ink);
      background: var(--sidebar-bg);
    }

    .message-content {
      width: fit-content;
      max-width: min(84%, 760px);
      min-width: 0;
      flex: 0 1 auto;
    }

    .message-text .math-inline {
      white-space: nowrap;
    }

    .message-text .math-display {
      display: block;
      max-width: 100%;
      margin: 12px 0;
      overflow-x: auto;
      overscroll-behavior-x: contain;
    }

    .message-text .math-display .katex-display {
      margin: 0;
    }

    .message[data-role="user"] .message-content {
      display: flex;
      align-items: flex-end;
      flex-direction: column;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 18px;
      margin: 0 6px 5px;
      color: var(--muted);
      font-size: var(--font-xs);
      font-weight: 600;
    }

    .message-meta time {
      color: var(--muted);
      font-size: var(--font-xs);
      font-weight: 500;
    }

    .message[data-role="user"] .message-meta {
      justify-content: flex-end;
    }

    .message-actions {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      margin: 5px 6px 0;
    }

    .message[data-role="assistant"] .message-actions {
      justify-content: flex-start;
    }

    .message-action {
      min-height: 24px;
      padding: 2px 5px;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--muted);
      background: transparent;
      font-size: var(--font-xs);
      font-weight: 650;
    }

    .message-action:hover {
      border-color: var(--line);
      color: var(--ink);
      background: var(--sidebar-bg);
    }

    .message-action[data-bookmarked="true"] {
      border-color: var(--line-strong);
      color: var(--ink);
      background: var(--sidebar-active);
    }

    .message-action[data-speaking="true"] {
      border-color: var(--line-strong);
      color: var(--ink);
      background: var(--sidebar-active);
    }

    .bubble {
      max-width: 100%;
      min-width: 74px;
      margin: 0 2px;
      padding: 12px 14px;
      overflow: hidden;
      border: 0;
      border-radius: 6px;
      background: color-mix(in srgb, var(--surface) 78%, var(--paper));
      box-shadow: none;
    }

    .message[data-role="user"] .bubble {
      border: 1px solid color-mix(in srgb, var(--blue) 22%, var(--line));
      border-radius: 6px;
      color: var(--ink);
      background: color-mix(in srgb, var(--soft-blue) 58%, var(--surface));
      box-shadow: none;
    }

    .message[data-role="assistant"] .bubble {
      padding: 2px 4px 3px 0;
      background: transparent;
    }

    .message[data-intent="welcome"] {
      margin-bottom: 0;
    }

    .message[data-intent="welcome"] .message-content {
      width: min(560px, 100%);
      max-width: min(560px, 100%);
    }

    .message[data-intent="welcome"] .bubble {
      padding: 0;
      overflow: visible;
      background: transparent;
    }

    .welcome-message-text {
      margin: 0;
    }

    .welcome-message-lead {
      display: block;
      color: var(--ink);
      font-size: 1.08rem;
      font-weight: 760;
      line-height: 1.5;
    }

    .welcome-message-body {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.91rem;
      line-height: 1.75;
    }

    .solution-sheet {
      width: 100%;
      min-width: 0;
      overflow: hidden;
      border: 0;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(24, 33, 47, 0.052),
        0 10px 24px rgba(24, 33, 47, 0.038);
    }

    .message-stack {
      display: grid;
      min-width: 0;
      gap: 8px;
    }

    .solution-section {
      min-width: 0;
      padding: 15px 17px 16px;
      border-top: 1px solid color-mix(in srgb, var(--line) 76%, transparent);
    }

    .solution-section:first-child {
      border-top: 0;
    }

    .solution-section--result {
      background: color-mix(in srgb, var(--soft-blue) 48%, var(--surface));
    }

    .solution-section--reasoning {
      background: var(--surface);
    }

    .solution-section--knowledge {
      background: color-mix(in srgb, var(--paper) 72%, var(--surface));
    }

    .solution-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .solution-section-title {
      margin: 0;
      color: var(--ink);
      font-size: 0.84rem;
      font-weight: 850;
      line-height: 1.35;
    }

    .solution-section-tag {
      flex: 0 0 auto;
      padding: 2px 7px;
      border: 1px solid color-mix(in srgb, var(--line-strong) 76%, transparent);
      border-radius: 4px;
      color: var(--muted);
      background: color-mix(in srgb, var(--surface) 68%, transparent);
      font-size: 0.64rem;
      font-weight: 750;
      line-height: 1.45;
    }

    .solution-result-row {
      display: grid;
      min-width: 0;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: baseline;
      gap: 10px;
    }

    .solution-result-label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 750;
    }

    .solution-result-value {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 1.08rem;
      font-variant-numeric: tabular-nums;
      line-height: 1.45;
    }

    .solution-sheet .formula {
      margin: 12px 0 0;
      border-color: color-mix(in srgb, var(--line-strong) 72%, transparent);
      background: color-mix(in srgb, var(--surface) 72%, transparent);
    }

    .solution-sheet .function-plot {
      margin-top: 12px;
      background: color-mix(in srgb, var(--surface) 84%, transparent);
    }

    .solution-sheet .verdict {
      margin-top: 0;
    }

    .solution-reasoning {
      margin: 0;
      color: var(--ink);
      font-size: 0.81rem;
      line-height: 1.72;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .solution-reasoning .math-display {
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .solution-step-list {
      display: grid;
      gap: 9px;
    }

    .solution-step {
      display: grid;
      min-width: 0;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid color-mix(in srgb, var(--line) 68%, transparent);
      border-radius: 7px;
      background: color-mix(in srgb, var(--paper) 52%, var(--surface));
    }

    .solution-step--lead {
      border-color: color-mix(in srgb, var(--blue) 24%, var(--line));
      background: color-mix(in srgb, var(--soft-blue) 54%, var(--surface));
    }

    .solution-step-index {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--blue) 18%, var(--line));
      border-radius: 6px;
      color: var(--blue-dark);
      background: color-mix(in srgb, var(--surface) 86%, var(--soft-blue));
      font-size: 0.7rem;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .solution-step-body {
      min-width: 0;
      padding-top: 1px;
    }

    .solution-step-label {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-size: 0.72rem;
      font-weight: 850;
      line-height: 1.4;
    }

    .solution-step-text {
      margin: 0;
      color: var(--ink);
      font-size: 0.8rem;
      line-height: 1.68;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .solution-step-text .math-display {
      max-width: 100%;
      margin: 9px 0;
      overflow-x: auto;
      overscroll-behavior-x: contain;
    }

    .solution-step-text .math-display .katex-display {
      margin: 0;
    }

    .solution-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid color-mix(in srgb, var(--line) 76%, transparent);
      background: color-mix(in srgb, var(--paper) 78%, var(--surface));
    }

    .solution-action {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: var(--surface);
      font-size: 0.72rem;
      font-weight: 750;
      line-height: 1.35;
    }

    .solution-action:hover {
      border-color: color-mix(in srgb, var(--blue) 34%, var(--line));
      background: color-mix(in srgb, var(--soft-blue) 36%, var(--surface));
    }

    .solution-action--primary {
      border-color: var(--blue);
      color: #ffffff;
      background: var(--blue);
    }

    .solution-action--primary:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .solution-action[data-bookmarked="true"] {
      color: var(--blue-dark);
      background: color-mix(in srgb, var(--soft-blue) 66%, var(--surface));
    }

    .solution-action:disabled {
      border-color: var(--line);
      color: var(--disabled-ink);
      background: var(--disabled-bg);
      cursor: not-allowed;
      opacity: 0.68;
    }

    .solution-action svg {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .solution-knowledge-list {
      display: grid;
      gap: 0;
    }

    .solution-knowledge-item {
      padding: 10px 0;
      border-top: 1px solid color-mix(in srgb, var(--line) 76%, transparent);
    }

    .solution-knowledge-item:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .solution-knowledge-item:last-child {
      padding-bottom: 0;
    }

    .solution-knowledge-item strong {
      display: block;
      color: var(--ink);
      font-size: 0.75rem;
      font-weight: 850;
    }

    .solution-knowledge-item p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.6;
    }

    .message-text {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-attachments {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(108px, 1fr));
      gap: 7px;
      margin-bottom: 10px;
    }

    .message-attachments:last-child {
      margin-bottom: 0;
    }

    .message-attachment {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }

    .message[data-role="user"] .message-attachment {
      border-color: rgba(255, 255, 255, 0.36);
      background: rgba(255, 255, 255, 0.12);
    }

    .message-attachment img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: var(--media-placeholder);
    }

    .message-attachment-file {
      display: flex;
      min-height: 48px;
      align-items: center;
      gap: 7px;
      padding: 8px;
      font-size: 0.68rem;
      line-height: 1.35;
    }

    .message-attachment-file svg {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .message-attachment-file span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .formula {
      max-width: 100%;
      margin: 12px -14px 10px;
      padding: 13px 12px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      background: var(--sidebar-bg);
      text-align: center;
      -webkit-overflow-scrolling: touch;
    }

    .formula .katex {
      font-size: 1.18em;
      white-space: nowrap;
    }

    .formula .katex-display {
      min-width: max-content;
    }

    .function-plot {
      width: 100%;
      max-width: 100%;
      margin: 13px 0 4px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
    }

    .function-plot img {
      display: block;
      width: 100%;
      height: auto;
    }

    .verdict {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      margin-top: 11px;
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .verdict[data-state="correct"] {
      color: var(--ink);
      background: var(--sidebar-active);
    }

    .verdict[data-state="incorrect"] {
      color: var(--red);
      background: color-mix(in srgb, var(--red) 7%, var(--surface));
    }

    .calculation-details {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .calculation-details summary {
      width: fit-content;
      cursor: pointer;
      font-weight: 750;
    }

    .calculation-grid {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 5px 12px;
      margin: 8px 0 1px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .calculation-grid dt {
      color: var(--muted);
      font-size: 0.73rem;
      font-weight: 700;
    }

    .calculation-grid dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 0.76rem;
    }

    .teacher-thinking {
      display: flex;
      min-width: 220px;
      align-items: flex-start;
      gap: 10px;
      padding: 2px 0;
    }

    .teacher-thinking-mark {
      display: grid;
      flex: 0 0 26px;
      width: 26px;
      height: 26px;
      place-items: center;
      border-radius: 5px;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 0.86rem;
      font-weight: 800;
    }

    .teacher-thinking-copy strong,
    .teacher-thinking-copy span {
      display: block;
    }

    .teacher-thinking-copy strong {
      color: var(--ink);
      font-size: 0.79rem;
      font-weight: 800;
      line-height: 1.45;
    }

    .teacher-thinking-copy span {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.69rem;
      line-height: 1.45;
    }

    .teacher-thinking-copy::after {
      display: block;
      width: 76px;
      height: 3px;
      margin-top: 7px;
      border-radius: 1px;
      background: var(--line);
      content: "";
      animation: thinking-pulse 1.4s ease-in-out infinite;
      transform-origin: left center;
    }

    @keyframes thinking-pulse {
      0%,
      100% {
        opacity: 0.5;
        transform: scaleX(0.64);
      }

      50% {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .messages {
        scroll-behavior: auto;
      }

      .teacher-thinking-copy::after {
        animation-duration: 2s;
      }
    }

    .composer-area {
      width: 100%;
      flex: 0 0 auto;
      min-width: 0;
      padding: 0 20px max(16px, env(safe-area-inset-bottom));
      overflow: hidden;
      border-top: 0;
      background: var(--paper);
    }

    .suggestions-toolbar {
      display: flex;
      justify-content: flex-end;
      padding: 8px 2px 0;
    }

    .suggestions-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      padding: 3px 8px;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--muted);
      background: transparent;
      font-size: 0.7rem;
      font-weight: 650;
    }

    .suggestions-toggle:hover {
      border-color: var(--line);
      color: var(--ink);
      background: var(--sidebar-hover);
    }

    .suggestions-toggle-icon {
      display: block;
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
      transform: rotate(180deg);
      transition: transform 0.15s ease;
    }

    .composer-area[data-suggestions-collapsed="true"] .suggestions-toggle-icon {
      transform: rotate(0deg);
    }

    .suggestions {
      display: flex;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 2px 10px;
      overflow: visible;
    }

    .composer-area[data-suggestions-collapsed="true"] .suggestions {
      display: none;
    }

    .suggestions:empty {
      display: none;
    }

    .suggestion {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 6px;
      max-width: 100%;
      min-height: 30px;
      padding: 4px 10px 4px 9px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line) 76%, transparent);
      border-radius: 999px;
      color: var(--muted);
      background: color-mix(in srgb, var(--surface) 76%, var(--paper));
      font-size: 0.8rem;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.15s ease, border-color 0.15s ease,
        background-color 0.15s ease;
    }

    .suggestion:hover {
      border-color: color-mix(in srgb, var(--blue) 28%, var(--line));
      color: var(--ink);
      background: color-mix(in srgb, var(--soft-blue) 30%, var(--surface));
    }

    .suggestion:active {
      transform: none;
    }

    .suggestion-icon {
      display: block;
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .suggestion-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .composer {
      display: flex;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      flex-direction: column;
      gap: 8px;
      padding: 8px 8px 10px;
      border: 1px solid color-mix(in srgb, var(--line) 68%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 84%, var(--paper));
      box-shadow: none;
    }

    .composer-head {
      display: flex;
      min-height: 20px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 8px;
    }

    .composer-title {
      color: var(--ink);
      font-size: 0.72rem;
      font-weight: 800;
    }

    .composer-row {
      display: grid;
      min-width: 0;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      align-items: end;
      gap: 8px;
    }

    .composer-row[data-voice-available="false"] {
      grid-template-columns: minmax(0, 1fr) auto auto;
    }

    .image-file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .composer:focus-within {
      border-color: color-mix(in srgb, var(--blue) 58%, var(--line));
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--blue) 12%, transparent);
    }

    .chat-input {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      max-height: 132px;
      padding: 9px 8px 8px;
      overflow-y: auto;
      resize: none;
      border: 0;
      color: var(--ink);
      background: transparent;
      outline: none;
      line-height: 1.5;
    }

    .chat-input::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    .image-upload-button,
    .voice-input-button {
      display: grid;
      flex: 0 0 auto;
      width: 44px;
      min-height: 44px;
      padding: 0;
      place-items: center;
      border: 1px solid transparent;
      border-radius: var(--radius-control);
      color: var(--muted);
      background: transparent;
    }

    .image-upload-button:hover,
    .voice-input-button:hover {
      border-color: var(--line);
      color: var(--ink);
      background: var(--sidebar-hover);
    }

    .image-upload-button:active,
    .voice-input-button:active {
      transform: translateY(1px);
    }

    .image-upload-button:disabled,
    .voice-input-button:disabled {
      cursor: wait;
      opacity: 0.66;
    }

    .image-upload-button svg,
    .voice-input-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .image-upload-button[data-loading="true"] svg {
      animation: image-spin 0.9s linear infinite;
    }

    .voice-input-button[data-listening="true"] {
      border-color: var(--blue-dark);
      color: #ffffff;
      background: var(--blue);
    }

    .voice-input-button[data-listening="true"]:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    @keyframes image-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .voice-status {
      min-height: 18px;
      margin: -1px 8px 1px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 650;
      line-height: 1.45;
    }

    .voice-status:empty {
      display: none;
    }

    .voice-status[data-state="listening"] {
      color: var(--blue-dark);
    }

    .voice-status[data-state="success"] {
      color: var(--blue-dark);
    }

    .voice-status[data-state="error"] {
      color: var(--red);
    }

    .send-button {
      flex: 0 0 auto;
      min-width: 72px;
      min-height: 44px;
      padding: 8px 17px;
      border: 1px solid var(--blue);
      border-radius: 6px;
      color: #ffffff;
      background: var(--blue);
      font-weight: 800;
    }

    .send-button:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .send-button:active {
      transform: translateY(1px);
    }

    .send-button:disabled {
      cursor: not-allowed;
      border-color: var(--disabled-bg);
      color: var(--disabled-ink);
      background: var(--disabled-bg);
      opacity: 0.62;
    }

    html[data-theme="dark"] .chat-header,
    html[data-theme="dark"] .composer-area {
      background: color-mix(in srgb, var(--paper) 84%, var(--surface));
    }

    html[data-theme="dark"] .image-upload-button,
    html[data-theme="dark"] .voice-input-button,
    html[data-theme="dark"] .composer-image-preview {
      border-color: var(--line);
      background: var(--surface);
    }

    html[data-theme="dark"] .image-upload-button:hover,
    html[data-theme="dark"] .voice-input-button:hover {
      background: var(--soft-blue);
    }

    html[data-theme="dark"] .voice-input-button[data-listening="true"] {
      border-color: var(--blue-dark);
      color: #ffffff;
      background: var(--blue);
    }

    html[data-theme="dark"] .voice-status[data-state="success"] {
      color: var(--blue-dark);
    }

    html[data-theme="dark"] .voice-status[data-state="error"] {
      color: var(--red);
    }

    html[data-theme="dark"] .composer-image-preview[data-state="success"] {
      border-color: color-mix(in srgb, var(--blue) 38%, var(--line));
      background: color-mix(in srgb, var(--blue) 9%, var(--surface));
    }

    html[data-theme="dark"]
      .composer-image-preview[data-state="success"]
      .composer-image-copy
      span {
      color: var(--blue-ink);
    }

    html[data-theme="dark"] .messages {
      background-color: var(--paper);
    }

      html[data-theme="dark"] .suggestion {
        background: var(--surface);
      }

      html[data-theme="dark"] .bubble {
        background: color-mix(in srgb, var(--surface) 76%, var(--paper));
      }

    html[data-theme="dark"] .message[data-role="user"] .bubble {
      background: var(--blue);
    }

      html[data-theme="dark"] .formula {
        background: var(--sidebar-active);
      }

    html[data-theme="dark"] .message[data-role="user"] .avatar {
      background: var(--surface);
    }

    .section-heading,
    .history-time,
    .history-action,
    .toolbox-tab-count,
    .wrongbook-toolbar,
    .wrongbook-clear,
    .wrongbook-item-title,
    .wrongbook-item-meta,
    .wrongbook-answer summary,
    .wrongbook-answer-text,
    .wrongbook-item-actions button,
    .wrongbook-empty,
    .progress-metric span,
    .progress-streak,
    .progress-day,
    .progress-action,
    .progress-status,
    .toolbox-heading,
    .toolbox-heading span:last-child,
    .quick-caption,
    .related-knowledge-head,
    .related-knowledge-head span:last-child,
    .related-knowledge-empty,
    .knowledge-item,
    .knowledge-item strong,
    .knowledge-item p,
    .knowledge-source,
    .solver-entry,
    .topic-preset,
    .symbol-button,
    .topic-library > summary,
    .inline-solver-head p,
    .favorite-item,
    .composer-image-copy strong,
    .composer-image-copy span,
    .composer-image-question-count,
    .composer-image-question-command,
    .composer-image-question-option,
    .composer-image-review,
    .composer-image-status,
    .composer-image-clear,
    .message-meta,
    .message-meta time,
    .message-action,
    .message-attachment-file,
    .calculation-grid dt {
      font-size: var(--font-xs);
    }

    .toolbox-tab,
    .quick-tool-title,
    .suggestions-toggle {
      font-size: var(--font-sm);
    }

    .toolbox-tab-count {
      min-width: 22px;
      height: 22px;
    }

    .solver-field input:focus-visible,
    .solver-field select:focus-visible,
    .solver-field textarea:focus-visible,
    .quick-input:focus-visible,
    .quick-select:focus-visible,
    .toolbox-tab:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
      box-shadow: none;
    }

    .sidebar-resizer:focus-visible {
      outline: none;
      background: color-mix(in srgb, var(--focus-ring) 24%, transparent);
      box-shadow: inset 0 0 0 2px var(--focus-ring);
    }

    @media (hover: none) {
      .history-actions {
        position: static;
        align-items: center;
        padding-right: 6px;
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }

      .history-item .history-title {
        padding-right: 0;
      }

      .toolbox-tab,
      .progress-action {
        min-height: 44px;
      }
    }

    @media (max-width: 820px) {
      .app-shell {
        min-height: 0;
      }

      .sidebar {
        position: fixed;
        z-index: 30;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(86vw, 340px);
        flex-basis: auto;
        border-right: 1px solid var(--line);
        box-shadow: none;
        transform: translateX(0);
        transition: transform 0.2s ease;
      }

      .app-shell[data-sidebar-collapsed="true"] .sidebar {
        width: min(86vw, 340px);
        border-right: 1px solid var(--line);
        transform: translateX(-104%);
      }

      .sidebar-inner {
        width: 100%;
      }

      .sidebar-resizer {
        display: none;
      }

      .sidebar-scrim {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: block;
        border: 0;
        background: var(--scrim);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .app-shell[data-sidebar-collapsed="false"] .sidebar-scrim {
        opacity: 1;
        pointer-events: auto;
      }

      .conversation-panel {
        display: none;
      }

      .toolbox-tab,
      .progress-action {
        min-height: 44px;
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        width: 100%;
        border: 0;
      }

      .chat-header {
        width: 100%;
        min-width: 0;
        min-height: 70px;
        padding: 11px 14px;
      }

      .brand-mark {
        flex-basis: 38px;
        width: 38px;
        height: 38px;
      }

      .brand-copy h1 {
        font-size: 0.98rem;
      }

      .brand-copy p,
      .clear-button {
        display: none;
      }

      .brand {
        flex: 1 1 auto;
        min-width: 0;
        gap: 8px;
      }

      .brand-copy {
        overflow: hidden;
      }

      .brand-copy h1 {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .header-actions {
        flex: 0 0 auto;
        gap: 6px;
      }

      .messages {
        max-width: 100%;
        padding: 22px 12px 16px;
      }

      .message {
        gap: 7px;
        margin-bottom: 20px;
      }

      .avatar {
        flex-basis: 30px;
        width: 30px;
        height: 30px;
        font-size: 0.73rem;
      }

      .message-content {
        width: auto;
        max-width: calc(100% - 37px);
      }

      .bubble {
        padding: 10px 12px;
      }

      .formula {
        margin-right: -12px;
        margin-left: -12px;
      }

      .composer-area {
        max-width: 100%;
        padding: 0 10px max(12px, env(safe-area-inset-bottom));
      }

      .suggestions {
        padding-top: 10px;
        padding-bottom: 8px;
      }

      .composer-row {
        grid-template-columns: minmax(0, 1fr) 44px 44px 54px;
        gap: 6px;
      }

      .composer-row[data-voice-available="false"] {
        grid-template-columns: minmax(0, 1fr) 44px 54px;
      }

      .send-button {
        min-width: 54px;
        padding-right: 8px;
        padding-left: 8px;
      }

      .solver-dialog {
        width: calc(100vw - 16px);
        max-height: calc(100dvh - 16px);
        border-radius: 8px;
      }

      .solver-shell {
        max-height: calc(100dvh - 16px);
      }

      .solver-header,
      .solver-body,
      .solver-footer {
        padding-right: 14px;
        padding-left: 14px;
      }

      .solver-grid {
        grid-template-columns: 1fr;
      }

      .solver-field.is-wide {
        grid-column: auto;
      }

      .solver-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .solver-actions {
        justify-content: flex-end;
      }

      .send-button {
        min-width: 54px;
        padding-right: 8px;
        padding-left: 8px;
      }
    }

    @media (max-width: 360px) {
      .chat-input {
        font-size: 0.875rem;
      }
    }

    @media (hover: none), (max-width: 820px) {
      .sidebar-rail-button,
      .icon-button,
      .conversation-panel-head .new-chat-icon,
      .history-select,
      .history-action,
      .toolbox-tab,
      .wrongbook-clear,
      .wrongbook-answer summary,
      .wrongbook-item-actions button,
      .progress-action,
      .theme-button,
      .quick-input,
      .quick-select,
      .quick-calculate,
      .toolbox-more-toggle,
      .solver-entry,
      .topic-preset,
      .symbol-button,
      .topic-library > summary,
      .favorite-item,
      .solver-field input,
      .solver-field select,
      .solver-button,
      .suggestions-toggle,
      .suggestion,
      .chat-input,
      .image-upload-button,
      .voice-input-button,
      .send-button,
      .composer-image-question-command,
      .composer-image-question-option,
      .composer-image-review,
      .composer-image-clear,
      .message-action,
      .calculation-details summary {
        min-height: 44px;
      }

      .wrongbook-clear {
        min-width: 44px;
      }

      .icon-button,
      .conversation-panel-head .new-chat-icon,
      .image-upload-button,
      .voice-input-button,
      .composer-image-remove {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
      }

      .composer-image-question-option input {
        width: 18px;
        height: 18px;
      }

      .avatar {
        font-size: var(--font-xs);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .voice-input-button[data-listening="true"] {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell" data-sidebar-collapsed="false">
    <aside class="sidebar" id="sidebar" aria-label="会话与工具">
      <div class="sidebar-inner">
        <nav class="sidebar-rail" aria-label="侧边栏快捷入口">
          <button
            class="sidebar-rail-button"
            type="button"
            data-sidebar-toggle
            aria-label="展开侧边栏"
            title="展开侧边栏"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
          <button
            class="sidebar-rail-button"
            type="button"
            data-rail-tab="wrongbook"
            aria-current="true"
            aria-label="错题集"
            title="错题集"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3h12v18H6z"></path>
              <path d="M9 8h6"></path>
              <path d="M9 12h6"></path>
              <path d="m9 16 1.5 1.5L14 14"></path>
            </svg>
          </button>
          <button
            class="sidebar-rail-button"
            type="button"
            data-rail-tab="progress"
            aria-current="false"
            aria-label="学习进度"
            title="学习进度"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 19V5"></path>
              <path d="M4 19h16"></path>
              <path d="m7 15 3-3 3 2 5-6"></path>
            </svg>
          </button>
        </nav>

        <div class="sidebar-top">
          <div class="sidebar-brand">
            <span class="sidebar-logo" aria-hidden="true">π</span>
            <span>知微高数</span>
          </div>
          <button
            class="icon-button"
            type="button"
            data-sidebar-toggle
            aria-label="折叠侧边栏"
            title="折叠侧边栏"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>
        </div>

        <div class="toolbox-scroll">
          <section
            class="related-knowledge"
            id="questionKnowledge"
            aria-label="本题知识点"
          >
            <div class="related-knowledge-head">
              <span>本题知识点</span>
              <span id="questionKnowledgeStatus">等待题目</span>
            </div>
            <div
              class="related-knowledge-list"
              id="questionKnowledgeList"
              aria-live="polite"
            ></div>
          </section>

          <div class="toolbox-tabs" role="tablist" aria-label="学习工具">
            <button
              class="toolbox-tab"
              type="button"
              role="tab"
              aria-selected="true"
              data-toolbox-tab="wrongbook"
            >错题集 <span
                class="toolbox-tab-count"
                id="wrongBookTabCount"
              >0</span></button>
            <button
              class="toolbox-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-toolbox-tab="progress"
            >学习进度</button>
          </div>

          <div
            class="toolbox-panel"
            data-toolbox-panel="wrongbook"
            data-active="true"
          >
            <section class="toolbox-section">
              <div class="toolbox-heading">
                <span>错题集</span>
                <span id="wrongBookCount">0 题</span>
              </div>
              <div class="wrongbook-toolbar">
                <span>浏览器本地保存，可反复练习</span>
                <button
                  class="wrongbook-clear"
                  id="wrongBookExport"
                  type="button"
                >&#23548;&#20986;</button>
                <button
                  class="wrongbook-clear"
                  id="wrongBookClear"
                  type="button"
                >清空</button>
              </div>
              <div class="wrongbook-list" id="wrongBookList"></div>
              <div class="wrongbook-empty" id="wrongBookEmpty">
                解答完成后，如果你确认这是需要复习的错题，可在答案下方加入。
              </div>
            </section>
          </div>

          <div
            class="toolbox-panel"
            data-toolbox-panel="progress"
            data-active="false"
          >
            <section class="toolbox-section">
              <div class="toolbox-heading">
                <span>学习进度</span>
                <span id="learningProgressUpdated">尚未开始</span>
              </div>
              <div
                class="learning-progress-summary"
                aria-label="学习进度摘要"
              >
                <div class="progress-metric">
                  <strong id="learningProgressQuestions">0</strong>
                  <span>完成题目</span>
                </div>
                <div class="progress-metric">
                  <strong id="learningProgressCalculations">0</strong>
                  <span>工具计算</span>
                </div>
                <div class="progress-metric">
                  <strong id="learningProgressPractice">0</strong>
                  <span>错题重练</span>
                </div>
                <div class="progress-metric">
                  <strong id="learningProgressWrongBook">0</strong>
                  <span>加入错题集</span>
                </div>
              </div>
              <div class="progress-streak">
                <span>连续学习 <strong id="learningProgressStreak">0</strong> 天</span>
                <span>共学习 <strong id="learningProgressDays">0</strong> 天</span>
              </div>
              <div
                class="progress-days"
                id="learningProgressDaysList"
                aria-label="最近七天学习记录"
              ></div>
              <div class="progress-actions">
                <button
                  class="progress-action primary"
                  id="learningProgressExport"
                  type="button"
                >导出报告</button>
                <button
                  class="progress-action"
                  id="learningProgressBackup"
                  type="button"
                >备份数据</button>
                <button
                  class="progress-action"
                  id="learningProgressMerge"
                  type="button"
                >合并导入</button>
                <button
                  class="progress-action"
                  id="learningProgressOverwrite"
                  type="button"
                >覆盖导入</button>
              </div>
              <input
                id="learningProgressImportInput"
                type="file"
                accept=".json,application/json"
                class="sr-only"
                tabindex="-1"
              >
              <p
                class="progress-status"
                id="learningProgressStatus"
                role="status"
              >报告用于查看，数据备份用于以后恢复。</p>
            </section>
          </div>
        </div>

        <div class="sidebar-footer">
          <button class="theme-button" id="themeToggle" type="button">
            <span class="theme-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8"></circle>
                <path d="M12 4v16"></path>
              </svg>
            </span>
            <span id="themeLabel">切换深色主题</span>
          </button>
        </div>
      </div>
      <div
        class="sidebar-resizer"
        id="sidebarResizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整侧边栏宽度"
        tabindex="0"
      ></div>
    </aside>
    <button
      class="sidebar-scrim"
      id="sidebarScrim"
      type="button"
      aria-label="关闭侧边栏"
      tabindex="-1"
    ></button>

    <aside class="conversation-panel" id="conversationPanel" aria-label="会话列表">
      <div class="conversation-panel-head">
        <span class="conversation-panel-title">会话</span>
        <div class="conversation-panel-actions">
          <button
            class="icon-button new-chat-icon"
            id="newChatButton"
            type="button"
            aria-label="新建会话"
            title="新建会话"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14"></path>
              <path d="M5 12h14"></path>
            </svg>
          </button>
          <button
            class="icon-button"
            id="conversationPanelToggle"
            type="button"
            aria-label="收起会话列表"
            title="收起会话列表"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>
        </div>
      </div>

      <section class="sidebar-section" aria-labelledby="historyHeading">
        <div class="section-heading" id="historyHeading">
          <span>历史对话</span>
          <span id="historyCount">0</span>
        </div>
        <div class="history-list" id="historyList"></div>
      </section>
    </aside>

    <div class="chat-layout">
      <header class="chat-header">
        <div class="brand">
          <button
            class="icon-button"
            id="sidebarToggle"
            type="button"
            data-sidebar-toggle
            aria-label="展开或折叠侧边栏"
            title="展开或折叠侧边栏"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 17h16"></path>
            </svg>
          </button>
          <div class="brand-mark" aria-hidden="true">∫</div>
          <div class="brand-copy">
            <h1>知微老师</h1>
            <p>高等数学学习伙伴</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="clear-button" id="clearButton" type="button">清空对话</button>
        </div>
      </header>

      <div class="workspace-body">
        <main
          class="messages"
          id="messageList"
          aria-label="知微老师对话记录"
          aria-live="polite"
        ></main>

      </div>

      <footer class="composer-area" data-suggestions-collapsed="false">
        <div class="suggestions-toolbar">
          <button
            class="suggestions-toggle"
            id="suggestionsToggle"
            type="button"
            aria-controls="suggestions"
            aria-expanded="true"
            title="收起快捷入口"
          >
            <svg class="suggestions-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 15 6-6 6 6"></path>
            </svg>
            <span id="suggestionsToggleLabel">收起快捷入口</span>
          </button>
        </div>
        <div class="suggestions" id="suggestions" aria-label="常用学习入口"></div>
        <form class="composer" id="chatForm">
          <div class="composer-head">
            <span class="composer-title">今天的草稿纸</span>
          </div>
          <div
            class="composer-image-preview"
            id="composerImagePreview"
            hidden
          >
            <div
              class="composer-image-list"
              id="composerImageList"
              aria-label="待发送题目图片"
            ></div>
            <div class="composer-image-footer">
              <span
                class="composer-image-status"
                id="composerImageStatus"
                role="status"
                aria-live="polite"
              ></span>
              <button

      function normalizeMessages(value) {
        if (!Array.isArray(value)) {
          return [];
        }
        return value
          .filter((item) => item && (item.role === "user" || item.role === "assistant"))
          .slice(-MAX_STORED_MESSAGES)
          .map((item) => {
            const text = String(item.text || "");
            const intent = String(item.intent || "");
            const legacyWelcome =
              intent === "welcome" && !WELCOME_TEXTS.includes(text);
            const normalizedWelcomeText = legacyWelcome
              ? WELCOME_TEXTS[0]
              : text;
            const welcomeParts = intent === "welcome"
              ? welcomeMessageParts(normalizedWelcomeText)
              : { lead: "", body: "" };
            return {
              id: String(item.id || makeId()),
              role: item.role,
              text: normalizedWelcomeText,
              intent,
              welcomeLead: legacyWelcome
                ? welcomeParts.lead
                : String(item.welcomeLead || welcomeParts.lead),
              welcomeBody: legacyWelcome
                ? welcomeParts.body
                : String(item.welcomeBody || welcomeParts.body),
              formulaLatex: String(item.formulaLatex || ""),
              formulaText: String(item.formulaText || ""),
              resultLabel: String(item.resultLabel || ""),
              resultValue: String(item.resultValue || ""),
              verdict: typeof item.verdict === "boolean" ? item.verdict : null,
              plotUrl: String(item.plotUrl || ""),
              attachments: Array.isArray(item.attachments)
                ? item.attachments
                  .slice(0, MAX_QUESTION_IMAGE_COUNT)
                  .map((attachment) => ({
                    name: String(
                      (attachment && attachment.name) || "题目图片",
                    ),
                    previewUrl: String(
                      (attachment && attachment.previewUrl) || "",
                    ).startsWith("blob:")
                      ? ""
                      : String((attachment && attachment.previewUrl) || ""),
                  }))
                : [],
              createdAt: String(item.createdAt || currentTime()),
            };
          });
      }

      function messagesForStorage(value) {
        return value.map((message) => ({
          ...message,
          attachments: Array.isArray(message.attachments)
            ? message.attachments.map((attachment) => ({
                name: String(
                  (attachment && attachment.name) || "题目图片",
                ),
              }))
            : [],
        }));
      }

      function loadConversations() {
        try {
          const parsed = JSON.parse(
            window.localStorage.getItem(CONVERSATIONS_KEY) || "[]",
          );
          if (!Array.isArray(parsed)) {
            return [];
          }
          return parsed
            .filter((item) => item && item.id)
            .slice(0, MAX_CONVERSATIONS)
            .map((item) => ({
              id: String(item.id),
              title: String(item.title || "历史对话"),
              renamed: Boolean(item.renamed),
              updatedAt: Number(item.updatedAt) || Date.now(),
              messages: normalizeMessages(item.messages),
            }));
        } catch (error) {
          return [];
        }
      }

      function persistConversations() {
        try {
          window.localStorage.setItem(
            CONVERSATIONS_KEY,
            JSON.stringify(conversations.slice(0, MAX_CONVERSATIONS)),
          );
        } catch (error) {
          // Conversation history remains optional when browser storage is unavailable.
        }
      }

      function makeId() {
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function sessionId() {
        try {
          let value = window.localStorage.getItem(SESSION_KEY);
          if (!value) {
            value =
              window.crypto && window.crypto.randomUUID
                ? window.crypto.randomUUID()
                : `session-${makeId()}`;
            window.localStorage.setItem(SESSION_KEY, value);
          }
          return value;
        } catch (error) {
          return "session-fallback";
        }
      }
