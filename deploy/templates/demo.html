      function knowledgeMatchScore(text, rule) {
        let score = 0;
        rule.keywords.forEach((keyword) => {
          const normalizedKeyword = String(keyword).toLowerCase();
          if (normalizedKeyword && text.includes(normalizedKeyword)) {
            score += Math.max(2, Math.min(6, normalizedKeyword.length));
          }
        });
        (rule.patterns || []).forEach((pattern) => {
          if (pattern.test(text)) {
            score += 7;
          }
        });
        return score;
      }

      function localMatchedQuestionKnowledge(rawText) {
        const text = String(rawText || "").trim().toLowerCase();
        if (!text) {
          return [];
        }
        return QUESTION_KNOWLEDGE_RULES
          .map((rule) => ({
            rule,
            score: knowledgeMatchScore(text, rule),
          }))
          .filter((item) => item.score > 0)
          .sort((left, right) => right.score - left.score)
          .slice(0, 3)
          .map((item) => item.rule);
      }

      function serverKnowledgeMatches(payload) {
        const results = Array.isArray(payload && payload.results)
          ? payload.results
          : [];
        return results
          .slice(0, 3)
          .map((result, index) => {
            const points = Array.isArray(result && result.points)
              ? result.points
                .map((point) => String(point || "").trim())
                .filter(Boolean)
              : [];
            const excerpt = String(
              (result && result.excerpt) || "",
            ).trim();
            return {
              id: String((result && result.id) || `server-${index}`),
              title: String(
                (result && result.title) || excerpt || "知识点",
              ),
              chapter: String((result && result.chapter) || ""),
              source: String((result && result.source) || ""),
              points: points.length ? points : [excerpt].filter(Boolean),
              origin: "server",
            };
          })
          .filter((result) => result.title);
      }

      async function fetchQuestionKnowledge(rawText, signal) {
        const text = String(rawText || "").trim();
        const localMatches = localMatchedQuestionKnowledge(text);
        if (!text) {
          return localMatches;
        }

        const timeoutId = window.setTimeout(
          () => signal.abort(),
          KNOWLEDGE_API_TIMEOUT_MS,
        );
        try {
          const response = await fetch(KNOWLEDGE_API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ query: text, limit: 3 }),
            signal,
          });
          if (!response.ok) {
            return localMatches;
          }
          const data = await response.json();
          const remoteMatches = serverKnowledgeMatches(data);
          return remoteMatches.length ? remoteMatches : localMatches;
        } catch (error) {
          return localMatches;
        } finally {
          window.clearTimeout(timeoutId);
        }
      }

      async function renderQuestionKnowledge(rawText, options = {}) {
        if (!questionKnowledgeList || !questionKnowledgeStatus) {
          return;
        }
        const text = String(rawText || "").trim();
        const requestId = ++knowledgeRequestSerial;
        if (knowledgeAbortController) {
          knowledgeAbortController.abort();
        }
        const controller = new AbortController();
        knowledgeAbortController = controller;
        const fragment = document.createDocumentFragment();
        const matches = await fetchQuestionKnowledge(text, controller.signal);
        if (requestId !== knowledgeRequestSerial) {
          return;
        }
        if (!text) {
          questionKnowledgeStatus.textContent = "等待题目";
          questionKnowledge.dataset.state = "empty";
          fragment.append(
            element(
              "div",
              "related-knowledge-empty",
              "输入题目后，这里会显示与当前问题相关的知识点。",
            ),
          );
        } else if (!matches.length) {
          questionKnowledgeStatus.textContent = "识别题型";
          questionKnowledge.dataset.state = "generic";
          const item = element("article", "knowledge-item");
          item.append(
            element("strong", "", "审题与验证"),
            element(
              "p",
              "",
              "先明确已知条件、目标量和所求形式；计算后再用代入或量纲检查结果。",
            ),
          );
          fragment.append(item);
        } else {
          questionKnowledgeStatus.textContent =
            options.source === "input"
              ? `正在匹配 ${matches.length} 个知识点`
              : `已匹配 ${matches.length} 个知识点`;
          questionKnowledge.dataset.state = "ready";
          matches.forEach((rule) => {
            const item = element("article", "knowledge-item");
            item.dataset.knowledgeId = rule.id;
            item.append(element("strong", "", rule.title));
            if (rule.origin === "server") {
              const source = [rule.chapter, rule.source]
                .filter(Boolean)
                .join(" / ");
              if (source) {
                item.append(element("span", "knowledge-source", source));
              }
            }
            (rule.points || []).forEach((point) => {
              item.append(element("p", "", point));
            });
            fragment.append(item);
          });
        }
        questionKnowledgeList.replaceChildren(fragment);
      }

      function queueQuestionKnowledgeUpdate(rawText) {
        window.clearTimeout(knowledgeDebounceId);
        knowledgeDebounceId = window.setTimeout(() => {
          const text = String(rawText || "").trim();
          renderQuestionKnowledge(
            text || lastSubmittedKnowledgeText,
            { source: text ? "input" : "saved" },
          );
        }, 180);
      }

      function toggleWrongBook(messageId) {
        const message = messages.find(
          (item) => item.id === messageId && item.role === "user",
        );
        if (!message || !messageCanJoinWrongBook(message)) {
          return;
        }
        const existingIndex = wrongBook.findIndex(
          (item) =>
            (message.id && item.sourceMessageId === message.id)
            || item.text === message.text.trim(),
        );
        if (existingIndex !== -1) {
          if (!window.confirm("确认从错题集移除这道题吗？")) {
            return;
          }
          wrongBook.splice(existingIndex, 1);
        } else {
          if (
            !window.confirm(
              "确认这是一道需要收录的错题吗？加入后可在错题集里重练。",
            )
          ) {
            return;
          }
          wrongBook.unshift({
            id: makeId(),
            text: message.text.trim(),
            answer: wrongBookAnswerFor(message.id),
            createdAt: Date.now(),
            lastPracticedAt: 0,
            practiceCount: 0,
            sourceConversationId: activeConversationId,
            sourceMessageId: message.id,
          });
          wrongBook = wrongBook.slice(0, MAX_WRONG_BOOK_ITEMS);
        }
        saveWrongBook();
        renderWrongBook();
        syncLearningProgressWrongBookCount();
        renderMessages();
      }

      function practiceWrongBookItem(itemId) {
        if (requestInFlight) {
          return;
        }
        const item = wrongBook.find((entry) => entry.id === itemId);
        if (!item) {
          return;
        }
        item.practiceCount += 1;
        item.lastPracticedAt = Date.now();
        saveWrongBook();
        renderWrongBook();
        recordLearningActivity("practice");
        if (sidebarMedia.matches) {
          setSidebarCollapsed(true);
        }
        sendMessage(item.text);
      }

      function deleteWrongBookItem(itemId) {
        wrongBook = wrongBook.filter((item) => item.id !== itemId);
        saveWrongBook();
        renderWrongBook();
        syncLearningProgressWrongBookCount();
        renderMessages();
      }

      function clearWrongBook() {
        if (!wrongBook.length) {
          return;
        }
        wrongBook = [];
        saveWrongBook();
        renderWrongBook();
        syncLearningProgressWrongBookCount();
        renderMessages();
      }

      function exportWrongBook() {
        if (!wrongBook.length) {
          return;
        }
        const blocks = wrongBook
          .slice()
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
          .map((item, index) => {
            const lines = [
              `${index + 1}. ${item.text}`,
              `收藏时间：${formatWrongBookDate(item.createdAt) || "-"}`,
              `练习次数：${item.practiceCount || 0}`,
            ];
            const answer = String(item.answer || "").trim();
            if (answer) {
              lines.push(`参考答案：${answer}`);
            }
            return lines.join("\n");
          });
        const header = `知微高数错题集（共 ${wrongBook.length} 题，导出于 ${formatWrongBookDate(Date.now())}）`;
        const blob = new Blob([`${header}\n\n${blocks.join("\n\n")}\n`], {
          type: "text/plain;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `知微高数错题集-${new Date().toISOString().slice(0, 10)}.txt`;
        document.body.append(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function clampProgressCount(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) {
          return 0;
        }
        return Math.min(
          MAX_PROGRESS_COUNT,
          Math.max(0, Math.round(number)),
        );
      }

      function clampProgressTimestamp(value) {
        const number = Number(value);
        if (!Number.isFinite(number) || number < 0) {
          return 0;
        }
        return Math.min(MAX_PROGRESS_TIMESTAMP, Math.round(number));
      }

      function localDateKey(value = Date.now()) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "";
        }
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function isValidProgressDate(value) {
        const text = String(value || "");
        if (!/^\d{4}-\d{2}-\d{2}$/.test(text)) {
          return false;
        }
        return localDateKey(`${text}T12:00:00`) === text;
      }

      function createDefaultLearningProgress() {
        return {
          version: LEARNING_PROGRESS_VERSION,
          updatedAt: 0,
          questionCount: 0,
          calculationCount: 0,
          practiceCount: 0,
          wrongBookSavedCount: 0,
          studyDays: [],
          dailyCounts: {},
        };
      }

      function normalizeLearningProgress(value) {
        const source = value
          && typeof value === "object"
          && !Array.isArray(value)
          && value.progress
          && typeof value.progress === "object"
          && !Array.isArray(value.progress)
          ? value.progress
          : value;

        if (
          !source
          || typeof source !== "object"
          || Array.isArray(source)
        ) {
          throw new Error("进度文件内容无法识别。");
        }
        if (
          value
          && value.format
          && value.format !== LEARNING_PROGRESS_FORMAT
        ) {
          throw new Error("这不是知微高数学习进度文件。");
        }

        const version = Number(source.version);
        if (
          Number.isFinite(version)
          && version !== LEARNING_PROGRESS_VERSION
        ) {
          throw new Error("进度文件版本不受支持。");
        }

        const progress = createDefaultLearningProgress();
        progress.updatedAt = clampProgressTimestamp(source.updatedAt);
        progress.questionCount = clampProgressCount(source.questionCount);
        progress.calculationCount = clampProgressCount(
          source.calculationCount,
        );
        progress.practiceCount = clampProgressCount(source.practiceCount);
        progress.wrongBookSavedCount = clampProgressCount(
          source.wrongBookSavedCount,
        );

        const rawDailyCounts = (
          source.dailyCounts
          && typeof source.dailyCounts === "object"
          && !Array.isArray(source.dailyCounts)
        )
          ? source.dailyCounts
          : {};
        const studyDays = new Set();

        if (Array.isArray(source.studyDays)) {
          source.studyDays.forEach((day) => {
            const text = String(day || "");
            if (isValidProgressDate(text)) {
              studyDays.add(text);
            }
          });
        }
        Object.entries(rawDailyCounts).forEach(([day, count]) => {
          const text = String(day || "");
          if (!isValidProgressDate(text)) {
            return;
          }
          const normalizedCount = clampProgressCount(count);
          if (normalizedCount > 0) {
            progress.dailyCounts[text] = normalizedCount;
            studyDays.add(text);
          }
        });

        progress.studyDays = [...studyDays]
          .sort()
          .slice(-MAX_PROGRESS_DAYS);
        const retainedDays = new Set(progress.studyDays);
        Object.keys(progress.dailyCounts).forEach((day) => {
          if (!retainedDays.has(day)) {
            delete progress.dailyCounts[day];
          }
        });
        return progress;
      }

      function loadLearningProgress() {
        try {
          const parsed = JSON.parse(
            window.localStorage.getItem(LEARNING_PROGRESS_KEY) || "null",
          );
          return parsed
            ? normalizeLearningProgress(parsed)
            : createDefaultLearningProgress();
        } catch (error) {
          return createDefaultLearningProgress();
        }
      }

      function saveLearningProgress() {
        try {
          window.localStorage.setItem(
            LEARNING_PROGRESS_KEY,
            JSON.stringify(normalizeLearningProgress(learningProgress)),
          );
        } catch (error) {
          // Progress remains available in memory for this page.
        }
      }

      function learningProgressStreakValue() {
        const today = new Date();
        today.setHours(12, 0, 0, 0);
        const todayKey = localDateKey(today);
        let cursor = new Date(today);
        if (!(learningProgress.dailyCounts[todayKey] > 0)) {
          cursor.setDate(cursor.getDate() - 1);
        }

        let streak = 0;
        while (streak < MAX_PROGRESS_DAYS) {
          const key = localDateKey(cursor);
          if (!(learningProgress.dailyCounts[key] > 0)) {
            break;
          }
          streak += 1;
          cursor.setDate(cursor.getDate() - 1);
        }
        return streak;
      }

      function recentProgressDateKeys() {
        const keys = [];
        const cursor = new Date();
        cursor.setHours(12, 0, 0, 0);
        for (let offset = 6; offset >= 0; offset -= 1) {
          const date = new Date(cursor);
          date.setDate(date.getDate() - offset);
          keys.push(localDateKey(date));
        }
        return keys;
      }

      function renderLearningProgress() {
        if (!learningProgressDaysList) {
          return;
        }
        const progress = normalizeLearningProgress(learningProgress);
        learningProgressQuestions.textContent = String(
          progress.questionCount,
        );
        learningProgressCalculations.textContent = String(
          progress.calculationCount,
        );
        learningProgressPractice.textContent = String(
          progress.practiceCount,
        );
        learningProgressWrongBook.textContent = String(wrongBook.length);
        learningProgressStreak.textContent = String(
          learningProgressStreakValue(),
        );
        learningProgressDays.textContent = String(
          progress.studyDays.length,
        );
        learningProgressUpdated.textContent = progress.updatedAt
          ? `最近 ${new Date(progress.updatedAt).toLocaleString("zh-CN", {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          })}`
          : "尚未开始";

        const dateKeys = recentProgressDateKeys();
        const maxCount = Math.max(
          1,
          ...dateKeys.map(
            (key) => clampProgressCount(progress.dailyCounts[key]),
          ),
        );
        const fragment = document.createDocumentFragment();
        dateKeys.forEach((key) => {
          const count = clampProgressCount(progress.dailyCounts[key]);
          const row = element("div", "progress-day");
          const date = new Date(`${key}T12:00:00`);
          const label = date.toLocaleDateString("zh-CN", {
            month: "2-digit",
            day: "2-digit",
          });
          const track = element("div", "progress-day-track");
          const fill = element("div", "progress-day-fill");
          fill.style.setProperty(
            "--progress-width",
            `${Math.round((count / maxCount) * 100)}%`,
          );
          track.append(fill);
          row.append(
            element("span", "", label),
            track,
            element("span", "progress-day-count", String(count)),
          );
          fragment.append(row);
        });
        learningProgressDaysList.replaceChildren(fragment);
      }

      function setLearningProgressStatus(message, state = "") {
        if (!learningProgressStatus) {
          return;
        }
        learningProgressStatus.textContent = message;
        if (state) {
          learningProgressStatus.dataset.state = state;
        } else {
          learningProgressStatus.removeAttribute("data-state");
        }
      }

      function recordLearningActivity(kind, amount = 1) {
        const fields = {
          question: "questionCount",
          calculation: "calculationCount",
          practice: "practiceCount",
        };
        const field = fields[kind];
        if (!field) {
          return;
        }

        const increment = Math.max(1, Math.round(Number(amount) || 1));
        learningProgress[field] = clampProgressCount(
          learningProgress[field] + increment,
        );
        const day = localDateKey();
        learningProgress.dailyCounts[day] = clampProgressCount(
          (learningProgress.dailyCounts[day] || 0) + increment,
        );
        if (!learningProgress.studyDays.includes(day)) {
          learningProgress.studyDays.push(day);
        }
        learningProgress.studyDays = learningProgress.studyDays
          .filter(isValidProgressDate)
          .sort()
          .slice(-MAX_PROGRESS_DAYS);
        learningProgress.updatedAt = Date.now();
        saveLearningProgress();
        renderLearningProgress();
      }

      function syncLearningProgressWrongBookCount() {
        learningProgress.wrongBookSavedCount = wrongBook.length;
        learningProgress.updatedAt = Date.now();
        saveLearningProgress();
        renderLearningProgress();
      }

      function mergeLearningProgress(currentValue, importedValue) {
        const current = normalizeLearningProgress(currentValue);
        const imported = normalizeLearningProgress(importedValue);
        current.updatedAt = Math.max(
          current.updatedAt,
          imported.updatedAt,
        );
        current.questionCount = Math.max(
          current.questionCount,
          imported.questionCount,
        );
        current.calculationCount = Math.max(
          current.calculationCount,
          imported.calculationCount,
        );
        current.practiceCount = Math.max(
          current.practiceCount,
          imported.practiceCount,
        );
        current.wrongBookSavedCount = Math.max(
          current.wrongBookSavedCount,
          imported.wrongBookSavedCount,
        );

        const days = new Set([
          ...current.studyDays,
          ...imported.studyDays,
        ]);
        current.studyDays = [...days]
          .filter(isValidProgressDate)
          .sort()
          .slice(-MAX_PROGRESS_DAYS);
        const retainedDays = new Set(current.studyDays);
        Object.keys(current.dailyCounts).forEach((day) => {
          if (!retainedDays.has(day)) {
            delete current.dailyCounts[day];
          }
        });
        Object.entries(imported.dailyCounts).forEach(([day, count]) => {
          if (!retainedDays.has(day)) {
            return;
          }
          current.dailyCounts[day] = Math.max(
            current.dailyCounts[day] || 0,
            count,
          );
        });
        return normalizeLearningProgress(current);
      }

      function triggerProgressDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function formatProgressReportDateTime(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "暂无记录";
        }
        return date.toLocaleString("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      }

          .join("");
        const report = `<!doctype html>

      function exportLearningProgressBackup() {
        learningProgress.wrongBookSavedCount = wrongBook.length;
        const normalized = normalizeLearningProgress(learningProgress);
        const payload = {
          format: LEARNING_PROGRESS_FORMAT,
          version: LEARNING_PROGRESS_VERSION,
          exportedAt: new Date().toISOString(),
          progress: normalized,
        };
        const blob = new Blob(
          [`${JSON.stringify(payload, null, 2)}\n`],
          { type: "application/json;charset=utf-8" },
        );
        triggerProgressDownload(
          blob,
          `知微高数_学习进度备份_${localDateKey() || "export"}.json`,
        );
        setLearningProgressStatus("学习进度备份已导出，可用于恢复或合并。", "success");
      }

      function readLearningProgressFile(file) {
        if (typeof file.text === "function") {
          return file.text();
        }
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.addEventListener("load", () => {
            resolve(String(reader.result || ""));
          });
          reader.addEventListener("error", () => {
            reject(new Error("进度文件读取失败。"));
          });
          reader.readAsText(file);
        });
      }

      async function importLearningProgress(file, mode = "merge") {
        if (!file) {
          return;
        }
        try {
          if (file.size > 1024 * 1024) {
            throw new Error("进度文件过大，请选择 1 MB 以内的文件。");
          }
          const text = await readLearningProgressFile(file);
          const parsed = JSON.parse(text);
          const imported = normalizeLearningProgress(parsed);
          learningProgress = mode === "overwrite"
            ? imported
            : mergeLearningProgress(learningProgress, imported);
          learningProgress.wrongBookSavedCount = Math.max(
            learningProgress.wrongBookSavedCount,
            wrongBook.length,
          );
          saveLearningProgress();
          renderLearningProgress();
          setLearningProgressStatus(
            mode === "overwrite"
              ? "已覆盖当前学习进度。"
              : "已合并进度，重复记录不会重复累计。",
            "success",
          );
        } catch (error) {
          setLearningProgressStatus(
            error instanceof SyntaxError
              ? "进度文件不是有效的 JSON。"
              : error.message || "进度导入失败。",
            "error",
          );
        } finally {
          if (learningProgressImportInput) {
            learningProgressImportInput.value = "";
          }
        }
      }

      function renderFormula(container, message) {
        container.textContent = "";
        if (!message.formulaLatex) {
          return;
        }

        if (window.katex) {
          try {
            window.katex.render(message.formulaLatex, container, {
              displayMode: true,
              throwOnError: true,
              strict: false,
              trust: false,
            });
            return;
          } catch (error) {
            // Fall back to the plain text returned by the calculation service.
          }
        }
        container.textContent = message.formulaText || message.formulaLatex;
      }

      function renderRichMessageText(container, rawText) {
        const source = String(rawText || "");
        container.textContent = "";
        if (!source) {
          return;
        }
        if (!window.katex) {
          container.textContent = source;
          return;
        }

        const mathPattern = /(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|\$[^$\n]+?\$)/g;
        let cursor = 0;
        for (const match of source.matchAll(mathPattern)) {
          const token = match[0];
          const index = match.index ?? 0;
          if (index > cursor) {
            container.append(document.createTextNode(source.slice(cursor, index)));
          }

          let expression = "";
          let displayMode = false;
          if (token.startsWith("$$") && token.endsWith("$$")) {
            expression = token.slice(2, -2).trim();
            displayMode = true;
          } else if (token.startsWith("\\[") && token.endsWith("\\]")) {
            expression = token.slice(2, -2).trim();
            displayMode = true;
          } else if (token.startsWith("\\(") && token.endsWith("\\)")) {
            expression = token.slice(2, -2).trim();
          } else {
            expression = token.slice(1, -1).trim();
          }

          const math = element(
            "span",
            displayMode ? "math-display" : "math-inline",
          );
          let rendered = false;
          if (expression) {
            try {
              window.katex.render(expression, math, {
                displayMode,
                throwOnError: true,
                strict: false,
                trust: false,
              });
              rendered = true;
            } catch (error) {
              rendered = false;
            }
          }
          if (rendered) {
            container.append(math);
          } else {
            container.append(document.createTextNode(token));
          }
          cursor = index + token.length;
        }

        if (cursor < source.length) {
          container.append(document.createTextNode(source.slice(cursor)));
        }
      }

      function renderMessageAttachments(attachments) {
        const gallery = element("div", "message-attachments");
        attachments.forEach((attachment, index) => {
          const card = element("div", "message-attachment");
          if (attachment.previewUrl) {
            const image = element("img");
            image.src = attachment.previewUrl;
            image.alt = attachment.name || `题目图片 ${index + 1}`;
            image.loading = "lazy";
            card.append(image);
          } else {
            const fallback = element("div", "message-attachment-file");
            fallback.append(
              element("span", "", attachment.name || "题目图片"),
            );
            card.append(fallback);
          }
          gallery.append(card);
        });
        return gallery;
      }

      function createMessageNode(message) {
        const article = element("article", "message");
        article.dataset.role = message.role;
        article.dataset.messageId = message.id;

        const avatar = element(
          "div",
          "avatar",
          message.role === "user" ? "我" : "知",
        );
        avatar.setAttribute("aria-hidden", "true");

        const content = element("div", "message-content");
        const meta = element("div", "message-meta");
        meta.append(
          element("span", "", message.role === "user" ? "你" : "知微老师"),
          element("time", "", message.createdAt),
        );

        const bubble = element("div", "bubble");
        if (message.loading) {
          const typing = element("div", "typing");
          typing.setAttribute("aria-label", "知微老师正在计算");
          typing.append(element("span"), element("span"), element("span"));
          bubble.append(typing);
        } else {
          if (Array.isArray(message.attachments) && message.attachments.length) {
            bubble.append(renderMessageAttachments(message.attachments));
          }
          if (message.text) {
            const text = element("p", "message-text");
            renderRichMessageText(text, message.text);
            bubble.append(text);
          }

          if (message.formulaLatex) {
            const formula = element("div", "formula");
            renderFormula(formula, message);
            bubble.append(formula);
          }

          if (message.plotUrl) {
            const figure = element("figure", "function-plot");
            const image = element("img");
            image.src = message.plotUrl;
            image.alt = message.formulaText
              ? `函数图像：${message.formulaText}`
              : "函数图像";
            image.loading = "lazy";
            figure.append(image);
            bubble.append(figure);
          }

          if (typeof message.verdict === "boolean") {
            const verdict = element(
              "div",
              "verdict",
              message.verdict ? "答案正确" : "答案不正确",
            );
            verdict.dataset.state = message.verdict ? "correct" : "incorrect";
            bubble.append(verdict);
          }

          if (message.resultLabel && message.resultValue) {
            const details = element("details", "calculation-details");
            details.append(element("summary", "", "计算明细"));
            const grid = element("dl", "calculation-grid");
            grid.append(
              element("dt", "", "结果"),
              element("dd", "", message.resultValue),
              element("dt", "", "类型"),
              element("dd", "", message.resultLabel),
            );
            details.append(grid);
            bubble.append(details);
          }
        }

        content.append(meta, bubble);
        if (message.role === "assistant" && !message.loading) {
          const sourceUserMessage = sourceUserMessageForAnswer(message);
          const bookmarked = sourceUserMessage
            ? wrongBookHasMessage(sourceUserMessage)
            : false;
          if (
            sourceUserMessage
            && (bookmarked || messageCanJoinWrongBook(message))
          ) {
            const actions = element("div", "message-actions");
            const bookmarkButton = element(
              "button",
              "message-action",
              bookmarked ? "已加入错题集" : "加入错题集",
            );
            bookmarkButton.type = "button";
            bookmarkButton.dataset.messageAction = "toggle-wrongbook";
            bookmarkButton.dataset.messageId = sourceUserMessage.id;
            bookmarkButton.dataset.bookmarked = String(bookmarked);
            bookmarkButton.setAttribute(
              "aria-pressed",
              String(bookmarked),
            );
            actions.append(bookmarkButton);
            content.append(actions);
          }
        }
        article.append(avatar, content);
        return article;
      }

      function latestUserQuestion() {
        for (let index = messages.length - 1; index >= 0; index -= 1) {

      function resizeInput() {
        chatInput.style.height = "auto";
