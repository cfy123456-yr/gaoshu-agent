<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8ff">
  <meta
    name="description"
    content="知微老师高等数学对话演示，支持求导、积分和极限计算。"
  >
  <title>知微老师 · 高数对话演示</title>
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='katex/katex.min.css') }}"
  >
  <style>
    :root {
      --ink: #172033;
      --muted: #6d7a91;
      --line: #e4ecf7;
      --line-strong: #cbdaf0;
      --canvas: #f4f8ff;
      --surface: #ffffff;
      --soft-blue: #eaf2ff;
      --blue: #2868d8;
      --blue-dark: #174da3;
      --blue-ink: #123f87;
      --amber: #b77916;
      --red: #c2413b;
      --shadow: 0 12px 34px rgba(37, 99, 201, 0.09);
      --sidebar-bg: #f7faff;
      --sidebar-hover: #edf4ff;
      --sidebar-active: #e4eeff;
      --sidebar-width: 272px;
      --sidebar-rail-width: 68px;
      --sidebar-current-width: var(--sidebar-width);
      --scrim: rgba(15, 28, 48, 0.34);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e8f0ff;
      --muted: #9aabc5;
      --line: #293c5a;
      --line-strong: #3e587c;
      --canvas: #0d1626;
      --surface: #142033;
      --soft-blue: #1b3150;
      --blue: #5d91ef;
      --blue-dark: #a8c7ff;
      --blue-ink: #c9dcff;
      --amber: #d9a54d;
      --red: #ef8178;
      --shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
      --sidebar-bg: #101b2c;
      --sidebar-hover: #192941;
      --sidebar-active: #203655;
      --scrim: rgba(3, 8, 16, 0.62);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      line-height: 1.55;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(40, 104, 216, 0.18);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      display: flex;
      width: 100%;
      max-width: 1440px;
      height: 100vh;
      height: 100dvh;
      min-height: 540px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 0 0 1px rgba(203, 218, 240, 0.72);
    }

    .app-shell[data-sidebar-collapsed="true"] {
      --sidebar-current-width: var(--sidebar-rail-width);
    }

    .sidebar {
      position: relative;
      flex: 0 0 var(--sidebar-current-width);
      width: var(--sidebar-current-width);
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: var(--sidebar-bg);
      transition: width 0.2s ease, flex-basis 0.2s ease;
    }

    .app-shell.is-resizing .sidebar {
      transition: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-inner {
      width: var(--sidebar-current-width);
      padding: 12px 10px;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-top {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-brand,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-section,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-footer,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-resizer,
    .app-shell[data-sidebar-collapsed="true"] .tools-menu summary {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .new-chat-button {
      width: 44px;
      min-height: 44px;
      margin: 14px auto 0;
      padding: 0;
      border-radius: 12px;
    }

    .app-shell[data-sidebar-collapsed="true"] .new-chat-label {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .tools-menu {
      margin-top: 14px;
      padding-top: 14px;
    }

    .app-shell[data-sidebar-collapsed="true"] .tool-list {
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 0;
    }

    .app-shell[data-sidebar-collapsed="true"] .tool-button {
      display: grid;
      width: 44px;
      min-height: 44px;
      height: 44px;
      margin: 0 auto;
      padding: 0;
      place-items: center;
      border-radius: 12px;
    }

    .app-shell[data-sidebar-collapsed="true"] .tool-label {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .tool-icon {
      display: block;
      font-size: 0.7rem;
      letter-spacing: -0.02em;
    }

    .sidebar-inner {
      display: flex;
      width: var(--sidebar-width);
      height: 100%;
      min-height: 0;
      flex-direction: column;
      padding: 14px 12px 12px;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 40px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
      color: var(--ink);
      font-size: 0.88rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .sidebar-logo {
      display: grid;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-size: 0.82rem;
    }

    .icon-button {
      display: grid;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--surface);
      font-size: 1rem;
      font-weight: 800;
      line-height: 1;
    }

    .icon-button:hover {
      border-color: var(--line-strong);
      color: var(--blue-dark);
      background: var(--sidebar-hover);
    }

    .new-chat-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 42px;
      margin-top: 16px;
      padding: 8px 12px;
      border: 1px solid var(--blue);
      border-radius: 10px;
      color: #ffffff;
      background: var(--blue);
      font-size: 0.84rem;
      font-weight: 800;
    }

    .new-chat-button:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .sidebar-section {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      margin-top: 20px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 6px 8px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .history-list {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: thin;
    }

    .history-item {
      position: relative;
      display: flex;
      align-items: stretch;
      width: 100%;
      margin-bottom: 4px;
      overflow: visible;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--ink);
      background: transparent;
    }

    .history-item::before {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 0;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: transparent;
      content: "";
    }

    .history-select {
      min-width: 0;
      flex: 1;
      padding: 9px 10px;
      overflow: hidden;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
    }

    .history-actions {
      position: absolute;
      top: 50%;
      right: 6px;
      display: flex;
      gap: 3px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 0.15s ease;
    }

    .history-item:hover .history-actions,
    .history-item:focus-within .history-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .history-action {
      min-height: 24px;
      padding: 2px 5px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      color: var(--muted);
      background: var(--surface);
      font-size: 0.64rem;
      font-weight: 750;
    }

    .history-action:hover {
      border-color: #a9c5ec;
      color: var(--blue-dark);
      background: var(--soft-blue);
    }

    .history-item:hover {
      border-color: var(--line);
      background: var(--sidebar-hover);
    }

    .history-item[data-active="true"] {
      border-color: #c8dbf7;
      background: var(--sidebar-active);
    }

    .history-item[data-active="true"]::before {
      background: var(--blue);
    }

    .history-title,
    .history-time {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-title {
      font-size: 0.79rem;
      font-weight: 750;
      transition: padding-right 0.15s ease;
    }

    .history-item:hover .history-title,
    .history-item:focus-within .history-title {
      padding-right: 82px;
    }

    .history-time {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .history-empty {
      padding: 10px;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.6;
    }

    .tools-menu {
      flex: 0 0 auto;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .tools-menu summary {
      padding: 5px 6px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      list-style: none;
    }

    .tools-menu summary::-webkit-details-marker {
      display: none;
    }

    .tools-menu summary::after {
      float: right;
      content: "+";
      font-size: 0.9rem;
    }

    .tools-menu[open] summary::after {
      content: "−";
    }

    .tool-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding: 7px 4px 1px;
    }

    .tool-button {
      display: grid;
      place-items: center;
      min-height: 34px;
      padding: 5px 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--blue-dark);
      background: var(--surface);
      font-size: 0.73rem;
      font-weight: 800;
    }

    .tool-icon {
      display: none;
    }

    .tool-button:hover {
      border-color: #a9c5ec;
      background: var(--sidebar-hover);
    }

    .sidebar-footer {
      flex: 0 0 auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .theme-button {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 38px;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      font-size: 0.77rem;
      font-weight: 750;
      text-align: left;
    }

    .theme-button:hover {
      border-color: var(--line);
      color: var(--blue-dark);
      background: var(--sidebar-hover);
    }

    .theme-icon {
      display: grid;
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      place-items: center;
      border-radius: 7px;
      background: var(--soft-blue);
    }

    .sidebar-resizer {
      position: absolute;
      z-index: 5;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      cursor: col-resize;
    }

    .sidebar-resizer:hover,
    .sidebar-resizer:focus-visible {
      background: rgba(40, 104, 216, 0.18);
      outline: none;
    }

    .sidebar-scrim {
      display: none;
    }

    .chat-layout {
      display: flex;
      min-width: 0;
      flex: 1;
      flex-direction: column;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex: 0 0 auto;
      min-height: 80px;
      padding: 15px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.97);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-size: 1.05rem;
      font-weight: 850;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy h1 {
      margin: 0;
      color: var(--ink);
      font-size: 1.1rem;
      line-height: 1.25;
    }

    .brand-copy p {
      margin: 2px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.77rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 9px;
    }

    .status-chip,
    .clear-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border-radius: 999px;
      font-size: 0.79rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .status-chip {
      gap: 7px;
      min-width: 92px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #f7faff;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
    }

    .status-chip[data-state="online"] {
      border-color: #c9dbf8;
      color: var(--blue-dark);
      background: #edf4ff;
    }

    .status-chip[data-state="online"] .status-dot {
      background: var(--blue);
    }

    .status-chip[data-state="offline"] {
      border-color: #efc5c1;
      color: #84261f;
      background: #fff4f2;
    }

    .status-chip[data-state="offline"] .status-dot {
      background: var(--red);
    }

    .clear-button {
      min-height: 34px;
      padding: 5px 12px;
      border: 1px solid transparent;
      color: var(--muted);
      background: transparent;
    }

    .clear-button:hover {
      border-color: var(--line);
      color: var(--blue-dark);
      background: #f4f8ff;
    }

    .messages {
      flex: 1 1 auto;
      min-height: 0;
      padding: 30px 30px 22px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      background: #f8fbff;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 24px;
    }

    .message[data-role="user"] {
      flex-direction: row-reverse;
    }

    .avatar {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      margin-top: 20px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-size: 0.8rem;
      font-weight: 850;
    }

    .message[data-role="user"] .avatar {
      border: 1px solid #d8e5f8;
      color: var(--blue-dark);
      background: #ffffff;
    }

    .message-content {
      width: fit-content;
      max-width: min(76%, 680px);
      min-width: 0;
    }

    .message[data-role="user"] .message-content {
      display: flex;
      align-items: flex-end;
      flex-direction: column;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 18px;
      margin: 0 6px 5px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .message-meta time {
      color: #93a0b4;
      font-size: 0.64rem;
      font-weight: 500;
      opacity: 0.8;
    }

    .message[data-role="user"] .message-meta {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 100%;
      min-width: 74px;
      margin: 0 2px;
      padding: 14px 17px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px 18px 18px 18px;
      background: var(--surface);
      box-shadow: 0 4px 14px rgba(37, 99, 201, 0.045);
    }

    .message[data-role="user"] .bubble {
      border-color: var(--blue);
      border-radius: 18px 6px 18px 18px;
      color: #ffffff;
      background: var(--blue);
      box-shadow: none;
    }

    .message-text {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .formula {
      max-width: 100%;
      margin: 14px -17px 12px;
      padding: 15px 12px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      border: 0;
      border-radius: 12px;
      color: var(--blue-ink);
      background: #f2f7ff;
      text-align: center;
      -webkit-overflow-scrolling: touch;
    }

    .formula .katex {
      font-size: 1.18em;
      white-space: nowrap;
    }

    .formula .katex-display {
      min-width: max-content;
    }

    .verdict {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      margin-top: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .verdict[data-state="correct"] {
      color: var(--blue-dark);
      background: #eaf2ff;
    }

    .verdict[data-state="incorrect"] {
      color: #84261f;
      background: #fff0ee;
    }

    .calculation-details {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .calculation-details summary {
      width: fit-content;
      cursor: pointer;
      font-weight: 750;
    }

    .calculation-grid {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 5px 12px;
      margin: 8px 0 1px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .calculation-grid dt {
      color: #71809a;
      font-size: 0.73rem;
      font-weight: 700;
    }

    .calculation-grid dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 0.76rem;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7fa4dc;
      animation: pulse 1.15s ease-in-out infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes pulse {
      0%,
      70%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      35% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .messages {
        scroll-behavior: auto;
      }

      .typing span {
        animation-duration: 2s;
      }
    }

    .composer-area {
      flex: 0 0 auto;
      padding: 0 28px 18px;
      border-top: 1px solid var(--line);
      background: #ffffff;
    }

    .suggestions-toolbar {
      display: flex;
      justify-content: flex-end;
      padding: 8px 2px 0;
    }

    .suggestions-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      padding: 3px 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 0.7rem;
      font-weight: 750;
    }

    .suggestions-toggle:hover {
      border-color: var(--line);
      color: var(--blue-dark);
      background: #f7faff;
    }

    .suggestions-toggle-icon {
      display: inline-block;
      font-size: 0.9rem;
      line-height: 1;
      transform: rotate(180deg);
      transition: transform 0.15s ease;
    }

    .composer-area[data-suggestions-collapsed="true"] .suggestions-toggle-icon {
      transform: rotate(0deg);
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 2px 10px;
      overflow: visible;
    }

    .composer-area[data-suggestions-collapsed="true"] .suggestions {
      display: none;
    }

    .suggestions:empty {
      display: none;
    }

    .suggestion {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 5px 11px;
      border: 1px solid #d4e2f5;
      border-radius: 999px;
      color: var(--blue-dark);
      background: #f7faff;
      font-size: 0.77rem;
      font-weight: 750;
      transition: transform 0.15s ease, border-color 0.15s ease,
        background-color 0.15s ease;
    }

    .suggestion:hover {
      border-color: #a9c5ec;
      background: #edf4ff;
      transform: translateY(-1px);
    }

    .suggestion:active {
      transform: translateY(0) scale(0.98);
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 9px;
      padding: 8px;
      border: 1px solid #d7e3f3;
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(37, 99, 201, 0.07);
    }

    .composer:focus-within {
      border-color: #8fb3e8;
      box-shadow: 0 0 0 3px rgba(40, 104, 216, 0.09);
    }

    .chat-input {
      width: 100%;
      min-height: 42px;
      max-height: 132px;
      padding: 9px 8px 8px;
      overflow-y: auto;
      resize: none;
      border: 0;
      color: var(--ink);
      background: transparent;
      outline: none;
      line-height: 1.5;
    }

    .chat-input::placeholder {
      color: #91a0b7;
    }

    .send-button {
      min-width: 72px;
      min-height: 42px;
      padding: 8px 17px;
      border: 1px solid var(--blue);
      border-radius: 10px;
      color: #ffffff;
      background: var(--blue);
      font-weight: 800;
    }

    .send-button:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .send-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    html[data-theme="dark"] .chat-header,
    html[data-theme="dark"] .composer-area {
      background: rgba(20, 32, 51, 0.97);
    }

    html[data-theme="dark"] .messages {
      background: #101b2c;
    }

    html[data-theme="dark"] .status-chip,
    html[data-theme="dark"] .suggestion {
      background: #182840;
    }

    html[data-theme="dark"] .bubble {
      background: #182840;
    }

    html[data-theme="dark"] .message[data-role="user"] .bubble {
      background: var(--blue);
    }

    html[data-theme="dark"] .formula {
      background: #1a2e4d;
    }

    html[data-theme="dark"] .message[data-role="user"] .avatar {
      background: #182840;
    }

    @media (hover: none) {
      .history-actions {
        position: static;
        align-items: center;
        padding-right: 6px;
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }

      .history-item .history-title {
        padding-right: 0;
      }
    }

    @media (max-width: 820px) {
      .app-shell {
        min-height: 0;
      }

      .sidebar {
        position: fixed;
        z-index: 30;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(86vw, 340px);
        flex-basis: auto;
        border-right: 1px solid var(--line);
        box-shadow: 14px 0 34px rgba(24, 48, 84, 0.14);
        transform: translateX(0);
        transition: transform 0.2s ease;
      }

      .app-shell[data-sidebar-collapsed="true"] .sidebar {
        width: min(86vw, 340px);
        border-right: 1px solid var(--line);
        transform: translateX(-104%);
      }

      .sidebar-inner {
        width: 100%;
      }

      .sidebar-resizer {
        display: none;
      }

      .sidebar-scrim {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: block;
        border: 0;
        background: var(--scrim);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .app-shell[data-sidebar-collapsed="false"] .sidebar-scrim {
        opacity: 1;
        pointer-events: auto;
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        width: 100%;
        border: 0;
      }

      .chat-header {
        min-height: 70px;
        padding: 11px 14px;
      }

      .brand-mark {
        flex-basis: 38px;
        width: 38px;
        height: 38px;
      }

      .brand-copy h1 {
        font-size: 0.98rem;
      }

      .brand-copy p,
      .clear-button {
        display: none;
      }

      .brand {
        gap: 8px;
      }

      .status-chip {
        min-width: auto;
        padding: 6px 9px;
      }

      .messages {
        padding: 22px 12px 16px;
      }

      .message {
        gap: 7px;
        margin-bottom: 20px;
      }

      .avatar {
        flex-basis: 30px;
        width: 30px;
        height: 30px;
        font-size: 0.73rem;
      }

      .message-content {
        max-width: 87%;
      }

      .bubble {
        padding: 10px 12px;
      }

      .formula {
        margin-right: -12px;
        margin-left: -12px;
      }

      .composer-area {
        padding: 0 10px 12px;
      }

      .send-button {
        min-width: 62px;
        padding-right: 13px;
        padding-left: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell" data-sidebar-collapsed="false">
    <aside class="sidebar" id="sidebar" aria-label="会话与工具">
      <div class="sidebar-inner">
        <div class="sidebar-top">
          <div class="sidebar-brand">
            <span class="sidebar-logo" aria-hidden="true">知</span>
            <span>知微高数</span>
          </div>
          <button
            class="icon-button"
            type="button"
            data-sidebar-toggle
            aria-label="折叠侧边栏"
            title="折叠侧边栏"
          >‹</button>
        </div>

        <button class="new-chat-button" id="newChatButton" type="button">
          <span aria-hidden="true">+</span>
          <span class="new-chat-label">新建会话</span>
        </button>

        <section class="sidebar-section" aria-labelledby="historyHeading">
          <div class="section-heading" id="historyHeading">
            <span>历史对话</span>
            <span id="historyCount">0</span>
          </div>
          <div class="history-list" id="historyList"></div>
        </section>

        <details class="tools-menu">
          <summary>高数工具</summary>
          <div class="tool-list">
            <button class="tool-button" type="button" data-prompt="求导 x^2">
              <span class="tool-icon" aria-hidden="true">d/dx</span>
              <span class="tool-label">求导</span>
            </button>
            <button class="tool-button" type="button" data-prompt="积分 x^2">
              <span class="tool-icon" aria-hidden="true">∫</span>
              <span class="tool-label">积分</span>
            </button>
            <button class="tool-button" type="button" data-prompt="lim x→0 sin(x)/x">
              <span class="tool-icon" aria-hidden="true">lim</span>
              <span class="tool-label">极限</span>
            </button>
          </div>
        </details>

        <div class="sidebar-footer">
          <button class="theme-button" id="themeToggle" type="button">
            <span class="theme-icon" aria-hidden="true">◐</span>
            <span id="themeLabel">切换深色主题</span>
          </button>
        </div>
      </div>
      <div
        class="sidebar-resizer"
        id="sidebarResizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整侧边栏宽度"
        tabindex="0"
      ></div>
    </aside>
    <button
      class="sidebar-scrim"
      id="sidebarScrim"
      type="button"
      aria-label="关闭侧边栏"
      tabindex="-1"
    ></button>

    <div class="chat-layout">
      <header class="chat-header">
        <div class="brand">
          <button
            class="icon-button"
            id="sidebarToggle"
            type="button"
            data-sidebar-toggle
            aria-label="展开或折叠侧边栏"
            title="展开或折叠侧边栏"
          >☰</button>
          <div class="brand-mark" aria-hidden="true">知</div>
          <div class="brand-copy">
            <h1>知微老师</h1>
            <p>高等数学学习伙伴</p>
          </div>
        </div>
        <div class="header-actions">
          <div
            class="status-chip"
            id="serviceStatus"
            data-state="checking"
            role="status"
          >
            <span class="status-dot" aria-hidden="true"></span>
            <span id="serviceStatusText">连接中</span>
          </div>
          <button class="clear-button" id="clearButton" type="button">清空对话</button>
        </div>
      </header>

      <main
        class="messages"
        id="messageList"
        aria-label="知微老师对话记录"
        aria-live="polite"
      ></main>

      <footer class="composer-area" data-suggestions-collapsed="false">
        <div class="suggestions-toolbar">
          <button
            class="suggestions-toggle"
            id="suggestionsToggle"
            type="button"
            aria-controls="suggestions"
            aria-expanded="true"
            title="折叠示例快捷指令"
          >
            <span class="suggestions-toggle-icon" aria-hidden="true">⌃</span>
            <span id="suggestionsToggleLabel">收起示例</span>
          </button>
        </div>
        <div class="suggestions" id="suggestions" aria-label="示例题目"></div>
        <form class="composer" id="chatForm">
          <label class="sr-only" for="chatInput">输入高等数学题目</label>
          <textarea
            class="chat-input"
            id="chatInput"
            name="message"
            rows="1"
            maxlength="600"
            autocomplete="off"
            spellcheck="false"
            placeholder="输入题目，例如：求导 x^2"
            required
          ></textarea>
          <button class="send-button" id="sendButton" type="submit">发送</button>
        </form>
      </footer>
    </div>
  </div>

  <script
    defer
    src="{{ url_for('static', filename='katex/katex.min.js') }}"
  ></script>
  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "zhiwei-demo-chat-v1";
      const SESSION_KEY = "zhiwei-demo-session-v1";
      const CONVERSATIONS_KEY = "zhiwei-demo-conversations-v1";
      const ACTIVE_CONVERSATION_KEY = "zhiwei-demo-active-conversation-v1";
      const THEME_KEY = "zhiwei-demo-theme-v1";
      const SIDEBAR_WIDTH_KEY = "zhiwei-demo-sidebar-width-v1";
      const SIDEBAR_COLLAPSED_KEY = "zhiwei-demo-sidebar-collapsed-v1";
      const MAX_STORED_MESSAGES = 40;
      const MAX_REQUEST_HISTORY = 20;
      const MAX_CONVERSATIONS = 30;
      const RESPONSE_CACHE_LIMIT = 20;
      const REQUEST_TIMEOUT_MS = 20000;
      const MIN_SIDEBAR_WIDTH = 220;
      const MAX_SIDEBAR_WIDTH = 420;
      const DEFAULT_SIDEBAR_WIDTH = 272;
      const DEFAULT_SUGGESTIONS = [
        "求导 x^2",
        "判断 2x 是不是 x^2 的导数",
        "积分 x^2",
        "积分 0 到 1 x^2",
        "lim x→0 sin(x)/x",
        "我以前做过哪些题",
      ];
      const WELCOME_TEXT =
        "你好，我是知微老师。把题目发给我，我会用数学工具计算，再和你一起检查思路。想回顾之前的题目，直接问我“我以前做过哪些题”，也可以说“再算一遍上一题”。";

      const messageList = document.getElementById("messageList");
      const suggestions = document.getElementById("suggestions");
      const chatForm = document.getElementById("chatForm");
      const chatInput = document.getElementById("chatInput");
      const sendButton = document.getElementById("sendButton");
      const clearButton = document.getElementById("clearButton");
      const serviceStatus = document.getElementById("serviceStatus");
      const serviceStatusText = document.getElementById("serviceStatusText");
      const appShell = document.getElementById("appShell");
      const composerArea = document.querySelector(".composer-area");
      const suggestionsToggle = document.getElementById("suggestionsToggle");
      const suggestionsToggleLabel = document.getElementById(
        "suggestionsToggleLabel",
      );
      const historyList = document.getElementById("historyList");
      const historyCount = document.getElementById("historyCount");
      const newChatButton = document.getElementById("newChatButton");
      const themeToggle = document.getElementById("themeToggle");
      const themeLabel = document.getElementById("themeLabel");
      const toolsMenu = document.querySelector(".tools-menu");
      const sidebarResizer = document.getElementById("sidebarResizer");
      const sidebarScrim = document.getElementById("sidebarScrim");
      const sidebarMedia = window.matchMedia("(max-width: 820px)");

      let messages = [];
      let currentSuggestions = [...DEFAULT_SUGGESTIONS];
      let requestInFlight = false;
      const responseCache = new Map();
      let conversations = [];
      let activeConversationId = "";
      let toolsMenuRestoreOpen = null;

      function normalizeMessages(value) {
        if (!Array.isArray(value)) {
          return [];
        }
        return value
          .filter((item) => item && (item.role === "user" || item.role === "assistant"))
          .slice(-MAX_STORED_MESSAGES)
          .map((item) => ({
            id: String(item.id || makeId()),
            role: item.role,
            text: String(item.text || ""),
            formulaLatex: String(item.formulaLatex || ""),
            formulaText: String(item.formulaText || ""),
            resultLabel: String(item.resultLabel || ""),
            resultValue: String(item.resultValue || ""),
            verdict: typeof item.verdict === "boolean" ? item.verdict : null,
            createdAt: String(item.createdAt || currentTime()),
          }));
      }

      function loadConversations() {
        try {
          const parsed = JSON.parse(
            window.localStorage.getItem(CONVERSATIONS_KEY) || "[]",
          );
          if (!Array.isArray(parsed)) {
            return [];
          }
          return parsed
            .filter((item) => item && item.id)
            .slice(0, MAX_CONVERSATIONS)
            .map((item) => ({
              id: String(item.id),
              title: String(item.title || "历史对话"),
              renamed: Boolean(item.renamed),
              updatedAt: Number(item.updatedAt) || Date.now(),
              messages: normalizeMessages(item.messages),
            }));
        } catch (error) {
          return [];
        }
      }

      function persistConversations() {
        try {
          window.localStorage.setItem(
            CONVERSATIONS_KEY,
            JSON.stringify(conversations.slice(0, MAX_CONVERSATIONS)),
          );
        } catch (error) {
          // Conversation history remains optional when browser storage is unavailable.
        }
      }

      function makeId() {
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function sessionId() {
        try {
          let value = window.localStorage.getItem(SESSION_KEY);
          if (!value) {
            value =
              window.crypto && window.crypto.randomUUID
                ? window.crypto.randomUUID()
                : `session-${makeId()}`;
            window.localStorage.setItem(SESSION_KEY, value);
          }
          return value;
        } catch (error) {
          return "session-fallback";
        }
      }

      const demoSessionId = sessionId();

      function currentTime() {
        return new Date().toLocaleTimeString("zh-CN", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      }

      function welcomeMessage() {
        return {
          id: makeId(),
          role: "assistant",
          text: WELCOME_TEXT,
          formulaLatex: "",
          formulaText: "",
          resultLabel: "",
          resultValue: "",
          verdict: null,
          createdAt: currentTime(),
        };
      }

      function loadMessages() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            return [];
          }
          const parsed = JSON.parse(raw);
          return normalizeMessages(parsed);
        } catch (error) {
          return [];
        }
      }

      function saveMessages() {
        try {
          window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(messages.slice(-MAX_STORED_MESSAGES)),
          );
        } catch (error) {
          // The conversation still works when browser storage is unavailable.
        }
        updateCurrentConversation();
      }

      function currentConversationTitle() {
        const firstQuestion = messages.find(
          (message) => message.role === "user" && message.text.trim(),
        );
        if (!firstQuestion) {
          return "新会话";
        }
        const compact = firstQuestion.text.replace(/\s+/g, " ").trim();
        return compact.length > 22 ? `${compact.slice(0, 22)}…` : compact;
      }

      function conversationPreview(conversation) {
        if (conversation.renamed && conversation.title) {
          return conversation.title;
        }
        const firstQuestion = conversation.messages.find(
          (message) => message.role === "user" && message.text.trim(),
        );
        if (!firstQuestion) {
          return conversation.title || "新会话";
        }
        return firstQuestion.text.replace(/\s+/g, " ").trim();
      }

      function updateCurrentConversation() {
        const hasUserMessage = messages.some(
          (message) => message.role === "user" && message.text.trim(),
        );
        const existingConversation = conversations.find(
          (conversation) => conversation.id === activeConversationId,
        );
        conversations = conversations.filter(
          (conversation) => conversation.id !== activeConversationId,
        );
        if (hasUserMessage) {
          conversations.unshift({
            id: activeConversationId,
            title:
              existingConversation && existingConversation.renamed
                ? existingConversation.title
                : currentConversationTitle(),
            renamed: Boolean(existingConversation?.renamed),
            updatedAt: Date.now(),
            messages: messages.slice(-MAX_STORED_MESSAGES),
          });
          conversations = conversations.slice(0, MAX_CONVERSATIONS);
        }
        persistConversations();
        renderHistory();
      }

      function historyTime(timestamp) {
        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) {
          return "";
        }
        return date.toLocaleString("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      }

      function renderHistory() {
        const fragment = document.createDocumentFragment();
        if (!conversations.length) {
          fragment.append(
            element(
              "div",
              "history-empty",
              "所有会话关闭后会保存在这里",
            ),
          );
        } else {
          conversations.forEach((conversation) => {
            const item = element("div", "history-item");
            item.dataset.conversationId = conversation.id;
            item.dataset.active = String(
              conversation.id === activeConversationId,
            );

            const selectButton = element("button", "history-select");
            selectButton.type = "button";
            selectButton.setAttribute(
              "aria-label",
              `打开会话：${conversationPreview(conversation)}`,
            );
            if (conversation.id === activeConversationId) {
              selectButton.setAttribute("aria-current", "true");
            }
            selectButton.append(
              element("span", "history-title", conversationPreview(conversation)),
              element("span", "history-time", historyTime(conversation.updatedAt)),
            );

            const actions = element("div", "history-actions");
            const renameButton = element("button", "history-action", "重命名");
            renameButton.type = "button";
            renameButton.dataset.historyAction = "rename";
            renameButton.setAttribute(
              "aria-label",
              `重命名会话：${conversationPreview(conversation)}`,
            );

            const deleteButton = element("button", "history-action", "删除");
            deleteButton.type = "button";
            deleteButton.dataset.historyAction = "delete";
            deleteButton.setAttribute(
              "aria-label",
              `删除会话：${conversationPreview(conversation)}`,
            );

            actions.append(renameButton, deleteButton);
            item.append(selectButton, actions);
            fragment.append(item);
          });
        }
        historyList.replaceChildren(fragment);
        historyCount.textContent = String(conversations.length);
      }

      function requestHistory() {
        return messages
          .filter((message) => !message.loading)
          .slice(-MAX_REQUEST_HISTORY)
          .map((message) => ({
            role: message.role,
            text: message.text.slice(0, 600),
          }))
          .filter((message) => message.text);
      }

      function cacheResponse(question, data) {
        if (!data || data.history_used || data.intent === "history") {
          return;
        }
        const key = question.trim();
        if (!key) {
          return;
        }
        responseCache.delete(key);
        responseCache.set(key, data);
        while (responseCache.size > RESPONSE_CACHE_LIMIT) {
          responseCache.delete(responseCache.keys().next().value);
        }
      }

      function element(tagName, className, text) {
        const node = document.createElement(tagName);
        if (className) {
          node.className = className;
        }
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      }

      function renderFormula(container, message) {
        container.textContent = "";
        if (!message.formulaLatex) {
          return;
        }

        if (window.katex) {
          try {
            window.katex.render(message.formulaLatex, container, {
              displayMode: true,
              throwOnError: true,
              strict: false,
              trust: false,
            });
            return;
          } catch (error) {
            // Fall back to the plain text returned by the calculation service.
          }
        }
        container.textContent = message.formulaText || message.formulaLatex;
      }

      function createMessageNode(message) {
        const article = element("article", "message");
        article.dataset.role = message.role;
        article.dataset.messageId = message.id;

        const avatar = element(
          "div",
          "avatar",
          message.role === "user" ? "我" : "知",
        );
        avatar.setAttribute("aria-hidden", "true");

        const content = element("div", "message-content");
        const meta = element("div", "message-meta");
        meta.append(
          element("span", "", message.role === "user" ? "你" : "知微老师"),
          element("time", "", message.createdAt),
        );

        const bubble = element("div", "bubble");
        if (message.loading) {
          const typing = element("div", "typing");
          typing.setAttribute("aria-label", "知微老师正在计算");
          typing.append(element("span"), element("span"), element("span"));
          bubble.append(typing);
        } else {
          bubble.append(element("p", "message-text", message.text));

          if (message.formulaLatex) {
            const formula = element("div", "formula");
            renderFormula(formula, message);
            bubble.append(formula);
          }

          if (typeof message.verdict === "boolean") {
            const verdict = element(
              "div",
              "verdict",
              message.verdict ? "答案正确" : "答案不正确",
            );
            verdict.dataset.state = message.verdict ? "correct" : "incorrect";
            bubble.append(verdict);
          }

          if (message.resultLabel && message.resultValue) {
            const details = element("details", "calculation-details");
            details.append(element("summary", "", "计算明细"));
            const grid = element("dl", "calculation-grid");
            grid.append(
              element("dt", "", "结果"),
              element("dd", "", message.resultValue),
              element("dt", "", "类型"),
              element("dd", "", message.resultLabel),
            );
            details.append(grid);
            bubble.append(details);
          }
        }

        content.append(meta, bubble);
        article.append(avatar, content);
        return article;
      }

      function scrollToLatest() {
        window.requestAnimationFrame(() => {
          messageList.scrollTop = messageList.scrollHeight;
        });
      }

      function renderMessages() {
        const fragment = document.createDocumentFragment();
        messages.forEach((message) => fragment.append(createMessageNode(message)));
        messageList.replaceChildren(fragment);
        scrollToLatest();
      }

      function renderSuggestions(items) {
        currentSuggestions = Array.isArray(items) && items.length
          ? items.slice(0, 6)
          : DEFAULT_SUGGESTIONS;
        const fragment = document.createDocumentFragment();
        currentSuggestions.forEach((text) => {
          const button = element("button", "suggestion", String(text));
          button.type = "button";
          button.dataset.message = String(text);
          fragment.append(button);
        });
        suggestions.replaceChildren(fragment);
      }

      function setSuggestionsCollapsed(collapsed) {
        const nextCollapsed = Boolean(collapsed);
        composerArea.dataset.suggestionsCollapsed = String(nextCollapsed);
        suggestionsToggle.setAttribute(
          "aria-expanded",
          String(!nextCollapsed),
        );
        suggestionsToggle.setAttribute(
          "title",
          nextCollapsed ? "展开示例快捷指令" : "折叠示例快捷指令",
        );
        suggestionsToggleLabel.textContent = nextCollapsed
          ? "展开示例"
          : "收起示例";
      }

      function resizeInput() {
        chatInput.style.height = "auto";
        chatInput.style.height = `${Math.min(chatInput.scrollHeight, 132)}px`;
      }

      function setRequestState(active) {
        requestInFlight = active;
        sendButton.disabled = active;
        sendButton.textContent = active ? "计算中" : "发送";
      }

      function responseToMessage(data) {
        const calculation = data.calculation || {};
        let resultLabel = "";
        let resultValue = "";

        if (data.intent === "verify") {
          resultLabel = "导数";
          resultValue = calculation.derivative || "";
        } else if (data.intent === "integrate") {
          resultLabel = "积分";
          resultValue = calculation.integral || "";
        } else if (data.intent === "limit") {
          resultLabel = "极限";
          resultValue = calculation.limit || "";
        }

        return {
          id: makeId(),
          role: "assistant",
          text: String(data.reply || "这次没有得到可用的计算结果。"),
          formulaLatex: String(data.formula_latex || ""),
          formulaText: String(data.formula_text || ""),
          resultLabel,
          resultValue: String(resultValue),
          verdict:
            typeof calculation.is_correct === "boolean"
              ? calculation.is_correct
              : null,
          createdAt: currentTime(),
        };
      }

      async function sendMessage(rawMessage) {
        const text = String(rawMessage || "").trim();
        if (!text || requestInFlight) {
          return;
        }
        const history = requestHistory();

        messages.push({
          id: makeId(),
          role: "user",
          text,
          formulaLatex: "",
          formulaText: "",
          resultLabel: "",
          resultValue: "",
          verdict: null,
          createdAt: currentTime(),
        });

        const loadingId = makeId();
        messages.push({
          id: loadingId,
          role: "assistant",
          text: "",
          formulaLatex: "",
          formulaText: "",
          resultLabel: "",
          resultValue: "",
          verdict: null,
          createdAt: currentTime(),
          loading: true,
        });

        chatInput.value = "";
        resizeInput();
        setRequestState(true);
        renderMessages();
        saveMessages();

        const controller = new AbortController();
        const timeoutId = window.setTimeout(
          () => controller.abort(),
          REQUEST_TIMEOUT_MS,
        );

        try {
          const cachedResponse = responseCache.get(text);
          if (cachedResponse) {
            window.clearTimeout(timeoutId);
            await new Promise((resolve) => window.setTimeout(resolve, 120));
            const cachedIndex = messages.findIndex(
              (message) => message.id === loadingId,
            );
            if (cachedIndex !== -1) {
              messages[cachedIndex] = responseToMessage(cachedResponse);
            }
            renderSuggestions(cachedResponse.suggestions);
            return;
          }

          const response = await fetch("/demo/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Demo-Session": demoSessionId,
            },
            body: JSON.stringify({ message: text, history }),
            signal: controller.signal,
          }).finally(() => window.clearTimeout(timeoutId));

          let data;
          try {
            data = await response.json();
          } catch (error) {
            throw new Error("计算服务返回了无法识别的内容。");
          }

          if (!response.ok) {
            throw new Error(data.detail || `计算服务返回错误（${response.status}）。`);
          }

          const index = messages.findIndex((message) => message.id === loadingId);
          if (index !== -1) {
            messages[index] = responseToMessage(data);
          }
          cacheResponse(text, data);
          renderSuggestions(data.suggestions);
        } catch (error) {
          const index = messages.findIndex((message) => message.id === loadingId);
          if (index !== -1) {
            messages[index] = {
              id: loadingId,
              role: "assistant",
              text:
                error.name === "AbortError"
                  ? "这次等待时间有点长，已停止等待。可以再发一次同一题，系统会复用已有结果。"
                  : error.message || "计算服务暂时不可用，请稍后重试。",
              formulaLatex: "",
              formulaText: "",
              resultLabel: "",
              resultValue: "",
              verdict: null,
              createdAt: currentTime(),
            };
          }
          renderSuggestions(DEFAULT_SUGGESTIONS);
        } finally {
          setRequestState(false);
          renderMessages();
          saveMessages();
          chatInput.focus();
        }
      }

      async function checkService() {
        const controller = new AbortController();
        const timeoutId = window.setTimeout(() => controller.abort(), 6000);
        try {
          const response = await fetch("/demo/api/health", {
            cache: "no-store",
            signal: controller.signal,
          }).finally(() => window.clearTimeout(timeoutId));
          if (!response.ok) {
            throw new Error("offline");
          }
          serviceStatus.dataset.state = "online";
          serviceStatusText.textContent = "服务在线";
        } catch (error) {
          serviceStatus.dataset.state = "offline";
          serviceStatusText.textContent = "服务离线";
        }
      }

      function setSidebarCollapsed(collapsed, persist = true) {
        const nextCollapsed = Boolean(collapsed);
        appShell.dataset.sidebarCollapsed = String(nextCollapsed);
        if (persist) {
          try {
            window.localStorage.setItem(
              SIDEBAR_COLLAPSED_KEY,
              String(nextCollapsed),
            );
          } catch (error) {
            // Layout state remains active for the current page.
          }
        }

        if (!sidebarMedia.matches) {
          if (nextCollapsed) {
            if (toolsMenuRestoreOpen === null) {
              toolsMenuRestoreOpen = toolsMenu.open;
            }
            toolsMenu.open = true;
          } else if (toolsMenuRestoreOpen !== null) {
            toolsMenu.open = toolsMenuRestoreOpen;
            toolsMenuRestoreOpen = null;
          }
        }

        document.querySelectorAll("[data-sidebar-toggle]").forEach((button) => {
          button.setAttribute(
            "aria-label",
            nextCollapsed ? "展开侧边栏" : "折叠侧边栏",
          );
          button.setAttribute("aria-expanded", String(!nextCollapsed));
        });
      }

      function setSidebarWidth(width, persist = true) {
        const nextWidth = Math.min(
          MAX_SIDEBAR_WIDTH,
          Math.max(MIN_SIDEBAR_WIDTH, Number(width) || DEFAULT_SIDEBAR_WIDTH),
        );
        document.documentElement.style.setProperty(
          "--sidebar-width",
          `${nextWidth}px`,
        );
        if (persist) {
          try {
            window.localStorage.setItem(SIDEBAR_WIDTH_KEY, String(nextWidth));
          } catch (error) {
            // The current width still applies without storage.
          }
        }
      }

      function setTheme(theme) {
        const nextTheme = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = nextTheme;
        themeLabel.textContent =
          nextTheme === "dark" ? "切换浅色主题" : "切换深色主题";
        try {
          window.localStorage.setItem(THEME_KEY, nextTheme);
        } catch (error) {
          // Theme remains active for the current page.
        }
      }

      function startNewConversation() {
        if (requestInFlight) {
          return;
        }
        activeConversationId = makeId();
        try {
          window.localStorage.setItem(
            ACTIVE_CONVERSATION_KEY,
            activeConversationId,
          );
        } catch (error) {
          // The new conversation is still available in memory.
        }
        messages = [welcomeMessage()];
        responseCache.clear();
        renderSuggestions(DEFAULT_SUGGESTIONS);
        renderMessages();
        saveMessages();
        if (sidebarMedia.matches) {
          setSidebarCollapsed(true);
        }
        chatInput.focus();
      }

      function clearCurrentConversation() {
        if (requestInFlight) {
          return;
        }
        messages = [welcomeMessage()];
        responseCache.clear();
        renderSuggestions(DEFAULT_SUGGESTIONS);
        renderMessages();
        saveMessages();
        chatInput.focus();
      }

      function selectConversation(conversationId) {
        if (requestInFlight) {
          return;
        }
        const conversation = conversations.find(
          (item) => item.id === conversationId,
        );
        if (!conversation) {
          return;
        }
        activeConversationId = conversation.id;
        messages = conversation.messages.length
          ? normalizeMessages(conversation.messages)
          : [welcomeMessage()];
        responseCache.clear();
        try {
          window.localStorage.setItem(
            ACTIVE_CONVERSATION_KEY,
            activeConversationId,
          );
        } catch (error) {
          // The selected conversation is still active in memory.
        }
        renderSuggestions(DEFAULT_SUGGESTIONS);
        renderMessages();
        renderHistory();
        if (sidebarMedia.matches) {
          setSidebarCollapsed(true);
        }
        chatInput.focus();
      }

      function renameConversation(conversationId) {
        const conversation = conversations.find(
          (item) => item.id === conversationId,
        );
        if (!conversation) {
          return;
        }
        const nextTitle = window.prompt("重命名会话", conversation.title);
        if (nextTitle === null) {
          return;
        }
        const title = nextTitle.replace(/\s+/g, " ").trim();
        if (!title) {
          return;
        }
        conversation.title = title.slice(0, 60);
        conversation.renamed = true;
        conversation.updatedAt = Date.now();
        persistConversations();
        renderHistory();
      }

      function deleteConversation(conversationId) {
        const conversation = conversations.find(
          (item) => item.id === conversationId,
        );
        if (!conversation) {
          return;
        }
        if (!window.confirm(`确定删除“${conversationPreview(conversation)}”吗？`)) {
          return;
        }

        const wasActive = conversationId === activeConversationId;
        conversations = conversations.filter(
          (item) => item.id !== conversationId,
        );
        persistConversations();

        if (!wasActive) {
          renderHistory();
          return;
        }
        if (conversations.length) {
          selectConversation(conversations[0].id);
        } else {
          startNewConversation();
        }
      }

      document.querySelectorAll("[data-sidebar-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          setSidebarCollapsed(
            appShell.dataset.sidebarCollapsed !== "true",
          );
        });
      });

      sidebarScrim.addEventListener("click", () => {
        setSidebarCollapsed(true);
      });

      historyList.addEventListener("click", (event) => {
        const actionButton = event.target.closest("[data-history-action]");
        if (actionButton) {
          const item = actionButton.closest(".history-item");
          if (!item) {
            return;
          }
          if (actionButton.dataset.historyAction === "rename") {
            renameConversation(item.dataset.conversationId);
          } else if (actionButton.dataset.historyAction === "delete") {
            deleteConversation(item.dataset.conversationId);
          }
          return;
        }

        const selectButton = event.target.closest(".history-select");
        if (selectButton) {
          const item = selectButton.closest(".history-item");
          if (item) {
            selectConversation(item.dataset.conversationId);
          }
        }
      });

      newChatButton.addEventListener("click", startNewConversation);

      document.querySelector(".tools-menu").addEventListener("click", (event) => {
        const button = event.target.closest("[data-prompt]");
        if (!button) {
          return;
        }
        if (sidebarMedia.matches) {
          setSidebarCollapsed(true);
        }
        sendMessage(button.dataset.prompt);
      });

      themeToggle.addEventListener("click", () => {
        setTheme(
          document.documentElement.dataset.theme === "dark" ? "light" : "dark",
        );
      });

      let resizePointerId = null;
      let resizeStartX = 0;
      let resizeStartWidth = DEFAULT_SIDEBAR_WIDTH;

      sidebarResizer.addEventListener("pointerdown", (event) => {
        if (sidebarMedia.matches || event.button !== 0) {
          return;
        }
        event.preventDefault();
        resizePointerId = event.pointerId;
        resizeStartX = event.clientX;
        resizeStartWidth =
          parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--sidebar-width",
            ),
          ) || DEFAULT_SIDEBAR_WIDTH;
        appShell.classList.add("is-resizing");
        sidebarResizer.setPointerCapture(event.pointerId);
      });

      sidebarResizer.addEventListener("pointermove", (event) => {
        if (event.pointerId !== resizePointerId) {
          return;
        }
        setSidebarWidth(
          resizeStartWidth + event.clientX - resizeStartX,
          false,
        );
      });

      function finishSidebarResize(event) {
        if (event.pointerId !== resizePointerId) {
          return;
        }
        resizePointerId = null;
        appShell.classList.remove("is-resizing");
        const width =
          parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--sidebar-width",
            ),
          ) || DEFAULT_SIDEBAR_WIDTH;
        setSidebarWidth(width);
      }

      sidebarResizer.addEventListener("pointerup", finishSidebarResize);
      sidebarResizer.addEventListener("pointercancel", finishSidebarResize);

      sidebarResizer.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") {
          return;
        }
        event.preventDefault();
        const direction = event.key === "ArrowRight" ? 1 : -1;
        const currentWidth =
          parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--sidebar-width",
            ),
          ) || DEFAULT_SIDEBAR_WIDTH;
        setSidebarWidth(currentWidth + direction * 16);
      });

      const handleSidebarMediaChange = (event) => {
        if (event.matches) {
          setSidebarCollapsed(true, false);
          return;
        }
        let savedState = false;
        try {
          savedState =
            window.localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === "true";
        } catch (error) {
          savedState = false;
        }
        setSidebarCollapsed(savedState, false);
      };

      if (sidebarMedia.addEventListener) {
        sidebarMedia.addEventListener("change", handleSidebarMediaChange);
      } else {
        sidebarMedia.addListener(handleSidebarMediaChange);
      }

      chatForm.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage(chatInput.value);
      });

      chatInput.addEventListener("input", resizeInput);
      chatInput.addEventListener("keydown", (event) => {
        if (
          event.key === "Enter"
          && !event.shiftKey
          && !event.isComposing
          && event.keyCode !== 229
        ) {
          event.preventDefault();
          chatForm.requestSubmit();
        }
      });

      suggestions.addEventListener("click", (event) => {
        const button = event.target.closest(".suggestion");
        if (button) {
          sendMessage(button.dataset.message);
        }
      });

      suggestionsToggle.addEventListener("click", () => {
        setSuggestionsCollapsed(
          composerArea.dataset.suggestionsCollapsed !== "true",
        );
      });

      clearButton.addEventListener("click", clearCurrentConversation);

      conversations = loadConversations();
      try {
        activeConversationId =
          window.localStorage.getItem(ACTIVE_CONVERSATION_KEY) || "";
      } catch (error) {
        activeConversationId = "";
      }

      let activeConversation = conversations.find(
        (conversation) => conversation.id === activeConversationId,
      );
      if (activeConversation) {
        messages = normalizeMessages(activeConversation.messages);
      } else {
        messages = loadMessages();
        if (!messages.length && conversations.length) {
          activeConversation = conversations[0];
          activeConversationId = activeConversation.id;
          messages = normalizeMessages(activeConversation.messages);
        }
      }

      if (!activeConversationId) {
        activeConversationId = makeId();
      }
      try {
        window.localStorage.setItem(
          ACTIVE_CONVERSATION_KEY,
          activeConversationId,
        );
      } catch (error) {
        // The current conversation remains active in memory.
      }

      if (!messages.length) {
        messages = [welcomeMessage()];
      }

      let savedTheme = "light";
      let savedSidebarWidth = DEFAULT_SIDEBAR_WIDTH;
      let savedSidebarCollapsed = false;
      try {
        savedTheme =
          window.localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light";
        savedSidebarWidth =
          Number(window.localStorage.getItem(SIDEBAR_WIDTH_KEY)) ||
          DEFAULT_SIDEBAR_WIDTH;
        savedSidebarCollapsed =
          window.localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === "true";
      } catch (error) {
        // Defaults apply when browser storage is unavailable.
      }
      setTheme(savedTheme);
      setSidebarWidth(savedSidebarWidth, false);
      setSuggestionsCollapsed(false);
      setSidebarCollapsed(
        sidebarMedia.matches ? true : savedSidebarCollapsed,
        false,
      );

      saveMessages();
      renderSuggestions(DEFAULT_SUGGESTIONS);
      renderMessages();
      resizeInput();
      checkService();
    })();
  </script>
</body>
</html>
