<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8ff">
  <meta
    name="description"
    content="知微老师高等数学对话演示，支持求导、积分和极限计算。"
  >
  <title>知微老师 · 高数对话演示</title>
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='katex/katex.min.css') }}"
  >
  <style>
    :root {
      --ink: #172033;
      --muted: #6d7a91;
      --line: #e4ecf7;
      --line-strong: #cbdaf0;
      --canvas: #f4f8ff;
      --surface: #ffffff;
      --soft-blue: #eaf2ff;
      --blue: #2868d8;
      --blue-dark: #174da3;
      --blue-ink: #123f87;
      --amber: #b77916;
      --red: #c2413b;
      --shadow: 0 12px 34px rgba(37, 99, 201, 0.09);
      --sidebar-bg: #f7faff;
      --sidebar-hover: #edf4ff;
      --sidebar-active: #e4eeff;
      --sidebar-width: 272px;
      --sidebar-rail-width: 68px;
      --sidebar-current-width: var(--sidebar-width);
      --scrim: rgba(15, 28, 48, 0.34);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e8f0ff;
      --muted: #9aabc5;
      --line: #293c5a;
      --line-strong: #3e587c;
      --canvas: #0d1626;
      --surface: #142033;
      --soft-blue: #1b3150;
      --blue: #5d91ef;
      --blue-dark: #a8c7ff;
      --blue-ink: #c9dcff;
      --amber: #d9a54d;
      --red: #ef8178;
      --shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
      --sidebar-bg: #101b2c;
      --sidebar-hover: #192941;
      --sidebar-active: #203655;
      --scrim: rgba(3, 8, 16, 0.62);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      line-height: 1.55;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(40, 104, 216, 0.18);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      display: flex;
      width: 100%;
      max-width: 1440px;
      height: 100vh;
      height: 100dvh;
      min-height: 540px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 0 0 1px rgba(203, 218, 240, 0.72);
    }

    .app-shell[data-sidebar-collapsed="true"] {
      --sidebar-current-width: var(--sidebar-rail-width);
    }

    .sidebar {
      position: relative;
      flex: 0 0 var(--sidebar-current-width);
      width: var(--sidebar-current-width);
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: var(--sidebar-bg);
      transition: width 0.2s ease, flex-basis 0.2s ease;
    }

    .app-shell.is-resizing .sidebar {
      transition: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-inner {
      width: var(--sidebar-current-width);
      padding: 12px 10px;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-top {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .sidebar-brand,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-section,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-footer,
    .app-shell[data-sidebar-collapsed="true"] .sidebar-resizer,
    .app-shell[data-sidebar-collapsed="true"] .tools-menu summary {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .new-chat-button {
      width: 44px;
      min-height: 44px;
      margin: 14px auto 0;
      padding: 0;
      border-radius: 12px;
    }

    .app-shell[data-sidebar-collapsed="true"] .new-chat-label {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .tools-menu {
      margin-top: 14px;
      padding-top: 14px;
    }

    .app-shell[data-sidebar-collapsed="true"] .tool-list {
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 0;
    }

    .app-shell[data-sidebar-collapsed="true"] .tool-button {
      display: grid;
      width: 44px;
      min-height: 44px;
      height: 44px;
      margin: 0 auto;
      padding: 0;
      place-items: center;
      border-radius: 12px;
    }

    .app-shell[data-sidebar-collapsed="true"] .tool-label {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .tool-icon {
      display: block;
      font-size: 0.7rem;
      letter-spacing: -0.02em;
    }

    .app-shell[data-sidebar-collapsed="true"] .tool-nav {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .toolbox-scroll {
      padding: 0;
      overflow: hidden;
    }

    .app-shell[data-sidebar-collapsed="true"] .toolbox-tabs {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .toolbox-panel:not(
        [data-toolbox-panel="calculator"]
      ) {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"]
      .toolbox-panel[data-toolbox-panel="calculator"] {
      display: block;
    }

    .app-shell[data-sidebar-collapsed="true"] .toolbox-section {
      padding: 0;
      border-top: 0;
    }

    .app-shell[data-sidebar-collapsed="true"] .toolbox-section:not(.toolbox-quick) {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .toolbox-heading,
    .app-shell[data-sidebar-collapsed="true"] .quick-tool-head,
    .app-shell[data-sidebar-collapsed="true"] .quick-tool-row,
    .app-shell[data-sidebar-collapsed="true"] .quick-caption {
      display: none;
    }

    .app-shell[data-sidebar-collapsed="true"] .quick-stack {
      gap: 8px;
    }

    .app-shell[data-sidebar-collapsed="true"] .quick-tool {
      position: relative;
      display: grid;
      width: 44px;
      min-height: 44px;
      height: 44px;
      margin: 0 auto;
      padding: 0;
      place-items: center;
      border-radius: 12px;
      cursor: pointer;
    }

    .app-shell[data-sidebar-collapsed="true"] .quick-tool:hover,
    .app-shell[data-sidebar-collapsed="true"] .quick-tool:focus-visible {
      border-color: #a9c5ec;
      background: var(--sidebar-hover);
    }

    .app-shell[data-sidebar-collapsed="true"] .quick-tool::before {
      color: var(--blue-dark);
      content: attr(data-icon);
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .sidebar-inner {
      display: flex;
      width: var(--sidebar-width);
      height: 100%;
      min-height: 0;
      flex-direction: column;
      padding: 14px 12px 12px;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 40px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
      color: var(--ink);
      font-size: 0.88rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .sidebar-logo {
      display: grid;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-size: 0.82rem;
    }

    .icon-button {
      display: grid;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--surface);
      font-size: 1rem;
      font-weight: 800;
      line-height: 1;
    }

    .icon-button:hover {
      border-color: var(--line-strong);
      color: var(--blue-dark);
      background: var(--sidebar-hover);
    }

    .new-chat-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 42px;
      margin-top: 16px;
      padding: 8px 12px;
      border: 1px solid var(--blue);
      border-radius: 10px;
      color: #ffffff;
      background: var(--blue);
      font-size: 0.84rem;
      font-weight: 800;
    }

    .new-chat-button:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .sidebar-section {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      margin-top: 20px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 6px 8px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .history-list {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: thin;
    }

    .history-item {
      position: relative;
      display: flex;
      align-items: stretch;
      width: 100%;
      margin-bottom: 4px;
      overflow: visible;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--ink);
      background: transparent;
    }

    .history-item::before {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 0;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: transparent;
      content: "";
    }

    .history-select {
      min-width: 0;
      flex: 1;
      padding: 9px 10px;
      overflow: hidden;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
    }

    .history-actions {
      position: absolute;
      top: 50%;
      right: 6px;
      display: flex;
      gap: 3px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 0.15s ease;
    }

    .history-item:hover .history-actions,
    .history-item:focus-within .history-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .history-action {
      min-height: 24px;
      padding: 2px 5px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      color: var(--muted);
      background: var(--surface);
      font-size: 0.64rem;
      font-weight: 750;
    }

    .history-action:hover {
      border-color: #a9c5ec;
      color: var(--blue-dark);
      background: var(--soft-blue);
    }

    .history-item:hover {
      border-color: var(--line);
      background: var(--sidebar-hover);
    }

    .history-item[data-active="true"] {
      border-color: #c8dbf7;
      background: var(--sidebar-active);
    }

    .history-item[data-active="true"]::before {
      background: var(--blue);
    }

    .history-title,
    .history-time {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-title {
      font-size: 0.79rem;
      font-weight: 750;
      transition: padding-right 0.15s ease;
    }

    .history-item:hover .history-title,
    .history-item:focus-within .history-title {
      padding-right: 82px;
    }

    .history-time {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .history-empty {
      padding: 10px;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.6;
    }

    .tools-menu {
      min-height: 0;
      max-height: 58%;
      flex: 0 1 auto;
      margin-top: 12px;
      padding-top: 10px;
      overflow-x: hidden;
      overflow-y: auto;
      border-top: 1px solid var(--line);
      scrollbar-width: thin;
    }

    .tools-menu-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 32px;
      padding: 3px 6px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      list-style: none;
    }

    .tools-menu-summary::-webkit-details-marker {
      display: none;
    }

    .tools-menu-title {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .tools-menu-count {
      padding: 1px 7px;
      border-radius: 999px;
      color: var(--blue-dark);
      background: var(--soft-blue);
      font-size: 0.63rem;
      font-weight: 800;
    }

    .tools-menu-marker {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1;
    }

    .tools-menu-marker::before {
      content: "+";
    }

    .tools-menu[open] .tools-menu-marker::before {
      content: "−";
    }

    .tool-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding: 2px 4px 0;
    }

    .tool-button {
      display: grid;
      place-items: center;
      min-height: 33px;
      padding: 5px 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--blue-dark);
      background: var(--surface);
      font-size: 0.73rem;
      font-weight: 800;
      transition:
        border-color 0.15s ease,
        background 0.15s ease;
    }

    .tool-icon {
      display: none;
    }

    .tool-button:hover {
      border-color: #a9c5ec;
      background: var(--sidebar-hover);
    }

    .tool-button.is-wide {
      grid-column: 1 / -1;
    }

    .tool-nav {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }

    .tool-nav-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 6px;
      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .tool-nav-heading::after {
      flex: 1;
      height: 1px;
      background: var(--line);
      content: "";
    }

    .tool-nav-list {
      display: grid;
      gap: 4px;
    }

    .tool-chapter {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
    }

    .tool-chapter[open] {
      border-color: #c8dbf7;
      background: var(--sidebar-hover);
    }

    .tool-chapter > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 34px;
      padding: 6px 9px;
      color: var(--ink);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      list-style: none;
    }

    .tool-chapter > summary::-webkit-details-marker {
      display: none;
    }

    .tool-chapter-count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.65rem;
      font-weight: 750;
    }

    .tool-chapter-arrow {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.66rem;
      line-height: 1;
      transition: transform 0.15s ease;
    }

    .tool-chapter[open] .tool-chapter-arrow {
      transform: rotate(90deg);
    }

    .tool-chapter > summary:hover {
      color: var(--blue-dark);
      background: var(--soft-blue);
    }

    .tool-topic-list {
      display: grid;
      gap: 2px;
      padding: 0 6px 7px;
    }

    .tool-topic {
      display: block;
      width: 100%;
      padding: 6px 8px 6px 15px;
      overflow: hidden;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      font-size: 0.72rem;
      line-height: 1.35;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tool-topic:hover,
    .tool-topic:focus-visible {
      color: var(--blue-dark);
      background: var(--surface);
    }

    html[data-theme="dark"] .tool-chapter[open] {
      border-color: rgba(112, 166, 240, 0.32);
    }

    html[data-theme="dark"] .tool-chapter[open] > summary {
      background: rgba(56, 126, 232, 0.12);
    }

    html[data-theme="dark"] .tool-topic:hover,
    html[data-theme="dark"] .tool-topic:focus-visible {
      background: rgba(255, 255, 255, 0.06);
    }

    .solver-dialog {
      width: min(720px, calc(100vw - 28px));
      max-width: none;
      max-height: min(780px, calc(100dvh - 28px));
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(20, 55, 110, 0.24);
    }

    .solver-dialog::backdrop {
      background: rgba(11, 27, 52, 0.38);
      backdrop-filter: blur(3px);
    }

    .solver-shell {
      display: flex;
      max-height: min(780px, calc(100dvh - 28px));
      flex-direction: column;
    }

    .solver-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
    }

    .solver-header h2 {
      margin: 0;
      color: var(--ink);
      font-size: 1.02rem;
      line-height: 1.35;
    }

    .solver-header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .solver-body {
      min-height: 0;
      padding: 16px 20px;
      overflow-y: auto;
    }

    .solver-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .solver-field {
      display: grid;
      min-width: 0;
      gap: 5px;
    }

    .solver-field.is-wide {
      grid-column: 1 / -1;
    }

    .solver-field label {
      color: #60708b;
      font-size: 0.73rem;
      font-weight: 800;
    }

    .solver-field input,
    .solver-field select,
    .solver-field textarea {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #d5e2f3;
      border-radius: 9px;
      color: var(--ink);
      background: #fbfdff;
      font-size: 0.82rem;
      outline: none;
    }

    .solver-field textarea {
      min-height: 70px;
      resize: vertical;
      line-height: 1.5;
    }

    .solver-field input:focus,
    .solver-field select:focus,
    .solver-field textarea:focus {
      border-color: #87afea;
      box-shadow: 0 0 0 3px rgba(40, 104, 216, 0.08);
    }

    .solver-hint {
      margin: 14px 0 0;
      padding: 9px 11px;
      border-radius: 9px;
      color: #53647f;
      background: var(--soft-blue);
      font-size: 0.74rem;
      line-height: 1.55;
    }

    .solver-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 20px 17px;
      border-top: 1px solid var(--line);
      background: #fbfdff;
    }

    .solver-status {
      min-width: 0;
      color: var(--red);
      font-size: 0.75rem;
    }

    .solver-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
    }

    .solver-button {
      min-height: 38px;
      padding: 7px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      color: var(--blue-dark);
      background: var(--surface);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .solver-button:hover {
      border-color: #9ebce8;
      background: var(--sidebar-hover);
    }

    .solver-button.primary {
      border-color: var(--blue);
      color: #ffffff;
      background: var(--blue);
    }

    .solver-button.primary:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .solver-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .formula-body {
      display: grid;
      gap: 16px;
    }

    .formula-group {
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fbfdff;
    }

    .formula-group h3 {
      margin: 0 0 10px;
      color: var(--blue-dark);
      font-size: 0.86rem;
    }

    .formula-list {
      display: grid;
      gap: 9px;
      margin: 0;
    }

    .formula-item {
      display: grid;
      gap: 4px;
    }

    .formula-item code {
      color: var(--ink);
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 1rem;
      line-height: 1.5;
      white-space: normal;
    }

    .formula-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.5;
    }

    html[data-theme="dark"] .solver-field input,
    html[data-theme="dark"] .solver-field select,
    html[data-theme="dark"] .solver-field textarea,
    html[data-theme="dark"] .solver-footer,
    html[data-theme="dark"] .formula-group {
      border-color: var(--line);
      background: #101b2c;
    }

    html[data-theme="dark"] .solver-field label,
    html[data-theme="dark"] .solver-hint {
      color: var(--muted);
    }

    .sidebar-footer {
      flex: 0 0 auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .theme-button {
      display: flex;

      background: transparent;

      font-weight: 850;
      white-space: nowrap;
    }

      background: var(--sidebar-hover);

      color: var(--blue-dark);
      background: var(--sidebar-active);

      margin: 2px 2px 9px;

      height: 32px;

      border-radius: 7px;
      color: var(--ink);
      background: var(--surface);
      font-size: 0.72rem;
      outline: none;
    }

      gap: 5px;
    }

    .formula-card-group > h3 {

      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 850;

      padding: 7px 8px;

      background: var(--surface);

      text-align: left;

      background: var(--surface);

      font-size: 0.65rem;
      font-weight: 800;
    }

    .wrongbook-answer-text {

      margin-top: 6px;

      color: var(--muted);

      white-space: pre-wrap;
      word-break: break-word;

      gap: 5px;
      margin-top: 7px;
    }

      border: 1px solid var(--line);

      background: var(--soft-blue);
      font-size: 0.65rem;
      font-weight: 800;

    .toolbox-section {
      padding: 12px 2px;
      border-top: 1px solid var(--line);

    .toolbox-section:first-child {

    .toolbox-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 4px 9px;
      color: var(--muted);
      font-size: 0.7rem;

      background: var(--surface);
      font-size: 0.75rem;
      outline: none;

    }

    }

    .message-content {
      width: fit-content;
      max-width: min(76%, 680px);
      min-width: 0;
    }

    .message[data-role="user"] .message-content {
      display: flex;
      align-items: flex-end;
      flex-direction: column;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 18px;
      margin: 0 6px 5px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .message-meta time {
      color: #93a0b4;
      font-size: 0.64rem;
      font-weight: 500;
      opacity: 0.8;
    }

    .message[data-role="user"] .message-meta {
      justify-content: flex-end;
    }

    .message-actions {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      margin: 5px 6px 0;
    }

    .message-action {
      min-height: 24px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      font-size: 0.62rem;
      font-weight: 800;
    }

    .message-action:hover {
      border-color: #a9c5ec;
      color: var(--blue-dark);
      background: var(--sidebar-hover);
    }

    .message-action[data-bookmarked="true"] {
      border-color: #b9d0ef;
      color: var(--blue-dark);
      background: var(--soft-blue);
    }

    .bubble {
      max-width: 100%;
      min-width: 74px;
      margin: 0 2px;
      padding: 14px 17px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px 18px 18px 18px;
      background: var(--surface);
      box-shadow: 0 4px 14px rgba(37, 99, 201, 0.045);
    }

    .message[data-role="user"] .bubble {
      border-color: var(--blue);
      border-radius: 18px 6px 18px 18px;
      color: #ffffff;
      background: var(--blue);
      box-shadow: none;
    }

    .message-text {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .formula {
      max-width: 100%;
      margin: 14px -17px 12px;
      padding: 15px 12px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      border: 0;
      border-radius: 12px;
      color: var(--blue-ink);
      background: #f2f7ff;
      text-align: center;
      -webkit-overflow-scrolling: touch;
    }

    .formula .katex {
      font-size: 1.18em;
      white-space: nowrap;
    }

    .formula .katex-display {
      min-width: max-content;
    }

    .function-plot {
      width: 100%;
      max-width: 100%;
      margin: 13px 0 4px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
    }

    .function-plot img {
      display: block;
      width: 100%;
      height: auto;
    }

    .verdict {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      margin-top: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .verdict[data-state="correct"] {
      color: var(--blue-dark);
      background: #eaf2ff;
    }

    .verdict[data-state="incorrect"] {
      color: #84261f;
      background: #fff0ee;
    }

    .calculation-details {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .calculation-details summary {
      width: fit-content;
      cursor: pointer;
      font-weight: 750;
    }

    .calculation-grid {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 5px 12px;
      margin: 8px 0 1px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .calculation-grid dt {
      color: #71809a;
      font-size: 0.73rem;
      font-weight: 700;
    }

    .calculation-grid dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 0.76rem;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7fa4dc;
      animation: pulse 1.15s ease-in-out infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes pulse {
      0%,
      70%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      35% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .messages {
        scroll-behavior: auto;
      }

      .typing span {
        animation-duration: 2s;
      }
    }

    .composer-area {
      flex: 0 0 auto;
      padding: 0 28px 18px;
      border-top: 1px solid var(--line);
      background: #ffffff;
    }

    .suggestions-toolbar {
      display: flex;
      justify-content: flex-end;
      padding: 8px 2px 0;
    }

    .suggestions-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      padding: 3px 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 0.7rem;
      font-weight: 750;
    }

    .suggestions-toggle:hover {
      border-color: var(--line);
      color: var(--blue-dark);
      background: #f7faff;
    }

    .suggestions-toggle-icon {
      display: inline-block;
      font-size: 0.9rem;
      line-height: 1;
      transform: rotate(180deg);
      transition: transform 0.15s ease;
    }

    .composer-area[data-suggestions-collapsed="true"] .suggestions-toggle-icon {
      transform: rotate(0deg);
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 2px 10px;
      overflow: visible;
    }

    .composer-area[data-suggestions-collapsed="true"] .suggestions {
      display: none;
    }

    .suggestions:empty {
      display: none;
    }

    .suggestion {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 5px 11px;
      border: 1px solid #d4e2f5;
      border-radius: 999px;
      color: var(--blue-dark);
      background: #f7faff;
      font-size: 0.77rem;
      font-weight: 750;
      transition: transform 0.15s ease, border-color 0.15s ease,
        background-color 0.15s ease;
    }

    .suggestion:hover {
      border-color: #a9c5ec;
      background: #edf4ff;
      transform: translateY(-1px);
    }

    .suggestion:active {
      transform: translateY(0) scale(0.98);
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 9px;
      padding: 8px;
      border: 1px solid #d7e3f3;
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(37, 99, 201, 0.07);
    }

    .composer:focus-within {
      border-color: #8fb3e8;
      box-shadow: 0 0 0 3px rgba(40, 104, 216, 0.09);
    }

    .chat-input {
      width: 100%;
      min-height: 42px;
      max-height: 132px;
      padding: 9px 8px 8px;
      overflow-y: auto;
      resize: none;
      border: 0;
      color: var(--ink);
      background: transparent;
      outline: none;
      line-height: 1.5;
    }

    .chat-input::placeholder {
      color: #91a0b7;
    }

    .send-button {
      min-width: 72px;
      min-height: 42px;
      padding: 8px 17px;
      border: 1px solid var(--blue);
      border-radius: 10px;
      color: #ffffff;
      background: var(--blue);
      font-weight: 800;
    }

    .send-button:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    .send-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    html[data-theme="dark"] .chat-header,
    html[data-theme="dark"] .composer-area {
      background: rgba(20, 32, 51, 0.97);
    }

    html[data-theme="dark"] .messages {
      background: #101b2c;
    }

    html[data-theme="dark"] .status-chip,
    html[data-theme="dark"] .suggestion {
      background: #182840;
    }

    html[data-theme="dark"] .bubble {
      background: #182840;
    }

    html[data-theme="dark"] .message[data-role="user"] .bubble {
      background: var(--blue);
    }

    html[data-theme="dark"] .formula {
      background: #1a2e4d;
    }

    html[data-theme="dark"] .message[data-role="user"] .avatar {
      background: #182840;
    }

    @media (hover: none) {
      .history-actions {
        position: static;
        align-items: center;
        padding-right: 6px;
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }

      .history-item .history-title {
        padding-right: 0;
      }
    }

    @media (max-width: 820px) {
      .app-shell {
        min-height: 0;
      }

      .sidebar {
        position: fixed;
        z-index: 30;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(86vw, 340px);
        flex-basis: auto;
        border-right: 1px solid var(--line);
        box-shadow: 14px 0 34px rgba(24, 48, 84, 0.14);
        transform: translateX(0);
        transition: transform 0.2s ease;
      }

      .app-shell[data-sidebar-collapsed="true"] .sidebar {
        width: min(86vw, 340px);
        border-right: 1px solid var(--line);
        transform: translateX(-104%);
      }

      .sidebar-inner {
        width: 100%;
      }

      .sidebar-resizer {
        display: none;
      }

      .sidebar-scrim {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: block;
        border: 0;
        background: var(--scrim);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .app-shell[data-sidebar-collapsed="false"] .sidebar-scrim {
        opacity: 1;
        pointer-events: auto;
      }

      .conversation-panel {
        display: none;
      }

      .preview-panel {
        flex-basis: 210px;
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        width: 100%;
        border: 0;
      }

      .chat-header {
        min-height: 70px;
        padding: 11px 14px;
      }

      .brand-mark {
        flex-basis: 38px;
        width: 38px;
        height: 38px;
      }

      .brand-copy h1 {
        font-size: 0.98rem;
      }

      .brand-copy p,
      .clear-button {
        display: none;
      }

      .brand {
        gap: 8px;
      }

      .status-chip {
        min-width: auto;
        padding: 6px 9px;
      }

      .messages {
        padding: 22px 12px 16px;
      }

      .message {
        gap: 7px;
        margin-bottom: 20px;
      }

      .avatar {
        flex-basis: 30px;
        width: 30px;
        height: 30px;
        font-size: 0.73rem;
      }

      .message-content {
        max-width: 87%;
      }

      .bubble {
        padding: 10px 12px;
      }

      .formula {
        margin-right: -12px;
        margin-left: -12px;
      }

      .composer-area {
        padding: 0 10px 12px;
      }

      .solver-dialog {
        width: calc(100vw - 16px);
        max-height: calc(100dvh - 16px);
        border-radius: 13px;
      }

      .solver-shell {
        max-height: calc(100dvh - 16px);
      }

      .solver-header,
      .solver-body,
      .solver-footer {
        padding-right: 14px;
        padding-left: 14px;
      }

      .solver-grid {
        grid-template-columns: 1fr;
      }

      .solver-field.is-wide {
        grid-column: auto;
      }

      .solver-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .solver-actions {
        justify-content: flex-end;
      }

      .preview-panel {
        flex-basis: 188px;
      }

      .preview-head {
        padding-right: 9px;
        padding-left: 9px;
      }

      .preview-content {
        padding: 9px 10px 12px;
      }

      .workspace-tab {
        display: none;
      }

      .send-button {
        min-width: 62px;
        padding-right: 13px;
        padding-left: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell" data-sidebar-collapsed="false">
    <aside class="sidebar" id="sidebar" aria-label="会话与工具">
      <div class="sidebar-inner">
        <div class="sidebar-top">
          <div class="sidebar-brand">
            <span class="sidebar-logo" aria-hidden="true">知</span>
            <span>知微高数</span>
          </div>
          <button
            class="icon-button"
            type="button"
            data-sidebar-toggle
            aria-label="折叠侧边栏"
            title="折叠侧边栏"
          >‹</button>
        </div>

        <div class="toolbox-scroll">
          <div class="toolbox-tabs" role="tablist" aria-label="高数工具分类">
            <button
              class="toolbox-tab"
              type="button"
              role="tab"
              aria-selected="true"
              data-toolbox-tab="calculator"
            >计算工具</button>
            <button
              class="toolbox-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-toolbox-tab="formulas"
            >公式合集</button>
            <button
              class="toolbox-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-toolbox-tab="wrongbook"
            >错题集 <span id="wrongBookTabCount">0</span></button>
          </div>

          <div
            class="toolbox-panel"
            data-toolbox-panel="calculator"
            data-active="true"
          >
          <section class="toolbox-section toolbox-quick">
            <div class="toolbox-heading">
              <span>快速计算</span>
              <span>变量默认 x</span>
            </div>
            <div class="quick-stack">
              <form
                class="quick-tool"
                id="quickLimitForm"
                data-icon="lim"
                data-focus-target="quickLimitExpression"
              >
                <div class="quick-tool-head">
                  <span class="quick-tool-title">
                    <span class="quick-tool-mark">lim</span>
                    极限
                  </span>
                </div>
                <div class="quick-tool-row is-limit">
                  <input
                    class="quick-input"
                    id="quickLimitExpression"
                    placeholder="sin(x)/x"
                    autocomplete="off"
                    required
                  >
                  <span class="quick-caption">→</span>
                  <input
                    class="quick-input"
                    id="quickLimitPoint"
                    value="0"
                    autocomplete="off"
                    required
                  >
                </div>
                <div class="quick-tool-row">
                  <select class="quick-select" id="quickLimitDirection">
                    <option value="">双侧</option>
                    <option value="+">右极限</option>
                    <option value="-">左极限</option>
                  </select>
                  <button class="quick-calculate" type="submit">计算</button>
                </div>
              </form>

              <form
                class="quick-tool"
                id="quickDerivativeForm"
                data-icon="d/dx"
                data-focus-target="quickDerivativeExpression"
              >
                <div class="quick-tool-head">
                  <span class="quick-tool-title">
                    <span class="quick-tool-mark">d/dx</span>
                    求导
                  </span>
                </div>
                <div class="quick-tool-row">
                  <input
                    class="quick-input"
                    id="quickDerivativeExpression"
                    placeholder="x^2"
                    autocomplete="off"
                    required
                  >
                  <button class="quick-calculate" type="submit">计算</button>
                </div>
              </form>

              <form
                class="quick-tool"
                id="quickIndefiniteForm"
                data-icon="∫"
                data-focus-target="quickIndefiniteExpression"
              >
                <div class="quick-tool-head">
                  <span class="quick-tool-title">
                    <span class="quick-tool-mark">∫</span>
                    不定积分
                  </span>
                </div>
                <div class="quick-tool-row">
                  <input
                    class="quick-input"
                    id="quickIndefiniteExpression"
                    placeholder="x^2"
                    autocomplete="off"
                    required
                  >
                  <button class="quick-calculate" type="submit">计算</button>
                </div>
              </form>

              <form
                class="quick-tool"
                id="quickDefiniteForm"
                data-icon="∫a"
                data-focus-target="quickDefiniteExpression"
              >
                <div class="quick-tool-head">
                  <span class="quick-tool-title">
                    <span class="quick-tool-mark">∫</span>
                    定积分
                  </span>
                </div>
                <div class="quick-tool-row is-integral">
                  <input
                    class="quick-input"
                    id="quickDefiniteExpression"
                    placeholder="x^2"
                    autocomplete="off"
                    required
                  >
                  <input
                    class="quick-input"
                    id="quickDefiniteLower"
                    value="0"
                    aria-label="积分下限"
                    required
                  >
                  <input
                    class="quick-input"
                    id="quickDefiniteUpper"
                    value="1"
                    aria-label="积分上限"
                    required
                  >
                </div>
                <button class="quick-calculate" type="submit">计算</button>
              </form>

              <form
                class="quick-tool"
                id="quickDifferentialForm"
                data-icon="y'"
                data-focus-target="quickDifferentialExpression"
              >
                <div class="quick-tool-head">
                  <span class="quick-tool-title">
                    <span class="quick-tool-mark">y'</span>
                    微分方程
                  </span>
                </div>
                <div class="quick-tool-row">
                  <input
                    class="quick-input"
                    id="quickDifferentialExpression"
                    value="y' - y"
                    placeholder="y' - y"
                    autocomplete="off"
                    required
                  >
                  <button class="quick-calculate" type="submit">计算</button>
                </div>
              </form>
            </div>
          </section>

          <section class="toolbox-section">
            <div class="toolbox-heading">
              <span>函数绘图</span>
              <span>每行一条曲线</span>
            </div>
            <form class="quick-tool quick-plot-form" id="quickPlotForm" data-icon="plot">
              <textarea
                class="quick-input quick-plot-input"
                id="quickPlotExpression"
                rows="2"
                placeholder="sin(x)&#10;x^2/4"
                required
              ></textarea>
              <div class="quick-plot-range">
                <input
                  class="quick-input"
                  id="quickPlotXMin"
                  type="number"
                  value="-6"
                  step="0.5"
                  aria-label="X 最小值"
                >
                <input
                  class="quick-input"
                  id="quickPlotXMax"
                  type="number"
                  value="6"
                  step="0.5"
                  aria-label="X 最大值"
                >
              </div>
              <button class="quick-calculate" type="submit">绘制</button>
            </form>
          </section>

          <section class="toolbox-section">
            <div class="toolbox-heading">
              <span>智能题型库</span>
              <span>高频考点</span>
            </div>
            <div class="topic-presets">
              <button class="topic-preset" type="button" data-toolbox-prompt="判断级数 1/n^2 收敛">级数敛散</button>
              <button class="topic-preset" type="button" data-toolbox-prompt="求隐函数 x^2+y^2=1 的 dy/dx">隐函数求导</button>
              <button class="topic-preset" type="button" data-toolbox-prompt="求二重积分 x*y 区域 0 到 1">二重积分</button>
              <button class="topic-preset" type="button" data-toolbox-prompt="求偏导 x^2*y 对 x">偏导数</button>
            </div>
            <div class="quick-favorites">
              <button class="favorite-item" type="button" data-toolbox-tab="wrongbook">错题工作台：收藏与重练</button>
            </div>
          </section>

          <section class="toolbox-section">
            <div class="toolbox-heading">
              <span>快捷工具</span>
              <span>插入到输入框</span>
            </div>
            <div class="symbol-board">
              <button class="symbol-button" type="button" data-symbol="∫">∫</button>
              <button class="symbol-button" type="button" data-symbol="lim ">lim</button>
              <button class="symbol-button" type="button" data-symbol="pi">π</button>
              <button class="symbol-button" type="button" data-symbol="sqrt(">√</button>
              <button class="symbol-button" type="button" data-symbol="^2">x²</button>
              <button class="symbol-button" type="button" data-symbol="oo">∞</button>
            </div>
            <div class="formula-recognition">
              <input
                id="formulaImageInput"
                type="file"
                accept="image/*"
                tabindex="-1"
              >
              <button
                class="topic-preset"
                id="formulaImageButton"
                type="button"
                style="width: 100%; margin-top: 7px;"
              >
                图片识别（暂未接入）
              </button>
              <p
                class="quick-caption"
                id="formulaImageStatus"
                role="status"
              >当前版本请直接输入题目文字</p>
            </div>
          </section>
          </div>

          <div
            class="toolbox-panel"
            data-toolbox-panel="formulas"
            data-active="false"
          >
            <section class="toolbox-section">
              <div class="toolbox-heading">
                <span>公式合集</span>
                <span>点击插入输入框</span>
              </div>
              <label class="formula-search">
                <span class="sr-only">搜索公式</span>
                <input
                  id="formulaSearchInput"
                  type="search"
                  placeholder="搜索：导数、积分、级数…"
                  autocomplete="off"
                >
              </label>
              <div class="formula-card-grid" id="formulaCardGrid"></div>
            </section>
          </div>

          <div
            class="toolbox-panel"
            data-toolbox-panel="wrongbook"
            data-active="false"
          >
            <section class="toolbox-section">
              <div class="toolbox-heading">
                <span>错题集</span>
                <span id="wrongBookCount">0 题</span>
              </div>
              <div class="wrongbook-toolbar">
                <span>浏览器本地保存，可反复练习</span>
                <button
                  class="wrongbook-clear"
                  id="wrongBookExport"
                  type="button"
                >&#23548;&#20986;</button>
                <button
                  class="wrongbook-clear"
                  id="wrongBookClear"
                  type="button"
                >清空</button>

      function normalizeMessages(value) {
        if (!Array.isArray(value)) {
          return [];
        }
        return value
          .filter((item) => item && (item.role === "user" || item.role === "assistant"))
          .slice(-MAX_STORED_MESSAGES)
          .map((item) => ({
            id: String(item.id || makeId()),
            role: item.role,
            text: String(item.text || ""),
            formulaLatex: String(item.formulaLatex || ""),
            formulaText: String(item.formulaText || ""),
            resultLabel: String(item.resultLabel || ""),
            resultValue: String(item.resultValue || ""),
            verdict: typeof item.verdict === "boolean" ? item.verdict : null,
            plotUrl: String(item.plotUrl || ""),
            createdAt: String(item.createdAt || currentTime()),
          }));
      }

      function loadConversations() {
        try {
          const parsed = JSON.parse(
            window.localStorage.getItem(CONVERSATIONS_KEY) || "[]",
          );
          if (!Array.isArray(parsed)) {
            return [];
          }
          return parsed
            .filter((item) => item && item.id)
            .slice(0, MAX_CONVERSATIONS)
            .map((item) => ({
              id: String(item.id),
              title: String(item.title || "历史对话"),
              renamed: Boolean(item.renamed),
              updatedAt: Number(item.updatedAt) || Date.now(),
              messages: normalizeMessages(item.messages),
            }));
        } catch (error) {
          return [];
        }
      }

      function persistConversations() {
        try {
          window.localStorage.setItem(
            CONVERSATIONS_KEY,
            JSON.stringify(conversations.slice(0, MAX_CONVERSATIONS)),
          );
        } catch (error) {
          // Conversation history remains optional when browser storage is unavailable.
        }
      }

      function makeId() {
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function sessionId() {
        try {
          let value = window.localStorage.getItem(SESSION_KEY);
          if (!value) {
            value =
              window.crypto && window.crypto.randomUUID
                ? window.crypto.randomUUID()
                : `session-${makeId()}`;
            window.localStorage.setItem(SESSION_KEY, value);
          }
          return value;
        } catch (error) {
          return "session-fallback";
        }
      }

        try {

          // The conversation still works when browser storage is unavailable.

        updateCurrentConversation();

      function currentConversationTitle() {
        const firstQuestion = messages.find(
          (message) => message.role === "user" && message.text.trim(),
        );
        if (!firstQuestion) {
          return "新会话";
        }
        const compact = firstQuestion.text.replace(/\s+/g, " ").trim();
        return compact.length > 22 ? `${compact.slice(0, 22)}…` : compact;
      }

      function conversationPreview(conversation) {
        if (conversation.renamed && conversation.title) {
          return conversation.title;
        }
        const firstQuestion = conversation.messages.find(
          (message) => message.role === "user" && message.text.trim(),
        );
        if (!firstQuestion) {
          return conversation.title || "新会话";
        }
        return firstQuestion.text.replace(/\s+/g, " ").trim();
      }

            id: activeConversationId,
            title:
              existingConversation && existingConversation.renamed
                ? existingConversation.title
                : currentConversationTitle(),
            renamed: Boolean(existingConversation?.renamed),
            updatedAt: Date.now(),
            messages: messages.slice(-MAX_STORED_MESSAGES),
          });
          conversations = conversations.slice(0, MAX_CONVERSATIONS);
        }
        persistConversations();
        renderHistory();
      }

      function historyTime(timestamp) {
        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) {
          return "";
        }
        return date.toLocaleString("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      }

      function renderHistory() {
        const fragment = document.createDocumentFragment();
        if (!conversations.length) {
          fragment.append(
            element(
              "div",
              "history-empty",
              "所有会话关闭后会保存在这里",
            ),
          );
        } else {
          conversations.forEach((conversation) => {
            const item = element("div", "history-item");
            item.dataset.conversationId = conversation.id;
            item.dataset.active = String(
              conversation.id === activeConversationId,
            );

            const selectButton = element("button", "history-select");
            selectButton.type = "button";
            selectButton.setAttribute(
              "aria-label",
              `打开会话：${conversationPreview(conversation)}`,
            );
            if (conversation.id === activeConversationId) {
              selectButton.setAttribute("aria-current", "true");
            }
            selectButton.append(
              element("span", "history-title", conversationPreview(conversation)),
              element("span", "history-time", historyTime(conversation.updatedAt)),
            );

            const actions = element("div", "history-actions");
            const renameButton = element("button", "history-action", "重命名");
            renameButton.type = "button";
            renameButton.dataset.historyAction = "rename";
            renameButton.setAttribute(
              "aria-label",
              `重命名会话：${conversationPreview(conversation)}`,
            );

            const deleteButton = element("button", "history-action", "删除");
            deleteButton.type = "button";
            deleteButton.dataset.historyAction = "delete";
            deleteButton.setAttribute(
              "aria-label",
              `删除会话：${conversationPreview(conversation)}`,
            );

            actions.append(renameButton, deleteButton);
            item.append(selectButton, actions);
            fragment.append(item);
          });
        }
        historyList.replaceChildren(fragment);
        historyCount.textContent = String(conversations.length);
      }

      function requestHistory() {
        return messages
          .filter((message) => !message.loading)
          .slice(-MAX_REQUEST_HISTORY)
          .map((message) => ({
            role: message.role,
            text: message.text.slice(0, 600),
          }))
          .filter((message) => message.text);
      }

      function cacheResponse(question, data) {
        if (!data || data.history_used || data.intent === "history") {
          return;
        }
        const key = question.trim();
        if (!key) {
          return;
        }
        responseCache.delete(key);
        responseCache.set(key, data);
        while (responseCache.size > RESPONSE_CACHE_LIMIT) {
          responseCache.delete(responseCache.keys().next().value);
        }
      }

      function element(tagName, className, text) {
        const node = document.createElement(tagName);
        if (className) {
          node.className = className;
        }
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      }

      function normalizeWrongBookItem(item) {
        if (!item || !String(item.text || "").trim()) {
          return null;
        }
        return {
          id: String(item.id || makeId()),
          text: String(item.text).trim(),
          answer: String(item.answer || ""),
          createdAt: Number(item.createdAt) || Date.now(),
          lastPracticedAt: Number(item.lastPracticedAt) || 0,
          practiceCount: Math.max(0, Number(item.practiceCount) || 0),
          sourceConversationId: String(item.sourceConversationId || ""),
          sourceMessageId: String(item.sourceMessageId || ""),
        };
      }

      function loadWrongBook() {
        try {
          const parsed = JSON.parse(
            window.localStorage.getItem(WRONG_BOOK_KEY) || "[]",
          );
          if (!Array.isArray(parsed)) {
            return [];
          }
          return parsed
            .map(normalizeWrongBookItem)
            .filter(Boolean)
            .slice(0, MAX_WRONG_BOOK_ITEMS);
        } catch (error) {
          return [];
        }
      }

      function saveWrongBook() {
        try {
          window.localStorage.setItem(
            WRONG_BOOK_KEY,
            JSON.stringify(wrongBook.slice(0, MAX_WRONG_BOOK_ITEMS)),
          );
        } catch (error) {
          // The wrong-book remains available in memory for this page.
        }
      }

      function wrongBookHasMessage(message) {
        const text = String(message.text || "").trim();
        return wrongBook.some(
          (item) =>
            (message.id && item.sourceMessageId === message.id)
            || (text && item.text === text),
        );
      }

      function wrongBookAnswerFor(messageId) {
        const index = messages.findIndex((message) => message.id === messageId);
        if (index === -1) {
          return "";
        }
        for (let cursor = index + 1; cursor < messages.length; cursor += 1) {
          const candidate = messages[cursor];
          if (candidate.role !== "assistant" || candidate.loading) {
            continue;
          }
          const answer = String(candidate.text || "").trim();
          const formula = String(candidate.formulaText || "").trim();
          return [answer, formula].filter(Boolean).join("\n");
        }
        return "";
      }

      function syncWrongBookAnswer(messageId, questionText = "") {
        const normalizedQuestion = String(questionText || "").trim();
        const item = wrongBook.find(
          (entry) =>
            (messageId && entry.sourceMessageId === messageId)
            || (normalizedQuestion && entry.text === normalizedQuestion),
        );
        if (!item || String(item.answer || "").trim()) {
          return;
        }
        const answer = wrongBookAnswerFor(messageId);
        if (!answer) {
          return;
        }
        item.answer = answer;
        saveWrongBook();
        renderWrongBook();
      }

      function formatWrongBookDate(timestamp) {
        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) {
          return "";
        }
        return date.toLocaleString("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      }

      function renderWrongBook() {
        if (!wrongBookList || !wrongBookEmpty) {
          return;
        }
        const total = wrongBook.length;
        if (wrongBookCount) {
          wrongBookCount.textContent = `${total} 题`;
        }
        if (wrongBookTabCount) {
          wrongBookTabCount.textContent = String(total);
        }
        wrongBookEmpty.hidden = total > 0;

        const fragment = document.createDocumentFragment();
        wrongBook
          .slice()
          .sort(
            (left, right) =>
              (right.lastPracticedAt || right.createdAt)
              - (left.lastPracticedAt || left.createdAt),
          )
          .forEach((item) => {
            const card = element("article", "wrongbook-item");
            card.dataset.wrongBookId = item.id;
            card.append(
              element("div", "wrongbook-item-title", item.text),
            );

            const practiceText = item.practiceCount
              ? ` · 已练 ${item.practiceCount} 次`
              : "";
            card.append(
              element(
                "div",
                "wrongbook-item-meta",
                `收藏 ${formatWrongBookDate(item.createdAt)}${practiceText}`,
              ),
            );
            if (item.answer) {
              const answer = element("details", "wrongbook-answer");
              answer.append(
                element("summary", "", "查看参考答案"),
                element("div", "wrongbook-answer-text", item.answer),
              );
              card.append(answer);
            }

            const actions = element("div", "wrongbook-item-actions");
            const practiceButton = element(
              "button",
              "",
              "重新练习",
            );
            practiceButton.type = "button";
            practiceButton.dataset.wrongbookAction = "practice";
            practiceButton.dataset.wrongBookId = item.id;

            const deleteButton = element("button", "", "删除");
            deleteButton.type = "button";
            deleteButton.dataset.wrongbookAction = "delete";
            deleteButton.dataset.wrongBookId = item.id;

            actions.append(practiceButton, deleteButton);
            card.append(actions);
            fragment.append(card);
          });
        wrongBookList.replaceChildren(fragment);
      }

      function setToolboxTab(tab) {
        const allowed = ["calculator", "formulas", "wrongbook"];
        const nextTab = allowed.includes(tab) ? tab : "calculator";
        document.querySelectorAll("[data-toolbox-tab]").forEach((button) => {
          const active = button.dataset.toolboxTab === nextTab;
          button.setAttribute("aria-selected", String(active));
        });
        document.querySelectorAll("[data-toolbox-panel]").forEach((panel) => {
          panel.dataset.active = String(
            panel.dataset.toolboxPanel === nextTab,
          );
        });
        if (nextTab === "formulas") {
          renderFormulaCards();
        } else if (nextTab === "wrongbook") {
          renderWrongBook();
        }
      }

      function renderFormulaCards() {
        if (!formulaCardGrid) {
          return;
        }
        const keyword = String(formulaSearchInput?.value || "")
          .trim()
          .toLowerCase();
        const fragment = document.createDocumentFragment();
        let matched = 0;

        FORMULA_COLLECTION.forEach((group) => {
          const items = group.items.filter(([formula, note]) =>
            `${group.heading} ${formula} ${note}`
              .toLowerCase()
              .includes(keyword),
          );
          if (!items.length) {
            return;
          }
          matched += items.length;
          const section = element("section", "formula-card-group");
          section.append(element("h3", "", group.heading));
          items.forEach(([formula, note]) => {
            const card = element("button", "formula-card");
            card.type = "button";
            card.dataset.formulaCard = formula;
            card.dataset.formula = formula;
            card.append(
              element("strong", "", formula),
              element("span", "", note),
            );
            section.append(card);
          });
          fragment.append(section);
        });

        if (!matched) {
          fragment.append(
            element("div", "wrongbook-empty", "没有匹配的公式。"),
          );
        }
        formulaCardGrid.replaceChildren(fragment);
      }

      function toggleWrongBook(messageId) {
        const message = messages.find(
          (item) => item.id === messageId && item.role === "user",
        );
        if (!message) {
          return;
        }
        const existingIndex = wrongBook.findIndex(
          (item) =>
            (message.id && item.sourceMessageId === message.id)
            || item.text === message.text.trim(),
        );
        if (existingIndex !== -1) {
          wrongBook.splice(existingIndex, 1);
        } else {
          wrongBook.unshift({
            id: makeId(),
            text: message.text.trim(),
            answer: wrongBookAnswerFor(message.id),
            createdAt: Date.now(),
            lastPracticedAt: 0,
            practiceCount: 0,
            sourceConversationId: activeConversationId,
            sourceMessageId: message.id,
          });
          wrongBook = wrongBook.slice(0, MAX_WRONG_BOOK_ITEMS);
        }
        saveWrongBook();
        renderWrongBook();
        renderMessages();
      }

      function practiceWrongBookItem(itemId) {
        if (requestInFlight) {
          return;
        }
        const item = wrongBook.find((entry) => entry.id === itemId);
        if (!item) {
          return;
        }
        item.practiceCount += 1;
        item.lastPracticedAt = Date.now();
        saveWrongBook();
        renderWrongBook();
        setToolboxTab("calculator");
        if (sidebarMedia.matches) {
          setSidebarCollapsed(true);
        }
        sendMessage(item.text);
      }

      function deleteWrongBookItem(itemId) {
        wrongBook = wrongBook.filter((item) => item.id !== itemId);
        saveWrongBook();
        renderWrongBook();
        renderMessages();
      }

      function clearWrongBook() {
        if (!wrongBook.length) {
          return;
        }
        wrongBook = [];
        saveWrongBook();
        renderWrongBook();
        renderMessages();
      }

      function exportWrongBook() {
        if (!wrongBook.length) {
          return;
        }
        const blocks = wrongBook
          .slice()
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
          .map((item, index) => {
            const lines = [
              `${index + 1}. ${item.text}`,
              `收藏时间：${formatWrongBookDate(item.createdAt) || "-"}`,
              `练习次数：${item.practiceCount || 0}`,
            ];
            const answer = String(item.answer || "").trim();
            if (answer) {
              lines.push(`参考答案：${answer}`);
            }
            return lines.join("\n");
          });
        const header = `知微高数错题集（共 ${wrongBook.length} 题，导出于 ${formatWrongBookDate(Date.now())}）`;
        const blob = new Blob([`${header}\n\n${blocks.join("\n\n")}\n`], {
          type: "text/plain;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `知微高数错题集-${new Date().toISOString().slice(0, 10)}.txt`;
        document.body.append(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function renderFormula(container, message) {
        container.textContent = "";
        if (!message.formulaLatex) {
          return;
        }

        if (window.katex) {
          try {
            window.katex.render(message.formulaLatex, container, {
              displayMode: true,
              throwOnError: true,
              strict: false,
              trust: false,
            });
            return;
          } catch (error) {
            // Fall back to the plain text returned by the calculation service.
          }
        }
        container.textContent = message.formulaText || message.formulaLatex;
      }

      function createMessageNode(message) {
        const article = element("article", "message");
        article.dataset.role = message.role;
        article.dataset.messageId = message.id;

        const avatar = element(
          "div",
          "avatar",
          message.role === "user" ? "我" : "知",
        );
        avatar.setAttribute("aria-hidden", "true");

        const content = element("div", "message-content");
        const meta = element("div", "message-meta");
        meta.append(
          element("span", "", message.role === "user" ? "你" : "知微老师"),
          element("time", "", message.createdAt),
        );

        const bubble = element("div", "bubble");
        if (message.loading) {
          const typing = element("div", "typing");
          typing.setAttribute("aria-label", "知微老师正在计算");
          typing.append(element("span"), element("span"), element("span"));
          bubble.append(typing);
        } else {
          bubble.append(element("p", "message-text", message.text));

          if (message.formulaLatex) {
            const formula = element("div", "formula");
            renderFormula(formula, message);
            bubble.append(formula);
          }

          if (message.plotUrl) {
            const figure = element("figure", "function-plot");
            const image = element("img");
            image.src = message.plotUrl;
            image.alt = message.formulaText
              ? `函数图像：${message.formulaText}`
              : "函数图像";
            image.loading = "lazy";
            figure.append(image);
            bubble.append(figure);
          }

          if (typeof message.verdict === "boolean") {
            const verdict = element(
              "div",
              "verdict",
              message.verdict ? "答案正确" : "答案不正确",
            );
            verdict.dataset.state = message.verdict ? "correct" : "incorrect";
            bubble.append(verdict);
          }

          if (message.resultLabel && message.resultValue) {
            const details = element("details", "calculation-details");
            details.append(element("summary", "", "计算明细"));
            const grid = element("dl", "calculation-grid");
            grid.append(
              element("dt", "", "结果"),
              element("dd", "", message.resultValue),
              element("dt", "", "类型"),
              element("dd", "", message.resultLabel),
            );
            details.append(grid);
            bubble.append(details);
          }
        }

        content.append(meta, bubble);
        if (message.role === "user" && !message.loading) {
          const actions = element("div", "message-actions");
          const bookmarked = wrongBookHasMessage(message);
          const bookmarkButton = element(
            "button",
            "message-action",
            bookmarked ? "已收藏错题" : "收藏错题",
          );
          bookmarkButton.type = "button";
          bookmarkButton.dataset.messageAction = "toggle-wrongbook";
          bookmarkButton.dataset.messageId = message.id;
          bookmarkButton.dataset.bookmarked = String(bookmarked);
          bookmarkButton.setAttribute(
            "aria-pressed",
            String(bookmarked),
          );
          actions.append(bookmarkButton);
          content.append(actions);
        }
        article.append(avatar, content);
        return article;
      }

      function scrollToLatest() {
        window.requestAnimationFrame(() => {
          messageList.scrollTop = messageList.scrollHeight;
        });
      }

      function renderMessages() {
        const fragment = document.createDocumentFragment();
        messages.forEach((message) => fragment.append(createMessageNode(message)));
        messageList.replaceChildren(fragment);
        scrollToLatest();
      }

      function renderSuggestions(items) {
        currentSuggestions = Array.isArray(items) && items.length
          ? items.slice(0, 6)
          : DEFAULT_SUGGESTIONS;
        const fragment = document.createDocumentFragment();
        currentSuggestions.forEach((text) => {
          const button = element("button", "suggestion", String(text));
          button.type = "button";
          button.dataset.message = String(text);
          fragment.append(button);
        });
        suggestions.replaceChildren(fragment);
      }

      function setSuggestionsCollapsed(collapsed) {
        const nextCollapsed = Boolean(collapsed);
        composerArea.dataset.suggestionsCollapsed = String(nextCollapsed);
        suggestionsToggle.setAttribute(
          "aria-expanded",
          String(!nextCollapsed),
        );
        suggestionsToggle.setAttribute(
          "title",
          nextCollapsed ? "展开示例快捷指令" : "折叠示例快捷指令",
        );
        suggestionsToggleLabel.textContent = nextCollapsed
          ? "展开示例"
          : "收起示例";
      }

      function resizeInput() {
        chatInput.style.height = "auto";
        chatInput.style.height = `${Math.min(chatInput.scrollHeight, 132)}px`;
      }

      function setRequestState(active) {
        requestInFlight = active;
        sendButton.disabled = active;
        sendButton.textContent = active ? "计算中" : "发送";
      }

      function responseToMessage(data) {
        const calculation = data.calculation || {};
        let resultLabel = "";
        let resultValue = "";

        if (data.intent === "verify") {
          resultLabel = "导数";
          resultValue = calculation.derivative || "";
        } else if (data.intent === "integrate") {
          resultLabel = "积分";
          resultValue = calculation.integral || "";
        } else if (data.intent === "limit") {
          resultLabel = "极限";
          resultValue = calculation.limit || "";
        } else if (data.intent === "solve") {
          resultLabel = calculation.method || "章节求解";
          resultValue = calculation.result || "";
        }

        return {
          id: makeId(),
          role: "assistant",
          text: String(data.reply || "这次没有得到可用的计算结果。"),
          formulaLatex: String(data.formula_latex || ""),
          formulaText: String(data.formula_text || ""),
          resultLabel,
          resultValue: String(resultValue),
          verdict:
            typeof calculation.is_correct === "boolean"
              ? calculation.is_correct
              : null,
          plotUrl: String(calculation.plot_url || ""),
          createdAt: currentTime(),
        };
      }

      function selectedSolverTopic() {
        const chapterKey = solverChapter.value || Object.keys(SOLVER_CHAPTERS)[0];
        const chapter = SOLVER_CHAPTERS[chapterKey];
        if (!chapter) {
          return null;
        }
        const topicKey =
          solverTopic.value || Object.keys(chapter.topics)[0];
        const topic = chapter.topics[topicKey];
        if (!topic) {
          return null;
        }
        return { chapterKey, chapter, topicKey, topic };
      }

      function renderSolverFields() {
        const selected = selectedSolverTopic();
        if (!selected) {
          solverFields.replaceChildren();
          solverHint.textContent = "";
          return;
        }

        const fragment = document.createDocumentFragment();
        selected.topic.fields.forEach((field) => {
          const wrapper = element(
            "div",
            `solver-field${field.wide ? " is-wide" : ""}`,
          );
          const label = element("label", "", field.label);
          label.htmlFor = `solver-${field.key}`;
          const control = document.createElement(
            field.type === "json" ? "textarea" : "input",
          );
          control.id = `solver-${field.key}`;
          control.name = field.key;
          control.placeholder = field.placeholder;
          control.value = field.defaultValue;
          if (field.type === "number") {
            control.type = "number";
          } else if (field.type !== "json") {
            control.type = "text";
          }
          if (field.required !== false) {
            control.required = true;
          }
          wrapper.append(label, control);
          fragment.append(wrapper);
        });

        solverFields.replaceChildren(fragment);
        solverHint.textContent = selected.topic.hint;
        solverStatus.textContent = "";
      }

      function populateSolverTopics() {
        const chapter = SOLVER_CHAPTERS[solverChapter.value];
        if (!chapter) {
          solverTopic.replaceChildren();
          renderSolverFields();
          return;
        }

        const fragment = document.createDocumentFragment();
        Object.entries(chapter.topics).forEach(([topicKey, topic]) => {
          const option = document.createElement("option");
          option.value = topicKey;
          option.textContent = topic.label;
          fragment.append(option);
        });
        solverTopic.replaceChildren(fragment);
        renderSolverFields();
      }

      function populateSolverChapters() {
        if (solverChapter.options.length) {
          return;
        }
        const fragment = document.createDocumentFragment();
        Object.entries(SOLVER_CHAPTERS).forEach(([chapterKey, chapter]) => {
          const option = document.createElement("option");
          option.value = chapterKey;
          option.textContent = chapter.label;
          fragment.append(option);
        });
        solverChapter.replaceChildren(fragment);
        populateSolverTopics();
      }

      function renderToolsNavigation() {
        const toolsNavList = document.getElementById("toolsNavList");
        const toolsMenuCount = document.getElementById("toolsMenuCount");
        if (!toolsNavList || !toolsMenuCount) {
          return;
        }

        const chapterEntries = Object.entries(SOLVER_CHAPTERS);
        const topicTotal = chapterEntries.reduce(
          (total, [, chapter]) => total + Object.keys(chapter.topics).length,
          0,

          details.className = "tool-chapter";
          details.dataset.chapter = chapterKey;

          const summary = document.createElement("summary");
          const name = element("span", "tool-chapter-name", chapter.label);
          const count = element(
            "span",
            "tool-chapter-count",
            `${topicEntries.length} 项`,

          const arrow = element("span", "tool-chapter-arrow", "›");

          topicEntries.forEach(([topicKey, topic]) => {

            button.dataset.solverChapter = chapterKey;
            button.title = `${chapter.label} · ${topic.label}`;

      function openSolverTopic(chapterKey, topicKey) {
        if (!SOLVER_CHAPTERS[chapterKey]) {
          return;
        }
        openSolverDialog(chapterKey, topicKey);
      }

      function readSolverField(field) {
        const control = document.getElementById(`solver-${field.key}`);
        const raw = control ? control.value.trim() : "";
        if (!raw) {
          if (field.required !== false) {
            throw new Error(`请填写${field.label}`);
          }
          return undefined;
        }
        if (field.type === "list") {
          const values = raw
            .split(",")
            .map((value) => value.trim())
            .filter(Boolean);
          if (!values.length) {
            throw new Error(`${field.label}不能为空`);
          }
          return values;
        }
        if (field.type === "json") {
          try {
            const parsed = JSON.parse(raw);
            if (
              !parsed
              || Array.isArray(parsed)
              || typeof parsed !== "object"
            ) {
              throw new Error("not-object");
            }
            return parsed;
          } catch (error) {
            throw new Error(`${field.label}必须是 JSON 对象`);
          }
        }
        return raw;
      }

      function buildSolverPayload() {
        const selected = selectedSolverTopic();
        if (!selected) {
          throw new Error("请选择章节和题型");
        }
        const inputs = {};
        selected.topic.fields.forEach((field) => {
          const value = readSolverField(field);
          if (value !== undefined) {
            inputs[field.key] = value;
          }
        });
        return {
          chapter: selected.chapterKey,
          topic: selected.topicKey,
          inputs,
        };
      }

      function solverSummary(selected, inputs) {
        const details = selected.topic.fields
          .filter((field) => inputs[field.key] !== undefined)
          .map((field) => {
            const value = inputs[field.key];
            const text = Array.isArray(value)
              ? value.join(", ")
              : typeof value === "object"
                ? JSON.stringify(value)
                : value;
            return `${field.label}：${text}`;
          });
        return `${selected.chapter.label} / ${selected.topic.label}${
          details.length ? `；${details.join("；")}` : ""
        }`;
      }

      function openSolverDialog(chapterKey, topicKey) {
        if (requestInFlight) {
          return;
        }
        populateSolverChapters();
        const nextChapter =
          chapterKey && SOLVER_CHAPTERS[chapterKey]
            ? chapterKey
            : solverChapter.value;
        solverChapter.value = nextChapter;
        populateSolverTopics();
        if (topicKey && solverTopic.querySelector(`option[value="${topicKey}"]`)) {
          solverTopic.value = topicKey;
          renderSolverFields();
        }
        solverStatus.textContent = "";
        if (typeof solverDialog.showModal === "function") {
          solverDialog.showModal();
        } else {
          solverDialog.setAttribute("open", "");
        }
      }

      function closeSolverDialog() {
        if (
          solverDialog.open
          && typeof solverDialog.close === "function"
        ) {
          solverDialog.close();
        } else {
          solverDialog.removeAttribute("open");
        }
      }
