      function welcomeMessageParts(text) {
        const source = String(text || "").trim();
        const match = source.match(/^(.*?[。！？])\s*(.*)$/);
        return match
          ? { lead: match[1], body: match[2] }
          : { lead: source, body: "" };
      }

      function welcomeMessage() {
        let previousIndex = lastWelcomeIndex;
        if (previousIndex < 0) {
          try {
            const storedIndex = Number(
              window.sessionStorage.getItem(WELCOME_INDEX_KEY),
            );
            if (
              Number.isInteger(storedIndex)
              && storedIndex >= 0
              && storedIndex < WELCOME_TEXTS.length
            ) {
              previousIndex = storedIndex;
            }
          } catch (error) {
            previousIndex = -1;
          }
        }

        const availableIndexes = WELCOME_TEXTS
          .map((_, index) => index)
          .filter((index) => index !== previousIndex);
        const pool = availableIndexes.length
          ? availableIndexes
          : WELCOME_TEXTS.map((_, index) => index);
        const welcomeIndex = pool[Math.floor(Math.random() * pool.length)];
        const welcomeText = WELCOME_TEXTS[welcomeIndex];
        const welcomeParts = welcomeMessageParts(welcomeText);
        lastWelcomeIndex = welcomeIndex;
        try {
          window.sessionStorage.setItem(
            WELCOME_INDEX_KEY,
            String(welcomeIndex),
          );
        } catch (error) {
          // The welcome message still varies in memory when storage is unavailable.
        }
        return {
          id: makeId(),
          role: "assistant",
          text: welcomeText,
          intent: "welcome",
          welcomeLead: welcomeParts.lead,
          welcomeBody: welcomeParts.body,
          formulaLatex: "",
          formulaText: "",
          resultLabel: "",
          resultValue: "",
          verdict: null,
          createdAt: currentTime(),
        };
      }

      function loadMessages() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            return [];
          }
          const parsed = JSON.parse(raw);
          return normalizeMessages(parsed);
        } catch (error) {
          return [];
        }
      }

      function saveMessages() {
        try {
          window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
              messagesForStorage(messages).slice(-MAX_STORED_MESSAGES),
            ),
          );
        } catch (error) {
          // The conversation still works when browser storage is unavailable.
        }
        updateCurrentConversation();
      }

      function currentConversationTitle() {
        const firstQuestion = messages.find(
          (message) => message.role === "user" && message.text.trim(),
        );
        if (!firstQuestion) {
          return "新会话";
        }
        const compact = firstQuestion.text.replace(/\s+/g, " ").trim();
        return compact.length > 22 ? `${compact.slice(0, 22)}…` : compact;
      }

      function conversationPreview(conversation) {
        if (conversation.renamed && conversation.title) {
          return conversation.title;
        }
        const firstQuestion = conversation.messages.find(
          (message) => message.role === "user" && message.text.trim(),
        );
        if (!firstQuestion) {
          return conversation.title || "新会话";
        }
        return firstQuestion.text.replace(/\s+/g, " ").trim();
      }

      function updateCurrentConversation() {
        const hasUserMessage = messages.some(
          (message) => message.role === "user" && message.text.trim(),
        );
        const existingConversation = conversations.find(
          (conversation) => conversation.id === activeConversationId,
        );
        conversations = conversations.filter(
          (conversation) => conversation.id !== activeConversationId,
        );
        if (hasUserMessage) {
          conversations.unshift({
            id: activeConversationId,
            title:
              existingConversation && existingConversation.renamed
                ? existingConversation.title
                : currentConversationTitle(),
            renamed: Boolean(existingConversation?.renamed),
            updatedAt: Date.now(),
            messages: messagesForStorage(messages).slice(-MAX_STORED_MESSAGES),
          });
          conversations = conversations.slice(0, MAX_CONVERSATIONS);
        }
        persistConversations();
        renderHistory();
      }

      function historyTime(timestamp) {
        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) {
          return "";
        }
        return date.toLocaleString("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      }

      function renderHistory() {
        const fragment = document.createDocumentFragment();
        if (!conversations.length) {
          fragment.append(
            element(
              "div",
              "history-empty",
              "所有会话关闭后会保存在这里",
            ),
          );
        } else {
          conversations.forEach((conversation) => {
            const item = element("div", "history-item");
            item.dataset.conversationId = conversation.id;
            item.dataset.active = String(
              conversation.id === activeConversationId,
            );

            const selectButton = element("button", "history-select");
            selectButton.type = "button";
            selectButton.setAttribute(
              "aria-label",
              `打开会话：${conversationPreview(conversation)}`,
            );
            if (conversation.id === activeConversationId) {
              selectButton.setAttribute("aria-current", "true");
            }
            selectButton.append(
              element("span", "history-title", conversationPreview(conversation)),
              element("span", "history-time", historyTime(conversation.updatedAt)),
            );

            const actions = element("div", "history-actions");
            const renameButton = element("button", "history-action", "重命名");
            renameButton.type = "button";
            renameButton.dataset.historyAction = "rename";
            renameButton.setAttribute(
              "aria-label",
              `重命名会话：${conversationPreview(conversation)}`,
            );

            const deleteButton = element("button", "history-action", "删除");
            deleteButton.type = "button";
            deleteButton.dataset.historyAction = "delete";
            deleteButton.setAttribute(
              "aria-label",
              `删除会话：${conversationPreview(conversation)}`,
            );

            actions.append(renameButton, deleteButton);
            item.append(selectButton, actions);
            fragment.append(item);
          });
        }
        historyList.replaceChildren(fragment);
        historyCount.textContent = String(conversations.length);
      }

      function requestHistory() {
        return messages
          .filter((message) => !message.loading)
          .slice(-MAX_REQUEST_HISTORY)
          .map((message) => ({
            role: message.role,
            text: (
              message.role === "user"
              && Array.isArray(message.attachments)
              && message.attachments.length
              && message.text
                ? `${message.text}\n请你确认题目识别是否正确。`
                : message.text
            ).slice(0, 600),
          }))
          .filter((message) => message.text);
      }

      function cacheResponse(question, data) {
        if (
          !data
          || data.history_used
          || [
            "general",
            "help",
            "history",
            "unknown",
            "needs_input",
            "ocr_error",
          ].includes(data.intent)
        ) {
          return;
        }
        const key = question.trim();
        if (!key) {
          return;
        }
        responseCache.delete(key);
        responseCache.set(key, data);
        while (responseCache.size > RESPONSE_CACHE_LIMIT) {
          responseCache.delete(responseCache.keys().next().value);
        }
      }

      function element(tagName, className, text) {
        const node = document.createElement(tagName);
        if (className) {
          node.className = className;
        }
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      }

      function normalizeWrongBookItem(item) {
        if (!item || !String(item.text || "").trim()) {
          return null;
        }
        return {
          id: String(item.id || makeId()),
          text: String(item.text).trim(),
          answer: String(item.answer || ""),
          createdAt: Number(item.createdAt) || Date.now(),
          lastPracticedAt: Number(item.lastPracticedAt) || 0,
          practiceCount: Math.max(0, Number(item.practiceCount) || 0),
          sourceConversationId: String(item.sourceConversationId || ""),
          sourceMessageId: String(item.sourceMessageId || ""),
        };
      }

      function loadWrongBook() {
        try {
          const parsed = JSON.parse(
            window.localStorage.getItem(WRONG_BOOK_KEY) || "[]",
          );
          if (!Array.isArray(parsed)) {
            return [];
          }
          return parsed
            .map(normalizeWrongBookItem)
            .filter(Boolean)
            .slice(0, MAX_WRONG_BOOK_ITEMS);
        } catch (error) {
          return [];
        }
      }

      function saveWrongBook() {
        try {
          window.localStorage.setItem(
            WRONG_BOOK_KEY,
            JSON.stringify(wrongBook.slice(0, MAX_WRONG_BOOK_ITEMS)),
          );
        } catch (error) {
          // The wrong-book remains available in memory for this page.
        }
      }

      function wrongBookHasMessage(message) {
        const text = String(message.text || "").trim();
        return wrongBook.some(
          (item) =>
            (message.id && item.sourceMessageId === message.id)
            || (text && item.text === text),
        );
      }

      function resolvedAnswerForUserMessage(messageId) {
        const index = messages.findIndex((message) => message.id === messageId);
        if (index === -1) {
          return null;
        }
        for (let cursor = index + 1; cursor < messages.length; cursor += 1) {
          const candidate = messages[cursor];
          if (candidate.role === "user") {
            return null;
          }
          if (candidate.role !== "assistant" || candidate.loading) {
            continue;
          }
          return candidate;
        }
        return null;
      }

      function sourceUserMessageForAnswer(message) {
        if (!message || message.role !== "assistant" || message.loading) {
          return null;
        }
        if (message.sourceUserMessageId) {
          const linkedMessage = messages.find(
            (item) =>
              item.id === message.sourceUserMessageId
              && item.role === "user",
          );
          if (linkedMessage) {
            return linkedMessage;
          }
        }
        const index = messages.findIndex((item) => item.id === message.id);
        for (let cursor = index - 1; cursor >= 0; cursor -= 1) {
          const candidate = messages[cursor];
          if (candidate.role === "user" && !candidate.loading) {
            return candidate;
          }
        }
        return null;
      }

      function messageCanJoinWrongBook(message) {
        if (!message || message.loading) {
          return false;
        }
        const userMessage = message.role === "assistant"
          ? sourceUserMessageForAnswer(message)
          : message;
        if (
          !userMessage
          || userMessage.role !== "user"
          || userMessage.loading
        ) {
          return false;
        }
        const answer = message.role === "assistant"
          ? message
          : resolvedAnswerForUserMessage(userMessage.id);
        if (
          !answer
          || !WRONG_BOOK_ELIGIBLE_INTENTS.has(String(answer.intent || ""))
        ) {
          return false;
        }
        return Boolean(
          String(answer.resultValue || "").trim()
          || String(answer.formulaLatex || "").trim()
          || String(answer.formulaText || "").trim()
          || String(answer.plotUrl || "").trim()
        );
      }

      function wrongBookAnswerFor(messageId) {
        const answerMessage = resolvedAnswerForUserMessage(messageId);
        if (!answerMessage) {
          return "";
        }
        const answer = String(answerMessage.text || "").trim();
        const formula = String(answerMessage.formulaText || "").trim();
        return [answer, formula].filter(Boolean).join("\n");
      }

      function syncWrongBookAnswer(messageId, questionText = "") {
        const normalizedQuestion = String(questionText || "").trim();
        const item = wrongBook.find(
          (entry) =>
            (messageId && entry.sourceMessageId === messageId)
            || (normalizedQuestion && entry.text === normalizedQuestion),
        );
        if (!item || String(item.answer || "").trim()) {
          return;
        }
        const answer = wrongBookAnswerFor(messageId);
        if (!answer) {
          return;
        }
        item.answer = answer;
        saveWrongBook();
        renderWrongBook();
      }

      function formatWrongBookDate(timestamp) {
        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) {
          return "";
        }
        return date.toLocaleString("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      }

      function renderWrongBook() {
        if (!wrongBookList || !wrongBookEmpty) {
          return;
        }
        const total = wrongBook.length;
        if (wrongBookCount) {
          wrongBookCount.textContent = `${total} 题`;
        }
        if (wrongBookTabCount) {
          wrongBookTabCount.textContent = String(total);
        }
        wrongBookEmpty.hidden = total > 0;

        const fragment = document.createDocumentFragment();
        wrongBook
          .slice()
          .sort(
            (left, right) =>
              (right.lastPracticedAt || right.createdAt)
              - (left.lastPracticedAt || left.createdAt),
          )
          .forEach((item) => {
            const card = element("article", "wrongbook-item");
            card.dataset.wrongBookId = item.id;
            card.append(
              element("div", "wrongbook-item-title", item.text),
            );

            const practiceText = item.practiceCount
              ? ` · 已练 ${item.practiceCount} 次`
              : "";
            card.append(
              element(
                "div",
                "wrongbook-item-meta",
                `收藏 ${formatWrongBookDate(item.createdAt)}${practiceText}`,
              ),
            );
            if (item.answer) {
              const answer = element("details", "wrongbook-answer");
              answer.append(
                element("summary", "", "查看参考答案"),
                element("div", "wrongbook-answer-text", item.answer),
              );
              card.append(answer);
            }

            const actions = element("div", "wrongbook-item-actions");
            const practiceButton = element(
              "button",
              "",
              "重新练习",
            );
            practiceButton.type = "button";
            practiceButton.dataset.wrongbookAction = "practice";
            practiceButton.dataset.wrongBookId = item.id;

            const deleteButton = element("button", "", "删除");
            deleteButton.type = "button";
            deleteButton.dataset.wrongbookAction = "delete";
            deleteButton.dataset.wrongBookId = item.id;

            actions.append(practiceButton, deleteButton);
            card.append(actions);
            fragment.append(card);
          });
        wrongBookList.replaceChildren(fragment);
      }

      function setToolboxTab(tab) {
        const allowed = ["wrongbook", "progress"];
        const nextTab = allowed.includes(tab) ? tab : "wrongbook";
        document.querySelectorAll("[data-toolbox-tab]").forEach((button) => {
          const active = button.dataset.toolboxTab === nextTab;
          button.setAttribute("aria-selected", String(active));
        });
        document.querySelectorAll("[data-rail-tab]").forEach((button) => {
          button.setAttribute(
            "aria-current",
            String(button.dataset.railTab === nextTab),
          );
        });
        document.querySelectorAll("[data-toolbox-panel]").forEach((panel) => {
          panel.dataset.active = String(
            panel.dataset.toolboxPanel === nextTab,
          );
        });
        if (nextTab === "wrongbook") {
          renderWrongBook();
        } else if (nextTab === "progress") {
          renderLearningProgress();
        }
      }

      function knowledgeMatchScore(text, rule) {
        let score = 0;
        rule.keywords.forEach((keyword) => {
          const normalizedKeyword = String(keyword).toLowerCase();
          if (normalizedKeyword && text.includes(normalizedKeyword)) {
            score += Math.max(2, Math.min(6, normalizedKeyword.length));
          }
        });
        (rule.patterns || []).forEach((pattern) => {
          if (pattern.test(text)) {
            score += 7;
          }
        });
        return score;
      }

      function localMatchedQuestionKnowledge(rawText) {
        const text = String(rawText || "").trim().toLowerCase();
        if (!text) {
          return [];
        }
        return QUESTION_KNOWLEDGE_RULES
          .map((rule) => ({
            rule,
            score: knowledgeMatchScore(text, rule),
          }))
          .filter((item) => item.score > 0)
          .sort((left, right) => right.score - left.score)
          .slice(0, 3)
          .map((item) => item.rule);
      }

      function serverKnowledgeMatches(payload) {
        const results = Array.isArray(payload && payload.results)
          ? payload.results
          : [];
        return results
          .slice(0, 3)
          .map((result, index) => {
            const points = Array.isArray(result && result.points)
              ? result.points
                .map((point) => String(point || "").trim())
                .filter(Boolean)
              : [];
            const excerpt = String(
              (result && result.excerpt) || "",
            ).trim();
            return {
              id: String((result && result.id) || `server-${index}`),
              title: String(
                (result && result.title) || excerpt || "知识点",
              ),
              chapter: String((result && result.chapter) || ""),
              source: String((result && result.source) || ""),
              points: points.length ? points : [excerpt].filter(Boolean),
              origin: "server",
            };
          })
          .filter((result) => result.title);
      }

      async function fetchQuestionKnowledge(rawText, signal) {
        const text = String(rawText || "").trim();
        const localMatches = localMatchedQuestionKnowledge(text);
        if (!text) {
          return localMatches;
        }

        const timeoutId = window.setTimeout(
          () => signal.abort(),
          KNOWLEDGE_API_TIMEOUT_MS,
        );
        try {
          const response = await fetch(KNOWLEDGE_API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ query: text, limit: 3 }),
            signal,
          });
          if (!response.ok) {
            return localMatches;
          }
          const data = await response.json();
          const remoteMatches = serverKnowledgeMatches(data);
          return remoteMatches.length ? remoteMatches : localMatches;
        } catch (error) {
          return localMatches;
        } finally {
          window.clearTimeout(timeoutId);
        }
      }

      async function renderQuestionKnowledge(rawText, options = {}) {
        if (!questionKnowledgeList || !questionKnowledgeStatus) {
          return;
        }
        const text = String(rawText || "").trim();
        const requestId = ++knowledgeRequestSerial;
        if (knowledgeAbortController) {
          knowledgeAbortController.abort();
        }
        const controller = new AbortController();
        knowledgeAbortController = controller;
        const fragment = document.createDocumentFragment();
        const matches = await fetchQuestionKnowledge(text, controller.signal);
        if (requestId !== knowledgeRequestSerial) {
          return;
        }
        if (!text) {
          questionKnowledgeStatus.textContent = "等待题目";
          questionKnowledge.dataset.state = "empty";
          fragment.append(
            element(
              "div",
              "related-knowledge-empty",
              "输入题目后，这里会显示与当前问题相关的知识点。",
            ),
          );
        } else if (!matches.length) {
          questionKnowledgeStatus.textContent = "识别题型";
          questionKnowledge.dataset.state = "generic";
          const item = element("article", "knowledge-item");
          item.append(
            element("strong", "", "审题与验证"),
            element(
              "p",
              "",
              "先明确已知条件、目标量和所求形式；计算后再用代入或量纲检查结果。",
            ),
          );
          fragment.append(item);
        } else {
          questionKnowledgeStatus.textContent =
            options.source === "input"
              ? `正在匹配 ${matches.length} 个知识点`
              : `已匹配 ${matches.length} 个知识点`;
          questionKnowledge.dataset.state = "ready";
          matches.forEach((rule) => {
            const item = element("article", "knowledge-item");
            item.dataset.knowledgeId = rule.id;
            item.append(element("strong", "", rule.title));
            if (rule.origin === "server") {
              const source = [rule.chapter, rule.source]
                .filter(Boolean)
                .join(" / ");
              if (source) {
                item.append(element("span", "knowledge-source", source));
              }
            }
            (rule.points || []).forEach((point) => {
              item.append(element("p", "", point));
            });
            fragment.append(item);
          });
        }
        questionKnowledgeList.replaceChildren(fragment);
      }

      function queueQuestionKnowledgeUpdate(rawText) {
        window.clearTimeout(knowledgeDebounceId);
        knowledgeDebounceId = window.setTimeout(() => {
          const text = String(rawText || "").trim();
          renderQuestionKnowledge(
            text || lastSubmittedKnowledgeText,
            { source: text ? "input" : "saved" },
          );
        }, 180);
      }

      function toggleWrongBook(messageId) {
        const message = messages.find(
          (item) => item.id === messageId && item.role === "user",
        );
        if (!message || !messageCanJoinWrongBook(message)) {
          return;
        }
        const existingIndex = wrongBook.findIndex(
          (item) =>
            (message.id && item.sourceMessageId === message.id)
            || item.text === message.text.trim(),
        );
        if (existingIndex !== -1) {
          if (!window.confirm("确认从错题集移除这道题吗？")) {
            return;
          }
          wrongBook.splice(existingIndex, 1);
        } else {
          if (
            !window.confirm(
              "确认这是一道需要收录的错题吗？加入后可在错题集里重练。",
            )
          ) {
            return;
          }
          wrongBook.unshift({
            id: makeId(),
            text: message.text.trim(),
            answer: wrongBookAnswerFor(message.id),
            createdAt: Date.now(),
            lastPracticedAt: 0,
            practiceCount: 0,
            sourceConversationId: activeConversationId,
            sourceMessageId: message.id,
          });
          wrongBook = wrongBook.slice(0, MAX_WRONG_BOOK_ITEMS);
        }
        saveWrongBook();
        renderWrongBook();
        syncLearningProgressWrongBookCount();
        renderMessages();
      }

      function practiceWrongBookItem(itemId) {
        if (requestInFlight) {
          return;
        }
        const item = wrongBook.find((entry) => entry.id === itemId);
        if (!item) {
          return;
        }
        item.practiceCount += 1;
        item.lastPracticedAt = Date.now();
        saveWrongBook();
        renderWrongBook();
        recordLearningActivity("practice");
        if (sidebarMedia.matches) {
          setSidebarCollapsed(true);
        }
        sendMessage(item.text);
      }

      function deleteWrongBookItem(itemId) {
        wrongBook = wrongBook.filter((item) => item.id !== itemId);
        saveWrongBook();
        renderWrongBook();
        syncLearningProgressWrongBookCount();
        renderMessages();
      }

      function clearWrongBook() {
        if (!wrongBook.length) {
          return;
        }
        wrongBook = [];
        saveWrongBook();
        renderWrongBook();
        syncLearningProgressWrongBookCount();
        renderMessages();
      }

      function exportWrongBook() {
        if (!wrongBook.length) {
          return;
        }
        const blocks = wrongBook
          .slice()
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
          .map((item, index) => {
            const lines = [
              `${index + 1}. ${item.text}`,
              `收藏时间：${formatWrongBookDate(item.createdAt) || "-"}`,
              `练习次数：${item.practiceCount || 0}`,
            ];
            const answer = String(item.answer || "").trim();
            if (answer) {
              lines.push(`参考答案：${answer}`);
            }
            return lines.join("\n");
          });
        const header = `知微高数错题集（共 ${wrongBook.length} 题，导出于 ${formatWrongBookDate(Date.now())}）`;
        const blob = new Blob([`${header}\n\n${blocks.join("\n\n")}\n`], {
          type: "text/plain;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `知微高数错题集-${new Date().toISOString().slice(0, 10)}.txt`;
        document.body.append(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function clampProgressCount(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) {
          return 0;
        }
        return Math.min(
          MAX_PROGRESS_COUNT,
          Math.max(0, Math.round(number)),
        );
      }

      function clampProgressTimestamp(value) {
        const number = Number(value);
        if (!Number.isFinite(number) || number < 0) {
          return 0;
        }
        return Math.min(MAX_PROGRESS_TIMESTAMP, Math.round(number));
      }

      function localDateKey(value = Date.now()) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "";
        }
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function isValidProgressDate(value) {
        const text = String(value || "");
        if (!/^\d{4}-\d{2}-\d{2}$/.test(text)) {
          return false;
        }
        return localDateKey(`${text}T12:00:00`) === text;
      }

      function createDefaultLearningProgress() {
        return {
          version: LEARNING_PROGRESS_VERSION,
          updatedAt: 0,
          questionCount: 0,
          calculationCount: 0,
          practiceCount: 0,
          wrongBookSavedCount: 0,
          studyDays: [],
          dailyCounts: {},
        };
      }

      function normalizeLearningProgress(value) {
        const source = value
          && typeof value === "object"
          && !Array.isArray(value)
          && value.progress
          && typeof value.progress === "object"
          && !Array.isArray(value.progress)
          ? value.progress
          : value;

        if (
          !source
          || typeof source !== "object"
          || Array.isArray(source)
        ) {
          throw new Error("进度文件内容无法识别。");
        }
        if (
          value
          && value.format
          && value.format !== LEARNING_PROGRESS_FORMAT
        ) {
          throw new Error("这不是知微高数学习进度文件。");
        }

        const version = Number(source.version);
        if (
          Number.isFinite(version)
          && version !== LEARNING_PROGRESS_VERSION
        ) {
          throw new Error("进度文件版本不受支持。");
        }

        const progress = createDefaultLearningProgress();
        progress.updatedAt = clampProgressTimestamp(source.updatedAt);
        progress.questionCount = clampProgressCount(source.questionCount);
        progress.calculationCount = clampProgressCount(
          source.calculationCount,
        );
        progress.practiceCount = clampProgressCount(source.practiceCount);
        progress.wrongBookSavedCount = clampProgressCount(
          source.wrongBookSavedCount,
        );

        const rawDailyCounts = (
          source.dailyCounts
          && typeof source.dailyCounts === "object"
          && !Array.isArray(source.dailyCounts)
        )
          ? source.dailyCounts
          : {};
        const studyDays = new Set();

        if (Array.isArray(source.studyDays)) {
          source.studyDays.forEach((day) => {
            const text = String(day || "");
            if (isValidProgressDate(text)) {
              studyDays.add(text);
            }
          });
        }
        Object.entries(rawDailyCounts).forEach(([day, count]) => {
          const text = String(day || "");
          if (!isValidProgressDate(text)) {
            return;
          }
          const normalizedCount = clampProgressCount(count);
          if (normalizedCount > 0) {
            progress.dailyCounts[text] = normalizedCount;
            studyDays.add(text);
          }
        });

        progress.studyDays = [...studyDays]
          .sort()
          .slice(-MAX_PROGRESS_DAYS);
        const retainedDays = new Set(progress.studyDays);
        Object.keys(progress.dailyCounts).forEach((day) => {
          if (!retainedDays.has(day)) {
            delete progress.dailyCounts[day];
          }
        });
        return progress;
      }

      function loadLearningProgress() {
        try {
          const parsed = JSON.parse(
            window.localStorage.getItem(LEARNING_PROGRESS_KEY) || "null",
          );
          return parsed
            ? normalizeLearningProgress(parsed)
            : createDefaultLearningProgress();
        } catch (error) {
          return createDefaultLearningProgress();
        }
      }

      function saveLearningProgress() {
        try {
          window.localStorage.setItem(
            LEARNING_PROGRESS_KEY,
            JSON.stringify(normalizeLearningProgress(learningProgress)),
          );
        } catch (error) {
          // Progress remains available in memory for this page.
        }
      }

      function learningProgressStreakValue() {
        const today = new Date();
        today.setHours(12, 0, 0, 0);
        const todayKey = localDateKey(today);
        let cursor = new Date(today);
        if (!(learningProgress.dailyCounts[todayKey] > 0)) {
          cursor.setDate(cursor.getDate() - 1);
        }

        let streak = 0;
        while (streak < MAX_PROGRESS_DAYS) {
          const key = localDateKey(cursor);
          if (!(learningProgress.dailyCounts[key] > 0)) {
            break;
          }
          streak += 1;
          cursor.setDate(cursor.getDate() - 1);
        }
        return streak;
      }

      function recentProgressDateKeys() {
        const keys = [];
        const cursor = new Date();
        cursor.setHours(12, 0, 0, 0);
        for (let offset = 6; offset >= 0; offset -= 1) {
          const date = new Date(cursor);
          date.setDate(date.getDate() - offset);
          keys.push(localDateKey(date));
        }
        return keys;
      }

      function renderLearningProgress() {
        if (!learningProgressDaysList) {
          return;
        }
        const progress = normalizeLearningProgress(learningProgress);
        learningProgressQuestions.textContent = String(
          progress.questionCount,
        );
        learningProgressCalculations.textContent = String(
          progress.calculationCount,
        );
        learningProgressPractice.textContent = String(
          progress.practiceCount,
        );
        learningProgressWrongBook.textContent = String(wrongBook.length);
        learningProgressStreak.textContent = String(
          learningProgressStreakValue(),
        );
        learningProgressDays.textContent = String(
          progress.studyDays.length,
        );
        learningProgressUpdated.textContent = progress.updatedAt
          ? `最近 ${new Date(progress.updatedAt).toLocaleString("zh-CN", {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          })}`
          : "尚未开始";

        const dateKeys = recentProgressDateKeys();
        const maxCount = Math.max(
          1,
          ...dateKeys.map(
            (key) => clampProgressCount(progress.dailyCounts[key]),
          ),
        );
        const fragment = document.createDocumentFragment();
        dateKeys.forEach((key) => {
          const count = clampProgressCount(progress.dailyCounts[key]);
          const row = element("div", "progress-day");
          const date = new Date(`${key}T12:00:00`);
          const label = date.toLocaleDateString("zh-CN", {
            month: "2-digit",
            day: "2-digit",
          });
          const track = element("div", "progress-day-track");
          const fill = element("div", "progress-day-fill");
          fill.style.setProperty(
            "--progress-width",
            `${Math.round((count / maxCount) * 100)}%`,
          );
          track.append(fill);
          row.append(
            element("span", "", label),
            track,
            element("span", "progress-day-count", String(count)),
          );
          fragment.append(row);
        });
        learningProgressDaysList.replaceChildren(fragment);
      }

      function setLearningProgressStatus(message, state = "") {
        if (!learningProgressStatus) {
          return;
        }
        learningProgressStatus.textContent = message;
        if (state) {
          learningProgressStatus.dataset.state = state;

        }

      function recordLearningActivity(kind, amount = 1) {
        const fields = {
          question: "questionCount",
          calculation: "calculationCount",
          practice: "practiceCount",
        };
        const field = fields[kind];
        if (!field) {
          return;
        }

        const increment = Math.max(1, Math.round(Number(amount) || 1));
        learningProgress[field] = clampProgressCount(
          learningProgress[field] + increment,
        );
        const day = localDateKey();
        learningProgress.dailyCounts[day] = clampProgressCount(
          (learningProgress.dailyCounts[day] || 0) + increment,
        );
        if (!learningProgress.studyDays.includes(day)) {
          learningProgress.studyDays.push(day);
        }
        learningProgress.studyDays = learningProgress.studyDays
          .filter(isValidProgressDate)
          .sort()
          .slice(-MAX_PROGRESS_DAYS);
        learningProgress.updatedAt = Date.now();
        saveLearningProgress();
        renderLearningProgress();
      }

      function syncLearningProgressWrongBookCount() {
        learningProgress.wrongBookSavedCount = wrongBook.length;
        learningProgress.updatedAt = Date.now();
        saveLearningProgress();
        renderLearningProgress();
      }

      function mergeLearningProgress(currentValue, importedValue) {
        const current = normalizeLearningProgress(currentValue);
        const imported = normalizeLearningProgress(importedValue);
        current.updatedAt = Math.max(
          current.updatedAt,
          imported.updatedAt,
        );
        current.questionCount = Math.max(
          current.questionCount,
          imported.questionCount,
        );
        current.calculationCount = Math.max(
          current.calculationCount,
          imported.calculationCount,
        );
        current.practiceCount = Math.max(
          current.practiceCount,
          imported.practiceCount,
        );
        current.wrongBookSavedCount = Math.max(
          current.wrongBookSavedCount,
          imported.wrongBookSavedCount,
        );

        const days = new Set([
          ...current.studyDays,
          ...imported.studyDays,
        ]);
        current.studyDays = [...days]
          .filter(isValidProgressDate)
          .sort()
          .slice(-MAX_PROGRESS_DAYS);
        const retainedDays = new Set(current.studyDays);
        Object.keys(current.dailyCounts).forEach((day) => {
          if (!retainedDays.has(day)) {
            delete current.dailyCounts[day];
          }
        });
        Object.entries(imported.dailyCounts).forEach(([day, count]) => {
          if (!retainedDays.has(day)) {
            return;
          }
          current.dailyCounts[day] = Math.max(
            current.dailyCounts[day] || 0,
            count,
          );
        });
        return normalizeLearningProgress(current);
      }

        const payload = {

      function readLearningProgressFile(file) {
        if (typeof file.text === "function") {
          return file.text();
        }
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.addEventListener("load", () => {
            resolve(String(reader.result || ""));
          });
          reader.addEventListener("error", () => {
            reject(new Error("进度文件读取失败。"));
          });
          reader.readAsText(file);
        });
      }

      async function importLearningProgress(file, mode = "merge") {
        if (!file) {
          return;
        }
        try {
          if (file.size > 1024 * 1024) {
            throw new Error("进度文件过大，请选择 1 MB 以内的文件。");
          }
          const text = await readLearningProgressFile(file);
          const parsed = JSON.parse(text);
          const imported = normalizeLearningProgress(parsed);
          learningProgress = mode === "overwrite"
            ? imported
            : mergeLearningProgress(learningProgress, imported);
          learningProgress.wrongBookSavedCount = Math.max(
            learningProgress.wrongBookSavedCount,
            wrongBook.length,
          );
          saveLearningProgress();
          renderLearningProgress();
          setLearningProgressStatus(
            mode === "overwrite"
              ? "已覆盖当前学习进度。"
              : "已合并进度，重复记录不会重复累计。",
            "success",
          );
        } catch (error) {
          setLearningProgressStatus(
            error instanceof SyntaxError
              ? "进度文件不是有效的 JSON。"
              : error.message || "进度导入失败。",
            "error",
          );
        } finally {
          if (learningProgressImportInput) {
            learningProgressImportInput.value = "";
          }
        }

              displayMode: true,
              throwOnError: true,
              strict: false,
              trust: false,
            });
            return;
          } catch (error) {
            // Fall back to the plain text returned by the calculation service.

        container.textContent = message.formulaText || message.formulaLatex;

      function renderRichMessageText(container, rawText) {
        const source = String(rawText || "");
        container.textContent = "";
        if (!source) {
          return;
        }
        if (!window.katex) {
          container.textContent = source;
          return;
        }

        const mathPattern = /(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|\$[^$\n]+?\$)/g;
        let cursor = 0;
        for (const match of source.matchAll(mathPattern)) {
          const token = match[0];
          const index = match.index ?? 0;
          if (index > cursor) {
            container.append(document.createTextNode(source.slice(cursor, index)));
          }

          let expression = "";
          let displayMode = false;
          if (token.startsWith("$$") && token.endsWith("$$")) {
            expression = token.slice(2, -2).trim();
            displayMode = true;
          } else if (token.startsWith("\\[") && token.endsWith("\\]")) {
            expression = token.slice(2, -2).trim();
            displayMode = true;
          } else if (token.startsWith("\\(") && token.endsWith("\\)")) {
            expression = token.slice(2, -2).trim();
          } else {
            expression = token.slice(1, -1).trim();
          }

          const math = element(
            "span",
            displayMode ? "math-display" : "math-inline",
          );
          let rendered = false;
          if (expression) {
            try {
              window.katex.render(expression, math, {
                displayMode,
                throwOnError: true,
                strict: false,
                trust: false,
              });
              rendered = true;
            } catch (error) {
              rendered = false;
            }
          }
          if (rendered) {
            container.append(math);
          } else {
            container.append(document.createTextNode(token));
          }
          cursor = index + token.length;
        }

        if (cursor < source.length) {
          container.append(document.createTextNode(source.slice(cursor)));
        }
      }

      function solutionViewModel(message, sourceUserMessage) {
        if (
          !message
          || message.role !== "assistant"
          || message.loading
          || !SOLUTION_INTENTS.has(String(message.intent || ""))
        ) {
          return null;
        }
        const hasResult = Boolean(
          String(message.resultValue || "").trim()
          || String(message.formulaLatex || "").trim()
          || String(message.formulaText || "").trim()
          || String(message.plotUrl || "").trim()
          || typeof message.verdict === "boolean",
        );
        if (!hasResult && !String(message.text || "").trim()) {
          return null;
        }
        return {
          hasResult,
          knowledge: solutionKnowledgeFor(sourceUserMessage),
        };
      }

      function splitSolutionSteps(rawText) {
        const source = String(rawText || "")
          .replace(/\r\n?/g, "\n")
          .trim();
        if (!source) {
          return [];
        }

        const numbered = source
          .split(
            /(?:^|\n)\s*(?:第\s*[一二三四五六七八九十\d]+\s*步|[1-9]\d*[.、)])\s*/u,
          )
          .map((part) => part.trim())
          .filter(Boolean);
        if (numbered.length > 1) {
          return numbered.slice(0, 4);
        }

        const lines = source
          .split(/\n+/)
          .map((part) => part.trim())
          .filter(Boolean);
        if (lines.length > 1) {
          return lines.slice(0, 4);
        }

        const sentences = source
          .split(/(?<=[。！？；])(?=\S)/u)
          .map((part) => part.trim())
          .filter(Boolean);
        return sentences.length > 1 ? sentences.slice(0, 4) : [source];
      }

      function solutionStepsFor(message) {
        const parts = splitSolutionSteps(message.text);
        if (!parts.length) {
          parts.push("先看清题目条件和所求目标，再选择对应的计算方法。");
        }
        if (parts.length === 1) {
          parts.push(
            "再把结果代回原式或题设条件检查一遍，确认符号、范围和计算过程都符合要求。",
          );
        }
        const titles = [
          "先读题与定方法",
          "完成关键推导",
          "继续化简与判断",
          "核对结果",
        ];
        return parts.map((text, index) => ({
          text,
          title: titles[index] || "补充说明",
        }));
      }

      function renderSolutionSteps(container, message) {
        const list = element("div", "solution-step-list");

          const card = element(

          );

          const body = element("div", "solution-step-body");

            element("strong", "solution-step-label", step.title),

          renderRichMessageText(text, step.text);
          body.append(text);
          card.append(indexLabel, body);

        container.append(list);

      function renderSolutionActions(message, sourceUserMessage) {
        const actions = element("div", "solution-actions");
        actions.setAttribute("aria-label", "解题结果操作");

        const explainButton = element("button", "solution-action");
        explainButton.type = "button";
        explainButton.dataset.messageAction = "explain-step";
        explainButton.dataset.messageId = message.id;
        explainButton.append(
          suggestionIcon("question"),
          element("span", "", "这步没看懂"),
        );
        actions.append(explainButton);

        const bookmarked = sourceUserMessage
          ? wrongBookHasMessage(sourceUserMessage)
          : false;
        const canBookmark = Boolean(
          sourceUserMessage
          && (bookmarked || messageCanJoinWrongBook(message)),
        );
        const bookmarkButton = element(
          "button",
          "solution-action solution-action--primary",
          bookmarked ? "已加入错题本" : "我懂了，加入错题本",
        );
        bookmarkButton.type = "button";
        bookmarkButton.dataset.messageAction = "toggle-wrongbook";
        bookmarkButton.dataset.messageId = sourceUserMessage
          ? sourceUserMessage.id
          : "";
        bookmarkButton.dataset.bookmarked = String(bookmarked);
        bookmarkButton.disabled = !canBookmark;
        bookmarkButton.setAttribute("aria-pressed", String(bookmarked));
        if (!canBookmark) {
          bookmarkButton.title = "这道题暂时不适合加入错题本";
        }
        bookmarkButton.prepend(suggestionIcon("check"));
        actions.append(bookmarkButton);

        const canSpeak = Boolean(
          speechSynthesisApi
          && SpeechSynthesisUtteranceApi
          && speechTextForMessage(message),
        );
        if (canSpeak) {
          const speakButton = element("button", "solution-action");
          speakButton.type = "button";
          speakButton.dataset.messageAction = "speak-answer";
          speakButton.dataset.messageId = message.id;
          speakButton.setAttribute("aria-pressed", "false");
          speakButton.setAttribute("aria-label", "朗读这条回答");
          speakButton.title = "朗读这条回答";
          speakButton.append(
            suggestionIcon("speaker"),
            element("span", "speech-button-label", "朗读答案"),
          );
          actions.append(speakButton);
        }
        return actions;
      }

      function renderSolutionSheet(message, sourceUserMessage) {
        const sheet = element("article", "solution-sheet");
        sheet.setAttribute("aria-label", "结构化解题结果");

        if (solutionViewModel(message, sourceUserMessage).hasResult) {
          const section = element(
            "section",
            "solution-section solution-section--result",
          );
          const head = element("div", "solution-section-head");
          head.append(element("h3", "solution-section-title", "最终结果"));
          head.append(
            element(
              "span",
              "solution-section-tag",
              typeof message.verdict === "boolean"
                ? (message.verdict ? "答案正确" : "答案不正确")
                : (message.resultLabel || "已计算"),
            ),
          );
          section.append(head);

          if (message.resultValue) {
            const row = element("div", "solution-result-row");
            row.append(
              element(
                "span",
                "solution-result-label",
                message.resultLabel || "结果",
              ),
              element("strong", "solution-result-value", message.resultValue),
            );
            section.append(row);
          }

          if (message.formulaLatex) {
            const formula = element("div", "formula");
            renderFormula(formula, message);
            section.append(formula);
          }

          if (message.plotUrl) {
            const figure = element("figure", "function-plot");
            const image = element("img");
            image.src = message.plotUrl;
            image.alt = message.formulaText
              ? `函数图像：${message.formulaText}`
              : "函数图像";
            image.loading = "lazy";
            figure.append(image);
            section.append(figure);
          }

          sheet.append(section);
        }

        if (message.text) {
          const section = element(
            "section",
            "solution-section solution-section--reasoning",
          );
          const head = element("div", "solution-section-head");
          head.append(
            element("h3", "solution-section-title", "解题思路"),
            element("span", "solution-section-tag", "分步推演"),
          );
          section.append(head);
          renderSolutionSteps(section, message);
          sheet.append(section);
        }

        const knowledgeSection = element(
          "section",
          "solution-section solution-section--knowledge",
        );
        const knowledgeHead = element("div", "solution-section-head");
        knowledgeHead.append(
          element("h3", "solution-section-title", "知识点巩固"),
          element("span", "solution-section-tag", "建议复习"),
        );
        const knowledgeList = element("div", "solution-knowledge-list");
        solutionKnowledgeFor(sourceUserMessage).forEach((rule) => {
          const item = element("article", "solution-knowledge-item");
          item.append(element("strong", "", rule.title));
          (rule.points || []).forEach((point) => {
            item.append(element("p", "", point));
          });
          knowledgeList.append(item);
        });
        knowledgeSection.append(knowledgeHead, knowledgeList);
        sheet.append(knowledgeSection);
        sheet.append(renderSolutionActions(message, sourceUserMessage));
        return sheet;
      }

      function createMessageNode(message) {
        const article = element("article", "message");
        article.dataset.role = message.role;
        article.dataset.intent = message.intent || "";
        article.dataset.messageId = message.id;
        let renderedSolutionSheet = false;

        const avatar = element(
          "div",
          "avatar",
          message.role === "user" ? "我" : "π",
        );
        avatar.setAttribute("aria-hidden", "true");

        const content = element("div", "message-content");
        const meta = element("div", "message-meta");
        meta.append(
          element("span", "", message.role === "user" ? "你" : "知微老师"),
          element("time", "", message.createdAt),
        );

        if (message.loading) {
          const bubble = element("div", "bubble");
          const thinking = element("div", "teacher-thinking");
          thinking.setAttribute("role", "status");
          thinking.setAttribute("aria-live", "polite");
          const copy = element("div", "teacher-thinking-copy");
          copy.append(
            element("strong", "", "老师正在推演这道题..."),
            element("span", "", "正在整理结果与关键步骤"),
          );
          thinking.append(
            element("span", "teacher-thinking-mark", "π"),
            copy,
          );
          bubble.append(thinking);
          content.append(meta, bubble);
        } else {
          const sourceUserMessage = sourceUserMessageForAnswer(message);
          const viewModel = solutionViewModel(message, sourceUserMessage);
          if (viewModel) {
            renderedSolutionSheet = true;
            const stack = element("div", "message-stack");
            if (
              Array.isArray(message.attachments)
              && message.attachments.length
            ) {
              const attachments = element("div", "bubble");
              attachments.append(
                renderMessageAttachments(message.attachments),
              );
              stack.append(attachments);
            }
            stack.append(renderSolutionSheet(message, sourceUserMessage));
            content.append(meta, stack);
          } else {
            const bubble = element("div", "bubble");
            if (
              Array.isArray(message.attachments)
              && message.attachments.length
            ) {
              bubble.append(renderMessageAttachments(message.attachments));
            }
            if (message.text) {
              const text = element("p", "message-text");
              if (message.intent === "welcome" && message.welcomeLead) {
                renderWelcomeMessageText(text, message);
              } else {
                renderRichMessageText(text, message.text);
              }
              bubble.append(text);
            }

            if (message.formulaLatex) {
              const formula = element("div", "formula");
              renderFormula(formula, message);
              bubble.append(formula);
            }

            if (message.plotUrl) {
              const figure = element("figure", "function-plot");
              const image = element("img");
              image.src = message.plotUrl;
              image.alt = message.formulaText
                ? `函数图像：${message.formulaText}`
                : "函数图像";
              image.loading = "lazy";
              figure.append(image);
              bubble.append(figure);
            }

            if (typeof message.verdict === "boolean") {
              const verdict = element(
                "div",
                "verdict",
                message.verdict ? "答案正确" : "答案不正确",
              );
              verdict.dataset.state = message.verdict ? "correct" : "incorrect";
              bubble.append(verdict);
            }

            if (message.resultLabel && message.resultValue) {
              const details = element("details", "calculation-details");
              details.append(element("summary", "", "计算明细"));
              const grid = element("dl", "calculation-grid");
              grid.append(
                element("dt", "", "结果"),
                element("dd", "", message.resultValue),
                element("dt", "", "类型"),
                element("dd", "", message.resultLabel),
              );
              details.append(grid);
              bubble.append(details);
            }
            content.append(meta, bubble);
          }
        }

        if (
          message.role === "assistant"
          && !message.loading
          && !renderedSolutionSheet
        ) {
          const sourceUserMessage = sourceUserMessageForAnswer(message);
          const bookmarked = sourceUserMessage
            ? wrongBookHasMessage(sourceUserMessage)
            : false;
          const canSpeak = Boolean(
            message.intent !== "welcome"
            && speechSynthesisApi
            && SpeechSynthesisUtteranceApi
            && speechTextForMessage(message),
          );
          const canBookmark = Boolean(
            sourceUserMessage
            && (bookmarked || messageCanJoinWrongBook(message)),
          );
          if (canSpeak || canBookmark) {
            const actions = element("div", "message-actions");
            if (canSpeak) {
              const speakButton = element("button", "message-action", "朗读");
              speakButton.type = "button";
              speakButton.dataset.messageAction = "speak-answer";
              speakButton.dataset.messageId = message.id;
              speakButton.setAttribute("aria-pressed", "false");
              speakButton.setAttribute("aria-label", "朗读这条回答");
              speakButton.title = "朗读这条回答";
              actions.append(speakButton);
            }
            if (canBookmark) {
              const bookmarkButton = element(
                "button",
                "message-action",
                bookmarked ? "已加入错题集" : "加入错题集",
              );
              bookmarkButton.type = "button";
              bookmarkButton.dataset.messageAction = "toggle-wrongbook";
              bookmarkButton.dataset.messageId = sourceUserMessage.id;
              bookmarkButton.dataset.bookmarked = String(bookmarked);
              bookmarkButton.setAttribute(
                "aria-pressed",
                String(bookmarked),
              );
              actions.append(bookmarkButton);
            }
            content.append(actions);
          }
        }
        if (message.intent === "welcome") {
          meta.remove();
          article.append(content);
        } else {
          article.append(avatar, content);
        }
        return article;
      }

      function scrollToLatest() {
        window.requestAnimationFrame(() => {
          messageList.scrollTop = messageList.scrollHeight;
        });
      }

      function latestUserQuestion() {
        for (let index = messages.length - 1; index >= 0; index -= 1) {
          const message = messages[index];
          if (message.role === "user" && !message.loading && message.text) {
            return message.text;
          }
        }
        return "";
      }

      function renderMessages() {
        const fragment = document.createDocumentFragment();
        messages.forEach((message) => fragment.append(createMessageNode(message)));
        messageList.replaceChildren(fragment);
        messageList.dataset.welcomeOnly = String(
          messages.length === 1 && messages[0]?.intent === "welcome",
        );
        syncSpeechButtons();
        scrollToLatest();
      }

      function normalizeSuggestion(item) {
        if (typeof item === "string") {
          const text = item.trim();
          return text
            ? {
              label: text,
              message: text,
              action: "ask",
              prompt: "",
              icon: "",
            }
            : null;
        }
        if (!item || typeof item !== "object") {
          return null;
        }
        const label = String(item.label || item.message || "").trim();
        return label
          ? {
            label,
            message: String(item.message || ""),
            action: String(item.action || "ask"),
            prompt: String(item.prompt || ""),
            icon: String(item.icon || ""),
          }
          : null;
      }

      function suggestionIcon(name) {
        const paths = {
          camera: [
            "M14.5 5 13 3h-2L9.5 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4.5Z",
            "M12 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z",
          ],
          check: [
            "M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z",
            "M14 3v6h6",
            "m8.5 15 2.2 2.2 4.8-5.2",
          ],
          book: [
            "M4 5.5A2.5 2.5 0 0 1 6.5 3H19a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 0 4 22Z",
            "M4 5.5V19a2.5 2.5 0 0 1 2.5-2.5H20",
            "M8 7h7",
          ],
          question: [
            "M9.2 9a3 3 0 1 1 4.5 2.6c-1.1.7-1.7 1.3-1.7 2.4",
            "M12 18h.01",
            "M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z",
          ],
          speaker: [
            "M11 5 6.5 9H3v6h3.5L11 19Z",
            "M15 9a4.2 4.2 0 0 1 0 6",
            "M17.8 6.5a8 8 0 0 1 0 11",
          ],
        };
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("class", "suggestion-icon");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");
        (paths[name] || paths.book).forEach((pathValue) => {
          const path = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          path.setAttribute("d", pathValue);
          svg.append(path);
        });
        return svg;
      }

      function renderSuggestions(items) {
        const source = Array.isArray(items) && items.length
          ? items
          : DEFAULT_SUGGESTIONS;
        currentSuggestions = source
          .slice(0, 6)
          .map(normalizeSuggestion)
          .filter(Boolean);
        const fragment = document.createDocumentFragment();
        currentSuggestions.forEach((suggestion) => {
          const button = element("button", "suggestion");
          button.type = "button";
          button.dataset.suggestionAction = suggestion.action;
          button.append(
            suggestionIcon(suggestion.icon),
            element("span", "suggestion-label", suggestion.label),
          );
          if (suggestion.message) {
            button.dataset.message = suggestion.message;
          }
          if (suggestion.prompt) {
            button.dataset.prompt = suggestion.prompt;
          }
          fragment.append(button);
        });
        suggestions.replaceChildren(fragment);
      }

      function setSuggestionsCollapsed(collapsed) {
        const nextCollapsed = Boolean(collapsed);
        composerArea.dataset.suggestionsCollapsed = String(nextCollapsed);
        suggestionsToggle.setAttribute(
          "aria-expanded",
          String(!nextCollapsed),
        );
        suggestionsToggle.setAttribute(
          "title",
          nextCollapsed ? "展开快捷入口" : "收起快捷入口",
        );
        suggestionsToggleLabel.textContent = nextCollapsed
          ? "展开快捷入口"
          : "收起快捷入口";
      }

      function resizeInput() {
        chatInput.style.height = "auto";
        chatInput.style.height = `${Math.min(chatInput.scrollHeight, 132)}px`;
      }

      function imageSizeLabel(bytes) {
        if (bytes < 1024 * 1024) {
          return `${Math.max(1, Math.round(bytes / 1024))} KB`;
        }
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function pendingImageSummary() {
        if (composerImageNotice) {
          return composerImageNotice;
        }
        const total = pendingQuestionImages.length;
        if (!total) {
          return "";
        }
        const completed = pendingQuestionImages.filter(
          (item) => item.state === "success",
        ).length;
        const failed = pendingQuestionImages.filter(
          (item) => item.state === "error",
        ).length;
        const loading = pendingQuestionImages.filter(
          (item) => item.state === "loading",
        ).length;
        if (loading) {
          return `正在识别题目（${completed}/${total}），点击发送后会等识别结束再发送。`;
        }
        const unresolved = pendingQuestionImages.filter(
          (item) => item.state === "success" && !usableRecognizedText(item),
        ).length;
        if (unresolved) {
          return `识别到 ${unresolved} 张图片包含多题或需要确认，请先完成选择。`;
        }
        const selectedQuestions = pendingQuestionImages.reduce(
          (total, item) => total + recognizedQuestionTexts(item).length,
          0,
        );
        if (selectedQuestions > 1) {
          return `已选择 ${selectedQuestions} 道题，发送后将逐题计算。`;
        }
        if (selectedQuestions === 1) {
          return "已选择 1 道题，可直接发送。";
        }
        if (failed === total) {
          return "图片识别失败，仍可直接发送图片，或补充文字后发送。";
        }
        if (failed) {
          return `${completed} 张已识别，${failed} 张失败；仍可直接发送并补充说明。`;
        }
        return `已识别 ${completed} 张图片，可直接发送。`;
      }

      function selectedBlockIndexes(item) {
        const blocks = Array.isArray(item?.questionBlocks)
          ? item.questionBlocks
          : [];
        const selected = Array.isArray(item?.selectedBlockIndexes)
          ? item.selectedBlockIndexes
          : [];
        return [...new Set(
          selected
            .map((value) => Number(value))
            .filter(
              (value) =>
                Number.isInteger(value)
                && value >= 0
                && value < blocks.length,
            ),
        )].sort((left, right) => left - right);
      }

      function selectedRecognizedBlocks(item) {
        return selectedBlockIndexes(item)
          .map((blockIndex) => item.questionBlocks?.[blockIndex])
          .filter(Boolean);
      }

      function recognizedQuestionTexts(item) {
        if (!item || item.state !== "success") {
          return [];
        }
        if (Array.isArray(item.questionBlocks) && item.questionBlocks.length > 1) {
          return selectedRecognizedBlocks(item)
            .map((block) => String(block.text || "").trim())
            .filter(Boolean);
        }
        if (item.reviewRequired && !item.reviewConfirmed) {
          return [];
        }
        const text = String(item.text || "").trim();
        return text ? [text] : [];
      }

      function usableRecognizedText(item) {
        return recognizedQuestionTexts(item).join("\n\n");
      }

      function setRecognizedQuestionSelection(item, blockIndex, selected) {
        const blocks = Array.isArray(item?.questionBlocks)
          ? item.questionBlocks
          : [];
        if (
          !Number.isInteger(blockIndex)
          || blockIndex < 0
          || blockIndex >= blocks.length
        ) {
          return;
        }
        const next = new Set(selectedBlockIndexes(item));
        if (selected) {
          next.add(blockIndex);
        } else {
          next.delete(blockIndex);
        }
        item.selectedBlockIndexes = [...next].sort((left, right) => left - right);
        const selectedBlocks = selectedRecognizedBlocks(item);
        const selectedTexts = selectedBlocks
          .map((block) => String(block.text || "").trim())
          .filter(Boolean);
        item.selectedBlockText = selectedTexts.join("\n\n");
        item.statusText = selectedTexts.length
          ? `已选择 ${selectedTexts.length} 道题，发送后逐题计算`
          : "请选择需要计算的题目";
        lastRecognizedQuestion =
          selectedTexts.length === 1 ? selectedTexts[0] : "";
        composerImageNotice = "";
      }

      function syncRecognizedQuestionPicker(item, picker) {
        const selected = new Set(selectedBlockIndexes(item));
        picker.inputs.forEach((input) => {
          input.checked = selected.has(Number(input.value));
        });
        picker.count.textContent =
          `已选 ${selected.size}/${item.questionBlocks.length} 道`;
        picker.selectAll.disabled =
          selected.size === item.questionBlocks.length;
        picker.clear.disabled = selected.size === 0;
        picker.status.textContent = item.statusText;
        composerImageStatus.textContent = pendingImageSummary();
        syncComposerState();
      }

      function toggleRecognizedQuestion(
        item,
        blockIndex,
        selected,
        picker,
      ) {
        setRecognizedQuestionSelection(item, blockIndex, selected);
        syncRecognizedQuestionPicker(item, picker);
      }

      function setAllRecognizedQuestions(item, picker, selected) {
        item.selectedBlockIndexes = selected
          ? item.questionBlocks.map((block, blockIndex) => blockIndex)
          : [];
        const selectedTexts = selectedRecognizedBlocks(item)
          .map((block) => String(block.text || "").trim())
          .filter(Boolean);
        item.selectedBlockText = selectedTexts.join("\n\n");
        item.statusText = selectedTexts.length
          ? `已选择 ${selectedTexts.length} 道题，发送后逐题计算`
          : "请选择需要计算的题目";
        lastRecognizedQuestion =
          selectedTexts.length === 1 ? selectedTexts[0] : "";
        composerImageNotice = "";
        syncRecognizedQuestionPicker(item, picker);
      }

      function confirmRecognizedQuestion(item) {
        if (!item.text) {
          return;
        }
        item.reviewConfirmed = true;
        item.insertedText = appendRecognizedText(item.text);
        item.statusText = "已确认当前识别题，可核对后发送";
        lastRecognizedQuestion = item.text;
        composerImageNotice = "";
        renderComposerImages();
      }

      function renderComposerImages() {
        composerImageList.replaceChildren();
        const hasNotice = Boolean(composerImageNotice);
        composerImagePreview.hidden =
          !pendingQuestionImages.length && !hasNotice;
        composerImageClear.hidden = !pendingQuestionImages.length;
        if (!pendingQuestionImages.length) {
          composerImageStatus.textContent = composerImageNotice;
          syncComposerState();
          return;
        }

        const fragment = document.createDocumentFragment();
        pendingQuestionImages.forEach((item, index) => {
          const card = element("div", "composer-image-item");
          card.dataset.state = item.state;

          const thumb = element("img", "composer-image-thumb");
          thumb.alt = `待发送题目图片 ${index + 1}`;
          thumb.src = item.previewUrl;
          thumb.loading = "lazy";

          const copy = element("div", "composer-image-copy");
          const status = element("span", "", item.statusText);
          copy.append(
            element("strong", "", `第 ${index + 1} 张图 · ${item.name}`),
            status,
          );
          if (Array.isArray(item.questionBlocks) && item.questionBlocks.length > 1) {
            card.classList.add("has-question-picker");
            const picker = element(
              "fieldset",
              "composer-image-question-picker",
            );
            picker.append(element("legend", "sr-only", "选择需要计算的题目"));

            const toolbar = element("div", "composer-image-question-toolbar");
            const count = element("span", "composer-image-question-count");
            const selectAllButton = element(
              "button",
              "composer-image-question-command",
              "全选",
            );
            selectAllButton.type = "button";
            selectAllButton.setAttribute("aria-label", "全选所有识别题目");
            const clearButton = element(
              "button",
              "composer-image-question-command",
              "取消选择",
            );
            clearButton.type = "button";
            clearButton.setAttribute("aria-label", "取消选择所有识别题目");
            toolbar.append(count, selectAllButton, clearButton);

            const options = element(
              "div",
              "composer-image-question-options",
            );
            const selected = new Set(selectedBlockIndexes(item));
            const inputs = [];
            item.questionBlocks.forEach((block, blockIndex) => {
              const option = element(
                "label",
                "composer-image-question-option",
              );
              const checkbox = document.createElement("input");
              checkbox.type = "checkbox";
              checkbox.value = String(blockIndex);
              checkbox.checked = selected.has(blockIndex);
              option.append(
                checkbox,
                element(
                  "span",
                  "",
                  block.label ? `第 ${block.label} 题` : `第 ${blockIndex + 1} 题`,
                ),
              );
              options.append(option);
              inputs.push(checkbox);
            });

            const pickerState = {
              count,
              inputs,
              selectAll: selectAllButton,
              clear: clearButton,
              status,
            };
            count.textContent =
              `已选 ${selected.size}/${item.questionBlocks.length} 道`;
            selectAllButton.disabled =
              selected.size === item.questionBlocks.length;
            clearButton.disabled = selected.size === 0;
            inputs.forEach((checkbox) => {
              checkbox.addEventListener("change", (event) => {
                toggleRecognizedQuestion(
                  item,
                  Number(event.target.value),
                  event.target.checked,
                  pickerState,
                );
              });
            });
            selectAllButton.addEventListener("click", () => {
              setAllRecognizedQuestions(item, pickerState, true);
            });
            clearButton.addEventListener("click", () => {
              setAllRecognizedQuestions(item, pickerState, false);
            });
            picker.append(toolbar, options);
            copy.append(picker);
          } else if (item.reviewRequired && !item.reviewConfirmed) {
            const reviewButton = element(
              "button",
              "composer-image-review",
              "按当前识别题继续",
            );
            reviewButton.type = "button";
            reviewButton.addEventListener("click", () => {
              confirmRecognizedQuestion(item);
            });
            copy.append(reviewButton);
          }

          const removeButton = element("button", "composer-image-remove");
          removeButton.type = "button";
          removeButton.dataset.imageId = item.id;
          removeButton.setAttribute("aria-label", `移除图片 ${item.name}`);
          removeButton.title = "移除图片";
          const removeIcon = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg",
          );
          removeIcon.setAttribute("viewBox", "0 0 24 24");
          removeIcon.setAttribute("aria-hidden", "true");
          const removeIconPath = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          removeIconPath.setAttribute("d", "m6 6 12 12M18 6 6 18");
          removeIcon.append(removeIconPath);
          removeButton.append(removeIcon);

          card.append(thumb, copy, removeButton);
          fragment.append(card);
        });
        composerImageList.append(fragment);
        composerImageStatus.textContent = pendingImageSummary();
        syncComposerState();
      }

      function setVoiceStatus(message, state = "") {
        if (!voiceStatus) {
          return;
        }
        window.clearTimeout(voiceStatusTimer);
        voiceStatus.textContent = String(message || "");
        if (state) {
          voiceStatus.dataset.state = state;
        } else {
          voiceStatus.removeAttribute("data-state");
        }
        if (message && (state === "success" || state === "error")) {
          voiceStatusTimer = window.setTimeout(
            () => {
              if (voiceStatus.textContent === message) {
                voiceStatus.textContent = "";
                voiceStatus.removeAttribute("data-state");
              }
            },
            state === "error" ? 7000 : 4500,
          );
        }
      }

      function setVoiceListeningState(active) {
        voiceInputListening = Boolean(active);
        voiceInputButton.dataset.listening = String(voiceInputListening);
        voiceInputButton.setAttribute(
          "aria-pressed",
          String(voiceInputListening),
        );
        voiceInputButton.setAttribute(
          "aria-label",
          voiceInputListening ? "停止语音输入" : "开始语音输入",
        );
      }

      function chineseNumberToArabic(value) {
        const source = String(value || "").trim();
        if (!source || /^\d+$/.test(source)) {
          return source;
        }
        const digits = {
          零: 0,
          〇: 0,
          一: 1,
          二: 2,
          两: 2,
          三: 3,
          四: 4,
          五: 5,
          六: 6,
          七: 7,
          八: 8,
          九: 9,
        };
        const smallUnits = {十: 10, 百: 100, 千: 1000};
        if (![...source].every((char) => (
          Object.hasOwn(digits, char)
          || Object.hasOwn(smallUnits, char)
          || char === "万"
        ))) {
          return source;
        }

        let total = 0;
        let section = 0;
        let number = 0;
        for (const char of source) {
          if (Object.hasOwn(digits, char)) {
            number = digits[char];
            continue;
          }
          if (char === "万") {
            section = (section + number) * 10000;
            total += section;
            section = 0;
            number = 0;
            continue;
          }
          const unit = smallUnits[char];
          section += (number || 1) * unit;
          number = 0;
        }
        return String(total + section + number);
      }

      function normalizeSpokenMathText(value) {
        let text = String(value || "")
          .trim()
          .replace(/[，、；]/g, ",")
          .replace(/[：]/g, ":")
          .replace(/\s+/g, " ");

        text = text.replace(
          /([零〇一二两三四五六七八九十百千万]+)分之([零〇一二两三四五六七八九十百千万]+)/g,
          (_, denominator, numerator) =>
            `${chineseNumberToArabic(numerator)}/${chineseNumberToArabic(denominator)}`,
        );
        text = text.replace(
          /([A-Za-z0-9()+\-*/^]+)\s*的\s*(平方|立方)/g,
          (_, base, exponent) => `${base}^${exponent === "平方" ? "2" : "3"}`,
        );
        text = text.replace(
          /([A-Za-z0-9()+\-*/^]+)\s*的\s*([零〇一二两三四五六七八九十百千万A-Za-z0-9]+)\s*次方/g,
          (_, base, exponent) =>
            `${base}^${chineseNumberToArabic(exponent)}`,
        );
        text = text.replace(
          /(?:开)?根号(?:下)?\s*([A-Za-z0-9()+\-*/^]+)/g,
          (_, expression) => `sqrt(${expression})`,
        );
        text = text.replace(/正无穷大|正无穷/g, "+oo");
        text = text.replace(/负无穷大|负无穷/g, "-oo");
        text = text.replace(/无穷大|无穷/g, "oo");
        text = text.replace(/圆周率/g, "pi");
        text = text.replace(/趋近于|趋向于|趋于/g, "->");
        text = text.replace(/不等于/g, "!=");
        text = text.replace(/大于等于|不小于/g, ">=");
        text = text.replace(/小于等于|不大于/g, "<=");
        text = text.replace(/大于/g, ">");
        text = text.replace(/小于/g, "<");
        text = text.replace(/等于/g, "=");
        text = text.replace(/点乘/g, " __VOICE_DOT__ ");
        text = text.replace(/叉乘/g, " __VOICE_CROSS__ ");
        text = text.replace(/乘以|乘/g, "*");
        text = text.replace(/除以|除/g, "/");
        text = text.replace(/加上|加/g, "+");
        text = text.replace(/减去|减/g, "-");
        text = text.replace(/__VOICE_DOT__/g, "点乘");
        text = text.replace(/__VOICE_CROSS__/g, "叉乘");
        return text.replace(/\s+/g, " ").trim();
      }

      function applyVoiceDraft(spokenText) {
        const normalized = normalizeSpokenMathText(spokenText);
        const existing = String(voiceBaseText || "").trimEnd();
        const joined = [existing, normalized].filter(Boolean).join("\n\n");
        const maximum = Number(chatInput.maxLength) || 600;
        chatInput.value = joined.slice(0, maximum);
        resizeInput();
        queueQuestionKnowledgeUpdate(chatInput.value);
        syncComposerState();
      }

      function ensureSpeechRecognition() {
        if (!BrowserSpeechRecognition) {
          return null;
        }
        if (speechRecognition) {
          return speechRecognition;
        }

        const recognition = new BrowserSpeechRecognition();
        recognition.lang = "zh-CN";
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          setVoiceListeningState(true);
          setVoiceStatus(
            "正在聆听，说完题目后会自动停止。转写结果请核对后再发送。",
            "listening",
          );
        };

        recognition.onresult = (event) => {
          let finalChunk = "";
