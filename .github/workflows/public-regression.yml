name: Public regression

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/public-regression.yml
      - scripts/verify_deployment.py
      - scripts/verify_limit_regression.py
      - scripts/verify_solve_regression.py
      - scripts/verify_random_regression.py
      - deploy/**
      - requirements.txt
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify deployment
        run: python scripts/verify_deployment.py --base-url https://cfyyy.pythonanywhere.com
      - name: Verify limit regression
        run: python scripts/verify_limit_regression.py --base-url https://cfyyy.pythonanywhere.com
      - name: Verify solve regression
        run: python scripts/verify_solve_regression.py --base-url https://cfyyy.pythonanywhere.com
      - name: Verify seeded random regression
        run: python scripts/verify_random_regression.py --base-url https://cfyyy.pythonanywhere.com --seed 20260928
